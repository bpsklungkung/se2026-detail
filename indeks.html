  renderAdvEcpRcaChart(byYear[advCompYear.complexity]);

  document.getElementById('dlAdvEcpTs').onclick = ()=> triggerJPGDownload(advCharts.ecpTs, 'ecp_tren');
  document.getElementById('dlAdvEcpRca').onclick = ()=> triggerJPGDownload(advCharts.ecpRca, `ecp_rca_${advCompYear.complexity}`);
  document.getElementById('advEcpExcelBtn').onclick = async ()=>{
    await exportStyledExcel('economic_complexity', 'ECP', ['Tahun','Sektor Unggulan (D_t)','Diversifikasi','Avg RCA Unggulan','Raw ECP','ECP Normalized'], yearSeries.map(y=>[y.tahun,y.dt,y.divers,y.avgRca,y.rawEcp,y.ecpNorm]));
  };
}
function renderAdvEcpRcaChart(yearData){
  if(!yearData) return;
  const ctx = document.getElementById('advEcpRcaCanvas');
  if(advCharts.ecpRca){ advCharts.ecpRca.destroy(); }
  const sorted = [...yearData.sektor].sort((a,b)=> b.rca-a.rca);
  advCharts.ecpRca = new Chart(ctx, {
    type:'bar',
    data:{ labels: sorted.map(s=>s.sektor), datasets:[{ label:'RCA', data: sorted.map(s=>s.rca), backgroundColor: sorted.map(s=> s.rca>=1?'#6F8F52':'#C1440E') }] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
      scales:{ x:{grid:{color:'#F2D9D4'}, ticks:{color:'#8A4A55',font:{family:'Inter',size:10.5}}}, y:{grid:{display:false},ticks:{color:'#8A4A55',font:{family:'Inter',size:10.5}}} } }
  });
}

/* =========================================================
   5. REGIONAL ECONOMIC RESILIENCE INDEX (RERI)
   ========================================================= */
function advDetectResilienceCols(){
  const h = advHeaders.resilience;
  const find = re=> h.find(x=> re.test(divNormalizeHeader(x)));
  advMap.resilience = {
    tahun: find(/^tahun$/i), totalPdrb: find(/^Total\s*PDRB$/i),
    entropy: find(/^Entropy$/i), de: find(/^Normalized\s*Entropy/i),
    hhi: find(/^HHI$/i), hhiDiv: find(/^HHI\s*Diversification$/i),
    reiStruktur: find(/^REI\s*Struktur$/i), stability: find(/^Stability/i),
    rc: find(/^Recovery\s*Capacity$/i), reri: find(/^RERI/i)
  };
}
function advBuildResilienceRows(){
  const m = advMap.resilience;
  const rows = [];
  advRaw.resilience.forEach(r=>{
    const tahun = divExtractYear(r[m.tahun]);
    const reri = divToNumber(r[m.reri]);
    if(!tahun || isNaN(reri)) return;
    const rcRaw = r[m.rc];
    const isNA = rcRaw!==undefined && rcRaw!==null && rcRaw.toString().trim().toUpperCase()==='N/A';
    const rc = isNA ? null : divToNumber(rcRaw);
    rows.push({
      tahun, totalPdrb: divToNumber(r[m.totalPdrb]), entropy: divToNumber(r[m.entropy]), de: divToNumber(r[m.de]),
      hhi: divToNumber(r[m.hhi]), hhiDiv: divToNumber(r[m.hhiDiv]), reiStruktur: divToNumber(r[m.reiStruktur]),
      stability: divToNumber(r[m.stability]), rc: (rc!==null && isNaN(rc)) ? null : rc, reri
    });
  });
  rows.sort((a,b)=>a.tahun-b.tahun);
  return rows;
}
function reriBadge(v){
  if(v>=80) return {label:'Sangat Tahan', color:'#6F8F52'};
  if(v>=60) return {label:'Cukup Tahan', color:'#B98B27'};
  return {label:'Rentan', color:'#C1440E'};
}
function renderAdvResilience(){
  if(!advEnsureLoaded('resilience')) return;
  if(!advMap.resilience) advDetectResilienceCols();
  const rows = advBuildResilienceRows();
  const body = document.getElementById('advBody');
  if(!rows.length){ body.innerHTML = `<div class="state-msg">Tidak ada data valid.</div>`; return; }
  const latest = rows[rows.length-1];
  const badge = reriBadge(latest.reri);

  body.innerHTML = `
    <div class="ss-method-note">
      <div><b>📖 Apa itu indeks ini:</b> Regional Economic Resilience Index (RERI) — indeks komposit yang mengukur seberapa tahan struktur ekonomi Klungkung: apakah cukup terdiversifikasi, stabil dari waktu ke waktu, tidak terlalu terkonsentrasi, dan mampu pulih setelah guncangan (mis. pandemi).</div>
      <div style="margin-top:8px"><b>🧮 Formula:</b></div>
      <ul class="formula-list"><li>RERI = 100 × (0,25×DE + 0,25×Stability + 0,25×HHI_Diversification + 0,25×RC)</li></ul>
      <div class="formula-caption">DE = Entropy ternormalisasi; Stability = 1 − REI struktur (kebalikan pergeseran struktur antar tahun, lihat tab Diversitas); HHI_Diversification = 1 − HHI; RC (Recovery Capacity) dihitung untuk 2021–2025 terhadap baseline 2019, tahun lain N/A. Bobot keempatnya sama rata (25%).</div>
      <div style="margin-top:8px"><b>💡 Cara membaca angka:</b> RERI tinggi (mendekati 100) = ekonomi Klungkung terdiversifikasi baik, strukturnya stabil dari tahun ke tahun, tidak bertumpu pada satu-dua sektor, dan (untuk tahun setelah 2021) sudah pulih dari guncangan sebelumnya. RERI rendah menandakan salah satu atau lebih aspek itu lemah — cek komponen mana yang paling menekan skornya lewat grafik di bawah.</div>
    </div>
    <div class="ss-kpi-grid">
      <div class="stat-box"><div class="stat-label">Tahun Terakhir</div><div class="stat-value" style="font-size:15px;">${latest.tahun}</div></div>
      <div class="stat-box"><div class="stat-label">RERI</div><div class="stat-value" style="font-size:15px;color:${badge.color};">${latest.reri.toFixed(1)} · ${badge.label}</div></div>
      <div class="stat-box"><div class="stat-label">Diversifikasi (DE)</div><div class="stat-value" style="font-size:15px;">${(latest.de*100).toFixed(1)}%</div></div>
      <div class="stat-box"><div class="stat-label">Stabilitas Struktur</div><div class="stat-value" style="font-size:15px;">${(latest.stability*100).toFixed(1)}%</div></div>
      <div class="stat-box"><div class="stat-label">Recovery Capacity</div><div class="stat-value" style="font-size:15px;">${latest.rc!==null? (latest.rc*100).toFixed(1)+'%' : 'N/A'}</div></div>
    </div>
    <div class="ss-section-title">Tren RERI &amp; Komponennya</div>
    <div class="ss-controls" style="margin-bottom:8px;">
      <div class="ms-dropdown" id="advReriMetricDropdown">
        <button type="button" class="ms-dropdown-btn" id="advReriMetricBtn">📊 Pilih Indeks ▾</button>
        <div class="ms-dropdown-panel" id="advReriMetricPanel">
          <label class="ms-dropdown-item"><input type="checkbox" data-metric="reri" ${advReriMetrics.has('reri')?'checked':''}> RERI</label>
          <label class="ms-dropdown-item"><input type="checkbox" data-metric="de" ${advReriMetrics.has('de')?'checked':''}> Diversifikasi (DE)</label>
          <label class="ms-dropdown-item"><input type="checkbox" data-metric="stability" ${advReriMetrics.has('stability')?'checked':''}> Stabilitas</label>
          <label class="ms-dropdown-item"><input type="checkbox" data-metric="rc" ${advReriMetrics.has('rc')?'checked':''}> Recovery Capacity</label>
        </div>
      </div>
    </div>
    <div class="chart-box-wrap"><button class="dl-btn" id="dlAdvReri">⬇ JPG</button><div class="chart-box" style="height:320px;"><canvas id="advReriCanvas"></canvas></div></div>
    <div class="table-head-row"><span class="table-head-label">Tabel RERI per Tahun</span><button class="dl-btn" id="advReriExcelBtn" style="position:static;">⬇ Excel</button></div>
    <div class="ss-table-wrap ss-table-scroll"><table class="ss-table" id="advReriTable"></table></div>
  `;

  document.getElementById('advReriTable').innerHTML = `<thead><tr><th>Tahun</th><th>DE</th><th>Stability</th><th>HHI Div.</th><th>Recovery Cap.</th><th>RERI</th></tr></thead><tbody>${
    rows.map(r=>`<tr><td>${r.tahun}</td><td>${(r.de*100).toFixed(1)}%</td><td>${(r.stability*100).toFixed(1)}%</td><td>${(r.hhiDiv*100).toFixed(1)}%</td><td>${r.rc!==null?(r.rc*100).toFixed(1)+'%':'N/A'}</td><td>${r.reri.toFixed(1)}</td></tr>`).join('')
  }</tbody>`;

  const metricBtn = document.getElementById('advReriMetricBtn');
  const metricPanel = document.getElementById('advReriMetricPanel');
  metricBtn.onclick = (e)=>{
    e.stopPropagation();
    metricPanel.classList.toggle('open');
  };
  document.addEventListener('click', function closeAdvReriMetricPanel(e){
    if(!document.getElementById('advReriMetricDropdown')) { document.removeEventListener('click', closeAdvReriMetricPanel); return; }
    if(!document.getElementById('advReriMetricDropdown').contains(e.target)){
      metricPanel.classList.remove('open');
    }
  });
  metricPanel.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.onchange = ()=>{
      const m = cb.dataset.metric;
      if(cb.checked){
        advReriMetrics.add(m);
      }else{
        if(advReriMetrics.size<=1){ cb.checked = true; alert('Minimal 1 indeks harus ditampilkan.'); return; }
        advReriMetrics.delete(m);
      }
      renderAdvReriChart(rows);
    };
  });

  renderAdvReriChart(rows);

  document.getElementById('dlAdvReri').onclick = ()=> triggerJPGDownload(advCharts.reri, 'reri_tren');
  document.getElementById('advReriExcelBtn').onclick = async ()=>{
    await exportStyledExcel('resilience_index', 'RERI', ['Tahun','DE','Stability','HHI Diversification','Recovery Capacity','RERI'], rows.map(r=>[r.tahun,r.de,r.stability,r.hhiDiv,r.rc,r.reri]));
  };
}

function renderAdvReriChart(rows){
  const ctx = document.getElementById('advReriCanvas');
  if(advCharts.reri){ advCharts.reri.destroy(); }
  const allDatasets = [
    { m:'reri', ds:{ label:'RERI', data: rows.map(r=>r.reri), borderColor:'#4A1620', backgroundColor:'rgba(74,22,32,0.14)', fill:true, pointRadius:0, pointHoverRadius:4, tension:0.4, cubicInterpolationMode:'monotone', yAxisID:'y100' } },
    { m:'de', ds:{ label:'Diversifikasi (DE)', data: rows.map(r=>r.de*100), borderColor:'#3E6E8E', backgroundColor:'transparent', fill:false, pointRadius:0, pointHoverRadius:4, tension:0.4, cubicInterpolationMode:'monotone', yAxisID:'y100' } },
    { m:'stability', ds:{ label:'Stabilitas', data: rows.map(r=>r.stability*100), borderColor:'#B98B27', backgroundColor:'transparent', fill:false, pointRadius:0, pointHoverRadius:4, tension:0.4, cubicInterpolationMode:'monotone', yAxisID:'y100' } },
    { m:'rc', ds:{ label:'Recovery Capacity', data: rows.map(r=>r.rc!==null?r.rc*100:null), borderColor:'#6F8F52', backgroundColor:'transparent', fill:false, pointRadius:0, pointHoverRadius:4, tension:0.4, cubicInterpolationMode:'monotone', yAxisID:'y100', spanGaps:false } }
  ];
  const datasets = allDatasets.filter(d=> advReriMetrics.has(d.m)).map(d=>d.ds);
  advCharts.reri = new Chart(ctx, {
    type:'line',
    data:{ labels: rows.map(r=>r.tahun), datasets },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{font:{family:'Inter',size:10.5},color:'#4A1620',boxWidth:14}}},
      scales:{ x:{grid:{display:false},ticks:{color:'#8A4A55',font:{family:'Inter',size:10.5}}}, y100:{min:0,max:100,grid:{color:'#F2D9D4'},ticks:{color:'#8A4A55',font:{size:10}}} } }
  });
}

/* =========================================================
   6. DYNAMIC SPECIALIZATION TRAJECTORY
   ========================================================= */
function advDetectTrajectoryCols(){
  const h = advHeaders.trajectory;
  const find = re=> h.find(x=> re.test(divNormalizeHeader(x)));
  advMap.trajectory = {
    tahun: find(/^tahun$/i), sektor: find(/^sektor$/i),
    slq: find(/^SLQ\/RCA$/i) || find(/^SLQ/i),
    dlq: find(/^DLQ$/i), deltaSlq: find(/ΔSLQ|Delta\s*SLQ/i), status: find(/^Status\s*SLQ$/i),
    trajectory: find(/^Trajectory/i), dss: find(/^DSS/i)
  };
}
function advBuildTrajectoryRows(){
  const m = advMap.trajectory;
  const rows = [];
  advRaw.trajectory.forEach(r=>{
    const tahun = divExtractYear(r[m.tahun]);
    const sektor = (r[m.sektor]||'').toString().trim();
    const slq = divToNumber(r[m.slq]);
    if(!tahun || !sektor || isNaN(slq)) return;
    rows.push({
      tahun, sektor, slq, dlq: divToNumber(r[m.dlq]), deltaSlq: divToNumber(r[m.deltaSlq]),
      status: (r[m.status]||'').toString().trim(), trajectory: (r[m.trajectory]||'').toString().trim(),
      dss: divToNumber(r[m.dss])
    });
  });
  return rows;
}
const TRAJ_INFO = {
  'Persistent Leader': {color:'#6F8F52', desc:'Konsisten jadi sektor unggulan (SLQ≥1) sejak awal periode hingga sekarang.'},
  'Emerging': {color:'#3E6E8E', desc:'Awalnya bukan unggulan, tapi tren SLQ-nya naik — kandidat sektor unggulan baru.'},
  'Declining Specialist': {color:'#C1440E', desc:'Dulunya unggulan, tapi SLQ-nya menurun — berisiko kehilangan status basisnya.'},
  'Persistent Non-specialist': {color:'#8A4A55', desc:'Konsisten bukan sektor unggulan sepanjang periode.'},
  'Potential': {color:'#B98B27', desc:'Belum unggulan, tren belum cukup jelas naik/turun — perlu dipantau lebih lanjut.'}
};
function renderAdvTrajectory(){
  if(!advEnsureLoaded('trajectory')) return;
  if(!advMap.trajectory) advDetectTrajectoryCols();
  const rows = advBuildTrajectoryRows();
  const body = document.getElementById('advBody');
  if(!rows.length){ body.innerHTML = `<div class="state-msg">Tidak ada data valid.</div>`; return; }

  const years = [...new Set(rows.map(r=>r.tahun))].sort((a,b)=>a-b);
  const latestYear = years[years.length-1];
  const bySektor = {};
  rows.forEach(r=>{ if(!bySektor[r.sektor]) bySektor[r.sektor] = []; bySektor[r.sektor].push(r); });
  const summary = Object.entries(bySektor).map(([sektor, list])=>{
    list.sort((a,b)=>a.tahun-b.tahun);
    const last = list[list.length-1];
    return { sektor, trajectory:last.trajectory, dss:last.dss, slqLatest:last.slq, slqAwal:list[0].slq };
  }).sort((a,b)=> b.dss-a.dss);

  const counts = {};
  summary.forEach(s=>{ counts[s.trajectory] = (counts[s.trajectory]||0)+1; });

  body.innerHTML = `
    <div class="ss-method-note">
      <div><b>📖 Apa itu analisis ini:</b> Menggabungkan status LQ sepanjang waktu untuk melihat lintasan tiap sektor — bukan cuma "unggul atau tidak sekarang", tapi "menuju ke arah mana" dari 2010 sampai tahun terakhir.</div>
      <div style="margin-top:8px"><b>🧮 Formula &amp; Klasifikasi:</b></div>
      <ul class="formula-list">
        <li>DLQ &amp; ΔSLQ dihitung tiap tahun (lihat tab LQ untuk detail DLQ)</li>
        <li>DSS = skor lintasan relatif terhadap tahun dasar 2010</li>
      </ul>
      <div class="formula-caption">Klasifikasi: <b>Persistent Leader</b> (konsisten unggul), <b>Emerging</b> (tren naik menuju unggul), <b>Declining Specialist</b> (dulu unggul, kini menurun), <b>Persistent Non-specialist</b> (konsisten tidak unggul), <b>Potential</b> (belum jelas arahnya).</div>
      <div style="margin-top:8px"><b>💡 Cara membaca angka:</b> Sektor <b>Persistent Leader</b> adalah fondasi ekonomi yang paling bisa diandalkan karena keunggulannya teruji lama. Sektor <b>Emerging</b> patut diperhatikan sebagai calon sektor unggulan baru — sering jadi target kebijakan pengembangan. Sektor <b>Declining Specialist</b> perlu perhatian karena keunggulan yang dulu dimiliki sedang terkikis. <b>DSS</b> yang lebih tinggi menunjukkan lintasan yang lebih positif dibanding kondisi awal 2010.</div>
    </div>
    <div class="ss-section-title">Distribusi Klasifikasi Lintasan Sektor</div>
    <div class="ss-quad-legend" style="margin-bottom:16px;">
      ${Object.keys(TRAJ_INFO).map(k=>`
        <div class="ss-quad-legend-item">
          <b style="color:${TRAJ_INFO[k].color}">${k} <span class="cnt">(${counts[k]||0})</span></b>
          ${TRAJ_INFO[k].desc}
        </div>`).join('')}
    </div>
    <div class="ss-section-title">Peta Lintasan Tiap Sektor (SLQ Awal → SLQ ${latestYear})</div>
    <div class="chart-box-wrap"><button class="dl-btn" id="dlAdvTraj">⬇ JPG</button><div class="chart-box" style="height:${Math.max(320, summary.length*26)}px;"><canvas id="advTrajCanvas"></canvas></div></div>
    <div class="table-head-row"><span class="table-head-label">Tabel Klasifikasi Lintasan Sektor</span><button class="dl-btn" id="advTrajExcelBtn" style="position:static;">⬇ Excel</button></div>
    <div class="ss-table-wrap ss-table-scroll"><table class="ss-table" id="advTrajTable"></table></div>
  `;

  document.getElementById('advTrajTable').innerHTML = `<thead><tr><th>Sektor</th><th>Klasifikasi</th><th>SLQ Awal</th><th>SLQ ${latestYear}</th><th>DSS</th></tr></thead><tbody>${
    summary.map(s=>`<tr><td>${escapeHtml(s.sektor)}</td><td><span class="ss-badge-quad" style="background:${(TRAJ_INFO[s.trajectory]||{color:'#999'}).color}">${escapeHtml(s.trajectory)}</span></td><td>${s.slqAwal.toFixed(2)}</td><td>${s.slqLatest.toFixed(2)}</td><td class="${s.dss>=0?'pos':'neg'}">${s.dss.toFixed(3)}</td></tr>`).join('')
  }</tbody>`;

  const ctx = document.getElementById('advTrajCanvas');
  if(advCharts.traj){ advCharts.traj.destroy(); }
  advCharts.traj = new Chart(ctx, {
    type:'bar',
    data:{ labels: summary.map(s=>s.sektor), datasets:[
      { label:'SLQ Awal (2010)', data: summary.map(s=>s.slqAwal), backgroundColor:'#D9B36C' },
      { label:`SLQ ${latestYear}`, data: summary.map(s=>s.slqLatest), backgroundColor: summary.map(s=>(TRAJ_INFO[s.trajectory]||{color:'#999'}).color) }
    ]},
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{legend:{position:'bottom', labels:{font:{family:'Inter',size:11},color:'#4A1620'}}},
      scales:{ x:{grid:{color:'#F2D9D4'}, ticks:{color:'#8A4A55',font:{family:'Inter',size:10.5}}}, y:{grid:{display:false},ticks:{color:'#8A4A55',font:{family:'Inter',size:10.5}}} } }
  });

  document.getElementById('dlAdvTraj').onclick = ()=> triggerJPGDownload(advCharts.traj, 'dynamic_specialization');
  document.getElementById('advTrajExcelBtn').onclick = async ()=>{
    await exportStyledExcel('dynamic_specialization', 'Trajectory', ['Sektor','Klasifikasi','SLQ Awal','SLQ Terakhir','DSS'], summary.map(s=>[s.sektor,s.trajectory,s.slqAwal,s.slqLatest,s.dss]));
  };
}

loadData();
</script>
