      <div style="margin-top:8px"><b>🧮 Formula:</b></div>
      <ul class="formula-list">
        <li>NS = eᵢ(t−1) × G</li>
        <li>IM = eᵢ(t−1) × (Gᵢ − G)</li>
        <li>RS = eᵢ(t−1) × (gᵢ − Gᵢ)</li>
      </ul>
      <div class="formula-caption">Kuadran dibentuk dari IM (sumbu-x) vs RS (sumbu-y).</div>
      <div style="margin-top:8px"><b>💡 Cara membaca angka:</b> <b>NS</b> besar bukan berarti sektor itu hebat — itu cuma menunjukkan seberapa besar dorongan pertumbuhan ekonomi Bali secara umum. <b>IM</b> positif berarti sektor ini termasuk yang sedang tumbuh cepat di level provinsi (iklim sektoralnya bagus), IM negatif berarti sektor ini secara nasional/provinsi memang sedang lesu. Yang paling penting untuk menilai daya saing lokal murni adalah <b>RS (Pergeseran Diferensial)</b>: RS positif = Klungkung unggul kompetitif dibanding Bali pada sektor ini (tumbuh lebih cepat dari yang "seharusnya"); RS negatif = sektor ini kalah saing di Klungkung dibanding rata-rata Bali, meski secara nasional sektornya sendiri mungkin sedang bagus.</div>`,
    em: `
      <div><b>📖 Apa itu model ini:</b> Perbaikan dari model Tradisional (Esteban-Marquilas, 1972). Masalah pada RS versi Tradisional adalah nilainya bisa "tertipu" oleh besar-kecilnya porsi sektor tersebut di ekonomi Klungkung (spesialisasi), bukan murni oleh daya saingnya. Model ini memisahkan nilai aktual sektor (eᵢ) menjadi nilai homotetik <b>h</b> — porsi yang "seharusnya" dimiliki Klungkung seandainya struktur ekonominya sama persis dengan Bali — supaya efek kompetitif bisa dihitung bersih dari bias spesialisasi.</div>
      <div style="margin-top:8px"><b>🧮 Formula:</b></div>
      <ul class="formula-list">
        <li>h = e(t−1) × Eᵢ(t−1) / E(t−1)  <span style="font-family:'Inter',sans-serif;color:var(--brown-mid);">(nilai homotetik)</span></li>
        <li>RS EM = h × (gᵢ − Gᵢ)  <span style="font-family:'Inter',sans-serif;color:var(--brown-mid);">(efek kompetitif murni)</span></li>
        <li>Allocation = (eᵢ − h) × (gᵢ − Gᵢ)</li>
      </ul>
      <div class="formula-caption">Kuadran dibentuk dari akumulasi (eᵢ − h) — spesialisasi (sumbu-x) — vs RS EM — keunggulan kompetitif (sumbu-y).</div>
      <div style="margin-top:8px"><b>💡 Cara membaca angka:</b> <b>RS EM</b> positif = daya saing sektor itu sendiri sedang bagus, terlepas dari besar-kecilnya porsi sektor itu di ekonomi Klungkung. <b>Allocation (Efek Alokasi)</b> positif berarti spesialisasi Klungkung "pas sasaran" — sektor yang porsinya besar (eᵢ &gt; h) memang juga sektor yang kompetitif, atau sebaliknya sektor kecil memang kurang kompetitif sehingga wajar porsinya kecil. Allocation <b>negatif</b> adalah sinyal "salah spesialisasi": sektor dengan porsi besar justru kurang kompetitif (sumber daya terlalu banyak ditaruh di sektor yang lemah), atau sektor kompetitif justru porsinya kecil (potensi belum digarap maksimal) — ini bisa jadi dasar rekomendasi realokasi sumber daya.</div>`,
    arcelus: `
      <div><b>📖 Apa itu model ini:</b> Perluasan dari Esteban-Marquilas (Arcelus, 1984). Kalau EM hanya memisahkan komponen kompetitif menjadi "sesuai struktur standar" (Effect) vs "menyimpang karena struktur khas Klungkung" (Deviation), Arcelus menerapkan pemisahan yang sama ke <b>seluruh</b> komponen — Nasional, Bauran Industri, sampai Regional.</div>
      <div style="margin-top:8px;padding:10px 12px;background:rgba(255,255,255,0.5);border-radius:9px;">
        <b>🧠 Analogi sederhana:</b> Bayangkan ada Klungkung "kembar imajiner" yang struktur ekonominya (porsi tiap sektor) persis sama dengan Bali. <b>Effect</b> = perubahan yang akan dialami sektor itu <i>seandainya</i> Klungkung memang seperti si kembar imajiner ini. <b>Deviation</b> = koreksi tambahan karena Klungkung yang sesungguhnya <i>tidak</i> persis seperti itu — porsi sektornya lebih besar atau lebih kecil dari "standar". Effect + Deviation selalu kembali menjadi angka perubahan yang sama seperti dihitung biasa, hanya saja sekarang dipecah supaya kelihatan mana yang murni soal tren pertumbuhan, dan mana yang soal struktur khas Klungkung sendiri.
      </div>
      <div style="margin-top:8px"><b>🔍 Empat pasang komponennya:</b></div>
      <ul class="component-list">
        <li><b>NSE &amp; NSD (Efek Nasional):</b> dorongan dari pertumbuhan ekonomi Bali secara keseluruhan — "air pasang" yang mengangkat semua sektor.</li>
        <li><b>IME &amp; IMD (Efek Bauran Industri):</b> dorongan dari cepat/lambatnya sektor <i>itu sendiri</i> secara nasional/provinsi, di luar tren Bali secara umum.</li>
        <li><b>RGE &amp; RGD (Efek Pertumbuhan Regional):</b> dorongan dari seberapa cepat/lambat <i>Klungkung secara keseluruhan</i> (semua sektor digabung) dibanding Bali — bukan soal sektor tertentu, tapi soal daerahnya.</li>
        <li><b>RIE &amp; RID (Efek Interaksi Regional):</b> sisa yang tidak dijelaskan tiga efek di atas — murni keunggulan/kelemahan <i>sektor itu khusus di Klungkung</i>, setelah semua faktor makro dikeluarkan. Biasanya paling menarik dicermati.</li>
      </ul>
      <div><b>🧮 Formula:</b></div>
      <ul class="formula-list">
        <li>NSE = h × G &nbsp;·&nbsp; NSD = (eᵢ − h) × G</li>
        <li>IME = h × (Gᵢ − G) &nbsp;·&nbsp; IMD = (eᵢ − h) × (Gᵢ − G)</li>
        <li>RGE = h × (g − G) &nbsp;·&nbsp; RGD = (eᵢ − h) × (g − G)</li>
        <li>RIE = h × (gᵢ − g − Gᵢ + G) &nbsp;·&nbsp; RID = (eᵢ − h) × (gᵢ − g − Gᵢ + G)</li>
      </ul>
      <div class="formula-caption">g = laju pertumbuhan total Klungkung. Kuadran dibentuk dari akumulasi (eᵢ − h) — spesialisasi — vs (RGE+RGD+RIE+RID) — keunggulan kompetitif total.</div>
      <div style="margin-top:8px"><b>💡 Cara membaca angka:</b> Untuk tiap pasangan, kalau Effect dan Deviation <b>searah</b> (sama-sama positif atau sama-sama negatif) berarti struktur khas Klungkung <b>memperkuat</b> efek itu; kalau <b>berlawanan arah</b>, struktur khas Klungkung justru <b>meredam/mengoreksi</b> efek tersebut. Contoh: kalau RGE positif (Klungkung tumbuh lebih cepat dari Bali secara umum) dan RGD <i>juga</i> positif, sektor ini ikut diuntungkan lebih besar oleh pertumbuhan Klungkung yang cepat itu. Tapi kalau RGE positif sementara RGD <i>negatif</i>, sektor ini justru "ketinggalan" menikmati keuntungan tersebut dibanding sektor-sektor lain di Klungkung. Total tiap sektor (jumlah kedelapan komponen) tetap sama persis dengan perubahan riilnya, seperti model lain.</div>`
  };
  document.getElementById('ssMethodNote').innerHTML = `<b>${ssMethod==='tradisional'?'Dynamic Traditional':ssMethod==='em'?'Dynamic Esteban-Marquilas':'Dynamic Arcelus'}</b><br><br>${notes[ssMethod]}`;
}

function ssSumField(perKategori, field){
  return perKategori.reduce((s,r)=>s+(r[field]||0),0);
}

function renderSSBody(result){
  const body = document.getElementById('ssBody');
  const { perKategori } = result;
  const isTraditional = ssMethod==='tradisional';

  const totalD = ssSumField(perKategori,'total');
  const totalAktual = ssSumField(perKategori,'actual');
  const maxAbsCheck = Math.max(...perKategori.map(r=>Math.abs(r.check)));

  const dominant = [...perKategori].sort((a,b)=> b.total-a.total)[0];
  const weakest = [...perKategori].sort((a,b)=> a.total-b.total)[0];

  const quadCounts = {1:0,2:0,3:0,4:0};
  perKategori.forEach(r=>{ if(r.quadrant) quadCounts[r.quadrant]++; });

  body.innerHTML = `
    <div class="ss-kpi-grid">
      <div class="stat-box"><div class="stat-label">Tahun Terpakai</div><div class="stat-value" style="font-size:15px;">${ssYearFrom}–${ssYearTo}</div></div>
      <div class="stat-box"><div class="stat-label">Total Perubahan (Efek)</div><div class="stat-value" style="font-size:15px;">${fmtNum(totalD)}</div></div>
      <div class="stat-box"><div class="stat-label">Total Perubahan Aktual</div><div class="stat-value" style="font-size:15px;">${fmtNum(totalAktual)}</div></div>
      <div class="stat-box"><div class="stat-label">Sektor Kontribusi Terbesar</div><div class="stat-value" style="font-size:13.5px;">${escapeHtml(dominant.kategori)}</div></div>
      <div class="stat-box"><div class="stat-label">Sektor Kontribusi Terkecil</div><div class="stat-value" style="font-size:13.5px;">${escapeHtml(weakest.kategori)}</div></div>
    </div>
    ${maxAbsCheck > Math.max(1, Math.abs(totalAktual))*0.01 ? `<div class="ss-method-note" style="border-color:var(--rust);"><b>⚠ Catatan konsistensi:</b> selisih Check terbesar antar-kategori adalah ${fmtNum(maxAbsCheck)}. Biasanya ini terjadi bila ada interval tahun yang tidak lengkap di sumber data.</div>` : ''}

      </div>

        <div class="ss-quad-legend">
          ${[1,2,3,4].map(q=>`

              <b style="color:${SS_QUAD_LABELS[quadGroup][q].color}">${SS_QUAD_LABELS[quadGroup][q].title} <span class="cnt">(${quadCounts[q]})</span></b>
              ${SS_QUAD_LABELS[quadGroup][q].desc}
            </div>`).join('')}
        </div>
      </div>
    </div>

    <div class="ss-section-title">Komponen Shift-Share per Sektor</div>
    <div class="chart-box-wrap">
      <button class="dl-btn" id="dlSSChart" title="Unduh grafik sebagai JPG">⬇ JPG</button>
      <div class="chart-box" style="height:${Math.max(260, perKategori.length*26)}px;"><canvas id="ssChartCanvas"></canvas></div>
    </div>

      <span class="table-head-label">Tabel Hasil Shift-Share (${ssMethod==='tradisional'?'Dynamic Traditional':ssMethod==='em'?'Dynamic Esteban-Marquilas':'Dynamic Arcelus'})</span>

function renderSSTable(perKategori, isTraditional){
  const table = document.getElementById('ssTable');
  const cellCls = v => v>=0 ? 'pos':'neg';
  const quadGroup = isTraditional ? 'tradisional' : 'spesialisasi';
  const badgeOf = r=>{
    const qInfo = r.quadrant ? SS_QUAD_LABELS[quadGroup][r.quadrant] : null;
    return qInfo ? `<span class="ss-badge-quad" style="background:${qInfo.color}">Q${r.quadrant}</span>` : '—';
  };

  let head, rows;
  if(ssMethod==='tradisional'){

/* =========================================================
   LOCATION QUOTIENT (SLQ / DLQ / SSLQ / DSLQ)
   Referensi: Kuncoro & Idris (2010), "Mengapa Terjadi Growth without
   Development di Provinsi Kalimantan Timur?", Jurnal Ekonomi Pembangunan.
   Sumber data & pemetaan kolom sama dengan tab Shift-Share
   (interval Tahun_Awal-Tahun_Akhir per Kategori, Klungkung vs Bali).
   ========================================================= */

/* Parser angka khusus untuk sheet LQ_Dynamic: format Indonesia (koma = desimal,
   titik = ribuan bila ada). Tidak memakai toNumber() global karena fungsi itu
   mencoba dulu asumsi koma = pemisah ribuan gaya Amerika, yang salah untuk
   nilai seperti "1,077087399" (harus dibaca 1.077087399, bukan 1077087399). */
function lqParseNum(v){
  if(v===undefined || v===null) return NaN;
  const s = v.toString().trim();
  if(s==='') return NaN;
  return parseFloat(s.replace(/\./g,'').replace(/,/g,'.'));
}

/* Ambil daftar Tahun yang tersedia di sheet LQ_Dynamic (urut naik). */
function lqAvailableYears(rows){
  const years = new Set();
  (rows||[]).forEach(r=>{
    const y = parseInt(lqParseNum(r['Tahun']));
    if(!isNaN(y)) years.add(y);
  });
  return [...years].sort((a,b)=>a-b);
}

/* Normalisasi teks kolom Status/klasifikasi dari sheet ke key internal LQ_KLAS. */
function lqStatusToKlas(status){
  const s = (status||'').toString().trim().toLowerCase();
  if(s.startsWith('unggul')) return 'unggulan';
  if(s.startsWith('andal')) return 'andalan';
  if(s.startsWith('prospek')) return 'prospektif';
  if(s.startsWith('tertingg')) return 'tertinggal';
  return 'tertinggal';
}

const LQ_KLAS = {
  unggulan:    { label:'Unggulan',    desc:'Terspesialisasi (SLQ≥1) dan sedang tumbuh lebih cepat dari wilayah acuan (DLQ≥1) — sektor basis dengan momentum yang menguat.', color:'#6F8F52' },
  andalan:     { label:'Andalan',     desc:'Belum terspesialisasi (SLQ<1) namun tumbuh lebih cepat dari wilayah acuan (DLQ≥1) — berpotensi menjadi unggulan di masa depan.', color:'#3E6E8E' },
  prospektif:  { label:'Prospektif',  desc:'Sudah terspesialisasi (SLQ≥1) tetapi pertumbuhannya melambat dibanding wilayah acuan (DLQ<1) — perlu diwaspadai despesialisasi.', color:'#B98B27' },
  tertinggal:  { label:'Tertinggal',  desc:'Belum terspesialisasi (SLQ<1) dan pertumbuhannya juga lebih lambat (DLQ<1) — bukan sektor basis maupun berkembang.', color:'#C1440E' }
};

function computeLQ(rows, year){
  const rowsYear = (rows||[]).filter(r=> parseInt(lqParseNum(r['Tahun']))===year);
  const perKategori = [];
  rowsYear.forEach(r=>{
    const kategori = (r['Sektor']||'').toString().trim();
    if(!kategori) return;
    const SLQ = lqParseNum(r['SLQ']);
    const DLQ = lqParseNum(r['DLQ']);
    const SSLQ = lqParseNum(r['SSLQ']);
    const DSLQ = lqParseNum(r['DSLQ']);
    if(isNaN(SLQ) || isNaN(DLQ) || isNaN(SSLQ) || isNaN(DSLQ)) return;
    const klas = lqStatusToKlas(r['Status']);
    perKategori.push({ kategori, SLQ, DLQ, SSLQ, DSLQ, klas });
  });
  perKategori.sort((a,b)=> b.SLQ-a.SLQ);
  return { perKategori, t:1, yearsUsed:[year] };
}

function renderLQView(){
  const filterPanel = document.getElementById('kelFilterPanel');
  if(filterPanel) filterPanel.style.display = 'none';
  const main = document.getElementById('main');

  const introHtml = `
    <div class="ss-intro">
      <h2>Location Quotient (SLQ &amp; DLQ)</h2>
      <p>Location Quotient mengukur derajat spesialisasi/keunggulan suatu sektor di Klungkung dibanding Bali. <b>Static LQ (SLQ)</b> membandingkan pangsa sektor di dua wilayah pada tahun terpilih; <b>Dynamic LQ (DLQ)</b> melakukan hal serupa namun memakai laju pertumbuhan tahunan (tahun terpilih vs tahun sebelumnya), sehingga menangkap potensi sektor ke depan, bukan hanya kontribusinya saat ini. Karena nilai SLQ/DLQ tidak simetris di sekitar 1 (rentang 0 s.d. tak terhingga), tersedia pula versi <b>simetris (SSLQ &amp; DSLQ)</b> yang mentransformasikannya ke rentang -1 s.d. 1 agar lebih adil secara statistik. Kedua versi menghasilkan klasifikasi sektor yang identik. Sektor diklasifikasikan menjadi <b>Unggulan</b>, <b>Andalan</b>, <b>Prospektif</b>, atau <b>Tertinggal</b> berdasarkan kombinasi SLQ &amp; DLQ.</p>
    </div>`;

  if(lqLoadState==='idle'){
    main.innerHTML = `<section class="ss-wrap">${introHtml}<div class="state-msg"><span class="spinner"></span>Memuat data…</div></section>`;
    loadLQData();
    return;
  }
  if(lqLoadState==='loading'){
    main.innerHTML = `<section class="ss-wrap">${introHtml}<div class="state-msg"><span class="spinner"></span>Memuat data…</div></section>`;
    return;
  }
  if(lqLoadState==='error'){
    main.innerHTML = `<section class="ss-wrap">${introHtml}<div class="state-msg">⚠ Gagal memuat data: ${escapeHtml(lqLoadError)}<br><br><a href="${LQ_DYN_CSV_URL}" target="_blank" style="color:var(--orange-deep);font-weight:600;">Buka sumber data →</a></div></section>`;
    return;
  }
  if(!lqRawRows || !lqRawRows.length){
    main.innerHTML = `<section class="ss-wrap">${introHtml}<div class="state-msg">Sumber data kosong atau tidak dapat dibaca.</div></section>`;
    return;
  }

  main.innerHTML = `
    <section class="ss-wrap">
      ${introHtml}

      <div class="ss-method-tabs" id="lqMethodTabs">
        <button class="ss-method-tab" data-m="raw">LQ Asli (SLQ · DLQ)</button>
        <button class="ss-method-tab" data-m="symmetric">LQ Simetris (SSLQ · DSLQ)</button>
      </div>
      <div class="ss-method-note" id="lqMethodNote"></div>

      <div class="ss-controls">
        <div class="ctrl-item"><label>Tahun</label><select id="lqTahun"></select></div>
        <div class="ctrl-item" style="font-size:11.5px;color:var(--brown-soft);" id="lqIntervalInfo"></div>
      </div>

      <div id="lqBody"></div>
    </section>`;

  document.querySelectorAll('#lqMethodTabs .ss-method-tab').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.m===lqMethod);
    btn.onclick = ()=>{ lqMethod = btn.dataset.m; renderLQView(); };
  });
  updateLQMethodNote();

  const years = lqAvailableYears(lqRawRows);
  if(years.length < 1){
    document.getElementById('lqBody').innerHTML = `<div class="state-msg">Tidak ada data Tahun yang terbaca dari sheet.</div>`;
    return;
  }

  if(!lqYear || !years.includes(lqYear)) lqYear = years[years.length-1];

  const tahunSel = document.getElementById('lqTahun');
  years.forEach(y=>{
    tahunSel.innerHTML += `<option value="${y}" ${y===lqYear?'selected':''}>${y}</option>`;
  });
  tahunSel.onchange = ()=>{ lqYear = parseInt(tahunSel.value); renderLQView(); };

  lqYearTo = lqYear;
  lqYearFrom = lqYear - 1;

  const result = computeLQ(lqRawRows, lqYear);
  lqResult = result;

  document.getElementById('lqIntervalInfo').textContent =
    `Tahun ${lqYear} · dibandingkan terhadap tahun ${lqYearFrom}`;

  if(!result.perKategori.length){
    document.getElementById('lqBody').innerHTML = `<div class="state-msg">Tidak ada sektor dengan data lengkap pada tahun ${lqYear}.</div>`;
    return;
  }

  renderLQBody(result);
}

function updateLQMethodNote(){
  const notes = {
    raw: `
      <div><b>📖 Apa itu model ini:</b> Location Quotient asli — bentuk paling umum dipakai. <b>SLQ</b> (Static) membandingkan porsi sektor di Klungkung vs Bali pada satu titik/rentang waktu (potret keunggulan saat ini). <b>DLQ</b> (Dynamic) membandingkan laju pertumbuhan relatif sektor tersebut, sehingga menangkap ke mana arah sektor itu menuju, bukan cuma posisinya sekarang.</div>
      <div style="margin-top:8px"><b>🧮 Formula:</b></div>
      <ul class="formula-list">
        <li>SLQ = (rata-rata pangsa sektor di Klungkung) / (rata-rata pangsa sektor di Bali)</li>
        <li>DLQ = [((1+gᵢ)/(1+g)) / ((1+Gᵢ)/(1+G))]ᵗ</li>
      </ul>
      <div class="formula-caption">gᵢ & g = laju pertumbuhan rata-rata tahunan sektor & total Klungkung, Gᵢ & G = laju pertumbuhan rata-rata tahunan sektor & total Bali, t = jumlah tahun. Ambang klasifikasi: 1.</div>
      <div style="margin-top:8px"><b>💡 Cara membaca angka:</b> <b>SLQ = 1</b> berarti porsi sektor itu di Klungkung persis sama dengan di Bali (netral, tidak istimewa). <b>SLQ &gt; 1</b> berarti Klungkung lebih terkonsentrasi/terspesialisasi pada sektor itu dibanding Bali — sektor ini menjadi basis ekonomi Klungkung, bukan sekadar melayani kebutuhan lokal. <b>SLQ &lt; 1</b> berarti porsinya di Klungkung lebih kecil dari Bali — sektor ini belum jadi andalan. Untuk <b>DLQ</b>: <b>DLQ &gt; 1</b> berarti sektor ini di Klungkung tumbuh lebih cepat secara relatif dibanding Bali (berpotensi makin unggul ke depan), sedangkan <b>DLQ &lt; 1</b> berarti tumbuh lebih lambat (berisiko makin tertinggal/despesialisasi). Kombinasi keduanya menghasilkan klasifikasi Unggulan/Andalan/Prospektif/Tertinggal.</div>`,
    symmetric: `
      <div><b>📖 Apa itu model ini:</b> Transformasi dari SLQ/DLQ (Dalum et al., 1998) untuk mengatasi kelemahan statistik SLQ/DLQ asli: karena rentangnya 0 sampai tak terhingga dengan titik netral di angka 1, penyimpangan di ATAS 1 (misal dari 1 ke 3) dan di BAWAH 1 (misal dari 1 ke 0,2) tidak dibobot setara secara matematis, sehingga kurang cocok dipakai untuk perbandingan statistik lanjutan (korelasi, regresi, dsb).</div>
      <div style="margin-top:8px"><b>🧮 Formula:</b></div>
      <ul class="formula-list">
        <li>SSLQ = (SLQ − 1) / (SLQ + 1)</li>
        <li>DSLQ = (DLQ − 1) / (DLQ + 1)</li>
      </ul>
      <div class="formula-caption">Transformasi ke rentang −1 s.d. 1 dengan titik netral di 0. Ambang klasifikasi: 0. Menghasilkan klasifikasi sektor yang identik dengan SLQ-DLQ (terbukti lewat korelasi Spearman = 1 pada studi rujukan).</div>
      <div style="margin-top:6px"><b>💡 Cara membaca angka:</b> <b>SSLQ = 0</b> setara dengan SLQ = 1 (netral). <b>SSLQ mendekati +1</b> berarti spesialisasi sangat kuat (SLQ jauh di atas 1); <b>SSLQ mendekati −1</b> berarti sangat tidak terspesialisasi (SLQ mendekati 0). Pola yang sama berlaku untuk <b>DSLQ</b> terhadap DLQ: mendekati +1 = tumbuh jauh lebih cepat dari Bali, mendekati −1 = tumbuh jauh lebih lambat. Karena skalanya simetris & seragam antar sektor, versi ini lebih adil dipakai untuk membandingkan "seberapa jauh" posisi tiap sektor dari titik netral, bukan cuma arah unggul/tidaknya saja.</div>`
  };
  document.getElementById('lqMethodNote').innerHTML = `<b>${lqMethod==='raw'?'LQ Asli (SLQ · DLQ)':'LQ Simetris (SSLQ · DSLQ)'}</b><br><br>${notes[lqMethod]}`;
}

function renderLQBody(result){
  const body = document.getElementById('lqBody');
  const { perKategori } = result;

function renderLQBarChart(perKategori, isRaw){
  const ctx = document.getElementById('lqChartCanvas');
  if(lqChart){ lqChart.destroy(); lqChart=null; }
  const labels = perKategori.map(r=>r.kategori);
  const datasets = isRaw ? [
    { label:'SLQ', data:perKategori.map(r=>r.SLQ), backgroundColor:'#3E6E8E' },
    { label:'DLQ', data:perKategori.map(r=>r.DLQ), backgroundColor:'#D64553' }
  ] : [
    { label:'SSLQ', data:perKategori.map(r=>r.SSLQ), backgroundColor:'#3E6E8E' },
    { label:'DSLQ', data:perKategori.map(r=>r.DSLQ), backgroundColor:'#D64553' }
  ];
  lqChart = new Chart(ctx, {
    type:'bar',
    data:{ labels, datasets },
    options:{
      indexAxis:'y',
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'bottom', labels:{ font:{family:'Inter', size:11}, color:'#4A1620' } } },
      scales:{
        x:{ grid:{color:'#F2D9D4'}, ticks:{ color:'#8A4A55', font:{family:'Inter', size:10.5} } },
        y:{ grid:{display:false}, ticks:{ color:'#8A4A55', font:{family:'Inter', size:10.5} } }
      }
    }
  });
}

function lqCrosshairPlugin(refX, refY){
  return {
    id:'lqCrosshair',
    beforeDatasetsDraw(chart){
      const {ctx, chartArea:{left,right,top,bottom}, scales:{x,y}} = chart;
      const x0 = x.getPixelForValue(refX), y0 = y.getPixelForValue(refY);
      ctx.save();
      ctx.strokeStyle = '#D8A15B';
      ctx.setLineDash([4,4]);
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x0, top); ctx.lineTo(x0, bottom); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(left, y0); ctx.lineTo(right, y0); ctx.stroke();
      ctx.restore();
    }
  };
}

function renderLQQuadrantChart(perKategori, isRaw){
  const ctx = document.getElementById('lqQuadCanvas');
  if(lqQuadChart){ lqQuadChart.destroy(); lqQuadChart=null; }
  const ref = isRaw ? 1 : 0;
  const pts = perKategori.map(r=>({
    x: isRaw ? r.SLQ : r.SSLQ,
    y: isRaw ? r.DLQ : r.DSLQ,
    label: r.kategori,
    klas: r.klas
  }));

  const maxAbsX = Math.max(Math.abs(ref)+0.5, ...pts.map(p=>Math.abs(p.x-ref)))+ref;
  const maxAbsY = Math.max(Math.abs(ref)+0.5, ...pts.map(p=>Math.abs(p.y-ref)))+ref;
  const minX = isRaw ? Math.max(0, ref - (maxAbsX-ref)*1.15) : -(maxAbsX-ref)*1.15;
  const minY = isRaw ? Math.max(0, ref - (maxAbsY-ref)*1.15) : -(maxAbsY-ref)*1.15;

  lqQuadChart = new Chart(ctx, {
    type:'scatter',
    data:{ datasets:[{
      label:'Sektor',
      data: pts,
      backgroundColor: pts.map(p=> LQ_KLAS[p.klas].color),
      pointRadius:7,
      pointHoverRadius:9
    }]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{ display:false },
        tooltip:{
          callbacks:{
            label:(item)=> `${item.raw.label}: ${isRaw?'SLQ':'SSLQ'}=${item.raw.x.toFixed(2)}, ${isRaw?'DLQ':'DSLQ'}=${item.raw.y.toFixed(2)}`
          }
        }
      },
      scales:{
        x:{ min:minX, max:(ref+(maxAbsX-ref)*1.15), grid:{color:'#F2D9D4'}, title:{display:true, text:isRaw?'SLQ':'SSLQ', color:'#8A4A55', font:{family:'Inter', size:11}}, ticks:{ color:'#8A4A55', font:{family:'Inter', size:10} } },
        y:{ min:minY, max:(ref+(maxAbsY-ref)*1.15), grid:{color:'#F2D9D4'}, title:{display:true, text:isRaw?'DLQ':'DSLQ', color:'#8A4A55', font:{family:'Inter', size:11}}, ticks:{ color:'#8A4A55', font:{family:'Inter', size:10} } }
      }
    },
    plugins:[lqCrosshairPlugin(ref, ref)]
  });
}

async function exportLQExcel(perKategori){
  const header = ['Sektor','Klasifikasi','SLQ','DLQ','SSLQ','DSLQ'];
  const rows = perKategori.map(r=>[r.kategori, LQ_KLAS[r.klas].label, r.SLQ, r.DLQ, r.SSLQ, r.DSLQ]);
  await exportStyledExcel(`lq_${lqYearFrom}_${lqYearTo}`, 'Location Quotient', header, rows);
}

/* ---------- Loader umum: satu sheet, header bersih di baris pertama ---------- */
function convLoadSimple(url, onDone){
  Papa.parse(url, {
    download:true, header:true, skipEmptyLines:true,
    complete:function(res){ onDone(null, res.data||[]); },
    error:function(err){ onDone(err.toString()); }
  });
}

function loadConvBaliData(){
  convBaliLoadState = 'loading';
  convLoadSimple(CONV_BALI_URL, (err, data)=>{
    if(err){ convBaliLoadState='error'; convBaliLoadError=err; }
    else{
      // Hanya tahun dengan data aktual (ADHK_Klungkung>0) — baris proyeksi 2026+ dikosongkan di sheet
      convBaliRows = data.filter(r=> lqParseNum(r['ADHK_Klungkung']) > 0);
      convBaliLoadState = 'ready';
    }
    if(convMode && convSubTab==='bali') renderKonvergensiView();
  });
}

function loadConvMrData(){
  convMrLoadState = 'loading';
  convLoadSimple(CONV_MR_URL, (err, data)=>{
    if(err){ convMrLoadState='error'; convMrLoadError=err; }
    else{
      convMrRows = data.filter(r=> lqParseNum(r['ADHK_Klungkung']) > 0);
      convMrLoadState = 'ready';

  });

/* Sheet 02_ANTAR_SEKTOR: satu baris = satu pasangan sektor per tahun (136 pasangan unik
   x 91 tahun 2010-2100, tapi hanya 2011-2025 yang punya data aktual). Matriks 17x17
   dibangun ulang di JS untuk tahun yang dipilih user (simetris: A-B = B-A). */
const SEKTOR_ORDER_BAKU = ['Pertanian','Penggalian','Industri','Listrik','Air','Konstruksi','Perdagangan','Transportasi','Akomodasi dan Makan Minum','Infokom','Keuangan','Real Estate','Jasa Perusahaan','Pemerintahan','Pendidikan','Kesehatan','Jasa Lainnya'];

function loadConvMatrixData(){
  convMatrixLoadState = 'loading';
  Papa.parse(CONV_ANTARSEKTOR_URL, {
    download:true, header:true, skipEmptyLines:true,
    complete:function(res){
      try{
        const data = res.data || [];
        const sectorSet = new Set();
        const years = new Set();
        const pairs = [];
        data.forEach(r=>{
          const tahun = parseInt(r['Tahun']);
          const a = (r['Sektor_A']||'').toString().trim();
          const b = (r['Sektor_B']||'').toString().trim();
          const absGap = lqParseNum(r['Absolute_Growth_Gap']);
          if(!a || !b || isNaN(tahun)) return;
          sectorSet.add(a); sectorSet.add(b);
          // Hanya tahun dengan data aktual: gap terisi & bukan baris placeholder (2026+ punya Growth -1,-1)
          const growthA = lqParseNum(r['Growth_A']);
          if(isNaN(absGap) || growthA===-1) return;
          if(tahun < 2011 || tahun > 2025) return;
          years.add(tahun);
          pairs.push({ tahun, a, b, absGap });
        });
        convAntarRows = pairs;
        convAntarYears = [...years].sort((x,y)=>x-y);
        convAntarSectors = SEKTOR_ORDER_BAKU.filter(s=> sectorSet.has(s));
        convMatrixLoadState = 'ready';
      }catch(err){ convMatrixLoadState='error'; convMatrixLoadError=err.message; }
      if(convMode && convSubTab==='matrix') renderKonvergensiView();
    },
    error:function(err){ convMatrixLoadState='error'; convMatrixLoadError=err.toString(); if(convMode && convSubTab==='matrix') renderKonvergensiView(); }
  });
}

function buildConvMatrixForYear(year){
  const matrix = {};
  convAntarSectors.forEach(s=> matrix[s] = {});
  convAntarRows.filter(p=>p.tahun===year).forEach(p=>{
    matrix[p.a][p.b] = p.absGap;
    matrix[p.b][p.a] = p.absGap;
  });
  return matrix;
}

/* =========================================================
   KLUNGKUNG VS BALI (SEKTORAL) — 6 sheet turunan:
   01 detail per-sektor per-tahun, 02 trajectory agregat 2011-2025,
   03 heatmap sektor x tahun, 04 snapshot (dihitung dari 01, karena
   sheet aslinya cell-driven/snapshot sama seperti kasus 03_SEKTOR_MATRIX),
   05 synchronization index per-sektor per-tahun, 06 ringkasan tahunan.
   Loader ditulis generik & memakai header dinamis supaya kalau baris/
   kolom tahun baru ditambahkan di sheet, otomatis ikut terbaca.
   ========================================================= */

function convLoadLongSheet(url, setState){
  Papa.parse(url, {
    download:true, header:true, skipEmptyLines:true,
    complete:function(res){ setState('ready', null, res.data||[]); },
    error:function(err){ setState('error', err.toString(), null); }
  });
}

function loadConvSektor01(){
  convSektor01LoadState = 'loading';
  convLoadLongSheet(CONV_SEKTOR_01_URL, (state, err, data)=>{
    if(state==='error'){ convSektor01LoadState='error'; convSektor01LoadError=err; }
    else{
      convSektor01Rows = data.map(r=>({
        tahun: parseInt(r['Tahun']),
        sektor: (r['Sektor']||'').toString().trim(),
        growthK: lqParseNum(r['Growth_Klungkung']),
        growthB: lqParseNum(r['Growth_Bali']),
        growthDiff: lqParseNum(r['Growth_Differential_pp']),
        absGap: lqParseNum(r['Absolute_Growth_Gap_pp']),
        status: (r['Status']||'').toString().trim().toUpperCase()
      })).filter(r=> r.sektor && !isNaN(r.tahun) && !isNaN(r.absGap) && r.growthK !== -1 && r.tahun <= 2025);
      convSektor01LoadState = 'ready';
    }
    if(convMode && convSubTab==='baliSektoral') renderKonvergensiView();
  });
}

function loadConvSektor02(){
  convSektor02LoadState = 'loading';
  convLoadLongSheet(CONV_SEKTOR_02_URL, (state, err, data)=>{
    if(state==='error'){ convSektor02LoadState='error'; convSektor02LoadError=err; }
    else{
      convSektor02Rows = data.map(r=>({
        sektor: (r['Sektor']||'').toString().trim(),
        avgGap: lqParseNum(r['Avg_Absolute_Gap_pp']),
        gapAwal: lqParseNum(r['2011_Absolute_Gap_pp']),
        gapAkhir: lqParseNum(r['2025_Absolute_Gap_pp']),
        gapChange: lqParseNum(r['Gap_Change_2011_2025_pp']),
        convRate: lqParseNum(r['Convergence_Rate']),
        yearsConv: parseInt(r['Years_Converging']),
        yearsDiv: parseInt(r['Years_Diverging']),
        yearsStable: parseInt(r['Years_Stable']),
        trajectory: (r['Overall_Trajectory']||'').toString().trim().toUpperCase()
      })).filter(r=> r.sektor);
      convSektor02LoadState = 'ready';
    }
    if(convMode && convSubTab==='baliSektoral') renderKonvergensiView();
  });
}

function loadConvSektor03(){
  convSektor03LoadState = 'loading';
  Papa.parse(CONV_SEKTOR_03_URL, {
    download:true, header:true, skipEmptyLines:true,
    complete:function(res){
      try{
        const data = res.data || [];
        if(!data.length) throw new Error('Sheet kosong.');
        const cols = Object.keys(data[0]);
        const yearCols = cols.filter(c=> /^\d{4}$/.test((c||'').toString().trim())).sort((a,b)=>parseInt(a)-parseInt(b));
        const sectors = []; const matrix = {};
        data.forEach(r=>{
          const s = (r['Sektor']||'').toString().trim();
          if(!s) return;
          sectors.push(s); matrix[s] = {};
          yearCols.forEach(y=>{ matrix[s][y] = lqParseNum(r[y]); });
        });
        convSektor03Data = { sectors, years: yearCols, matrix };
        convSektor03LoadState = 'ready';
      }catch(err){ convSektor03LoadState='error'; convSektor03LoadError=err.message; }
      if(convMode && convSubTab==='baliSektoral') renderKonvergensiView();
    },
    error:function(err){ convSektor03LoadState='error'; convSektor03LoadError=err.toString(); if(convMode && convSubTab==='baliSektoral') renderKonvergensiView(); }
  });
}

  const head = `<tr><th>Sektor</th>${years.map(y=>`<th>${y}</th>`).join('')}</tr>`;
  const bodyRows = sectors.map(s=>{
    const cells = years.map(y=>{

/* ---------- 2. MATRIKS SEKTOR ---------- */
function convMatrixColor(v, maxAbs){
  if(v===null || v===undefined || isNaN(v)) return '#F5F5F5';
  const t = Math.min(1, Math.abs(v)/(maxAbs||1));
  // hijau (mirip, gap kecil) -> merah (beda jauh, gap besar)
  const r1=[233,238,221], r2=[193,68,14]; // --green-bg -> --rust
  const r = Math.round(r1[0]+(r2[0]-r1[0])*t);
  const g = Math.round(r1[1]+(r2[1]-r1[1])*t);
  const b = Math.round(r1[2]+(r2[2]-r1[2])*t);
  return `rgb(${r},${g},${b})`;
}

  const body = document.getElementById('convBody');

  const maxAbs = allVals.length ? Math.max(...allVals) : 1;
  const avg = allVals.length ? allVals.reduce((s,v)=>s+v,0)/allVals.length : 0;

      <div class="stat-box"><div class="stat-label">Pasangan Paling Mirip</div><div class="stat-value" style="font-size:11.5px;line-height:1.4;">${minPair?escapeHtml(minPair.a)+' & '+escapeHtml(minPair.b)+' ('+minPair.v.toFixed(2)+' pp)':'-'}</div></div>

/* =========================================================
   ANALISIS DIVERSITAS EKONOMI (Entropy/Shannon-Weaver, HHI, REI, Tress Index)
   Sheet sumber SUDAH menghitung semua index-nya sendiri per Tahun, untuk
   Klungkung (kolom "K ...") maupun Bali sebagai pembanding (kolom "B ...").
   Dashboard ini hanya membaca & menyajikan, tidak menghitung ulang dari nol.
   ========================================================= */

function divNormalizeHeader(h){ return (h||'').toString().trim(); }

/* Parser angka khusus untuk sheet ini: koma sebagai desimal, tanpa pemisah ribuan
   (mis. "3580,17" -> 3580.17, "0,002748472838" -> 0.002748472838). Sengaja terpisah
   dari toNumber() global karena format sumber ini berbeda (Indonesian decimal comma). */
function divToNumber(v){
  if(v===undefined||v===null) return NaN;
  const s = v.toString().trim();
  if(s==='') return NaN;
  return parseFloat(s.replace(/,/g,'.'));
}

/* Cari semua kolom "PREFIX Share – Sektor" / "PREFIX Rank – Sektor" dsb,
   dan kembalikan {sektor: headerAsli} */
function divFindGroupCols(headers, prefix, label){
  const re = new RegExp('^'+prefix+'\\s*'+label+'\\s*[-\\u2013\\u2014]\\s*(.+)$','i');
  const out = {};
  headers.forEach(h=>{
    const m = divNormalizeHeader(h).match(re);
    if(m) out[m[1].trim()] = h;
  });
  return out;
}

function autoDetectDivColumns(){
  if(!divHeaders || !divHeaders.length) return;
  const find = (re)=> divHeaders.find(h=> re.test(divNormalizeHeader(h)));

  divMap.tahun = find(/^tahun$/i) || divMap.tahun;
  divMap.totalK = find(/^total\s*klungkung$/i) || divMap.totalK;
  divMap.totalB = find(/^total\s*bali$/i) || divMap.totalB;

  divMap.kShare = divFindGroupCols(divHeaders, 'K', 'Share');
  divMap.bShare = divFindGroupCols(divHeaders, 'B', 'Share');

  divMap.kEntropy = find(/^K\s*Entropy$/i) || divMap.kEntropy;
  divMap.kShannon = find(/^K\s*Shannon.?Weaver$/i) || divMap.kShannon;
  divMap.kHhi     = find(/^K\s*HHI$/i) || divMap.kHhi;
  divMap.kRei     = find(/^K\s*REI$/i) || divMap.kRei;
  divMap.kTress   = find(/^K\s*Tress/i) || divMap.kTress;

  divMap.bEntropy = find(/^B\s*Entropy$/i) || divMap.bEntropy;
  divMap.bShannon = find(/^B\s*Shannon.?Weaver$/i) || divMap.bShannon;
  divMap.bHhi     = find(/^B\s*HHI$/i) || divMap.bHhi;
  divMap.bRei     = find(/^B\s*REI$/i) || divMap.bRei;
  divMap.bTress   = find(/^B\s*Tress/i) || divMap.bTress;
}

function divMappingValid(){
  return !!(divMap.tahun && divMap.kEntropy && divMap.kHhi && divMap.kTress && Object.keys(divMap.kShare||{}).length>0);
}
function divHasBaliData(){
  return !!(divMap.bEntropy && divMap.bHhi && divMap.bTress && Object.keys(divMap.bShare||{}).length>0);
}

function divExtractYear(v){
  if(v===undefined||v===null) return NaN;
  const s = v.toString().trim();
  const m = s.match(/(19|20)\d{2}/);
  return m ? parseInt(m[0]) : parseInt(s);
}

function buildDivSeries(){
  const rows = [];
  divRawRows.forEach(r=>{
    const tahun = divExtractYear(r[divMap.tahun]);
    if(!tahun || isNaN(tahun)) return;
    const kEntropy = divToNumber(r[divMap.kEntropy]);
    const kHhi = divToNumber(r[divMap.kHhi]);
    const kTress = divToNumber(r[divMap.kTress]);
    if(isNaN(kEntropy) || isNaN(kHhi) || isNaN(kTress)) return;

    const kShares = {};
    Object.entries(divMap.kShare).forEach(([sektor,col])=>{
      const v = divToNumber(r[col]);
      if(!isNaN(v)) kShares[sektor] = v;
    });

    const row = {
      tahun,
      totalK: divMap.totalK ? divToNumber(r[divMap.totalK]) : null,
      kShares,
      kEntropy, kHhi, kTress,
      kShannon: divMap.kShannon ? divToNumber(r[divMap.kShannon]) : kEntropy,
      kRei: divMap.kRei ? divToNumber(r[divMap.kRei]) : null
    };
    if(row.kRei!==null && isNaN(row.kRei)) row.kRei = null;

    if(divHasBaliData()){
      const bEntropy = divToNumber(r[divMap.bEntropy]);
      const bHhi = divToNumber(r[divMap.bHhi]);
      const bTress = divToNumber(r[divMap.bTress]);
      if(!isNaN(bEntropy) && !isNaN(bHhi) && !isNaN(bTress)){
        const bShares = {};
        Object.entries(divMap.bShare).forEach(([sektor,col])=>{
          const v = divToNumber(r[col]);
          if(!isNaN(v)) bShares[sektor] = v;
        });
        row.totalB = divMap.totalB ? divToNumber(r[divMap.totalB]) : null;
        row.bShares = bShares;
        row.bEntropy = bEntropy; row.bHhi = bHhi; row.bTress = bTress;
        row.bShannon = divMap.bShannon ? divToNumber(r[divMap.bShannon]) : bEntropy;
        row.bRei = divMap.bRei ? divToNumber(r[divMap.bRei]) : null;
        if(row.bRei!==null && isNaN(row.bRei)) row.bRei = null;
      }
    }
    rows.push(row);
  });
  rows.sort((a,b)=>a.tahun-b.tahun);
  return rows;
}

function divHHIBadge(hhi){
  if(hhi < 0.15) return { label:'Terdiversifikasi', color:'#6F8F52' };
  if(hhi < 0.25) return { label:'Konsentrasi Sedang', color:'#B98B27' };
  return { label:'Sangat Terkonsentrasi', color:'#C1440E' };
}

function renderDiversityView(){
  const filterPanel = document.getElementById('kelFilterPanel');
  if(filterPanel) filterPanel.style.display = 'none';
  const main = document.getElementById('main');

  const introHtml = `
    <div class="ss-intro">

      <p>Mengukur seberapa merata PDRB Klungkung tersebar di antara berbagai sektor (diversifikasi) versus seberapa bertumpu pada segelintir sektor saja (konsentrasi), serta seberapa besar struktur itu bergeser dari tahun ke tahun. Empat indeks — <b>Entropy/Shannon-Weaver</b>, <b>HHI</b>, <b>REI</b>, dan <b>Tress Index</b> — sudah dihitung langsung di sumber data (Google Sheets) untuk Klungkung, dan juga tersedia untuk Bali sebagai pembanding.</p>
    </div>`;

  if(!DIV_CSV_URL){
    main.innerHTML = `<section class="ss-wrap">${introHtml}

          <input type="text" id="divUrlInput" placeholder="Tempel link publish-to-CSV Google Sheets di sini…" style="width:100%;font-family:'Inter',sans-serif;font-size:12.5px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card-bg);color:var(--brown);">
        </div>

      </div>
      <div class="state-msg">Belum ada sumber data.</div>
    </section>`;
    document.getElementById('divUrlApply').onclick = ()=>{
      const val = document.getElementById('divUrlInput').value.trim();
      if(!val) return;
      DIV_CSV_URL = val;
      divLoadState = 'idle';
      renderDiversityView();
    };
    return;
  }

  if(divLoadState==='idle'){
    main.innerHTML = `<section class="ss-wrap">${introHtml}<div class="state-msg"><span class="spinner"></span>Memuat data…</div></section>`;
    loadDivData();
    return;
  }
  if(divLoadState==='loading'){
    main.innerHTML = `<section class="ss-wrap">${introHtml}<div class="state-msg"><span class="spinner"></span>Memuat data…</div></section>`;
    return;
  }
  if(divLoadState==='error'){
    main.innerHTML = `<section class="ss-wrap">${introHtml}<div class="state-msg">⚠ Gagal memuat data: ${escapeHtml(divLoadError)}<br><br><a href="${DIV_CSV_URL}" target="_blank" style="color:var(--orange-deep);font-weight:600;">Buka sumber data →</a></div>
      <button class="ss-mapping-apply" id="divUrlReset" style="margin-top:10px;">Ganti Link Sumber Data</button>
    </section>`;
    document.getElementById('divUrlReset').onclick = ()=>{ DIV_CSV_URL=''; divLoadState='idle'; renderDiversityView(); };
    return;
  }
  if(!divRawRows || !divRawRows.length){
    main.innerHTML = `<section class="ss-wrap">${introHtml}<div class="state-msg">Sumber data kosong atau tidak dapat dibaca.</div></section>`;
    return;
  }

  const mappingOk = divMappingValid();

  main.innerHTML = `
    <section class="ss-wrap">
      ${introHtml}
      <div class="ss-method-note" id="divMethodNote"></div>

      <div class="ss-controls">
        <div class="ctrl-item"><label>Tahun Awal</label><select id="divFrom"></select></div>
        <div class="ctrl-item"><label>Tahun Akhir</label><select id="divTo"></select></div>
        ${divHasBaliData() ? `<div class="ctrl-item"><label style="display:flex;align-items:center;gap:5px;cursor:pointer;"><input type="checkbox" id="divCompareBali"${divCompareBali?' checked':''}> Bandingkan dengan Bali</label></div>` : ''}
        <div class="ctrl-item" style="font-size:11.5px;color:var(--brown-soft);" id="divIntervalInfo"></div>
        <button class="ss-mapping-toggle" id="divMapToggle">${mappingOk ? '⚙ Info Pemetaan Kolom' : '⚠ Kolom belum lengkap terdeteksi'}</button>
        <button class="ss-mapping-toggle" id="divUrlChangeBtn">🔗 Ganti Sumber Data</button>
      </div>

      <div class="ss-mapping-panel${divMappingPanelOpen ? ' open' : ''}" id="divMapPanel"></div>

      <div id="divBody"></div>
    </section>`;

  updateDivMethodNote();
  renderDivMappingInfo();

    divMappingPanelOpen = !divMappingPanelOpen;

  };
  document.getElementById('divUrlChangeBtn').onclick = ()=>{ DIV_CSV_URL=''; divLoadState='idle'; renderDiversityView(); };
  if(divHasBaliData()){
    document.getElementById('divCompareBali').onchange = (e)=>{ divCompareBali = e.target.checked; renderDiversityView(); };

  if(!mappingOk){

  const years = series.map(s=>s.tahun);

  toSel.onchange = ()=>{ divYearTo = parseInt(toSel.value); renderDiversityView(); };

  const filtered = series.filter(s=> s.tahun>=divYearFrom && s.tahun<=divYearTo);
  document.getElementById('divIntervalInfo').textContent = `${filtered.length} titik tahun ditampilkan`;

  if(!filtered.length){
    document.getElementById('divBody').innerHTML = `<div class="state-msg">Tidak ada tahun pada rentang ${divYearFrom}–${divYearTo}.</div>`;
    return;
  }

  divResult = filtered;
  if(!divCompositionYear || !filtered.find(s=>s.tahun===divCompositionYear)) divCompositionYear = filtered[filtered.length-1].tahun;

  renderDivBody(filtered);
}

function updateDivMethodNote(){
  document.getElementById('divMethodNote').innerHTML = `
    <div><b>📖 Apa itu indeks-indeks ini:</b> Keempatnya sama-sama dihitung dari pangsa (share) pᵢ tiap sektor terhadap total PDRB tiap tahun, tapi menyorot sisi berbeda: <b>Entropy/Shannon-Weaver</b> & <b>HHI</b> mengukur tingkat keberagaman/konsentrasi struktur ekonomi pada satu titik waktu, <b>REI</b> mengukur seberapa besar struktur itu bergeser dibanding tahun sebelumnya, dan <b>Tress Index</b> mengukur konsentrasi dengan bobot ranking sehingga lebih peka terhadap dominasi sektor terbesar.</div>
    <div style="margin-top:8px"><b>🧮 Formula:</b></div>
    <ul class="formula-list">
      <li>Entropy = −Σ pᵢ ln(pᵢ)</li>
      <li>HHI = Σ pᵢ²</li>
      <li>REIₜ = ½ Σ |pᵢ,ₜ − pᵢ,ₜ₋₁|</li>
      <li>Tress = [(Σ(shareᵢ × rankᵢ) − (n+1)/2) / (n − (n+1)/2)] × 100</li>
    </ul>
    <div class="formula-caption">rank 1 = share terkecil, rank n = share terbesar, n = ${DIV_N_SEKTOR}.</div>
    <div style="margin-top:8px"><b>💡 Cara membaca angka:</b> <b>Entropy</b> makin tinggi (mendekati ln(${DIV_N_SEKTOR})≈${Math.log(DIV_N_SEKTOR).toFixed(2)}) = ekonomi makin merata/terdiversifikasi antar sektor; mendekati 0 = sangat bertumpu pada segelintir sektor. <b>HHI</b> arahnya kebalikan: mendekati 1/${DIV_N_SEKTOR}≈${(1/DIV_N_SEKTOR).toFixed(2)} = merata; mendekati 1 = sangat terkonsentrasi (ambang umum: &lt;0,15 terdiversifikasi baik, 0,15–0,25 konsentrasi sedang, &gt;0,25 sangat terkonsentrasi). <b>REI</b> mendekati 0 = struktur ekonomi stabil dari tahun sebelumnya; makin tinggi = terjadi pergeseran porsi sektor yang signifikan dalam setahun. <b>Tress</b> 0 = seluruh sektor porsinya sama besar; mendekati 100 = ekonomi sangat bertumpu pada satu sektor dominan.</div>`;
}

function renderDivBody(series){

  const hhiBadge = divHHIBadge(latest.kHhi);
  const latestREI = [...series].reverse().find(s=>s.kRei!==null && s.kRei!==undefined && !isNaN(s.kRei));
  const showBali = divCompareBali && divHasBaliData();

  body.innerHTML = `
    <div class="ss-kpi-grid">
      <div class="stat-box"><div class="stat-label">Tahun Terakhir</div><div class="stat-value" style="font-size:15px;">${latest.tahun}</div></div>
      <div class="stat-box"><div class="stat-label">Entropy</div><div class="stat-value" style="font-size:15px;">${latest.kEntropy.toFixed(3)}${showBali && latest.bEntropy!==undefined?` <span style="font-size:11px;color:var(--brown-soft);">(Bali ${latest.bEntropy.toFixed(3)})</span>`:''}</div></div>

    : `<tr><th>Tahun</th><th>Entropy</th><th>HHI</th><th>Klasifikasi</th><th>Tress</th><th>REI</th></tr>`;
  const rows = series.map(s=>{

      <td>${s.kEntropy.toFixed(3)}</td>
      <td>${s.kHhi.toFixed(3)}</td>

function renderDivCompositionChart(s){
  if(!s) return;
  const ctx = document.getElementById('divCompCanvas');
  if(divCompChart){ divCompChart.destroy(); divCompChart=null; }
  const entries = Object.entries(s.kShares).sort((a,b)=> b[1]-a[1]);
  const datasets = [{ label:`Klungkung ${s.tahun}`, data:entries.map(e=>e[1]*100), backgroundColor:'#D64553' }];
  if(divCompareBali && s.bShares){
    datasets.push({ label:`Bali ${s.tahun}`, data:entries.map(e=> (s.bShares[e[0]]||0)*100), backgroundColor:'#3E6E8E' });
  }
  divCompChart = new Chart(ctx, {
    type:'bar',
    data:{ labels: entries.map(e=>e[0]), datasets },
    options:{
      indexAxis:'y',
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display: datasets.length>1, position:'bottom', labels:{font:{family:'Inter',size:11},color:'#4A1620'} } },
      scales:{
        x:{ grid:{color:'#F2D9D4'}, title:{display:true, text:'% terhadap Total PDRB', color:'#8A4A55', font:{size:10.5}}, ticks:{ color:'#8A4A55', font:{family:'Inter', size:10.5}, callback:v=>v+'%' } },
        y:{ grid:{display:false}, ticks:{ color:'#8A4A55', font:{family:'Inter', size:10.5} } }
      }
    }
  });
}

async function exportDivExcel(series, showBali){
  const header = showBali
    ? ['Tahun','K Entropy','K HHI','Klasifikasi K','K Tress','K REI','B Entropy','B HHI','B Tress','B REI']
    : ['Tahun','Entropy','HHI','Klasifikasi','Tress','REI'];
  const rows = series.map(s=>{
    const base = [s.tahun, s.kEntropy, s.kHhi, divHHIBadge(s.kHhi).label, s.kTress, s.kRei];
    if(showBali && s.bEntropy!==undefined) return [...base, s.bEntropy, s.bHhi, s.bTress, s.bRei];
    return base;
  });
  await exportStyledExcel(`diversitas_${divYearFrom}_${divYearTo}`, 'Diversitas', header, rows);
}

function loadDivData(){
  divLoadState = 'loading';
  Papa.parse(DIV_CSV_URL, {
    download:true,
    header:true,
    skipEmptyLines:true,
    complete:function(res){
      try{
        divRawRows = (res.data||[]).filter(r=> Object.values(r).some(v=> v!==null && v!==undefined && v.toString().trim()!==''));
        divHeaders = (res.meta && res.meta.fields) ? res.meta.fields.filter(h=>h && h.toString().trim()!=='') : (divRawRows[0]?Object.keys(divRawRows[0]):[]);
        autoDetectDivColumns();
        divLoadState = 'ready';
      }catch(err){
        divLoadState = 'error';
        divLoadError = err.message;
      }
      if(divMode) renderDiversityView();
    },
    error:function(err){
      divLoadState = 'error';
      divLoadError = err.toString();
      if(divMode) renderDiversityView();
    }
  });
}

/* ---------- Loader generik per sub-tab ---------- */
function advEnsureLoaded(key){
  const body = document.getElementById('advBody');
  const state = advLoadState[key];
  if(!state || state==='idle'){
    advLoadState[key] = 'loading';
    body.innerHTML = `<div class="state-msg"><span class="spinner"></span>Memuat data…</div>`;
    Papa.parse(ADV_URLS[key], {
      download:true, header:false, skipEmptyLines:false,
      complete:function(res){
        try{
          const grid = res.data || [];
          // Sheet-sheet ini punya baris judul/deskripsi di atas baris header asli,
          // jadi cari baris yang kolom pertamanya persis "Tahun" sebagai header sungguhan.
          let headerIdx = grid.findIndex(row => row && row[0] && row[0].toString().trim().toLowerCase()==='tahun');
          if(headerIdx === -1) headerIdx = 0;
          const headers = (grid[headerIdx]||[]).map(h=> (h||'').toString().trim());
          const dataRows = [];
          for(let i=headerIdx+1; i<grid.length; i++){
            const row = grid[i];
            const isBlank = !row || row.every(c=> c===null || c===undefined || c.toString().trim()==='');
            if(isBlank) break; // berhenti di baris kosong pertama setelah header (hindari blok ringkasan tambahan di bawahnya, mis. SUMMARY TAHUNAN)
            const obj = {};
            headers.forEach((h,idx)=>{ if(h) obj[h] = row[idx]; });
            dataRows.push(obj);
          }
          advRaw[key] = dataRows;
          advHeaders[key] = headers.filter(h=>h);
          advLoadState[key] = 'ready';
        }catch(err){ advLoadState[key]='error'; advLoadError[key]=err.message; }
        if(advMode && advSubTab===key) renderAdvancedView();
      },
      error:function(err){ advLoadState[key]='error'; advLoadError[key]=err.toString(); if(advMode && advSubTab===key) renderAdvancedView(); }
    });
    return false;
  }
  if(state==='loading'){ body.innerHTML = `<div class="state-msg"><span class="spinner"></span>Memuat data…</div>`; return false; }
  if(state==='error'){
    body.innerHTML = `<div class="state-msg">⚠ Gagal memuat data: ${escapeHtml(advLoadError[key]||'')}<br><br><a href="${ADV_URLS[key]}" target="_blank" style="color:var(--orange-deep);font-weight:600;">Buka sumber data →</a></div>
      <button class="ss-mapping-apply" id="advRetryBtn" style="margin-top:10px;">Coba Lagi</button>`;
    const btn = document.getElementById('advRetryBtn');
    if(btn) btn.onclick = ()=>{ advLoadState[key]='idle'; renderAdvancedView(); };
    return false;
  }
  if(!advRaw[key] || !advRaw[key].length){ body.innerHTML = `<div class="state-msg">Sumber data kosong.</div>`; return false; }
  return true;
}

/* =========================================================
   0a. GROWTH DIFFERENTIAL
   ========================================================= */
function advDetectGrowthDiffCols(){
  const h = advHeaders.growth_diff;
  const find = re=> h.find(x=> re.test(divNormalizeHeader(x)));
  advMap.growth_diff = {
    tahun: find(/^tahun$/i),
    adhkK: find(/^ADHK_Klungkung$/i),
    adhkB: find(/^ADHK_Bali$/i),
    growthK: find(/^Growth_K$/i),
    growthB: find(/^Growth_Bali$/i),
    diffPp: find(/^Growth_Diff_pp$/i),
    relDiff: find(/^Relative_Growth_Diff$/i),
    cumGap: find(/^Cumulative_Relative_Gap$/i),
    status: find(/^Status$/i)
  };
}
function advBuildGrowthDiffSeries(){
  const m = advMap.growth_diff;
  const rows = [];
  advRaw.growth_diff.forEach(r=>{
    const tahun = divExtractYear(r[m.tahun]);
    const adhkK = divToNumber(r[m.adhkK]);
    if(!tahun || isNaN(adhkK) || adhkK===0) return; // lewati baris padding (2026+)
    rows.push({
      tahun, adhkK, adhkB: divToNumber(r[m.adhkB]),
      growthK: divToNumber(r[m.growthK]), growthB: divToNumber(r[m.growthB]),
      diffPp: divToNumber(r[m.diffPp]), relDiff: divToNumber(r[m.relDiff]),
      cumGap: divToNumber(r[m.cumGap]), status: (r[m.status]||'').toString().trim()
    });
  });
  rows.sort((a,b)=>a.tahun-b.tahun);
  return rows;
}
function growthDiffBadge(status){
  if(/lebih cepat/i.test(status)) return {label:'Klungkung Lebih Cepat', color:'#6F8F52'};
  if(/lebih lambat/i.test(status)) return {label:'Klungkung Lebih Lambat', color:'#C1440E'};
  return {label:status||'Sama', color:'#8A4A55'};
}
function renderAdvGrowthDiff(){
  if(!advEnsureLoaded('growth_diff')) return;
  if(!advMap.growth_diff) advDetectGrowthDiffCols();
  const series = advBuildGrowthDiffSeries();
  const body = document.getElementById('advBody');
  if(!series.length){ body.innerHTML = `<div class="state-msg">Tidak ada data valid — periksa struktur kolom sumber data.</div>`; return; }

  const latest = series[series.length-1];
  const badge = growthDiffBadge(latest.status);

  body.innerHTML = `
    <div class="ss-method-note">
      <div><b>📖 Apa itu analisis ini:</b> Growth Differential membandingkan laju pertumbuhan ekonomi (ADHK) Klungkung terhadap Bali dari tahun ke tahun — apakah Klungkung tumbuh lebih cepat, lebih lambat, atau setara Bali.</div>
      <div style="margin-top:8px"><b>🧮 Formula:</b></div>
      <ul class="formula-list">
        <li>Growth Diff (pp) = (Growthₖ − Growth_Bali) × 100</li>
        <li>Cumulative Relative Gap = Σ Relative Growth Diff sejak tahun dasar</li>
      </ul>
      <div style="margin-top:8px"><b>💡 Cara membaca angka:</b> <b>Growth Diff (pp) positif</b> = pertumbuhan Klungkung tahun itu lebih cepat dari Bali dalam poin persentase. <b>Cumulative Relative Gap</b> menunjukkan akumulasi selisih sejak tahun dasar — tren naik berarti Klungkung perlahan mengejar/melampaui Bali, tren turun berarti sebaliknya.</div>
    </div>
    <div class="ss-kpi-grid">
      <div class="stat-box"><div class="stat-label">Tahun Terakhir</div><div class="stat-value" style="font-size:15px;">${latest.tahun}</div></div>
      <div class="stat-box"><div class="stat-label">Growth Diff (pp)</div><div class="stat-value" style="font-size:15px;color:${badge.color};">${latest.diffPp>=0?'+':''}${latest.diffPp.toFixed(3)} pp</div></div>
      <div class="stat-box"><div class="stat-label">Status</div><div class="stat-value" style="font-size:15px;color:${badge.color};">${escapeHtml(badge.label)}</div></div>
    </div>
    <div class="ss-section-title">Tren Pertumbuhan: Klungkung vs Bali</div>
    <div class="chart-box-wrap"><button class="dl-btn" id="dlAdvGrowthTs">⬇ JPG</button><div class="chart-box" style="height:280px;"><canvas id="advGrowthTsCanvas"></canvas></div></div>
    <div class="ss-section-title">Growth Differential & Cumulative Relative Gap</div>
    <div class="chart-box-wrap"><button class="dl-btn" id="dlAdvGrowthDiff">⬇ JPG</button><div class="chart-box" style="height:280px;"><canvas id="advGrowthDiffCanvas"></canvas></div></div>
    <div class="table-head-row"><span class="table-head-label">Tabel Growth Differential per Tahun</span><button class="dl-btn" id="advGrowthExcelBtn" style="position:static;">⬇ Excel</button></div>
    <div class="ss-table-wrap ss-table-scroll"><table class="ss-table" id="advGrowthTable"></table></div>
  `;

  document.getElementById('advGrowthTable').innerHTML = `<thead><tr><th>Tahun</th><th>Growth K</th><th>Growth Bali</th><th>Diff (pp)</th><th>Cum. Relative Gap</th><th>Status</th></tr></thead><tbody>${
    series.map(s=>{ const b=growthDiffBadge(s.status); return `<tr><td>${s.tahun}</td><td>${isNaN(s.growthK)?'-':(s.growthK*100).toFixed(2)+'%'}</td><td>${isNaN(s.growthB)?'-':(s.growthB*100).toFixed(2)+'%'}</td><td>${isNaN(s.diffPp)?'-':s.diffPp.toFixed(3)}</td><td>${isNaN(s.cumGap)?'-':(s.cumGap*100).toFixed(2)+'%'}</td><td><span class="ss-badge-quad" style="background:${b.color}">${escapeHtml(b.label)}</span></td></tr>`; }).join('')

function advDetectStructChangeCols(){
  const h = advHeaders.structural_change;
  const find = re=> h.find(x=> re.test(divNormalizeHeader(x)));
  advMap.structural_change = {
    tahun: find(/^tahun$/i), sektor: find(/^sektor$/i),
    totalK: find(/^total_k$/i), shareK: find(/^share_k$/i),
    totalB: find(/^total_bali$/i), shareB: find(/^share_bali$/i),
    deltaK: find(/^delta\s*share\s*k$/i), deltaB: find(/^delta_share_b$/i),
    sciK: find(/^sci_k$/i), sciB: find(/^sci_b$/i),
    gapSektoral: find(/^structural_gap_sectoral$/i),
    sciDiff: find(/^sci\s*difference$/i)
  };
}
function advBuildStructChangeRows(){
  const m = advMap.structural_change;
  const rows = [];
  advRaw.structural_change.forEach(r=>{
    const tahun = divExtractYear(r[m.tahun]);
    const sektor = (r[m.sektor]||'').toString().trim();
    const totalK = divToNumber(r[m.totalK]);
    if(!tahun || !sektor || isNaN(totalK) || totalK===0) return; // lewati baris padding (2026+)
    rows.push({
      tahun, sektor, shareK: divToNumber(r[m.shareK]), shareB: divToNumber(r[m.shareB]),
      deltaK: divToNumber(r[m.deltaK]), deltaB: divToNumber(r[m.deltaB]),
      sciK: divToNumber(r[m.sciK]), sciB: divToNumber(r[m.sciB]),
      gap: divToNumber(r[m.gapSektoral]), sciDiff: divToNumber(r[m.sciDiff])
    });
  });
  return rows;
}

/* =========================================================

   ========================================================= */
function advDetectKrugmanCols(){
  const h = advHeaders.krugman;
  const find = re=> h.find(x=> re.test(divNormalizeHeader(x)));
  advMap.krugman = {
    tahun: find(/^tahun$/i),
    sumGap: find(/^sum_absolute_share_gap$/i),
    half: find(/^krugman_index_half$/i),
    status: find(/^status$/i)
  };
}
function advBuildKrugmanSeries(){
  const m = advMap.krugman;
  const rows = [];
  advRaw.krugman.forEach(r=>{
    const tahun = divExtractYear(r[m.tahun]);
    const half = divToNumber(r[m.half]);
    const sumGap = divToNumber(r[m.sumGap]);
    if(!tahun || isNaN(half) || (half===0 && sumGap===0)) return; // lewati baris padding (2026+)
    rows.push({ tahun, sumGap, half, status: (r[m.status]||'').toString().trim() });
  });
  rows.sort((a,b)=>a.tahun-b.tahun);
  return rows;
}
function krugmanBadge(status){
  if(/very similar/i.test(status)) return {label:'Sangat Mirip', color:'#6F8F52'};
  if(/similar/i.test(status)) return {label:'Mirip', color:'#B98B27'};
  if(/different/i.test(status)) return {label:'Berbeda Struktural', color:'#C1440E'};
  return {label:status||'-', color:'#8A4A55'};
}
function renderAdvKrugman(){
  if(!advEnsureLoaded('krugman')) return;
  if(!advMap.krugman) advDetectKrugmanCols();
  const series = advBuildKrugmanSeries();

  if(!series.length){ body.innerHTML = `<div class="state-msg">Tidak ada data valid.</div>`; return; }
  const latest = series[series.length-1];
  const badge = krugmanBadge(latest.status);

  body.innerHTML = `
    <div class="ss-method-note">
      <div><b>📖 Apa itu indeks ini:</b> Krugman Specialization Index mengukur derajat perbedaan struktur ekonomi antar wilayah — konsep klasik dari Paul Krugman untuk melihat seberapa terspesialisasi suatu wilayah dibanding wilayah pembanding.</div>

      <ul class="formula-list">

    </div>
    <div class="ss-kpi-grid">
      <div class="stat-box"><div class="stat-label">Tahun Terakhir</div><div class="stat-value" style="font-size:15px;">${latest.tahun}</div></div>
      <div class="stat-box"><div class="stat-label">Krugman Index (Half)</div><div class="stat-value" style="font-size:15px;color:${badge.color};">${latest.half.toFixed(3)}</div></div>
      <div class="stat-box"><div class="stat-label">Status</div><div class="stat-value" style="font-size:15px;color:${badge.color};">${escapeHtml(badge.label)}</div></div>
    </div>

    <div class="chart-box-wrap"><button class="dl-btn" id="dlAdvKrugman">⬇ JPG</button><div class="chart-box" style="height:280px;"><canvas id="advKrugmanCanvas"></canvas></div></div>
    <div class="table-head-row"><span class="table-head-label">Tabel Indeks Krugman per Tahun</span><button class="dl-btn" id="advKrugmanExcelBtn" style="position:static;">⬇ Excel</button></div>
    <div class="ss-table-wrap ss-table-scroll"><table class="ss-table" id="advKrugmanTable"></table></div>
  `;

  document.getElementById('advKrugmanTable').innerHTML = `<thead><tr><th>Tahun</th><th>Sum Absolute Share Gap</th><th>Krugman Index (Half)</th><th>Status</th></tr></thead><tbody>${
    series.map(s=>{ const b=krugmanBadge(s.status); return `<tr><td>${s.tahun}</td><td>${s.sumGap.toFixed(4)}</td><td>${s.half.toFixed(4)}</td><td><span class="ss-badge-quad" style="background:${b.color}">${escapeHtml(b.label)}</span></td></tr>`; }).join('')
  }</tbody>`;

  const ctx = document.getElementById('advKrugmanCanvas');
  if(advCharts.krugman){ advCharts.krugman.destroy(); }
  advCharts.krugman = new Chart(ctx, {
    type:'line',
    data:{ labels: series.map(s=>s.tahun), datasets:[
      {label:'Krugman Index (Half)', data: series.map(s=>s.half), borderColor:'#C1440E', backgroundColor:'rgba(193,68,14,0.18)', fill:true, tension:0.4, pointRadius:0, pointHoverRadius:4, pointHitRadius:10}
    ]},
    options:{ responsive:true, maintainAspectRatio:false, interaction:{intersect:false, mode:'index'},
      plugins:{legend:{display:false}},
      scales:{ x:{grid:{display:false}, ticks:{color:'#8A4A55',font:{family:'Inter',size:10.5}}}, y:{grid:{color:'#F2D9D4'}, ticks:{color:'#8A4A55',font:{family:'Inter',size:10.5}}} } }
  });

  document.getElementById('dlAdvKrugman').onclick = ()=> triggerJPGDownload(advCharts.krugman, `krugman_index_tren`);

  };

/* =========================================================
   1. STRUCTURAL SIMILARITY (SSI)
   ========================================================= */
function advDetectSimilarityCols(){
  const h = advHeaders.similarity;
  const find = re=> h.find(x=> re.test(divNormalizeHeader(x)));
  advMap.similarity = {
    tahun: find(/^tahun$/i),
    totalK: find(/^total\s*klungkung$/i),
    totalB: find(/^total\s*bali$/i),
    kShare: divFindGroupCols(h, 'K', 'Share'),
    bShare: divFindGroupCols(h, 'B', 'Share'),
    totalGap: find(/^total\s*absolute\s*gap$/i),
    ssi: find(/^SSI$/i),
    ssiPct: find(/^SSI\s*\(%\)$/i) || h.find(x=> /ssi.*%/i.test(divNormalizeHeader(x)))
  };
}
function advBuildSimilaritySeries(){
  const m = advMap.similarity;
  const rows = [];
  advRaw.similarity.forEach(r=>{
    const tahun = divExtractYear(r[m.tahun]);
    if(!tahun) return;
    const ssiPct = divToNumber(r[m.ssiPct]);
    if(isNaN(ssiPct)) return;
    const kShares={}, bShares={};
    Object.entries(m.kShare).forEach(([s,c])=>{ const v=divToNumber(r[c]); if(!isNaN(v)) kShares[s]=v; });
    Object.entries(m.bShare).forEach(([s,c])=>{ const v=divToNumber(r[c]); if(!isNaN(v)) bShares[s]=v; });
    rows.push({ tahun, totalGap: divToNumber(r[m.totalGap]), ssi: divToNumber(r[m.ssi]), ssiPct, kShares, bShares });
  });
  rows.sort((a,b)=>a.tahun-b.tahun);
  return rows;
}
function ssiBadge(pct){
  if(pct>=85) return {label:'Sangat Mirip', color:'#6F8F52'};
  if(pct>=70) return {label:'Cukup Mirip', color:'#B98B27'};
  return {label:'Berbeda', color:'#C1440E'};
}
function renderAdvSimilarity(){
  if(!advEnsureLoaded('similarity')) return;
  if(!advMap.similarity) advDetectSimilarityCols();
  const series = advBuildSimilaritySeries();
  const body = document.getElementById('advBody');
  if(!series.length){ body.innerHTML = `<div class="state-msg">Tidak ada data valid — periksa struktur kolom sumber data.</div>`; return; }

  if(!advCompYear.similarity || !series.find(s=>s.tahun===advCompYear.similarity)) advCompYear.similarity = series[series.length-1].tahun;
  const latest = series[series.length-1];
  const badge = ssiBadge(latest.ssiPct);

  body.innerHTML = `
    <div class="ss-method-note">
      <div><b>📖 Apa itu indeks ini:</b> Structural Similarity Index (SSI) mengukur seberapa mirip struktur ekonomi Klungkung dengan Bali — bukan soal siapa "lebih maju", tapi seberapa mirip komposisi sektoralnya.</div>
      <div style="margin-top:8px"><b>🧮 Formula:</b></div>
      <ul class="formula-list"><li>SSI = 1 − ½ × Σ |Shareᵢ,Klungkung − Shareᵢ,Bali|</li></ul>
      <div class="formula-caption">Identik dengan REI di tab Diversitas, hanya sumbu pembandingnya diganti dari "antar tahun" menjadi "antar wilayah".</div>
      <div style="margin-top:8px"><b>💡 Cara membaca angka:</b> SSI (%) mendekati <b>100%</b> = struktur ekonomi Klungkung nyaris identik dengan Bali. Mendekati <b>0%</b> = struktur sangat berbeda — Klungkung punya "wajah ekonomi" sendiri, bukan sekadar mengikuti pola Bali. Ini indikator kemiripan struktural saja, bukan pernyataan sebab-akibat atau ketergantungan.</div>
    </div>
    <div class="ss-kpi-grid">
      <div class="stat-box"><div class="stat-label">Tahun Terakhir</div><div class="stat-value" style="font-size:15px;">${latest.tahun}</div></div>
      <div class="stat-box"><div class="stat-label">SSI</div><div class="stat-value" style="font-size:15px;color:${badge.color};">${latest.ssiPct.toFixed(1)}% · ${badge.label}</div></div>
      <div class="stat-box"><div class="stat-label">Total Absolute Gap</div><div class="stat-value" style="font-size:15px;">${latest.totalGap.toFixed(3)}</div></div>
    </div>
    <div class="ss-section-title">Tren Kemiripan Struktur Antar Tahun</div>
    <div class="chart-box-wrap"><button class="dl-btn" id="dlAdvSimTs">⬇ JPG</button><div class="chart-box" style="height:280px;"><canvas id="advSimTsCanvas"></canvas></div></div>
    <div class="ss-section-title">Perbandingan Komposisi Sektor</div>
    <div class="ss-controls" style="margin-bottom:10px;"><div class="ctrl-item"><label>Tahun</label><select id="advSimYear"></select></div></div>
    <div class="chart-box-wrap"><button class="dl-btn" id="dlAdvSimComp">⬇ JPG</button><div class="chart-box" style="height:${Math.max(280,Object.keys(latest.kShares).length*24)}px;"><canvas id="advSimCompCanvas"></canvas></div></div>
    <div class="table-head-row"><span class="table-head-label">Tabel SSI per Tahun</span><button class="dl-btn" id="advSimExcelBtn" style="position:static;">⬇ Excel</button></div>
    <div class="ss-table-wrap ss-table-scroll"><table class="ss-table" id="advSimTable"></table></div>
  `;

  const yearSel = document.getElementById('advSimYear');
  series.forEach(s=> yearSel.innerHTML += `<option value="${s.tahun}" ${s.tahun===advCompYear.similarity?'selected':''}>${s.tahun}</option>`);

/* =========================================================
   3. MARKOV TRANSITION
   ========================================================= */
function advDetectMarkovCols(){
  const h = advHeaders.markov;
  const find = re=> h.find(x=> re.test(divNormalizeHeader(x)));
  advMap.markov = {
    tahun: find(/^tahun$/i), sektor: find(/^sektor$/i), slq: find(/^SLQ$/i),
    kelas: find(/^Kelas$/i), kelasSebelum: find(/^Kelas\s*Sebelumnya$/i), transisi: find(/^Transisi$/i)
  };
}
function advBuildMarkovRows(){
  const m = advMap.markov;
  const rows = [];
  advRaw.markov.forEach(r=>{
    const tahun = divExtractYear(r[m.tahun]);
    const sektor = (r[m.sektor]||'').toString().trim();
    const kelas = (r[m.kelas]||'').toString().trim();
    if(!tahun || !sektor || !kelas) return;
    rows.push({ tahun, sektor, slq: divToNumber(r[m.slq]), kelas, kelasSebelum:(r[m.kelasSebelum]||'').toString().trim(), transisi:(r[m.transisi]||'').toString().trim() });
  });
  return rows;
}
const MARKOV_ORDER = ['Rendah','Menengah','Tinggi'];
function renderAdvMarkov(){
  if(!advEnsureLoaded('markov')) return;
  if(!advMap.markov) advDetectMarkovCols();
  const rows = advBuildMarkovRows();
  const body = document.getElementById('advBody');
  if(!rows.length){ body.innerHTML = `<div class="state-msg">Tidak ada data valid.</div>`; return; }

  const withPrev = rows.filter(r=> MARKOV_ORDER.includes(r.kelasSebelum) && MARKOV_ORDER.includes(r.kelas));
  const counts = {}; MARKOV_ORDER.forEach(a=>{ counts[a]={}; MARKOV_ORDER.forEach(b=> counts[a][b]=0); });
  withPrev.forEach(r=> counts[r.kelasSebelum][r.kelas]++ );
  const rowTotals = {}; MARKOV_ORDER.forEach(a=> rowTotals[a] = MARKOV_ORDER.reduce((s,b)=>s+counts[a][b],0));
  const stay = withPrev.filter(r=>r.kelasSebelum===r.kelas).length;
  const mobilityRate = withPrev.length? (1-stay/withPrev.length)*100 : 0;

  const years = [...new Set(rows.map(r=>r.tahun))].sort((a,b)=>a-b);
  const latestYear = years[years.length-1];
  const latestMovers = rows.filter(r=> r.tahun===latestYear && r.transisi && r.transisi!=='Tetap');

  body.innerHTML = `
    <div class="ss-method-note">
      <div><b>📖 Apa itu analisis ini:</b> Rantai Markov melihat bagaimana sektor "berpindah kelas" dari tahun ke tahun berdasarkan status LQ-nya, lalu memperkirakan probabilitas perpindahan tersebut — mirip konsep mobilitas kelas sosial, tapi untuk sektor ekonomi.</div>
      <div style="margin-top:8px"><b>🧮 Aturan Kelas &amp; Formula:</b></div>
      <ul class="formula-list">
        <li>Kelas: Rendah (SLQ &lt; 0,75) · Menengah (0,75 ≤ SLQ &lt; 1) · Tinggi/Basis (SLQ ≥ 1)</li>
        <li>P(i→j) = jumlah transisi kelas i ke kelas j / total transisi dari kelas i</li>
      </ul>
      <div style="margin-top:8px"><b>💡 Cara membaca angka:</b> Baris matriks = kelas <b>tahun sebelumnya</b>, kolom = kelas <b>tahun berjalan</b>. Angka di diagonal (Rendah→Rendah, dst.) menunjukkan seberapa stabil/persisten kelas suatu sektor. Angka tinggi di luar diagonal menandakan sektor sering naik/turun kelas. <b>Mobility Rate</b> = persentase transisi yang BUKAN "Tetap" — makin tinggi, makin sering sektor berpindah status dari tahun ke tahun.</div>
    </div>
    <div class="ss-kpi-grid">
      <div class="stat-box"><div class="stat-label">Total Transisi Diamati</div><div class="stat-value" style="font-size:15px;">${withPrev.length}</div></div>
      <div class="stat-box"><div class="stat-label">Mobility Rate</div><div class="stat-value" style="font-size:15px;">${mobilityRate.toFixed(1)}%</div></div>
      <div class="stat-box"><div class="stat-label">Sektor Berubah Kelas (${latestYear})</div><div class="stat-value" style="font-size:15px;">${latestMovers.length}</div></div>
    </div>
    <div class="ss-section-title">Matriks Probabilitas Transisi</div>
    <div class="ss-table-wrap" style="margin-bottom:18px;"><table class="ss-table" id="advMarkovMatrix"></table></div>
    ${latestMovers.length? `
    <div class="ss-section-title">Sektor yang Berubah Kelas di ${latestYear}</div>
    <div class="ss-table-wrap ss-table-scroll"><table class="ss-table" id="advMarkovMoversTable"></table></div>` : ''}
    <div class="table-head-row" style="margin-top:18px;"><span class="table-head-label">Ekspor Data Transisi Lengkap</span><button class="dl-btn" id="advMarkovExcelBtn" style="position:static;">⬇ Excel</button></div>
  `;

  const maxProb = Math.max(0.01, ...MARKOV_ORDER.flatMap(a=> MARKOV_ORDER.map(b=> rowTotals[a]? counts[a][b]/rowTotals[a] : 0)));
  const matrixHead = `<tr><th>Dari \\ Ke</th>${MARKOV_ORDER.map(b=>`<th>${b}</th>`).join('')}<th>Total</th></tr>`;
  const matrixRows = MARKOV_ORDER.map(a=>{
    const cells = MARKOV_ORDER.map(b=>{
      const c = counts[a][b]; const p = rowTotals[a]? c/rowTotals[a] : 0;
      const alpha = maxProb>0 ? (0.12+0.65*(p/maxProb)) : 0.12;
      return `<td style="background:rgba(214,69,83,${alpha.toFixed(2)});text-align:center;">${(p*100).toFixed(0)}%<br><span style="font-size:10px;color:var(--brown-soft);">(n=${c})</span></td>`;
    }).join('');
    return `<tr><td style="font-weight:700;">${a}</td>${cells}<td style="text-align:center;">${rowTotals[a]}</td></tr>`;
  }).join('');
  document.getElementById('advMarkovMatrix').innerHTML = `<thead>${matrixHead}</thead><tbody>${matrixRows}</tbody>`;

  if(latestMovers.length){
    document.getElementById('advMarkovMoversTable').innerHTML = `<thead><tr><th>Sektor</th><th>Kelas Sebelumnya</th><th>Kelas Sekarang</th><th>SLQ</th><th>Transisi</th></tr></thead><tbody>${
      latestMovers.map(r=>`<tr><td>${escapeHtml(r.sektor)}</td><td>${r.kelasSebelum}</td><td>${r.kelas}</td><td>${r.slq.toFixed(2)}</td><td>${escapeHtml(r.transisi)}</td></tr>`).join('')
    }</tbody>`;
  }

  document.getElementById('advMarkovExcelBtn').onclick = async ()=>{
    await exportStyledExcel('markov_transition', 'Markov', ['Tahun','Sektor','SLQ','Kelas','Kelas Sebelumnya','Transisi'], rows.map(r=>[r.tahun,r.sektor,r.slq,r.kelas,r.kelasSebelum,r.transisi]));
  };
}
