<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Indikator — BPS Klungkung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js';document.head.appendChild(s);"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';document.head.appendChild(s);"></script>
<style>
  :root{
    --cream:#FFF9F5;
    --cream-deep:#FFEFE3;
    --peach:#F0AFAE;
    --peach-soft:#FBDCDA;
    --orange:#D64553;
    --orange-deep:#B23244;
    --brown:#4A1620;
    --brown-deep:#2E0D14;
    --brown-mid:#7A3540;
    --brown-soft:#A9787E;
    --green:#6F8F52;
    --green-bg:#E9EEDD;
    --rust:#C1440E;
    --rust-bg:#FCE1CB;
    --white:#FFFFFF;
    --card-bg:#FFFFFF;
    --page-bg:#FFFFFF;
    --line:#E5E5E5;
    --border:#E5E5E5;
    --shadow: 0 6px 20px rgba(0,0,0,0.08);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    color:var(--brown);
    background:var(--page-bg);
    min-height:100vh;
    padding-bottom:50px;
  }
  ::selection{background:var(--peach);}

  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    color:var(--brown-deep);
    margin:0;
  }

  /* ===== Hero ===== */
  .hero{
    background: var(--white);
    border-bottom:1px solid #ECECEC;
    padding:30px 24px 40px;
    position:relative;
    overflow:hidden;
  }
  .hero-inner{
    max-width:1280px; margin:0 auto; position:relative; z-index:1;
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .hero-eyebrow{
    color:var(--orange); font-weight:600; letter-spacing:.13em; text-transform:uppercase;
    font-size:11px; margin-bottom:8px; font-family:'Inter',sans-serif;
  }
  .hero h1{ color:var(--brown-deep); font-size:clamp(22px,3vw,32px); font-weight:600; line-height:1.15; }
  .hero p{ color:var(--brown-mid); margin-top:6px; font-size:12.5px; max-width:480px; line-height:1.45; }

  .hero-stats{ display:flex; gap:10px; flex-wrap:wrap; }
  .stat-pill{
    background:#F7F7F7;
    border:1px solid #ECECEC;
    border-radius:12px;
    padding:9px 15px;
    min-width:88px;
  }
  .stat-pill .num{ color:var(--brown-deep); font-family:'Fraunces',serif; font-size:20px; font-weight:600; line-height:1; }
  .stat-pill .lbl{ color:var(--brown-mid); font-size:10px; margin-top:3px; letter-spacing:.05em; }

  /* ===== Tabbar sticky wrap: tab kiri + ringkasan statistik kanan, sama-sama freeze ===== */
  .tabbar-sticky-wrap{
    position:sticky; top:0; z-index:60;
    background:var(--page-bg);
    margin-top:-22px;
    padding:14px 0 10px;
    display:flex; align-items:center; gap:14px;
  }
  .tabbar-sticky-wrap .tabbar{ flex:1; min-width:0; margin-top:0; }
  .tabbar-stats{
    display:flex; gap:8px; flex-shrink:0;
  }
  .stat-pill-mini{
    background:var(--white);
    border:1px solid #ECECEC;
    border-radius:12px;
    box-shadow:var(--shadow);
    padding:8px 14px;
    min-width:74px;
    text-align:center;
  }
  .stat-pill-mini .num{ color:var(--brown-deep); font-family:'Fraunces',serif; font-size:17px; font-weight:600; line-height:1; }
  .stat-pill-mini .lbl{ color:var(--brown-mid); font-size:8.5px; margin-top:2px; letter-spacing:.05em; }
  @media (max-width: 860px){
    .tabbar-sticky-wrap{ flex-wrap:wrap; }
    .tabbar-stats{ order:2; width:100%; }
  }

  /* ===== Layout ===== */
  .page-wrap{ max-width:1280px; margin:0 auto; padding:0 24px; }

  /* Tabbar */
  .tabbar{
    background:var(--white);
    border:1px solid #ECECEC;
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:9px 10px;
    margin-top:-22px;
    position:relative; z-index:5;
    display:flex; gap:6px; flex-wrap:wrap; align-items:center;
  }
  .tab{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12.5px;
    padding:8px 14px;
    background:none;
    border:none;
    border-radius:10px;
    cursor:pointer;
    color:var(--brown);
    transition:background .15s, color .15s;
  }
  .tab.active{ background:var(--orange); color:#fff; }
  .tab:hover:not(.active){ background:var(--peach-soft); }
  .tab-sep{
    width:1px;
    align-self:stretch;
    background:var(--peach-soft);
    margin:4px 4px;
  }

  main{ padding-top:22px; }

  /* ===== Filter panel (left sidebar) ===== */
  .content-row{ display:flex; align-items:flex-start; gap:20px; }
  .content-row main{ flex:1; min-width:0; }
  .kel-filter-panel{
    width:220px;
    flex-shrink:0;
    background:var(--white);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:16px;
    margin-top:22px;
    position:sticky;
    top:16px;
    max-height:calc(100vh - 32px);
    overflow-y:auto;
  }
  .kel-filter-head{
    display:flex; align-items:center; justify-content:space-between;
    gap:8px; margin-bottom:12px;
  }
  .kel-filter-head span{
    font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    font-weight:700; color:var(--brown-mid);
  }
  .kel-filter-reset{
    font-size:10.5px; font-weight:600; color:var(--orange-deep);
    background:none; border:none; cursor:pointer; padding:2px 0;
    text-decoration:underline;
  }
  .kel-filter-reset:hover{ color:var(--orange); }
  .kel-filter-kat{ margin-bottom:14px; }
  .kel-filter-kat:last-child{ margin-bottom:0; }
  .kel-filter-kat-head{
    display:flex; align-items:center; justify-content:space-between;
    font-size:11.5px; font-weight:700; color:var(--brown-deep);
    margin-bottom:6px; padding-bottom:5px;
    border-bottom:1px solid var(--cream-deep);
  }
  .kel-filter-kat-toggle{
    font-size:10px; font-weight:600; color:var(--brown-soft);
    background:none; border:none; cursor:pointer; padding:0;
  }
  .kel-filter-kat-toggle:hover{ color:var(--orange-deep); }
  .kel-filter-item{
    display:flex; align-items:center; gap:7px;
    font-size:12px; color:var(--brown-mid);
    padding:4px 2px; cursor:pointer; border-radius:6px;
  }
  .kel-filter-item:hover{ background:var(--cream); color:var(--brown); }
  .kel-filter-item input{ accent-color:var(--orange); cursor:pointer; flex-shrink:0; }
  @media (max-width:900px){
    .content-row{ flex-direction:column; }
    .kel-filter-panel{
      width:100%;
      position:static;
      max-height:none;
      margin-top:14px;
    }
    .kel-filter-kat{ margin-bottom:10px; }
  }

  /* ===== Section headers ===== */
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin:22px 0 10px; flex-wrap:wrap; gap:6px;}
  .section-head h2{ font-size:17px; font-weight:600; }
  .section-head .tag{ font-size:11px; color:var(--brown); background:var(--peach-soft); padding:4px 10px; border-radius:100px; font-weight:600; letter-spacing:.04em;}

  .footer-note{ text-align:center; color:var(--brown-soft); font-size:11.5px; margin-top:30px; }

  /* Compare view */
  .compare-wrap{ margin-top:20px; }
  .compare-intro h2{
    font-family:'Fraunces',serif; font-weight:600; font-size:19px;
    margin:0 0 3px; color:var(--brown);
  }
  .compare-intro p{ margin:0 0 14px; color:var(--brown-mid); font-size:12.5px; max-width:560px; line-height:1.45; }

  .compare-controls{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--card-bg); border:1px solid var(--line); border-radius:12px;
    padding:10px 14px; margin-bottom:14px;
  }
  .ctrl-item{ display:flex; align-items:center; gap:7px; }
  .ctrl-item label{ font-size:11.5px; font-weight:600; color:var(--brown-mid); }
  .ctrl-item select{
    font-family:'Inter',sans-serif; font-size:12.5px; padding:5px 9px; border-radius:7px;
    border:1px solid var(--line); background:var(--cream); color:var(--brown);
  }
  .cmp-normalize{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--brown-mid); cursor:pointer; }
  .cmp-normalize input{ accent-color:var(--orange-deep); width:14px; height:14px; }
  .cmp-clear{
    margin-left:auto; font-size:12px; font-weight:700; color:var(--rust);
    background:var(--rust-bg); border:none; padding:6px 12px; border-radius:999px; cursor:pointer;
  }
  .cmp-clear:hover{ filter:brightness(.96); }

  .compare-body{
    display:grid; grid-template-columns:230px 1fr; gap:14px; align-items:start;
  }
  .compare-picker{
    background:var(--card-bg); border:1px solid var(--line); border-radius:12px;
    padding:8px; max-height:480px; overflow-y:auto;
  }
  .picker-kategori{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:700;
    color:var(--orange-deep); margin:11px 7px 3px;
  }
  .picker-kategori:first-child{ margin-top:1px; }
  .picker-kelompok{
    font-size:11px; font-weight:700; color:var(--brown-mid); margin:6px 7px 3px;
  }
  .picker-item{
    display:flex; align-items:center; gap:8px;
    font-size:12.5px; color:var(--brown); padding:5px 7px; border-radius:7px;
    cursor:pointer;
  }
  .picker-item:hover{ background:var(--cream-deep); }
  .picker-item.picked{ background:var(--peach-soft); }
  .picker-item input{ accent-color:var(--orange-deep); width:14px; height:14px; flex-shrink:0; }
  .picker-item span{ flex:1; line-height:1.25; }
  .picker-item.picked::after{
    content:''; width:7px; height:7px; border-radius:50%;
    background:var(--dotcolor, var(--orange-deep)); flex-shrink:0;
  }

  .compare-chart-area{ min-height:300px; display:flex; flex-direction:column; gap:12px; }
  .compare-empty{
    display:none;
    background:var(--card-bg); border:1px dashed var(--line); border-radius:12px;
    padding:50px 24px; text-align:center; color:var(--brown-soft); font-size:13px;
  }

  /* AI Insight & Definisi Grid */
  .cmp-info-grid{
    display:grid;
    grid-template-columns: 1fr;
    gap:12px;
  }
  .ai-insight-box{
    background: #FAFAFA;
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px;
  }
  .ai-insight-title{
    font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; font-weight:700;
    color:var(--orange-deep); margin-bottom:8px; display:flex; align-items:center; gap:6px;
  }
  .ai-insight-content{
    font-size:12.5px; line-height:1.6; color:var(--brown);
  }
  .ai-insight-content b{ color:var(--brown-deep); }
  .insight-section-title{
    font-weight:700; color:var(--brown-deep); margin-top:10px; margin-bottom:4px; display:block;
  }

  .compare-defs-box{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
  }
  .compare-defs-title{
    font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700;
    color:var(--orange-deep); margin-bottom:8px;
  }
  .def-item{
    font-size:12px; line-height:1.45; color:var(--brown-mid); margin-bottom:8px;
  }
  .def-item:last-child{ margin-bottom:0; }
  .def-item b{ color:var(--brown); }

  @media (max-width:760px){
    .compare-body{ grid-template-columns:1fr; }
    .compare-picker{ max-height:240px; }
  }

  /* ===== Shift-Share Dinamis ===== */
  .ss-wrap{ margin-top:20px; }
  .ss-intro h2{
    font-family:'Fraunces',serif; font-weight:600; font-size:19px;
    margin:0 0 3px; color:var(--brown);
  }
  .ss-intro p{ margin:0 0 14px; color:var(--brown-mid); font-size:12.5px; max-width:680px; line-height:1.5; }
  .ss-intro a{ color:var(--orange-deep); font-weight:600; }

  .ss-method-tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .ss-method-tab{
    font-family:'Inter',sans-serif; font-size:12px; font-weight:700;
    padding:8px 14px; border-radius:999px; cursor:pointer;
    background:var(--cream-deep); border:1px solid var(--border); color:var(--brown-mid);
  }
  .ss-method-tab.active{ background:var(--orange); color:#fff; border-color:var(--orange); }
  .ss-method-tab:hover:not(.active){ background:var(--peach-soft); }

  .ss-method-note{
    background:#FAFAFA;
    border:1px solid var(--border); border-radius:12px; padding:12px 16px; margin-bottom:14px;
    font-size:12px; line-height:1.55; color:var(--brown);
  }
  .ss-method-note b{ color:var(--brown-deep); }
  .ss-method-note .formula-list{ margin:4px 0 2px 20px; padding:0; }
  .ss-method-note .formula-list li{ margin-bottom:4px; font-family:'Menlo','Consolas',monospace; font-size:15px; font-weight:700; color:var(--brown-deep); }
  .ss-method-note .formula-caption{ margin:6px 0 2px 20px; font-size:11.5px; font-style:italic; color:var(--brown-soft); line-height:1.5; }
  .ss-method-note .component-list{ margin:4px 0 8px 20px; padding:0; }
  .ss-method-note .component-list li{ margin-bottom:5px; }

  .ss-controls{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--card-bg); border:1px solid var(--line); border-radius:12px;
    padding:10px 14px; margin-bottom:14px;
  }

  .ss-mapping-toggle{
    font-size:11.5px; font-weight:700; color:var(--orange-deep); background:none; border:none;
    cursor:pointer; text-decoration:underline; margin-left:auto;
  }
  .ss-mapping-panel{
    display:none; background:var(--card-bg); border:1px dashed var(--border); border-radius:12px;
    padding:14px; margin-bottom:14px;
  }
  .ss-mapping-panel.open{ display:block; }
  .ss-mapping-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px 16px; margin-bottom:10px; }
  .ss-mapping-grid .ctrl-item{ flex-direction:column; align-items:flex-start; gap:4px; }
  .ss-mapping-grid select{ width:100%; }
  .ss-mapping-mode{ display:flex; gap:14px; margin-bottom:10px; font-size:12px; font-weight:600; color:var(--brown-mid); }

  .ms-dropdown{ position:relative; display:inline-block; }
  .ms-dropdown-btn{
    font-size:11.5px; font-weight:700; color:var(--brown); background:var(--card-bg);
    border:1.5px solid var(--border); border-radius:8px; padding:6px 12px; cursor:pointer;
    display:flex; align-items:center; gap:6px;
  }
  .ms-dropdown-btn:hover{ border-color:var(--orange-deep); }
  .ms-dropdown-panel{
    display:none; position:absolute; top:calc(100% + 6px); left:0; z-index:20;
    background:var(--card-bg); border:1.5px solid var(--border); border-radius:10px;
    padding:8px; min-width:160px; box-shadow:0 6px 20px rgba(74,22,32,0.12);
  }
  .ms-dropdown-panel.open{ display:block; }
  .ms-dropdown-item{
    display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px;
    font-size:12.5px; font-weight:600; color:var(--brown-mid); cursor:pointer; white-space:nowrap;
  }
  .ms-dropdown-item:hover{ background:var(--cream-deep); }
  .ms-dropdown-item input{ accent-color:var(--orange-deep); width:14px; height:14px; flex-shrink:0; }
  .ss-mapping-mode label{ display:flex; align-items:center; gap:6px; cursor:pointer; }
  .ss-mapping-apply{
    font-size:12px; font-weight:700; color:#fff; background:var(--orange-deep); border:none;
    padding:7px 16px; border-radius:999px; cursor:pointer;
  }
  .ss-mapping-apply:hover{ filter:brightness(1.05); }

  .ss-kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px; }

  .ss-section-title{
    font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:700;
    color:var(--orange-deep); margin:18px 0 8px;
  }

  .ss-quad-grid{ display:grid; grid-template-columns:1.1fr 1fr; gap:14px; align-items:start; }
  .ss-quad-legend{
    display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;
  }
  .ss-quad-legend-item{
    background:var(--cream); border:1px solid var(--line); border-radius:10px; padding:8px 10px;
    font-size:11.5px; line-height:1.4; color:var(--brown-mid);
  }
  .ss-quad-legend-item b{ color:var(--brown-deep); display:block; font-size:12px; margin-bottom:2px; }
  .ss-quad-legend-item .cnt{ color:var(--orange-deep); font-weight:700; }

  .ss-table-wrap{
    border:1px solid var(--line); border-radius:12px; overflow:hidden;
  }
  table.ss-table{ width:100%; border-collapse:collapse; font-size:12px; }
  table.ss-table thead th{
    background:var(--brown); color:var(--cream); text-align:right;
    padding:8px 10px; font-size:10.5px; text-transform:uppercase; letter-spacing:.03em;
    white-space:nowrap; position:sticky; top:0;
  }
  table.ss-table thead th:first-child, table.ss-table thead th:nth-child(2){ text-align:left; }
  table.ss-table td{ padding:7px 10px; text-align:right; border-bottom:1px solid var(--line); color:var(--brown-mid); white-space:nowrap; }
  table.ss-table td:first-child, table.ss-table td:nth-child(2){ text-align:left; color:var(--brown); font-weight:600; }
  table.ss-table tbody tr:hover{ background:var(--cream); }
  table.ss-table td.pos{ color:var(--green); font-weight:700; }
  table.ss-table td.neg{ color:var(--rust); font-weight:700; }
  .ss-table-scroll{ max-height:420px; overflow:auto; }
  .ss-badge-quad{
    display:inline-block; font-size:10px; font-weight:700; padding:2px 8px; border-radius:999px;
    color:#fff;
  }

  @media (max-width:900px){
    .ss-quad-grid{ grid-template-columns:1fr; }
  }
  @media (max-width:760px){
    table.ss-table{ font-size:11px; }
  }

  /* Category section */
  .kategori-block{ margin-top:24px; }
  .section-head h2{ display:flex; align-items:center; gap:9px; }
  .kat-dot{
    width:11px; height:11px; border-radius:50%;
    display:inline-block; flex-shrink:0;
  }
  .kelompok-block{ margin-top:14px; }
  .kelompok-chip{
    display:inline-flex;
    align-items:center;
    gap:5px;
    background:var(--peach-soft);
    color:var(--orange-deep);
    font-size:11px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:999px;
    margin-bottom:9px;
  }
  .kelompok-chip::before{
    content:'';
    width:5px;height:5px;border-radius:50%;
    background:currentColor;
  }

  .card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(255px,1fr));
    gap:12px;
  }

  .insight-card{
    background:linear-gradient(120deg, var(--kat-accent, var(--orange))17, var(--card-bg) 55%);
    border:1px solid var(--line);
    border-top:4px solid var(--kat-accent, var(--orange));
    border-left:5px solid var(--kat-accent, var(--orange));
    cursor:default;
    justify-content:center;
  }
  .insight-card:hover{ transform:none; box-shadow:var(--shadow); }
  .insight-card-head{
    display:flex; align-items:center; gap:7px;
  }
  .insight-card-icon{ font-size:15px; }
  .insight-card-title{
    font-weight:800; font-size:12.5px; letter-spacing:.02em;
    color:var(--kat-accent, var(--orange-deep));
    text-transform:uppercase;
  }
  .insight-card-text{
    font-size:13px; line-height:1.6; color:var(--brown-mid);
  }
  .insight-card-text b{ color:var(--brown); }

  .card{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-top:4px solid var(--kat-accent, var(--orange));
    border-radius:var(--radius);
    padding:15px 19px 15px;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .card:hover{
    transform:translateY(-2px);
    border-color:var(--orange);

function toNumber(v){
  if(v===undefined||v===null) return NaN;
  const s = v.toString().trim().replace(/\./g,'').replace(/,/g,'.');
  const direct = parseFloat(v.toString().trim().replace(/,/g,''));
  if(!isNaN(direct)) return direct;
  return parseFloat(s);
}

function fmtNum(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return n.toLocaleString('id-ID', {maximumFractionDigits:2});
}

function triwulanToNum(t){
  if(!t) return 0;
  const s = t.toString().trim().toUpperCase();
  const map = {'I':1,'II':2,'III':3,'IV':4,'1':1,'2':2,'3':3,'4':4};
  return map[s] || 0;
}

function sortKey(e){ return e.tahun*10 + triwulanToNum(e.triwulan); }

function periodLabel(e){
  return e.triwulan ? `${e.tahun} TW ${e.triwulan}` : `${e.tahun}`;
}

function buildStore(rows){
  STORE = {};
  DEFINISI = {};
  SATUAN = {};
  rows.slice(1).forEach(row=>{ 
    const periode = (row[0]||'').toString().trim();
    const triwulan = (row[1]||'').toString().trim();
    const tahun = parseInt((row[2]||'').toString().trim());
    
    const kategori = (row[3]||'').toString().trim();
    const kelompok = (row[4]||'').toString().trim();
    const subkelompok = (row[5]||'').toString().trim();
    const data = toNumber(row[6]);
    const satuan = (row[7]||'').toString().trim();

    const defSub = (row[8]||'').toString().trim();
    const defText = (row[9]||'').toString().trim();
    if(defSub && defText && !DEFINISI[defSub]) DEFINISI[defSub] = defText;
    if(subkelompok && satuan && !SATUAN[subkelompok]) SATUAN[subkelompok] = satuan;

    if(!periode || !kategori || !kelompok || !subkelompok || isNaN(tahun) || isNaN(data)) return;

    if(!STORE[periode]) STORE[periode] = {};
    if(!STORE[periode][kategori]) STORE[periode][kategori] = {};
    if(!STORE[periode][kategori][kelompok]) STORE[periode][kategori][kelompok] = {};
    if(!STORE[periode][kategori][kelompok][subkelompok]) STORE[periode][kategori][kelompok][subkelompok] = [];

    STORE[periode][kategori][kelompok][subkelompok].push({tahun, triwulan, data});
  });

  Object.values(STORE).forEach(katObj=>{
    Object.values(katObj).forEach(kelObj=>{
      Object.values(kelObj).forEach(subObj=>{
        Object.keys(subObj).forEach(sk=>{
          subObj[sk].sort((a,b)=>sortKey(a)-sortKey(b));
        });
      });
    });
  });

  const periodeList = Object.keys(STORE);
  const priority = ['Tahunan','Triwulanan','Triwulan'];
  periodeList.sort((a,b)=>{
    const ia = priority.indexOf(a), ib = priority.indexOf(b);
    if(ia===-1 && ib===-1) return a.localeCompare(b);
    if(ia===-1) return 1;
    if(ib===-1) return -1;
    return ia-ib;
  });
  if(!activePeriode || !STORE[activePeriode]) activePeriode = periodeList[0];
  STORE.__order = periodeList;

  if(!ENABLED_KELOMPOK) ENABLED_KELOMPOK = new Set();
  periodeList.forEach(p=>{
    Object.keys(STORE[p]).forEach(kat=>{
      Object.keys(STORE[p][kat]).forEach(kel=>{
        const key = `${kat}|||${kel}`;
        if(!ENABLED_KELOMPOK.has(key)) ENABLED_KELOMPOK.add(key);
      });
    });
  });
}

function renderKelFilterPanel(periode){
  const panel = document.getElementById('kelFilterPanel');
  if(!panel) return;
  panel.style.display = '';
  const katObj = STORE[periode];
  if(!katObj){ panel.innerHTML = ''; return; }

  let html = `<div class="kel-filter-head">
      <span>Tampilkan Data</span>
      <button class="kel-filter-reset" id="kelFilterReset">Tampilkan Semua</button>
    </div>`;

  Object.keys(katObj).forEach(kategori=>{
    const kelompokList = Object.keys(katObj[kategori]);
    html += `<div class="kel-filter-kat">
        <div class="kel-filter-kat-head">
          <span>${escapeHtml(kategori)}</span>
          <button class="kel-filter-kat-toggle" data-kat="${encodeURIComponent(kategori)}">semua/tidak</button>
        </div>`;
    kelompokList.forEach(kelompok=>{
      const key = `${kategori}|||${kelompok}`;
      const checked = ENABLED_KELOMPOK.has(key) ? 'checked' : '';
      html += `<label class="kel-filter-item">
          <input type="checkbox" data-key="${encodeURIComponent(key)}" ${checked}>
          <span>${escapeHtml(kelompok)}</span>
        </label>`;
    });
    html += `</div>`;
  });

  panel.innerHTML = html;

  panel.querySelectorAll('.kel-filter-item input[type=checkbox]').forEach(cb=>{
    cb.onchange = ()=>{
      const key = decodeURIComponent(cb.dataset.key);
      if(cb.checked) ENABLED_KELOMPOK.add(key); else ENABLED_KELOMPOK.delete(key);
      renderContent(activePeriode);
    };
  });

  panel.querySelectorAll('.kel-filter-kat-toggle').forEach(btn=>{
    btn.onclick = ()=>{
      const kategori = decodeURIComponent(btn.dataset.kat);
      const kelompokList = Object.keys(katObj[kategori]);
      const allOn = kelompokList.every(kel=>ENABLED_KELOMPOK.has(`${kategori}|||${kel}`));
      kelompokList.forEach(kel=>{
        const key = `${kategori}|||${kel}`;
        if(allOn) ENABLED_KELOMPOK.delete(key); else ENABLED_KELOMPOK.add(key);
      });
      renderKelFilterPanel(periode);
      renderContent(activePeriode);
    };
  });

  const resetBtn = document.getElementById('kelFilterReset');
  if(resetBtn){
    resetBtn.onclick = ()=>{
      Object.keys(katObj).forEach(kategori=>{
        Object.keys(katObj[kategori]).forEach(kelompok=>{
          ENABLED_KELOMPOK.add(`${kategori}|||${kelompok}`);
        });
      });
      renderKelFilterPanel(periode);
      renderContent(activePeriode);
    };
  }
}

function computeHeroStats(){
  const subSet = new Set();
  const katSet = new Set();
  let maxTahun = -Infinity;
  STORE.__order.forEach(p=>{
    Object.keys(STORE[p]).forEach(kat=>{
      katSet.add(kat);
      Object.keys(STORE[p][kat]).forEach(kel=>{
        Object.keys(STORE[p][kat][kel]).forEach(sub=>{
          subSet.add(kat+'|||'+kel+'|||'+sub);
          STORE[p][kat][kel][sub].forEach(e=>{ if(e.tahun>maxTahun) maxTahun = e.tahun; });
        });
      });
    });
  });
  const elIndikator = document.getElementById('statIndikator');
  const elKategori = document.getElementById('statKategori');
  const elTerbaru = document.getElementById('statTerbaru');
  if(elIndikator) elIndikator.textContent = subSet.size;
  if(elKategori) elKategori.textContent = katSet.size;
  if(elTerbaru) elTerbaru.textContent = isFinite(maxTahun) ? maxTahun : '–';
}

function makeSparkline(entries, color, type){
  color = color || 'var(--orange)';
  type = type || 'filled-area';
  const vals = entries.slice(-8).map(e=>e.data);
  if(vals.length < 2){
    return `<div class="spark-wrap"></div>`;
  }
  const w = 220, h = 34, pad = 3;
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max-min) || 1;
  const step = (w-pad*2) / (vals.length-1);

  let svgContent = '';

  if (type === 'bar') {
    const barW = Math.max(3, (w - pad * 2) / vals.length * 0.5);
    svgContent = vals.map((v, i) => {
      let barH = ((v - min) / range) * (h - pad * 2);
      barH = Math.max(barH, 2); 
      const x = pad + i * step - barW / 2;
      const y = h - pad - barH;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="${color}" rx="0"></rect>`;
    }).join('');
  } else if (type === 'rounded-bar') {
    const barW = Math.max(3, (w - pad * 2) / vals.length * 0.6);
    svgContent = vals.map((v, i) => {
      let barH = ((v - min) / range) * (h - pad * 2);
      barH = Math.max(barH, 3); 
      const x = pad + i * step - barW / 2;
      const y = h - pad - barH;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="${color}" rx="3" ry="3"></rect>`;
    }).join('');
  } else if (type === 'lollipop') {
    svgContent = vals.map((v, i) => {
      const x = pad + i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      const baseY = h - pad;
      return `
        <line x1="${x.toFixed(1)}" y1="${baseY.toFixed(1)}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${color}" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${color}"/>
      `;
    }).join('');
  } else if (type === 'pure-bubble') {
    svgContent = vals.map((v, i) => {
      const x = pad + i * step;
      const normVal = range > 0 ? (v - min) / range : 0.5;
      const y = h - pad - normVal * (h - pad * 2);
      const radius = 2 + normVal * 4; 
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${radius.toFixed(1)}" fill="${color}" opacity="0.85"/>`;
    }).join('');
  } else if (type === 'bubble-ts') {
    let pathD = '';
    const pts = vals.map((v, i) => {
      const x = pad + i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return {x, y, v};
    });
    pts.forEach((p, i) => {
      if (i === 0) pathD += `M ${p.x.toFixed(1)},${p.y.toFixed(1)} `;
      else pathD += `L ${p.x.toFixed(1)},${p.y.toFixed(1)} `;
    });
    let bubbles = pts.map(p => {
      const normVal = range > 0 ? (p.v - min) / range : 0.5;
      const radius = 2 + normVal * 5; 
      return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${radius.toFixed(1)}" fill="${color}" opacity="0.85"/>`;
    }).join('');

    svgContent = `
      <path d="${pathD}" fill="none" stroke="${color}" stroke-width="1.2" opacity="0.4" stroke-dasharray="3,3"/>
      ${bubbles}
    `;
  } else if (type === 'spline') {
    let pathD = '';
    const pts = vals.map((v, i) => {
      const x = pad + i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return {x, y};
    });
    pts.forEach((p, i) => {
      if (i === 0) {
        pathD += `M ${p.x.toFixed(1)},${p.y.toFixed(1)} `;
      } else {
        const prev = pts[i - 1];
        const cpX = (prev.x + p.x) / 2;
        pathD += `C ${cpX.toFixed(1)},${prev.y.toFixed(1)} ${cpX.toFixed(1)},${p.y.toFixed(1)} ${p.x.toFixed(1)},${p.y.toFixed(1)} `;
      }
    });
    const last = pts[pts.length - 1];
    const first = pts[0];
    const poly = `${first.x.toFixed(1)},${h} ${pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')} ${last.x.toFixed(1)},${h}`;
    svgContent = `
      <polygon points="${poly}" fill="${color}" opacity="0.12"/>
      <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="3" fill="${color}"/>
    `;
  } else if (type === 'stepped-area') {
    let pathD = '';
    const pts = vals.map((v,i) => {
      const x = pad + i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    pts.forEach((p, i) => {
      const [x, y] = p.split(',');
      if (i === 0) {
        pathD += `M ${x},${y} `;
      } else {
        const prevY = pts[i-1].split(',')[1];
        pathD += `L ${x},${prevY} L ${x},${y} `;
      }
    });
    const last = pts[pts.length-1].split(',');
    svgContent = `
      <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${color}"/>
    `;
  } else if (type === 'dashed-area') {
    const pts = vals.map((v,i) => {
      const x = pad + i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    const last = pts[pts.length-1].split(',');
    svgContent = `
      <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4,4"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${color}"/>
    `;
  } else if (type === 'scatter') {
    svgContent = vals.map((v, i) => {
      const x = pad + i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${color}"/>`;
    }).join('');
  } else if (type === 'waterfall') {
    const barW = Math.max(3, (w - pad * 2) / vals.length * 0.55);
    const zeroY = h - pad;
    svgContent = vals.map((v, i) => {
      const prev = i === 0 ? min : vals[i-1];
      const isUp = v >= prev;
      const yTop = h - pad - ((Math.max(v,prev) - min) / range) * (h - pad * 2);
      const yBot = h - pad - ((Math.min(v,prev) - min) / range) * (h - pad * 2);
      const barH = Math.max(2, yBot - yTop);
      const x = pad + i * step - barW / 2;
      const barColor = i === 0 ? color : (isUp ? '#4E7D5A' : '#A63A50');
      return `<rect x="${x.toFixed(1)}" y="${yTop.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="${barColor}" rx="1"></rect>`;
    }).join('');
  } else if (type === 'funnel') {
    const sortedIdx = vals.map((v,i)=>i).sort((a,b)=>vals[b]-vals[a]);
    const barH = Math.max(2, (h - pad*2) / vals.length - 2);
    svgContent = sortedIdx.map((origI, rank) => {
      const v = vals[origI];
      const wRatio = range > 0 ? 0.28 + 0.72*((v-min)/range) : 1;
      const barW = (w - pad*2) * wRatio;
      const x = pad + ((w - pad*2) - barW)/2;
      const y = pad + rank * ((h - pad*2)/vals.length);
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="${color}" opacity="${(0.55+0.45*(v-min)/range).toFixed(2)}" rx="2"></rect>`;
    }).join('');
  } else if (type === 'surface') {
    const cellW = (w - pad*2) / vals.length;
    svgContent = vals.map((v, i) => {
      const norm = range > 0 ? (v-min)/range : 0.5;
      const x = pad + i * cellW;
      const op = 0.25 + norm*0.7;
      return `<rect x="${x.toFixed(1)}" y="${pad}" width="${(cellW-1.5).toFixed(1)}" height="${(h-pad*2).toFixed(1)}" fill="${color}" opacity="${op.toFixed(2)}" rx="2"></rect>`;
    }).join('');
  } else if (type === 'radar') {
    const cx = h / 2 + 6, cy = h / 2, r = h / 2 - 3;
    const n = vals.length;
    const pts = vals.map((v, i) => {
      const norm = range > 0 ? (v - min) / range : 0.5;
      const rad = 0.35 + norm * (r - 2);
      const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
      return [cx + Math.cos(angle) * rad, cy + Math.sin(angle) * rad];
    });
    const poly = pts.map(p => p.map(v=>v.toFixed(1)).join(',')).join(' ');
    svgContent = `<polygon points="${poly}" fill="${color}" fill-opacity="0.28" stroke="${color}" stroke-width="1.4"></polygon>`;
  } else if (type === 'polar-area') {
    const cx = h / 2 + 6, cy = h / 2, rMax = h / 2 - 2;
    const n = vals.length;
    const slice = (Math.PI * 2) / n;
    svgContent = vals.map((v, i) => {
      const norm = range > 0 ? (v - min) / range : 0.5;
      const rad = 0.3 + norm * (rMax - 1);
      const a0 = i * slice - Math.PI / 2;
      const a1 = a0 + slice;
      const x0 = cx + Math.cos(a0) * rad, y0 = cy + Math.sin(a0) * rad;
      const x1 = cx + Math.cos(a1) * rad, y1 = cy + Math.sin(a1) * rad;
      return `<path d="M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${rad.toFixed(1)},${rad.toFixed(1)} 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" fill="${color}" fill-opacity="${(0.3+0.5*norm).toFixed(2)}" stroke="#fff" stroke-width="0.5"></path>`;
    }).join('');
  } else if (type === 'diverging-bar') {
    const avg = vals.reduce((s,v)=>s+v,0)/vals.length;
    const zeroY = h - pad - ((avg - min) / range) * (h - pad * 2);
    const barW = Math.max(3, (w - pad * 2) / vals.length * 0.55);
    svgContent = vals.map((v, i) => {
      const x = pad + i * step - barW / 2;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      const isUp = v >= avg;
      const yTop = isUp ? y : zeroY;
      const barH = Math.max(1.5, Math.abs(zeroY - y));
      return `<rect x="${x.toFixed(1)}" y="${yTop.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="${isUp ? '#4E7D5A' : '#A63A50'}" rx="1"></rect>`;
    }).join('') + `<line x1="${pad}" y1="${zeroY.toFixed(1)}" x2="${w-pad}" y2="${zeroY.toFixed(1)}" stroke="#8A4A55" stroke-width="0.7" stroke-dasharray="2,2"></line>`;
  } else if (type === 'combo') {
    const barW = Math.max(3, (w - pad * 2) / vals.length * 0.55);
    const bars = vals.map((v, i) => {
      const x = pad + i * step - barW / 2;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      const barH = h - pad - y;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="${color}" opacity="0.45" rx="1"></rect>`;
    }).join('');
    let running = 0;
    const cumLine = vals.map((v,i)=>{
      running += v;
      const avgSoFar = running/(i+1);
      const x = pad + i * step;
      const y = h - pad - ((avgSoFar - min) / range) * (h - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    svgContent = bars + `<polyline points="${cumLine}" fill="none" stroke="${color}" stroke-width="1.6"></polyline>`;
  } else if (type === 'pareto') {
    const idxSorted = vals.map((v,i)=>i).sort((a,b)=>vals[b]-vals[a]);
    const barW = Math.max(3, (w - pad * 2) / vals.length * 0.6);
    const total = vals.reduce((s,v)=>s+v,0) || 1;
    let cum = 0;
    const bars = idxSorted.map((origI, rank) => {
      const v = vals[origI];
      const x = pad + rank * step - barW/2 + step/2 - step/2;
      const xPos = pad + rank * (w - pad*2)/vals.length;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      const barH = h - pad - y;
      return `<rect x="${xPos.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="${color}" opacity="0.55" rx="1"></rect>`;
    }).join('');
    const cumPts = idxSorted.map((origI, rank) => {
      cum += vals[origI];
      const pct = cum/total;
      const xPos = pad + rank * (w - pad*2)/vals.length + (w-pad*2)/vals.length/2;
      const y = h - pad - pct * (h - pad*2);
      return `${xPos.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    svgContent = bars + `<polyline points="${cumPts}" fill="none" stroke="#4A1620" stroke-width="1.4"></polyline>`;
  } else if (type === 'stream') {
    const midY = h / 2;
    const scaleY = range > 0 ? (h - pad*2) / 2 / (range/2) : 1;
    const topPts = vals.map((v, i) => {
      const x = pad + i * step;
      const halfV = ((v - min) - range/2) * scaleY * 0.5;
      return [x, midY - Math.abs(halfV) - 2];
    });
    const botPts = vals.map((v, i) => {
      const x = pad + i * step;
      const halfV = ((v - min) - range/2) * scaleY * 0.5;
      return [x, midY + Math.abs(halfV) + 2];
    });
    const pathPts = topPts.concat(botPts.slice().reverse());
    const d = pathPts.map((p,idx)=> (idx===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') + ' Z';
    svgContent = `<path d="${d}" fill="${color}" fill-opacity="0.5" stroke="${color}" stroke-width="1"></path>`;
  } else {
    const pts = vals.map((v,i) => {
      const x = pad + i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    const last = pts[pts.length-1].split(',');
    const poly = `${pts[0].split(',')[0]},${h} ${pts.join(' ')} ${last[0]},${h}`;
    svgContent = `
      <polygon points="${poly}" fill="${color}" opacity="0.15"/>
      <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${color}"/>
    `;
  }

  return `<div class="spark-wrap"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${svgContent}</svg></div>`;
}

function changeBadge(entries){
  if(entries.length < 2) return `<span class="badge na">Data awal</span>`;
  const latest = entries[entries.length-1].data;
  const prev = entries[entries.length-2].data;
  const diff = latest - prev;
  if(Math.abs(diff) < 0.0005) return `<span class="badge flat">▬ ${fmtNum(prev)}</span>`;
  const up = diff > 0;
  return `<span class="badge ${up?'up':'down'}">${up?'▲':'▼'} ${fmtNum(prev)}</span>`;
}

/* Badge pertumbuhan (%) year-on-year — dipakai khusus untuk subkelompok
   "Harga Konstan" (nilai riil), sesuai permintaan: nilai + pertumbuhan
   dibanding tahun sebelumnya, bukan nilai tahun sebelumnya. */
function growthBadge(entries){
  if(entries.length < 2) return `<span class="badge na">Data awal</span>`;
  const latest = entries[entries.length-1].data;
  const prev = entries[entries.length-2].data;
  if(!prev){ return `<span class="badge na">n/a</span>`; }
  const growth = (latest/prev - 1) * 100;
  if(Math.abs(growth) < 0.005) return `<span class="badge flat">▬ 0,00%</span>`;
  const up = growth > 0;
  return `<span class="badge ${up?'up':'down'}">${up?'▲':'▼'} ${up?'+':''}${growth.toFixed(2).replace('.',',')}%</span>`;
}

/* Kartu ringkasan/insight otomatis — mengisi slot kosong di baris terakhir grid kartu
   sebuah kelompok, berisi 2-3 kalimat insight dari indikator-indikator di kelompok itu. */
function buildKelompokInsightHtml(kelompok, subObj, normalSubs, kelColor, span){
  const items = normalSubs.map(sub=>{
    const entries = subObj[sub];
    if(!entries || !entries.length) return null;
    const latest = entries[entries.length-1];
    let pct = null;
    if(entries.length>=2){
      const prev = entries[entries.length-2].data;
      if(prev){ pct = (latest.data/prev - 1)*100; }
    }
    return { sub, value:latest.data, satuan:SATUAN[sub]||'', pct };
  }).filter(Boolean);
  if(!items.length) return '';

  const movers = items.filter(it=>it.pct!==null && isFinite(it.pct));
  let sentence2 = '';
  if(movers.length){
    const best = movers.slice().sort((a,b)=>b.pct-a.pct)[0];
    const worst = movers.slice().sort((a,b)=>a.pct-b.pct)[0];
    if(best && best.pct>0 && (!worst || worst.sub!==best.sub || worst.pct<=0)){
      sentence2 += `<b>${escapeHtml(best.sub)}</b> naik paling tinggi (${best.pct>=0?'+':''}${best.pct.toFixed(2).replace('.',',')}%) dibanding periode sebelumnya. `;
    }
    if(worst && worst.pct<0){
      sentence2 += `<b>${escapeHtml(worst.sub)}</b> turun paling dalam (${worst.pct.toFixed(2).replace('.',',')}%).`;
    }
  }
  if(!sentence2){
    sentence2 = `Nilai terbaru relatif stabil dibanding periode sebelumnya di seluruh indikator kelompok ini.`;
  }
  const countTxt = `${items.length} indikator`;

  return `<div class="card insight-card" style="--kat-accent:${kelColor}; grid-column: span ${span};">
      <div class="insight-card-head"><span class="insight-card-icon">💡</span><span class="insight-card-title">Ringkasan ${escapeHtml(kelompok)}</span></div>
      <div class="insight-card-text">Kelompok ini memuat ${countTxt}. ${sentence2}</div>
    </div>`;
}

/* Kartu ringkasan/insight untuk kelompok yang isinya kartu komposisi saja (mis. PDRB
   Lapangan Usaha: Harga Berlaku + Harga Konstan) — dominan sektor berdasar kontribusi (Harga
   Berlaku) dan sektor pertumbuhan tertinggi (Harga Konstan). */
function buildCompInsightHtml(kelompok, compGroups, subObj, kelColor, span){
  const parts = [];
  compGroups.forEach(g=>{
    if(g.kind!=='berlaku' && g.kind!=='konstan') return;
    let maxSK = -Infinity;
    g.segs.forEach(s=> (subObj[s]||[]).forEach(e=>{ maxSK = Math.max(maxSK, sortKey(e)); }));
    const latestEntries = g.segs.map(s=>{
      const arr = subObj[s] || [];
      const entry = arr.find(e=>sortKey(e)===maxSK) || arr[arr.length-1];
      if(!entry) return null;
      const prevEntry = arr.filter(e=>sortKey(e)<sortKey(entry)).sort((a,b)=>sortKey(b)-sortKey(a))[0] || null;
      return { sub:s, entry, prevEntry };
    }).filter(Boolean);
    if(!latestEntries.length) return;
    const total = latestEntries.reduce((sum,x)=>sum+(x.entry.data||0),0) || 1;
    const withShare = latestEntries.map(x=>({...x, share: x.entry.data/total*100}));
    const dominant = withShare.slice().sort((a,b)=>b.share-a.share)[0];
    const dominantShort = shortSegName(dominant.sub, g.label);
    if(g.kind==='berlaku'){
      parts.push(`Di <b>${escapeHtml(g.label)}</b>, kontribusi terbesar berasal dari <b>${escapeHtml(dominantShort)}</b> (${dominant.share.toFixed(1).replace('.',',')}% dari total).`);
    }else if(g.kind==='konstan'){
      const growthList = latestEntries.filter(x=> x.prevEntry && x.prevEntry.data && !NO_GROWTH_LABELS.test(shortSegName(x.sub, g.label))).map(x=>({...x, growth: (x.entry.data/x.prevEntry.data - 1)*100}));
      if(growthList.length){
        const top = growthList.slice().sort((a,b)=>b.growth-a.growth)[0];
        const topShort = shortSegName(top.sub, g.label);
        parts.push(`Pertumbuhan tertinggi di <b>${escapeHtml(g.label)}</b> dicatat oleh <b>${escapeHtml(topShort)}</b> (${top.growth>=0?'+':''}${top.growth.toFixed(2).replace('.',',')}%).`);
      }else{
        parts.push(`Kontribusi terbesar di <b>${escapeHtml(g.label)}</b> berasal dari <b>${escapeHtml(dominantShort)}</b> (${dominant.share.toFixed(1).replace('.',',')}% dari total).`);
      }
    }
  });
  if(!parts.length) return '';
  return `<div class="card insight-card" style="--kat-accent:${kelColor}; grid-column: span ${span};">
      <div class="insight-card-head"><span class="insight-card-icon">💡</span><span class="insight-card-title">Ringkasan ${escapeHtml(kelompok)}</span></div>
      <div class="insight-card-text">${parts.join(' ')}</div>
    </div>`;
}

function renderContent(periode){
  const main = document.getElementById('main');
  const katObj = STORE[periode];
  if(!katObj){ main.innerHTML = '<div class="state-msg">Tidak ada data.</div>'; return; }

  renderKelFilterPanel(periode);

  let html = '';
  let anyVisible = false;
  Object.keys(katObj).forEach(kategori=>{
    const kelObj = katObj[kategori];
    const visibleKelompok = Object.keys(kelObj).filter(kel=>ENABLED_KELOMPOK.has(`${kategori}|||${kel}`));
    if(visibleKelompok.length === 0) return;
    anyVisible = true;
    const subCount = visibleKelompok.reduce((n,k)=>n+Object.keys(kelObj[k]).length,0);
    html += `<section class="kategori-block">
      <div class="section-head"><h2><span class="kat-dot"></span>${escapeHtml(kategori)}</h2><span class="tag">${subCount} indikator</span></div>`;

    visibleKelompok.forEach(kelompok=>{
      const subObj = kelObj[kelompok];
      const compGroups = getCompositionGroups(subObj, kelompok);
      const kelColor = getGroupColor(kategori, kelompok);
      const claimedSubs = new Set(compGroups.flatMap(g=>g.segs));
      const normalSubs = Object.keys(subObj).filter(s=>!claimedSubs.has(s));

      html += `<div class="kelompok-block" style="--kat-accent:${kelColor}">
        <div class="kelompok-chip" style="background:${kelColor}22;color:${kelColor}">${escapeHtml(kelompok)}</div>
        <div class="card-grid">`;

      compGroups.forEach(g=>{
        html += renderCompositionCardHtml(periode,kategori,kelompok,subObj,g,kelColor);
      });
      normalSubs.forEach(sub=>{
          const entries = subObj[sub];
          const latest = entries[entries.length-1];
          const key = encodeURIComponent(JSON.stringify([periode,kategori,kelompok,sub]));
          const subChartType = getGroupChartType(kategori, kelompok, sub);
          const styleKey = chartStyleKey(kategori, kelompok, sub);
          const isHargaKonstan = /harga\s+konstan/i.test(sub);

          const satuanTeks = SATUAN[sub] ? `<span class="card-unit">${escapeHtml(SATUAN[sub])}</span>` : '';
          const styleOptionsHtml = CHART_STYLE_OPTIONS.map(o=>`<option value="${o.value}" ${o.value===subChartType?'selected':''}>${o.label}</option>`).join('');

          html += `<div class="card" data-key='${key}'>
              <div class="card-top-row">
                <div class="card-label">${escapeHtml(sub)}</div>
                <select class="chart-style-select" data-stylekey="${escapeHtml(styleKey)}" title="Ubah gaya grafik">${styleOptionsHtml}</select>
              </div>
              <div>
                <div class="card-period">Diperbarui: ${periodLabel(latest)}</div>
                <div class="card-value-row">
                  <div class="card-value">${fmtNum(latest.data)}${satuanTeks}</div>
                  ${isHargaKonstan ? growthBadge(entries) : changeBadge(entries)}
                </div>
              </div>
              ${makeSparkline(entries, kelColor, subChartType)}
              <div class="card-hint">Klik untuk lihat data</div>
            </div>`;
      });

      // Kartu ringkasan/insight mengisi slot kosong di baris terakhir (kalau ada).
      const totalCardCount = compGroups.length + normalSubs.length;
      const remainder = totalCardCount % 3;
      const insightSpan = remainder===1 ? 2 : (remainder===2 ? 1 : 0);
      if(insightSpan>0){
        let insightHtml = '';
        if(normalSubs.length>0){
          insightHtml = buildKelompokInsightHtml(kelompok, subObj, normalSubs, kelColor, insightSpan);
        }
        if(!insightHtml && compGroups.length>0){

function splitCompositionSegments(subObj){
  const subs = Object.keys(subObj);
  const candidates = subs.filter(s => {
    const t = s.trim();
    return /^\d+(\.\d+)?%/.test(t) || /^persentase/i.test(t);
  });
  if(candidates.length < 2 || candidates.length > 8) return null;

  const yearTotals = {};
  candidates.forEach(sub=>{
    subObj[sub].forEach(e=>{
      const k = sortKey(e);
      yearTotals[k] = (yearTotals[k]||0) + e.data;
    });
  });
  const totals = Object.values(yearTotals);
  if(totals.length === 0) return null;
  const closeTo100 = totals.filter(t=>Math.abs(t-100) <= 5).length;
  if((closeTo100 / totals.length) < 0.6) return null;
  return candidates;
}

const LEVEL_SUFFIX_RE = /\s+(SD\/Sederajat|SMP\/Sederajat|SMA\/Sederajat|SMK\/Sederajat|Perguruan Tinggi|\d{1,2}\s*-\s*\d{1,2}\s*Tahun|Laki-laki|Laki-Laki|Perempuan)$/i;

function splitLevelGroups(subObj){
  const subs = Object.keys(subObj);
  const groups = {};
  subs.forEach(s=>{
    const m = s.match(LEVEL_SUFFIX_RE);
    if(m){
      const prefix = s.slice(0, m.index).trim();
      if(!groups[prefix]) groups[prefix] = [];
      groups[prefix].push(s);
    }
  });
  return Object.keys(groups)
    .filter(p=>groups[p].length >= 2)
    .map(p=>({ label:p, segs:groups[p] }));
}

function longestCommonPrefix(strs){
  if(!strs || !strs.length) return '';
  let prefix = strs[0];
  for(let i=1;i<strs.length;i++){
    while(strs[i].indexOf(prefix) !== 0){
      prefix = prefix.slice(0, -1);
      if(!prefix) return '';
    }
  }
  return prefix;
}

/* Pola prefix PDRB yang dikenal — dipakai untuk deteksi grup DAN untuk memotong
   label di grafik/legend (hanya sisakan nama sektor/komponen pengeluaran).
   "Bruto" opsional supaya menangani variasi penamaan ("Nilai Tambah Bruto Harga
   Berlaku Pengeluaran ..." vs "Nilai Tambah Harga Berlaku Lapangan Usaha ..."). */
const HARGA_BERLAKU_DIMS = [
  { re:/^Nilai\s+Tambah\s+(?:Bruto\s+)?Harga\s+Berlaku\s+Lapangan\s+Usaha\s+/i, label:'Harga Berlaku' },
  { re:/^Nilai\s+Tambah\s+(?:Bruto\s+)?Harga\s+Berlaku\s+Komponen\s+/i, label:'Harga Berlaku (Pengeluaran)' }
];
const HARGA_KONSTAN_DIMS = [
  { re:/^Nilai\s+Tambah\s+(?:Bruto\s+)?Harga\s+Konstan\s+2010\s+Lapangan\s+Usaha\s+/i, label:'Harga Konstan' },
  { re:/^Nilai\s+Tambah\s+(?:Bruto\s+)?Harga\s+Konstan\s+2010\s+Komponen\s+/i, label:'Harga Konstan (Pengeluaran)' }
];
const PRICE_PREFIX_PATTERNS = [...HARGA_BERLAKU_DIMS, ...HARGA_KONSTAN_DIMS].map(d=>d.re);

/* Subkelompok "Nilai Tambah [Bruto] Harga Berlaku <Dimensi> <Komponen>" digabung
   jadi kartu komposit per dimensi (nilai + proporsi tahun yang sama). Bisa lebih
   dari satu kartu kalau ada beberapa dimensi (Lapangan Usaha, Pengeluaran, dst).
   Baris total "PDRB Menurut Harga Berlaku" SENGAJA dikecualikan (tidak cocok pola
   di atas) supaya tidak ikut dihitung sebagai salah satu komponen. */
function splitHargaBerlakuGroups(subObj){
  const subs = Object.keys(subObj);
  const groups = [];
  HARGA_BERLAKU_DIMS.forEach(d=>{
    const candidates = subs.filter(s=> d.re.test(s));
    if(candidates.length >= 2) groups.push({ segs:candidates, label:d.label });
  });
  return groups;
}

/* Sama seperti di atas tapi untuk Harga Konstan — dibuka dengan tampilan nilai +
   pertumbuhan (bukan proporsi), karena harga konstan dipakai untuk melihat
   pertumbuhan riil. Baris total "PDRB Menurut Harga Konstan 2010" dikecualikan
   dengan alasan sama. */
function splitHargaKonstanGroups(subObj){
  const subs = Object.keys(subObj);
  const groups = [];
  HARGA_KONSTAN_DIMS.forEach(d=>{
    const candidates = subs.filter(s=> d.re.test(s));
    if(candidates.length >= 2) groups.push({ segs:candidates, label:d.label });
  });
  return groups;
}

function getCompositionGroups(subObj, kelompok){
  const groups = [];
  const pctSegs = splitCompositionSegments(subObj);
  if(pctSegs) groups.push({ label:kelompok, segs:pctSegs, normalized:true, kind:'pct' });
  const claimed = new Set(pctSegs || []);

  splitHargaBerlakuGroups(subObj).forEach(hb=>{
    const segs = hb.segs.filter(s=>!claimed.has(s));
    if(segs.length >= 2){ groups.push({ label:hb.label, segs, normalized:true, kind:'berlaku' }); segs.forEach(s=>claimed.add(s)); }
  });

  splitHargaKonstanGroups(subObj).forEach(hk=>{
    const segs = hk.segs.filter(s=>!claimed.has(s));
    if(segs.length >= 2){ groups.push({ label:hk.label, segs, normalized:false, kind:'konstan' }); segs.forEach(s=>claimed.add(s)); }
  });

  splitLevelGroups(subObj).forEach(g=>{
    const segs = g.segs.filter(s=>!claimed.has(s));
    if(segs.length >= 2) groups.push({ label:g.label, segs, normalized:false, kind:'level' });
  });
  return groups;
}

function renderCompositionCardHtml(periode,kategori,kelompok,subObj,group,katColor){
  const { label, segs, normalized, kind } = group;
  let maxSK = -Infinity;
  segs.forEach(s=> subObj[s].forEach(e=>{ maxSK = Math.max(maxSK, sortKey(e)); }));
  const latestEntries = segs.map(s=>{
    const arr = subObj[s];
    return { sub:s, entry: arr.find(e=>sortKey(e)===maxSK) || arr[arr.length-1] };
  });
  const total = latestEntries.reduce((sum,x)=>sum + (x.entry?x.entry.data:0), 0) || 1;
  const latestLabel = latestEntries[0].entry ? periodLabel(latestEntries[0].entry) : '';

  const barSegs = latestEntries.map((x,i)=>{
    const pct = x.entry ? (x.entry.data/total*100) : 0;
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    return `<div class="comp-bar-seg" style="flex:${Math.max(pct,0.5)};background:${color};" title="${escapeHtml(x.sub)}: ${fmtNum(x.entry?x.entry.data:NaN)}"></div>`;
  }).join('');

  const legend = latestEntries.map((x,i)=>{
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    let shortName = x.sub;
    if(shortName.startsWith(label)){
      shortName = shortName.slice(label.length).trim().replace(/^[-–:\/]\s*/,'');
    }
    if(!shortName) shortName = x.sub;
    const pct = x.entry ? (x.entry.data/total*100) : 0;
    return `<div class="comp-legend-item" title="${escapeHtml(x.sub)}: ${fmtNum(x.entry?x.entry.data:NaN)}"><span class="dot" style="background:${color}"></span>${escapeHtml(shortName)} <b>${pct.toFixed(1).replace('.',',')}%</b></div>`;
  }).join('');

  const subtitle = kind==='konstan' ? `${segs.length} sektor · Klik untuk nilai &amp; pertumbuhan per tahun`
    : kind==='berlaku' ? `${segs.length} sektor · Klik untuk nilai &amp; proporsi per tahun`
    : (normalized ? 'Komposisi' : 'Rincian per Jenjang');

  const satuanTeks = SATUAN[segs[0]] ? ` ${SATUAN[segs[0]]}` : '';
  const isSimpleCard = kind==='berlaku' || kind==='konstan';

  const key = encodeURIComponent(JSON.stringify([periode,kategori,kelompok,label,segs,kind||'pct']));
  const gradientColors = latestEntries.map((_,i)=>COMPARE_COLORS[i % COMPARE_COLORS.length]);
  let stripGradient = gradientColors[0] || katColor;
  if(gradientColors.length > 1){
    const n = gradientColors.length;
    const stops = gradientColors.map((c,i)=>{
      const startPct = (i/n*100).toFixed(2);
      const endPct = ((i+1)/n*100).toFixed(2);
      return `${c} ${startPct}%, ${c} ${endPct}%`;
    }).join(', ');
    stripGradient = `linear-gradient(90deg, ${stops})`;
  }

  if(isSimpleCard){
    return `<div class="card comp-card" data-compkey='${key}'>
        <div class="comp-color-strip" style="background:${stripGradient}"></div>
        <div class="card-label">${escapeHtml(label)}</div>
        <div class="card-period">Diperbarui: ${latestLabel} · ${subtitle}</div>
        <div class="card-value-row" style="margin-top:8px;">
          <div class="card-value">${fmtNum(total)}<span class="card-unit">${escapeHtml(satuanTeks)}</span></div>
        </div>
        <div class="card-hint">Klik untuk lihat data</div>
      </div>`;
  }

  return `<div class="card comp-card" data-compkey='${key}'>
      <div class="comp-color-strip" style="background:${stripGradient}"></div>
      <div class="card-label">${escapeHtml(label)}</div>
      <div class="card-period">Diperbarui: ${latestLabel} · ${subtitle}</div>
      <div class="comp-bar">${barSegs}</div>
      <div class="comp-legend">${legend}</div>
      <div class="card-hint">Klik untuk lihat data</div>
    </div>`;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function triggerJPGDownload(inst, name){
  if(!inst){ alert('Grafik belum siap.'); return; }
  const srcCanvas = inst.canvas;
  const tmpCanvas = document.createElement('canvas');
  tmpCanvas.width = srcCanvas.width;
  tmpCanvas.height = srcCanvas.height;
  const tctx = tmpCanvas.getContext('2d');
  tctx.fillStyle = '#ffffff';
  tctx.fillRect(0, 0, tmpCanvas.width, tmpCanvas.height);
  tctx.drawImage(srcCanvas, 0, 0);
  tmpCanvas.toBlob(function(blob){
    if(!blob){ alert('Gagal membuat gambar.'); return; }
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `${(name||'grafik').replace(/[^a-z0-9]+/gi,'_')}.jpg`;
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }, 'image/jpeg', 1.0);
}
function downloadChartJPG(){ triggerJPGDownload(chartInstance, currentSeriesKey ? currentSeriesKey.sub : 'grafik'); }
function exportSvgAsJPG(svgEl, name){
  if(!svgEl){ alert('Grafik belum siap.'); return; }
  const xml = new XMLSerializer().serializeToString(svgEl);
  const svg64 = btoa(unescape(encodeURIComponent(xml)));
  const image64 = 'data:image/svg+xml;base64,' + svg64;
  const img = new Image();
  img.onload = function(){
    const vb = svgEl.viewBox && svgEl.viewBox.baseVal;
    const w = (vb && vb.width) || svgEl.clientWidth || 600;
    const h = (vb && vb.height) || svgEl.clientHeight || 320;
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,w,h);
    ctx.drawImage(img, 0, 0, w, h);
    canvas.toBlob(function(blob){
      if(!blob){ alert('Gagal membuat gambar.'); return; }
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${(name||'grafik').replace(/[^a-z0-9]+/gi,'_')}.jpg`;
      link.style.display = 'none';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
    }, 'image/jpeg', 1.0);
  };
  img.onerror = function(){ alert('Gagal membuat gambar dari grafik.'); };
  img.src = image64;
}

async function exportStyledExcel(filename, sheetName, header, rows){
  if(typeof ExcelJS === 'undefined'){ alert('Gagal memuat library Excel. Coba refresh halaman.'); return; }
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet(sheetName);
  ws.addRow(header);
  rows.forEach(r=>ws.addRow(r));

  const headerRow = ws.getRow(1);
  headerRow.eachCell(cell=>{
    cell.font = { bold:true, color:{argb:'FFFFFFFF'} };
    cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFE97B2A'} };
    cell.alignment = { vertical:'middle', horizontal:'center' };
    cell.border = {
      top:{style:'thin',color:{argb:'FFD8A15B'}}, left:{style:'thin',color:{argb:'FFD8A15B'}},
      bottom:{style:'thin',color:{argb:'FFD8A15B'}}, right:{style:'thin',color:{argb:'FFD8A15B'}}
    };
  });
  headerRow.height = 20;

  for(let i=2;i<=ws.rowCount;i++){
    const row = ws.getRow(i);
    row.eachCell((cell, colNumber)=>{
      cell.border = {
        top:{style:'thin',color:{argb:'FFEFDCB8'}}, left:{style:'thin',color:{argb:'FFEFDCB8'}},
        bottom:{style:'thin',color:{argb:'FFEFDCB8'}}, right:{style:'thin',color:{argb:'FFEFDCB8'}}
      };
      if(typeof cell.value === 'number'){
        cell.numFmt = '#,##0.00';
        cell.alignment = { horizontal:'right' };
      }else{
        cell.alignment = { horizontal: colNumber===1 ? 'left' : 'center' };
      }
      if(i % 2 === 0){
        cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFFBF3E4'} };
      }
    });
  }

  ws.columns.forEach((col,idx)=>{
    let maxLen = String(header[idx]==null?'':header[idx]).length;
    rows.forEach(r=>{
      const v = r[idx];
      const len = (v===null||v===undefined||v==='') ? 1 : String(v).length;
      if(len>maxLen) maxLen = len;
    });
    col.width = Math.min(Math.max(maxLen+3, 10), 40);
  });

  ws.views = [{ state:'frozen', ySplit:1 }];

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* Dua komponen sisi pengeluaran yang basisnya bisa mendekati nol/negatif, sehingga
   persentase pertumbuhannya tidak bermakna — dikecualikan dari semua tampilan pertumbuhan. */
const NO_GROWTH_LABELS = /perubahan\s*inventori|net\s*ekspor/i;

function shortSegName(sub, label){
  for(const re of PRICE_PREFIX_PATTERNS){
    if(re.test(sub)) return sub.replace(re,'').trim();
  }
  let s = sub;
  if(s.startsWith(label)) s = s.slice(label.length).trim().replace(/^[-–:\/]\s*/,'');
  return s || sub;
}

/* Daftar periode unik (Tahunan: {tahun}; Triwulanan: {tahun,triwulan}) di antara
   segs, terurut kronologis via sortKey() — dipakai bareng oleh drawer Harga
   Berlaku & Harga Konstan supaya otomatis mendukung periode apa pun. */
function getSubPeriods(subObj, segs){
  const map = new Map();
  segs.forEach(s=>{
    (subObj[s]||[]).forEach(e=>{
      const k = sortKey(e);
      if(!map.has(k)) map.set(k, { key:k, tahun:e.tahun, triwulan:e.triwulan, label: periodLabel(e) });
    });
  });
  return [...map.values()].sort((a,b)=>a.key-b.key);
}

/* Total kumulatif TW1..maxTriwulanNum untuk satu sub di satu tahun — dipakai
   untuk mode pertumbuhan "Kumulatif (c-to-c)" pada data Triwulanan. */
function cumulativeSum(arr, tahun, maxTriwulanNum){
  let sum = 0, found = false;
  arr.forEach(e=>{
    const tn = triwulanToNum(e.triwulan);
    if(e.tahun===tahun && tn>=1 && tn<=maxTriwulanNum){ sum += e.data; found = true; }
  });
  return found ? sum : null;
}
