function refreshKonstanSektoral(subObj, segs, label, periodKey, periods){
  const idx = periods.findIndex(p=>p.key===periodKey);
  const cur = periods[idx] || periods[periods.length-1];
  const prevPeriod = idx > 0 ? periods[idx-1] : null;
  const fileTag = cur.label.replace(/[^a-z0-9]+/gi,'_');
  const isTriwulanan = periods.some(p=>p.triwulan);
  const mode = isTriwulanan ? hkGrowthMode : 'qtq'; // Tahunan selalu dibanding periode sebelumnya

  let compareLabel = prevPeriod ? prevPeriod.label : '';
  if(mode==='yoy') compareLabel = `${cur.tahun-1} TW ${cur.triwulan}`;
  if(mode==='kumulatif') compareLabel = `Kumulatif s.d. TW ${triwulanToNum(cur.triwulan)} ${cur.tahun-1}`;

  const rows = segs.map(s=>{
    const arr = subObj[s];
    const curEntry = arr.find(e=>sortKey(e)===cur.key) || null;
    const short = shortSegName(s,label);
    const isNoGrowth = NO_GROWTH_LABELS.test(short);
    let growth = null;
    if(curEntry && !isNoGrowth){
      if(mode==='yoy'){
        const yoyEntry = arr.find(e=> e.tahun===cur.tahun-1 && triwulanToNum(e.triwulan)===triwulanToNum(cur.triwulan)) || null;
        growth = (yoyEntry && yoyEntry.data) ? (curEntry.data/yoyEntry.data - 1)*100 : null;
      }else if(mode==='kumulatif'){
        const maxQ = triwulanToNum(cur.triwulan);
        const curCum = cumulativeSum(arr, cur.tahun, maxQ);
        const prevCum = cumulativeSum(arr, cur.tahun-1, maxQ);
        growth = (curCum!==null && prevCum) ? (curCum/prevCum - 1)*100 : null;
      }else{
        const prevEntry = prevPeriod ? (arr.find(e=>sortKey(e)===prevPeriod.key)||null) : null;
        growth = (prevEntry && prevEntry.data) ? (curEntry.data/prevEntry.data - 1)*100 : null;
      }
    }
    return { sub:s, short, value: curEntry?curEntry.data:null, growth, isNoGrowth, satuan: SATUAN[s]||'' };
  }).filter(r=>r.value!==null).sort((a,b)=> b.value - a.value);

  const growthColLabel = compareLabel ? `Pertumbuhan vs ${escapeHtml(compareLabel)}` : 'Pertumbuhan';

  if(hkChartInstance) hkChartInstance.destroy();
  hkChartInstance = new Chart(document.getElementById('hkChartCanvas'), {
    data:{ labels: rows.map(r=>r.short), datasets:[
      { type:'line', label:'Nilai', data: rows.map(r=>r.value), borderColor:'#3E6E8E', backgroundColor:'rgba(62,110,142,0.28)', fill:true, tension:0.35, pointRadius:0, yAxisID:'y' },
      { type:'line', label:'Pertumbuhan (%)', data: rows.map(r=>r.growth), borderColor:'#D64553', backgroundColor:'rgba(214,69,83,0.28)', fill:true, tension:0.35, pointRadius:0, yAxisID:'y1', spanGaps:false }
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'bottom', labels:{font:{family:'Inter',size:11},color:'#4A1620'} },
        tooltip:{ callbacks:{ label:(it)=> it.dataset.label==='Pertumbuhan (%)' ? `Pertumbuhan: ${it.parsed.y===null?'n/a':it.parsed.y.toFixed(2)+'%'}` : `Nilai: ${fmtNum(it.parsed.y)}` } } },
      scales:{
        x:{ ticks:{ font:{family:'Inter',size:9.5}, color:'#8A4A55', maxRotation:60, minRotation:40 }, grid:{display:false} },
        y:{ position:'left', ticks:{color:'#8A4A55'}, grid:{color:'#F2D9D4'}, title:{display:true,text:'Nilai'} },
        y1:{ position:'right', ticks:{color:'#8A4A55', callback:(v)=>v+'%'}, grid:{display:false}, title:{display:true,text:'Pertumbuhan (%)'} }
      }
    }
  });

  const head = `<tr><th>Sektor</th><th>Nilai</th><th>${growthColLabel}</th></tr>`;
  const bodyRows = rows.map(r=>`<tr><td>${escapeHtml(r.short)}</td><td>${fmtNum(r.value)} ${escapeHtml(r.satuan)}</td><td>${r.isNoGrowth ? '<span style="color:#8A4A55;">— nilai konstan</span>' : (r.growth===null?'-':`<span class="badge ${r.growth>=0?'up':'down'}">${r.growth>=0?'▲ +':'▼ '}${r.growth.toFixed(2).replace('.',',')}%</span>`)}</td></tr>`).join('');
  document.getElementById('hkTable').innerHTML = `<thead>${head}</thead><tbody>${bodyRows}</tbody>`;

  document.getElementById('dlHkChart').onclick = ()=> triggerJPGDownload(hkChartInstance, `${label}_${fileTag}`);
  document.getElementById('dlHkExcel').onclick = async ()=>{
    const header = ['Sektor','Nilai','Pertumbuhan (%)'];
    const excelRows = rows.map(r=>[r.short, r.value, r.isNoGrowth ? '' : (r.growth===null?'':+r.growth.toFixed(2))]);
    await exportStyledExcel(`${label}_${fileTag}`.replace(/[^a-z0-9]+/gi,'_'), label.slice(0,31), header, excelRows);
  };
}

function buildCompositionInsight(label, segs, bySegSK, sortedSK, skMap){
  if(!sortedSK || sortedSK.length === 0) return 'Tidak ada data pada rentang periode ini.';
  const satuan = SATUAN[segs[0]] ? ' ' + escapeHtml(SATUAN[segs[0]]) : '';
  const firstSK = sortedSK[0], lastSK = sortedSK[sortedSK.length-1];
  const firstLabel = skMap.get(firstSK), lastLabel = skMap.get(lastSK);

  const firstTotal = segs.reduce((sum,s)=> sum + (bySegSK[s][firstSK] || 0), 0);
  const lastTotal = segs.reduce((sum,s)=> sum + (bySegSK[s][lastSK] || 0), 0);

  let domSeg = segs[0], domVal = -Infinity;
  segs.forEach(s=>{
    const v = bySegSK[s][lastSK];
    if(v !== undefined && v > domVal){ domVal = v; domSeg = s; }
  });
  const domShare = lastTotal > 0 ? (domVal/lastTotal*100) : 0;

  let bestSeg = null, bestChange = -Infinity, worstSeg = null, worstChange = Infinity;
  segs.forEach(s=>{
    const f = bySegSK[s][firstSK], l = bySegSK[s][lastSK];
    if(f !== undefined && l !== undefined){
      const diff = l - f;
      if(diff > bestChange){ bestChange = diff; bestSeg = s; }
      if(diff < worstChange){ worstChange = diff; worstSeg = s; }
    }
  });

  let trendWord = 'relatif stabil dibandingkan', trendClass = 'trend-flat';
  if(lastTotal > firstTotal){ trendWord = 'meningkat dibandingkan'; trendClass = 'trend-up'; }
  else if(lastTotal < firstTotal){ trendWord = 'menurun dibandingkan'; trendClass = 'trend-down'; }

  let html = `Pada periode <b>${escapeHtml(lastLabel)}</b>, total gabungan seluruh komponen <b>${escapeHtml(label)}</b> tercatat <b>${fmtNum(lastTotal)}${satuan}</b> (dijumlah apa adanya dari ${segs.length} komponen, bukan dinormalisasi ke 100%).`;

  if(firstSK !== lastSK){
    html += ` Nilai gabungan ini <span class="${trendClass}">${trendWord}</span> periode <b>${escapeHtml(firstLabel)}</b> yang tercatat <b>${fmtNum(firstTotal)}${satuan}</b>.`;
  }

  html += ` Komponen dengan porsi terbesar saat ini adalah <b>${escapeHtml(domSeg)}</b> (${fmtNum(domVal)}${satuan}, sekitar ${domShare.toFixed(1)}% dari total gabungan).`;

  if(bestSeg && worstSeg && bestSeg !== worstSeg){
    html += ` Sepanjang rentang ini, <b>${escapeHtml(bestSeg)}</b> mencatat kenaikan paling besar (${bestChange>0?'+':''}${fmtNum(bestChange)}${satuan}), sementara <b>${escapeHtml(worstSeg)}</b> mencatat perubahan paling rendah/menurun (${worstChange>0?'+':''}${fmtNum(worstChange)}${satuan}).`;
  }

  if(firstSK !== lastSK){
    const domValFirst = bySegSK[domSeg][firstSK];
    if(domValFirst !== undefined && firstTotal > 0){
      const domShareFirst = domValFirst/firstTotal*100;
      const shareDiff = domShare - domShareFirst;
      if(Math.abs(shareDiff) >= 1){
        html += ` Porsi <b>${escapeHtml(domSeg)}</b> terhadap total gabungan ${shareDiff>0?'membesar':'mengecil'} dari sekitar ${domShareFirst.toFixed(1)}% menjadi ${domShare.toFixed(1)}%, menandakan komposisi ${shareDiff>0?'makin terkonsentrasi pada komponen ini':'makin merata antar komponen'}.`;
      }
    }
  }

  if(segs.length >= 2 && sortedSK.length >= 3){
    let sameDirCount = 0, comparableMoves = 0;
    for(let i=1;i<sortedSK.length;i++){
      const skPrev = sortedSK[i-1], skCur = sortedSK[i];
      let totalPrev = 0, totalCur = 0, valid = true;
      segs.forEach(s=>{
        const p = bySegSK[s][skPrev], c = bySegSK[s][skCur];
        if(p === undefined || c === undefined) valid = false;
      });
      if(!valid) continue;
      segs.forEach(s=>{ totalPrev += bySegSK[s][skPrev]; totalCur += bySegSK[s][skCur]; });
      const totalDir = totalCur - totalPrev;
      segs.forEach(s=>{
        const segDir = bySegSK[s][skCur] - bySegSK[s][skPrev];
        comparableMoves++;
        if((segDir >= 0 && totalDir >= 0) || (segDir < 0 && totalDir < 0)) sameDirCount++;
      });
    }
    if(comparableMoves > 0){
      const syncPct = (sameDirCount/comparableMoves*100);
      let syncWord = 'cenderung bergerak searah dengan tren total gabungan (sinkron)';
      if(syncPct < 55) syncWord = 'cukup sering bergerak berlawanan arah satu sama lain (tidak sinkron)';
      else if(syncPct < 75) syncWord = 'kadang bergerak berbeda arah antar komponen';
      html += ` Antar komponen, pergerakan tahun-ke-tahun ${syncWord} (±${syncPct.toFixed(0)}% pergerakan searah dengan total).`;
    }
  }

  return html;
}

function buildTreemapLayout(items, x, y, w, h){
  if(items.length === 0) return [];
  if(items.length === 1){
    return [Object.assign({}, items[0], {x,y,w,h})];
  }
  const total = items.reduce((s,it)=>s+it.value,0) || 1;
  let cum = 0, splitIdx = 1;
  for(let i=0;i<items.length;i++){
    cum += items[i].value;
    if(cum >= total/2){ splitIdx = i+1; break; }
  }
  splitIdx = Math.max(1, Math.min(items.length-1, splitIdx));
  const groupA = items.slice(0, splitIdx);
  const groupB = items.slice(splitIdx);
  const sumA = groupA.reduce((s,it)=>s+it.value,0);
  const fracA = sumA/total;
  let rects = [];
  if(w >= h){
    const wA = w*fracA;
    rects = rects.concat(buildTreemapLayout(groupA, x, y, wA, h));
    rects = rects.concat(buildTreemapLayout(groupB, x+wA, y, w-wA, h));
  }else{
    const hA = h*fracA;
    rects = rects.concat(buildTreemapLayout(groupA, x, y, w, hA));
    rects = rects.concat(buildTreemapLayout(groupB, x, y+hA, w, h-hA));
  }
  return rects;
}

function buildTreemapSVG(segs, bySegSK, lastSK){
  const items = segs.map((s,i)=>({
    name: s,
    value: bySegSK[s][lastSK] || 0,
    color: COMPARE_COLORS[i % COMPARE_COLORS.length]
  })).filter(it=>it.value > 0);

  if(items.length === 0){
    return '<div style="padding:20px;font-size:13px;color:var(--brown-mid);">Tidak ada data pada periode ini.</div>';
  }

  items.sort((a,b)=>b.value-a.value);
  const total = items.reduce((s,it)=>s+it.value,0) || 1;
  const W = 600, H = 320;
  const rects = buildTreemapLayout(items, 0, 0, W, H);

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" id="compTreemapSvg" style="width:100%;height:320px;display:block;background:#fff;">`;
  rects.forEach(r=>{
    const rw = Math.max(0, r.w - 3);
    const rh = Math.max(0, r.h - 3);
    const pct = (r.value/total*100).toFixed(1);
    svg += `<rect x="${r.x.toFixed(1)}" y="${r.y.toFixed(1)}" width="${rw.toFixed(1)}" height="${rh.toFixed(1)}" fill="${r.color}" rx="5"><title>${escapeHtml(r.name)}: ${fmtNum(r.value)} (${pct}%)</title></rect>`;
    if(r.w > 70 && r.h > 34){
      const shortName = r.name.length > 24 ? r.name.slice(0,22)+'…' : r.name;
      svg += `<text x="${(r.x+9).toFixed(1)}" y="${(r.y+19).toFixed(1)}" font-size="11" font-family="Inter,sans-serif" fill="#fff" font-weight="700">${escapeHtml(shortName)}</text>`;
      svg += `<text x="${(r.x+9).toFixed(1)}" y="${(r.y+36).toFixed(1)}" font-size="13" font-family="Inter,sans-serif" fill="#fff" font-weight="700">${fmtNum(r.value)}</text>`;
    }else if(r.w > 34 && r.h > 20){
      svg += `<text x="${(r.x+r.w/2).toFixed(1)}" y="${(r.y+r.h/2+4).toFixed(1)}" font-size="10" font-family="Inter,sans-serif" fill="#fff" font-weight="700" text-anchor="middle">${pct}%</text>`;
    }
  });
  svg += `</svg>`;
  return svg;
}

function buildWaffleSVG(segs, bySegSK, lastSK){
  const items = segs.map((s,i)=>({
    name: s,
    value: bySegSK[s][lastSK] || 0,
    color: COMPARE_COLORS[i % COMPARE_COLORS.length]
  })).filter(it=>it.value > 0);

  if(items.length === 0){
    return '<div style="padding:20px;font-size:13px;color:var(--brown-mid);">Tidak ada data pada periode ini.</div>';
  }

  const total = items.reduce((s,it)=>s+it.value,0) || 1;
  const rawCounts = items.map(it => (it.value/total)*100);
  const counts = rawCounts.map(c => Math.floor(c));
  let remainder = 100 - counts.reduce((s,c)=>s+c,0);
  const order = rawCounts.map((c,i)=>({i, frac:c-Math.floor(c)})).sort((a,b)=>b.frac-a.frac);
  for(let k=0;k<remainder;k++){ counts[order[k % order.length].i]++; }

  const cellSeq = [];
  counts.forEach((c,i)=>{ for(let k=0;k<c;k++) cellSeq.push(items[i]); });
  while(cellSeq.length < 100 && items.length>0) cellSeq.push(items[items.length-1]);

  const cols = 10, gap = 3, size = 26;
  const W = cols*(size+gap)-gap, H = 10*(size+gap)-gap;
  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" id="compWaffleSvg" style="width:100%;height:320px;display:block;">`;
  cellSeq.slice(0,100).forEach((item, idx)=>{
    const col = idx % cols, row = Math.floor(idx/cols);
    const x = col*(size+gap), y = row*(size+gap);
    svg += `<rect x="${x}" y="${y}" width="${size}" height="${size}" rx="4" fill="${item.color}"><title>${escapeHtml(item.name)}: ${fmtNum(item.value)}</title></rect>`;
  });
  svg += `</svg>`;
  return svg;
}

function buildDumbbellSVG(segs, bySegSK, sortedSK, skMap){
  if(sortedSK.length === 0){
    return '<div style="padding:20px;font-size:13px;color:var(--brown-mid);">Tidak ada data pada periode ini.</div>';
  }
  const W = 600, rowH = 30, padTop = 16, padBottom = 24, padLeft = 90, padRight = 20;
  const H = padTop + sortedSK.length*rowH + padBottom;

  let globalMin = Infinity, globalMax = -Infinity;
  sortedSK.forEach(sk=>{
    segs.forEach(s=>{
      const v = bySegSK[s][sk];
      if(v !== undefined){ globalMin = Math.min(globalMin, v); globalMax = Math.max(globalMax, v); }
    });
  });
  if(!isFinite(globalMin)) { globalMin = 0; globalMax = 1; }
  const rangeV = (globalMax-globalMin) || 1;
  const plotW = W - padLeft - padRight;
  const xOf = (v)=> padLeft + ((v-globalMin)/rangeV) * plotW;

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" id="compDumbbellSvg" style="width:100%;height:${Math.min(H,340)}px;display:block;">`;

  sortedSK.forEach((sk, rowIdx)=>{
    const y = padTop + rowIdx*rowH + rowH/2;
    const pts = segs.map((s,i)=>({ v: bySegSK[s][sk], color: COMPARE_COLORS[i % COMPARE_COLORS.length], name:s }))
      .filter(p=>p.v !== undefined);
    if(pts.length === 0) return;
    const minP = pts.reduce((a,b)=> a.v<b.v?a:b);
    const maxP = pts.reduce((a,b)=> a.v>b.v?a:b);

    svg += `<text x="8" y="${(y+4).toFixed(1)}" font-size="10.5" font-family="Inter,sans-serif" fill="#8A4A55">${escapeHtml(skMap.get(sk)||'')}</text>`;
    if(pts.length > 1){
      svg += `<line x1="${xOf(minP.v).toFixed(1)}" y1="${y.toFixed(1)}" x2="${xOf(maxP.v).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#D8A15B" stroke-width="2.5"></line>`;
    }
    pts.forEach(p=>{
      svg += `<circle cx="${xOf(p.v).toFixed(1)}" cy="${y.toFixed(1)}" r="6" fill="${p.color}" stroke="#fff" stroke-width="1.5"><title>${escapeHtml(p.name)}: ${fmtNum(p.v)}</title></circle>`;
    });
  });

  svg += `</svg>`;
  return svg;
}

function buildStreamSVG(segs, bySegSK, sortedSK, skMap){
  if(sortedSK.length === 0){
    return '<div style="padding:20px;font-size:13px;color:var(--brown-mid);">Tidak ada data pada periode ini.</div>';
  }
  const W = 600, H = 300, padLeft = 10, padRight = 10, padTop = 16, padBottom = 26;
  const plotW = W - padLeft - padRight, plotH = H - padTop - padBottom;
  const n = sortedSK.length;
  const centerY = padTop + plotH / 2;

  let maxTotal = 0;
  sortedSK.forEach(sk=>{
    const total = segs.reduce((s,seg)=>s+(bySegSK[seg][sk]||0),0);
    if(total > maxTotal) maxTotal = total;
  });
  if(maxTotal === 0) maxTotal = 1;
  const scaleY = (plotH * 0.92 / 2) / (maxTotal / 2);
  const xAt = i => padLeft + (n<=1 ? plotW/2 : (i/(n-1))*plotW);

  const running = sortedSK.map(sk=>{
    const total = segs.reduce((s,seg)=>s+(bySegSK[seg][sk]||0),0);
    return -total/2;
  });

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" id="compStreamSvg" style="width:100%;height:320px;display:block;">`;
  segs.forEach((seg,i)=>{
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    const topPts = [], botPts = [];
    sortedSK.forEach((sk,ti)=>{
      const v = bySegSK[seg][sk] || 0;
      const bot = running[ti];
      const top = bot + v;
      running[ti] = top;
      topPts.push([xAt(ti), centerY - top*scaleY]);
      botPts.push([xAt(ti), centerY - bot*scaleY]);
    });
    const pathPts = topPts.concat(botPts.slice().reverse());
    const d = pathPts.map((p,idx)=> (idx===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') + ' Z';
    svg += `<path d="${d}" fill="${color}" fill-opacity="0.85" stroke="#fff" stroke-width="0.6"><title>${escapeHtml(seg)}</title></path>`;
  });

  const labelStep = Math.max(1, Math.ceil(n/8));
  sortedSK.forEach((sk,ti)=>{
    if(ti % labelStep === 0 || ti === n-1){
      svg += `<text x="${xAt(ti).toFixed(1)}" y="${(H-6).toFixed(1)}" font-size="9" text-anchor="middle" fill="#8A4A55">${escapeHtml(skMap.get(sk)||'')}</text>`;
    }
  });
  svg += `</svg>`;
  return svg;
}

function buildMarimekkoSVG(segs, bySegSK, sortedSK, skMap){
  if(sortedSK.length === 0){
    return '<div style="padding:20px;font-size:13px;color:var(--brown-mid);">Tidak ada data pada periode ini.</div>';
  }
  const W = 600, H = 300, padTop = 10, padBottom = 30, padLeft = 4, padRight = 4;
  const plotW = W - padLeft - padRight, plotH = H - padTop - padBottom;

  const periodTotals = sortedSK.map(sk => segs.reduce((s,seg)=> s + (bySegSK[seg][sk]||0), 0));
  const grandTotal = periodTotals.reduce((s,v)=>s+v,0) || 1;

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" id="compMarimekkoSvg" style="width:100%;height:320px;display:block;">`;
  let xCursor = padLeft;
  sortedSK.forEach((sk, si)=>{
    const total = periodTotals[si] || 0;
    const colW = grandTotal > 0 ? (total/grandTotal) * plotW : plotW/sortedSK.length;
    let yCursor = padTop;
    segs.forEach((seg,i)=>{
      const v = bySegSK[seg][sk] || 0;
      const shareH = total > 0 ? (v/total) * plotH : 0;
      const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
      svg += `<rect x="${xCursor.toFixed(1)}" y="${yCursor.toFixed(1)}" width="${Math.max(0,colW-1.5).toFixed(1)}" height="${Math.max(0,shareH-1).toFixed(1)}" fill="${color}"><title>${escapeHtml(seg)} (${escapeHtml(skMap.get(sk)||'')}): ${fmtNum(v)}</title></rect>`;
      yCursor += shareH;
    });
    if(colW > 20){
      svg += `<text x="${(xCursor+colW/2).toFixed(1)}" y="${(H-12).toFixed(1)}" font-size="9" text-anchor="middle" fill="#8A4A55">${escapeHtml(skMap.get(sk)||'')}</text>`;
    }
    xCursor += colW;
  });
  svg += `</svg>`;
  return svg;
}

function refreshCompositionDetail(subObj, segs, fromYear, toYear){
  const skMap = new Map();
  segs.forEach(s=>{
    subObj[s].forEach(e=>{
      if(e.tahun >= fromYear && e.tahun <= toYear) skMap.set(sortKey(e), periodLabel(e));
    });
  });
  const sortedSK = [...skMap.keys()].sort((a,b)=>a-b);
  const labels = sortedSK.map(sk=>skMap.get(sk));

  const bySegSK = {};
  segs.forEach(s=>{
    bySegSK[s] = {};
    subObj[s].forEach(e=>{ bySegSK[s][sortKey(e)] = e.data; });
  });

  const datasets = segs.map((s,i)=>{
    const data = sortedSK.map(sk=> bySegSK[s].hasOwnProperty(sk) ? bySegSK[s][sk] : null);

function downloadCompositionExcel(subObj, segs){
  const fromSel = document.getElementById('compFromYear');
  const toSel = document.getElementById('compToYear');
  const fromYear = parseInt(fromSel.value), toYear = parseInt(toSel.value);

  const skMap = new Map();
  segs.forEach(s=>{
    subObj[s].forEach(e=>{
      if(e.tahun >= fromYear && e.tahun <= toYear) skMap.set(sortKey(e), periodLabel(e));
    });
  });
  const sortedSK = [...skMap.keys()].sort((a,b)=>a-b);

  const header = ['Periode', ...segs, 'Total'];
  const rows = [];
  sortedSK.forEach(sk=>{
    const label = skMap.get(sk);
    let rowTotal = 0;
    const vals = segs.map(s=>{
      const entry = subObj[s].find(e=>sortKey(e)===sk);
      const v = entry ? entry.data : '';
      if(typeof v === 'number') rowTotal += v;
      return v;
    });
    rows.push([label, ...vals, rowTotal]);
  });

  exportStyledExcel(`${(currentCompKey?currentCompKey.label:'komposisi').replace(/[^a-z0-9]+/gi,'_')}.xlsx`, 'Komposisi', header, rows);
}

function buildCompareIndex(periode){
  const idx = {};
  const katObj = STORE[periode];
  Object.keys(katObj).forEach(kategori=>{
    Object.keys(katObj[kategori]).forEach(kelompok=>{
      Object.keys(katObj[kategori][kelompok]).forEach(sub=>{
        const key = `${kategori}|||${kelompok}|||${sub}`;
        idx[key] = {kategori, kelompok, sub, entries: katObj[kategori][kelompok][sub]};
      });
    });
  });
  return idx;
}

function computeSeriesAnalysis(keys){
  const list = [];
  keys.forEach(k=>{
    const info = compareIndex[k];
    const filteredEntries = info.entries.filter(e => e.tahun >= compareFrom && e.tahun <= compareTo);
    if(filteredEntries.length === 0) return;
    let maxObj = filteredEntries[0], minObj = filteredEntries[0];
    filteredEntries.forEach(e=>{
      if(e.data > maxObj.data) maxObj = e;
      if(e.data < minObj.data) minObj = e;
    });
    const firstVal = filteredEntries[0].data;
    const lastVal = filteredEntries[filteredEntries.length-1].data;
    const diff = lastVal - firstVal;
    const pct = firstVal !== 0 ? (diff/firstVal)*100 : 0;
    const spanYears = (compareTo - compareFrom) || 1;
    const cagr = firstVal > 0 ? (Math.pow(lastVal/firstVal, 1/spanYears)-1)*100 : 0;
    list.push({
      name: info.sub, first:firstVal, last:lastVal, pct, cagr,
      max:maxObj.data, maxLabel:periodLabel(maxObj),
      min:minObj.data, minLabel:periodLabel(minObj),
      unit: SATUAN[info.sub] || '',
      rawValues: filteredEntries.map(e=>e.data)
    });
  });
  return list;
}

    colVals.forEach((x,rank)=>{ ranksByKey[x.ki][colIdx] = rank+1; });
    valuesByKey.forEach((vals,ki)=>{ if(vals[colIdx]===null) ranksByKey[ki][colIdx] = null; });
  });

  const datasets = keys.map((k,i)=>{
    const info = compareIndex[k];
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    return {
      label: subLabel(info.sub),
      data: ranksByKey[i],
      borderColor: color,
      backgroundColor: color,
      pointBackgroundColor: color,
      pointRadius: 5,
      pointHoverRadius: 7,
      borderWidth: 2.5,
      tension: 0,
      fill: false,
      spanGaps: true
    };
  });

  compareChart = new Chart(ctx, {
    type:'line',
    data:{ labels, datasets },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{ position:'bottom', labels:{ color:'#4A1620', font:{family:'Inter', size:11.5}, boxWidth:10, usePointStyle:true } },

        }
      }
    }
  });
}

function buildCompareSurfaceGrid(keys){

  const colLabels = sortedKeys.map(sk=>uniqueLabelsMap.get(sk));

  if(sortedKeys.length === 0){
    return '<div style="padding:20px;font-size:13px;color:var(--brown-mid);">Tidak ada data pada rentang ini.</div>';
  }

  let html = '<div style="overflow-x:auto;"><table class="surface-grid"><thead><tr><th></th>';
  colLabels.forEach(l=>{ html += `<th>${escapeHtml(l)}</th>`; });
  html += '</tr></thead><tbody>';

  keys.forEach(k=>{
    const info = compareIndex[k];
    const bySort = {};
    info.entries.forEach(e=>{ bySort[sortKey(e)] = e.data; });
    const vals = sortedKeys.map(sk=> bySort.hasOwnProperty(sk) ? bySort[sk] : null);
    const numeric = vals.filter(v=>v!==null);
    const minV = numeric.length ? Math.min(...numeric) : 0;
    const maxV = numeric.length ? Math.max(...numeric) : 1;
    const rangeV = (maxV-minV) || 1;
    const color = COMPARE_COLORS[keys.indexOf(k) % COMPARE_COLORS.length];

    html += `<tr><td class="surface-row-label" title="${escapeHtml(subLabel(info.sub))}">${escapeHtml(subLabel(info.sub))}</td>`;
    vals.forEach(v=>{
      if(v === null){
        html += `<td class="surface-cell" style="background:#F5EEDB;"></td>`;
      }else{
        const norm = (v-minV)/rangeV;
        const op = (0.15 + norm*0.75).toFixed(2);

  return html;
}

function buildCompareStreamSVG(keys){
  const uniqueLabelsMap = new Map();
  keys.forEach(k=>{
    compareIndex[k].entries.forEach(e=>{
      if(e.tahun >= compareFrom && e.tahun <= compareTo) uniqueLabelsMap.set(sortKey(e), periodLabel(e));
    });
  });
  const sortedKeys = [...uniqueLabelsMap.keys()].sort((a,b)=>a-b);
  if(sortedKeys.length === 0){
    return '<div style="padding:20px;font-size:13px;color:var(--brown-mid);">Tidak ada data pada rentang ini.</div>';
  }

  const valuesByKey = keys.map(k=>{
    const info = compareIndex[k];
    const bySort = {};
    info.entries.forEach(e=>{ bySort[sortKey(e)] = e.data; });
    return sortedKeys.map(sk=> bySort.hasOwnProperty(sk) ? bySort[sk] : 0);
  });

  const W = 600, H = 300, padLeft = 10, padRight = 10, padTop = 16, padBottom = 26;
  const plotW = W - padLeft - padRight, plotH = H - padTop - padBottom;
  const n = sortedKeys.length;
  const centerY = padTop + plotH / 2;

  let maxTotal = 0;
  sortedKeys.forEach((sk,ti)=>{
    const total = valuesByKey.reduce((s,vals)=>s+(vals[ti]||0),0);
    if(total > maxTotal) maxTotal = total;
  });
  if(maxTotal === 0) maxTotal = 1;
  const scaleY = (plotH * 0.92 / 2) / (maxTotal / 2);
  const xAt = i => padLeft + (n<=1 ? plotW/2 : (i/(n-1))*plotW);

  const running = sortedKeys.map((sk,ti)=>{
    const total = valuesByKey.reduce((s,vals)=>s+(vals[ti]||0),0);
    return -total/2;
  });

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" id="cmpStreamSvg" style="width:100%;height:340px;display:block;">`;
  keys.forEach((k,i)=>{
    const info = compareIndex[k];
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    const topPts = [], botPts = [];
    sortedKeys.forEach((sk,ti)=>{
      const v = valuesByKey[i][ti] || 0;
      const bot = running[ti];
      const top = bot + v;
      running[ti] = top;
      topPts.push([xAt(ti), centerY - top*scaleY]);
      botPts.push([xAt(ti), centerY - bot*scaleY]);
    });
    const pathPts = topPts.concat(botPts.slice().reverse());
    const d = pathPts.map((p,idx)=> (idx===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') + ' Z';
    svg += `<path d="${d}" fill="${color}" fill-opacity="0.85" stroke="#fff" stroke-width="0.6"><title>${escapeHtml(subLabel(info.sub))}</title></path>`;
  });

  const labelStep = Math.max(1, Math.ceil(n/8));
  sortedKeys.forEach((sk,ti)=>{
    if(ti % labelStep === 0 || ti === n-1){
      svg += `<text x="${xAt(ti).toFixed(1)}" y="${(H-6).toFixed(1)}" font-size="9" text-anchor="middle" fill="#8A4A55">${escapeHtml(uniqueLabelsMap.get(sk)||'')}</text>`;
    }
  });
  svg += `</svg>`;

  const legend = keys.map((k,i)=>{
    const info = compareIndex[k];
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    return `<div class="comp-legend-item"><span class="dot" style="background:${color}"></span>${escapeHtml(subLabel(info.sub))}</div>`;
  }).join('');

  return svg + `<div class="comp-legend" style="margin-top:10px;">${legend}</div><div class="comp-chart-note">Menampilkan alur tiap indikator sepanjang waktu, disusun simetris di sekitar garis tengah (ThemeRiver style). Perhatikan bahwa penjumlahan lintas indikator hanya bermakna jika satuannya sama.</div>`;
}

function buildCompareMarimekkoSVG(keys){
  const uniqueLabelsMap = new Map();
  keys.forEach(k=>{
    compareIndex[k].entries.forEach(e=>{
      if(e.tahun >= compareFrom && e.tahun <= compareTo) uniqueLabelsMap.set(sortKey(e), periodLabel(e));

  }

    info.entries.forEach(e=>{ bySort[sortKey(e)] = e.data; });

  });

  const W = 600, H = 300, padTop = 10, padBottom = 30, padLeft = 4, padRight = 4;
  const plotW = W - padLeft - padRight, plotH = H - padTop - padBottom;

  const periodTotals = sortedKeys.map((sk,ti)=> valuesByKey.reduce((s,vals)=> s + Math.max(0,vals[ti]||0), 0));
  const grandTotal = periodTotals.reduce((s,v)=>s+v,0) || 1;

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" id="cmpMarimekkoSvg" style="width:100%;height:340px;display:block;">`;
  let xCursor = padLeft;
  sortedKeys.forEach((sk, si)=>{
    const total = periodTotals[si] || 0;
    const colW = grandTotal > 0 ? (total/grandTotal) * plotW : plotW/sortedKeys.length;
    let yCursor = padTop;
    keys.forEach((k,i)=>{
      const info = compareIndex[k];
      const v = Math.max(0, valuesByKey[i][si] || 0);
      const shareH = total > 0 ? (v/total) * plotH : 0;
      const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
      svg += `<rect x="${xCursor.toFixed(1)}" y="${yCursor.toFixed(1)}" width="${Math.max(0,colW-1.5).toFixed(1)}" height="${Math.max(0,shareH-1).toFixed(1)}" fill="${color}"><title>${escapeHtml(subLabel(info.sub))} (${escapeHtml(uniqueLabelsMap.get(sk)||'')}): ${fmtNum(v)}</title></rect>`;
      yCursor += shareH;
    });
    if(colW > 20){
      svg += `<text x="${(xCursor+colW/2).toFixed(1)}" y="${(H-12).toFixed(1)}" font-size="9" text-anchor="middle" fill="#8A4A55">${escapeHtml(uniqueLabelsMap.get(sk)||'')}</text>`;
    }
    xCursor += colW;
  });
  svg += `</svg>`;

  const legend = keys.map((k,i)=>{
    const info = compareIndex[k];
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    return `<div class="comp-legend-item"><span class="dot" style="background:${color}"></span>${escapeHtml(subLabel(info.sub))}</div>`;
  }).join('');

  return svg + `<div class="comp-legend" style="margin-top:10px;">${legend}</div><div class="comp-chart-note">Lebar tiap kolom sebanding dengan total gabungan seluruh indikator pada tahun tersebut (relatif terhadap total seluruh tahun); tinggi tiap segmen menunjukkan porsi indikator dalam tahun itu. Bermakna optimal jika satuan antar indikator sebanding.</div>`;
}

function buildCompareRadialBarSVG(keys){
  const uniqueLabelsMap = new Map();
  keys.forEach(k=>{
    compareIndex[k].entries.forEach(e=>{
      if(e.tahun >= compareFrom && e.tahun <= compareTo) uniqueLabelsMap.set(sortKey(e), periodLabel(e));
    });
  });
  const sortedKeys = [...uniqueLabelsMap.keys()].sort((a,b)=>a-b);
  if(sortedKeys.length === 0){
    return '<div style="padding:20px;font-size:13px;color:var(--brown-mid);">Tidak ada data pada rentang ini.</div>';
  }

  const valuesByKey = keys.map(k=>{
    const info = compareIndex[k];
    const bySort = {};
    info.entries.forEach(e=>{ bySort[sortKey(e)] = e.data; });
    return sortedKeys.map(sk=> bySort.hasOwnProperty(sk) ? bySort[sk] : null);
  });

  let allVals = [];
  valuesByKey.forEach(arr=> arr.forEach(v=>{ if(v!==null && v!==undefined) allVals.push(v); }));
  const maxV = allVals.length ? Math.max(...allVals) : 1;

  const W = 460, H = 460;
  const cx = W/2, cy = H/2;
  const rInner = 34, rOuter = Math.min(W,H)/2 - 46;
  const n = sortedKeys.length;
  const anglePer = (2*Math.PI) / n;
  const gapAngle = anglePer * 0.18;
  const barAngle = (anglePer - gapAngle) / keys.length;

  function polar(r, a){
    return [cx + r*Math.cos(a - Math.PI/2), cy + r*Math.sin(a - Math.PI/2)];
  }
  function arcPath(r0, r1, a0, a1){
    const [x0a,y0a] = polar(r0,a0);
    const [x1a,y1a] = polar(r1,a0);
    const [x1b,y1b] = polar(r1,a1);
    const [x0b,y0b] = polar(r0,a1);
    const large = (a1-a0) > Math.PI ? 1 : 0;
    return `M${x0a.toFixed(1)},${y0a.toFixed(1)} L${x1a.toFixed(1)},${y1a.toFixed(1)} A${r1.toFixed(1)},${r1.toFixed(1)} 0 ${large} 1 ${x1b.toFixed(1)},${y1b.toFixed(1)} L${x0b.toFixed(1)},${y0b.toFixed(1)} A${r0.toFixed(1)},${r0.toFixed(1)} 0 ${large} 0 ${x0a.toFixed(1)},${y0a.toFixed(1)} Z`;
  }

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" id="cmpRadialBarSvg" style="width:100%;max-width:460px;height:auto;display:block;margin:0 auto;">`;

  [0.25,0.5,0.75,1].forEach(f=>{
    svg += `<circle cx="${cx}" cy="${cy}" r="${(rInner + f*(rOuter-rInner)).toFixed(1)}" fill="none" stroke="#F2D9D4" stroke-width="1"></circle>`;
  });

  sortedKeys.forEach((sk, ti)=>{
    const a0 = ti*anglePer;
    keys.forEach((k,ki)=>{
      const v = valuesByKey[ki][ti];
      if(v===null || v===undefined) return;
      const color = COMPARE_COLORS[ki % COMPARE_COLORS.length];
      const frac = maxV>0 ? Math.max(0,v)/maxV : 0;
      const r1 = rInner + frac*(rOuter-rInner);
      const segA0 = a0 + ki*barAngle;
      const segA1 = segA0 + barAngle*0.86;
      svg += `<path d="${arcPath(rInner,r1,segA0,segA1)}" fill="${color}"><title>${escapeHtml(compareIndex[k].sub)} · ${escapeHtml(uniqueLabelsMap.get(sk)||'')}: ${fmtNum(v)}</title></path>`;
    });
    const labelA = a0 + anglePer/2;
    const [lx,ly] = polar(rOuter+16, labelA);
    svg += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="9.5" text-anchor="middle" dominant-baseline="middle" fill="#8A4A55">${escapeHtml(uniqueLabelsMap.get(sk)||'')}</text>`;
  });

  svg += `</svg>`;

  const legend = keys.map((k,i)=>{
    const info = compareIndex[k];
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    return `<div class="comp-legend-item"><span class="dot" style="background:${color}"></span>${escapeHtml(subLabel(info.sub))}</div>`;
  }).join('');

  return svg + `<div class="comp-legend" style="margin-top:10px;">${legend}</div><div class="comp-chart-note">Setiap sektor melingkar mewakili satu periode; panjang batang radial dari pusat sebanding dengan nilai indikator (dinormalisasi terhadap nilai maksimum di antara seluruh indikator terpilih).</div>`;
}

  });

  const W = 640;
  const rowH = 54;
  const H = rows.length * rowH + 16;
  const padLeft = 152, padRight = 30;
  const plotW = W - padLeft - padRight;

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" id="cmpBulletSvg" style="width:100%;height:${Math.min(H,440)}px;display:block;">`;

  rows.forEach((r, i)=>{
    const y0 = 12 + i*rowH;
    const gMin = r.minV;
    const gMax = r.maxV === gMin ? gMin+1 : r.maxV;
    const scale = plotW / (gMax-gMin);
    const xAt = v => padLeft + (v-gMin)*scale;

    const bandY = y0 + 8, bandH = 22;
    svg += `<rect x="${xAt(gMin).toFixed(1)}" y="${bandY}" width="${Math.max(0,xAt(r.avgV)-xAt(gMin)).toFixed(1)}" height="${bandH}" fill="#F2D9D4"></rect>`;
    svg += `<rect x="${xAt(r.avgV).toFixed(1)}" y="${bandY}" width="${Math.max(0,xAt(gMax)-xAt(r.avgV)).toFixed(1)}" height="${bandH}" fill="#EACB8E"></rect>`;

    const barY = bandY + bandH/2 - 5;
    svg += `<rect x="${xAt(gMin).toFixed(1)}" y="${barY}" width="${Math.max(0,xAt(r.latest)-xAt(gMin)).toFixed(1)}" height="10" fill="${r.color}"><title>${escapeHtml(r.label)}: ${fmtNum(r.latest)}</title></rect>`;

    const tx = xAt(r.target).toFixed(1);
    svg += `<line x1="${tx}" y1="${bandY-4}" x2="${tx}" y2="${bandY+bandH+4}" stroke="#4A1620" stroke-width="2.5"><title>Periode sebelumnya: ${fmtNum(r.target)}</title></line>`;

    const shortLabel = r.label.length > 24 ? r.label.slice(0,22)+'…' : r.label;
    svg += `<text x="${padLeft-10}" y="${(bandY+bandH/2+4).toFixed(1)}" font-size="10.5" text-anchor="end" fill="#4A1620">${escapeHtml(shortLabel)}</text>`;
  });

  svg += `</svg>`;

  return svg + `<div class="comp-chart-note">Bar berwarna = nilai periode terakhir dalam rentang yang dipilih. Garis tegak gelap = nilai periode sebelumnya (pembanding/target). Pita latar menunjukkan rentang minimum–rata-rata–maksimum historis pada rentang tersebut.</div>`;
}

    if(compareChartType === 'stacked-bar-100' && stackTotals){
      values = values.map((v,j)=>{
        if(v===null || v===undefined) return null;

        return total ? (v/total*100) : 0;
      });
    }else if(normalizeCompare){
      const base = values.find(v=>v!==null && v!==undefined && v!==0);
      if(base){
        values = values.map(v=>(v===null||v===undefined) ? null : (v/base*100));
      }

    const isStackedType = compareChartType === 'stacked-area' || compareChartType === 'stacked-bar' || compareChartType === 'stacked-bar-100';

      datasets.push({
        type:'line', label: subLabel(info.sub), data:values, borderColor:color, backgroundColor:color,
        pointBackgroundColor:color, pointRadius:5, pointHoverRadius:7, showLine:false, fill:false,
        yAxisID, order:1
      });
    }else if(compareChartType === 'pure-bubble' || compareChartType === 'bubble-ts'){
      const numericVals = values.filter(v=>v!==null && v!==undefined);
      const minV = numericVals.length ? Math.min(...numericVals) : 0;
      const maxV = numericVals.length ? Math.max(...numericVals) : 1;
      const rangeV = (maxV-minV) || 1;
      const isTS = compareChartType === 'bubble-ts';
      datasets.push({
        type:'line',
        label: subLabel(info.sub),
        data: values,
        borderColor: color,
        backgroundColor: isTS ? hexToRgba(color,0.16) : hexToRgba(color,0.7),
        pointBackgroundColor: color,
        showLine: isTS,
        fill: isTS,
        tension: isTS ? 0.3 : 0,
        borderDash: isTS ? [3,3] : [],
        borderWidth: isTS ? 1.4 : 0,
        pointRadius: function(context){
          const v = context.raw;
          if(v===null||v===undefined) return 0;
          const norm = (v-minV)/rangeV;
          return computeBubbleRadius(norm, context.chart, keys.length);
        },
        pointHoverRadius: function(context){
          const v = context.raw;
          if(v===null||v===undefined) return 0;
          const norm = (v-minV)/rangeV;
          return computeBubbleRadius(norm, context.chart, keys.length) + 3;
        },
        yAxisID
      });
    }else if(isSlope){
      const twoVals = values.length >= 2 ? [values[0], values[values.length-1]] : values;
      datasets.push({
        type:'line', label: subLabel(info.sub), data:twoVals, borderColor:color, backgroundColor:color,
        pointBackgroundColor:color, pointRadius:5, pointHoverRadius:7, borderWidth:3, tension:0,
        fill:false, yAxisID
      });
    }else if(compareChartType === 'combo'){
      if(i === 0){
        datasets.push({
          type:'bar', label: subLabel(info.sub), data:values, backgroundColor: hexToRgba(color,0.5),
          borderWidth:0, borderRadius:3, maxBarThickness:32, yAxisID, order:2
        });
      }else{
        datasets.push({
          type:'line', label: subLabel(info.sub), data:values, borderColor:color, backgroundColor:color,
          pointRadius:3, pointHoverRadius:5, borderWidth:2.2, tension:0.22, fill:false, yAxisID, order:1, spanGaps:true

    }else{
      const style = getCompareTypeStyle(compareChartType, color);
      datasets.push(Object.assign({ label: subLabel(info.sub), data:values, borderColor:color, yAxisID, spanGaps:true }, style));
    }
  });

  const isStackedType = compareChartType === 'stacked-area' || compareChartType === 'stacked-bar' || compareChartType === 'stacked-bar-100';
  const hasY1 = !isStackedType && !normalizeCompare && keys.length > 1 && keys.some((_, i) => i % 2 === 1);

  const ctx = document.getElementById('compareChart').getContext('2d');
  if(compareChart) compareChart.destroy();
  compareChart = new Chart(ctx, {
    type: topType,
    data:{ labels: chartLabels, datasets },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins:{
        legend:{
          position:'bottom',
          labels:{
            color:'#4A1620', font:{family:'Inter', size:11.5}, boxWidth:10, usePointStyle:true,
            filter: (legendItem)=> compareChartType !== 'lollipop' || legendItem.datasetIndex % 2 === 1
          }

        tooltip:{
          callbacks:{
            label: (c)=> compareChartType === 'stacked-bar-100'
              ? `${c.dataset.label}: ${c.parsed.y===null? '-' : c.parsed.y.toFixed(1)}%`

          }
        }
      },
      scales:{
        x:{ stacked: isStackedType, grid:{display:false}, ticks:{ color:'#8A4A55', font:{family:'Inter', size:11} } },
        y:{
          type: 'linear',
          display: true,
          position: 'left',
          stacked: isStackedType,
          max: compareChartType==='stacked-bar-100' ? 100 : undefined,
          grid:{color:'#F2D9D4'},
          ticks:{
            color:'#8A4A55', font:{family:'Inter', size:11},
            callback: compareChartType==='stacked-bar-100' ? (v)=> v+'%' : undefined

        y1:{
          type: 'linear',
          display: hasY1,
          position: 'right',
          grid:{ drawOnChartArea: false },
          ticks:{ color:'#8A4A55', font:{family:'Inter', size:11} }
        }
      }
    }
  });

  generateAdvancedAIInsight(seriesAnalysisData);
  renderCompareDefinitions(keys);
}

function getCompareTypeStyle(type, color){
  switch(type){
    case 'bar':
      return { type:'bar', backgroundColor: hexToRgba(color,0.68), borderRadius:0, borderWidth:0 };
    case 'rounded-bar':
      return { type:'bar', backgroundColor: hexToRgba(color,0.68), borderRadius:6, borderWidth:0 };
    case 'area':
      return { type:'line', backgroundColor: hexToRgba(color,0.28), fill:true, tension:0.25, borderWidth:2.2, pointRadius:3, pointHoverRadius:5 };
    case 'spline':
      return { type:'line', backgroundColor: color, fill:false, tension:0.42, borderWidth:2.2, pointRadius:3, pointHoverRadius:5 };
    case 'stepped-area':
      return { type:'line', backgroundColor: hexToRgba(color,0.22), fill:true, stepped:true, tension:0, borderWidth:2.2, pointRadius:2, pointHoverRadius:5 };
    case 'dashed-area':
      return { type:'line', backgroundColor: 'transparent', fill:false, borderDash:[6,4], tension:0, borderWidth:2.2, pointRadius:2, pointHoverRadius:5 };
    case 'scatter':
      return { type:'line', backgroundColor: color, fill:false, showLine:false, borderWidth:0, pointRadius:4, pointHoverRadius:6 };
    case 'stacked-area':
      return { type:'line', backgroundColor: hexToRgba(color,0.55), fill:true, tension:0, pointRadius:0, borderWidth:1.5, stack:'cmp' };
    case 'stacked-bar':
      return { type:'bar', backgroundColor: hexToRgba(color,0.78), borderRadius:0, borderWidth:0, stack:'cmp' };
    case 'stacked-bar-100':
      return { type:'bar', backgroundColor: hexToRgba(color,0.78), borderRadius:0, borderWidth:0, stack:'cmp' };
    case 'line':
    default:
      return { type:'line', backgroundColor: color, fill:false, tension:0.22, borderWidth:2.2, pointRadius:3, pointHoverRadius:5 };
  }
}

function pearsonCorrelation(a, b){
  const pairs = [];
  for(let i=0;i<a.length && i<b.length;i++){
    if(a[i]!==null && a[i]!==undefined && b[i]!==null && b[i]!==undefined) pairs.push([a[i],b[i]]);
  }
  if(pairs.length < 3) return null;
  const n = pairs.length;
  const meanA = pairs.reduce((s,p)=>s+p[0],0)/n;
  const meanB = pairs.reduce((s,p)=>s+p[1],0)/n;
  let cov = 0, varA = 0, varB = 0;
  pairs.forEach(p=>{
    cov += (p[0]-meanA)*(p[1]-meanB);
    varA += Math.pow(p[0]-meanA,2);
    varB += Math.pow(p[1]-meanB,2);
  });
  if(varA === 0 || varB === 0) return null;
  return cov / Math.sqrt(varA*varB);
}

function generateAdvancedAIInsight(dataList){
  const textEl = document.getElementById('aiInsightText');
  if(!textEl) return;

  if(!dataList || dataList.length === 0){
    textEl.innerHTML = `Silakan centang minimal satu indikator di panel sebelah kiri.`;
    return;
  }

  let html = `<span class="insight-section-title">📊 Rangkuman Kinerja & Tren Multi-Indikator</span>`;
  html += `Analisis mencakup rentang waktu <b>${compareFrom}</b> hingga <b>${compareTo}</b>:<br><br>`;

  dataList.forEach(item=>{
    const arah = item.pct > 0 ? 'menunjukkan tren kenaikan' : (item.pct < 0 ? 'menunjukkan tren penurunan' : 'cenderung stagnan');
    const warnaArah = item.pct > 0 ? 'color:var(--rust);' : (item.pct < 0 ? 'color:var(--green);' : '');
    
    html += `• <b>${escapeHtml(item.name)}</b>: <span style="${warnaArah}font-weight:700;">${arah}</span> sebesar <b>${item.pct > 0 ? '+' : ''}${item.pct.toFixed(1)}%</b> secara kumulatif (Laju rata-rata tahunan/CAGR: <b>${item.cagr > 0 ? '+' : ''}${item.cagr.toFixed(2)}%/tahun</b>). Nilai tertinggi tercatat pada <b>${item.maxLabel}</b> (${fmtNum(item.max)} ${item.unit}), sementara titik terendahnya berada di <b>${item.minLabel}</b> (${fmtNum(item.min)} ${item.unit}).<br>`;
  });

  if(dataList.some(d=>d.rawValues && d.rawValues.filter(v=>v!==null&&v!==undefined).length >= 3)){
    html += `<span class="insight-section-title" style="margin-top:14px;">📈 Volatilitas Tiap Indikator</span>`;
    const volList = dataList.map(item=>{
      const vals = (item.rawValues||[]).filter(v=>v!==null && v!==undefined);
      if(vals.length < 3) return {name:item.name, cv:null};
      const mean = vals.reduce((s,v)=>s+v,0)/vals.length;
      const variance = vals.reduce((s,v)=>s+Math.pow(v-mean,2),0)/vals.length;
      const cv = mean !== 0 ? Math.abs(Math.sqrt(variance)/mean*100) : 0;
      return {name:item.name, cv};
    }).filter(v=>v.cv !== null);
    volList.sort((a,b)=>b.cv-a.cv);
    if(volList.length > 0){
      html += volList.map(v=>{
        let w = 'stabil';
        if(v.cv >= 25) w = 'cukup fluktuatif';
        else if(v.cv >= 10) w = 'sedikit berfluktuasi';
        return `• <b>${escapeHtml(v.name)}</b>: ${w} (CV ≈ ${v.cv.toFixed(1)}%)`;
      }).join('<br>') + '<br>';
    }
  }

  if(dataList.length >= 2){
    const corrPairs = [];
    for(let i=0;i<dataList.length;i++){
      for(let j=i+1;j<dataList.length;j++){
        const r = pearsonCorrelation(dataList[i].rawValues||[], dataList[j].rawValues||[]);
        if(r !== null) corrPairs.push({a:dataList[i].name, b:dataList[j].name, r});
      }
    }
    if(corrPairs.length > 0){
      corrPairs.sort((x,y)=>Math.abs(y.r)-Math.abs(x.r));
      html += `<span class="insight-section-title" style="margin-top:14px;">🔗 Korelasi Antar Indikator</span>`;
      corrPairs.slice(0,4).forEach(p=>{
        let word = 'nyaris tidak berkorelasi';
        let cls = 'trend-flat';
        if(p.r >= 0.7){ word = 'bergerak searah dengan kuat'; cls='trend-up'; }
        else if(p.r >= 0.3){ word = 'cenderung bergerak searah'; cls='trend-up'; }
        else if(p.r <= -0.7){ word = 'bergerak berlawanan arah dengan kuat (trade-off)'; cls='trend-down'; }
        else if(p.r <= -0.3){ word = 'cenderung bergerak berlawanan arah'; cls='trend-down'; }
        html += `• <b>${escapeHtml(p.a)}</b> vs <b>${escapeHtml(p.b)}</b>: <span class="${cls}" style="font-weight:700;">${word}</span> (r = ${p.r.toFixed(2)})<br>`;
      });
    }
  }

  html += `<span class="insight-section-title" style="margin-top:14px;">🔍 Catatan Komparasi & Rekomendasi Analisis</span>`;
  if(dataList.length === 1){
    html += `Anda sedang memantau satu indikator tunggal. Tambahkan indikator pembanding lain di panel sebelah kiri untuk melihat pola korelasi atau divergensi antar variabel.`;
  } else {
    html += `Dengan membandingkan <b>${dataList.length} indikator terpilih</b>, Anda dapat mengamati apakah pergerakan variabel-variabel ini saling sejalan (sinkron) atau bergerak secara berlawanan (trade-off). Perhatikan bahwa korelasi statistik di atas tidak selalu menunjukkan hubungan sebab-akibat.`;
  }

  textEl.innerHTML = html;
}

function buildSeriesInsight(filtered, indikator){
  if(!filtered || filtered.length === 0) return 'Tidak ada data pada rentang periode ini.';
  const satuan = SATUAN[indikator] ? ' ' + escapeHtml(SATUAN[indikator]) : '';
  const first = filtered[0];
  const last = filtered[filtered.length-1];

  let maxObj = filtered[0], minObj = filtered[0], sum = 0;
  filtered.forEach(e=>{
    if(e.data > maxObj.data) maxObj = e;
    if(e.data < minObj.data) minObj = e;
    sum += e.data;
  });
  const avg = sum / filtered.length;
  const variance = filtered.reduce((s,e)=>s + Math.pow(e.data-avg,2), 0) / filtered.length;
  const stdev = Math.sqrt(variance);
  const cv = avg !== 0 ? Math.abs(stdev/avg*100) : 0;

  let trendWord = 'relatif stabil dibandingkan', trendClass = 'trend-flat';
  if(last.data > first.data){ trendWord = 'meningkat dibandingkan'; trendClass = 'trend-up'; }
  else if(last.data < first.data){ trendWord = 'menurun dibandingkan'; trendClass = 'trend-down'; }

  let html = `Pada periode <b>${periodLabel(last)}</b>, indikator <b>${escapeHtml(indikator)}</b> tercatat <b>${fmtNum(last.data)}${satuan}</b>.`;

  if(first !== last){
    const diff = last.data - first.data;
    const pct = first.data !== 0 ? (diff/first.data*100) : 0;
    const spanYears = (last.tahun - first.tahun) || 1;
    const cagr = first.data > 0 ? (Math.pow(last.data/first.data, 1/spanYears) - 1) * 100 : 0;
    html += ` Nilai ini <span class="${trendClass}">${trendWord}</span> periode <b>${periodLabel(first)}</b> (${fmtNum(first.data)}${satuan}), setara perubahan kumulatif <b>${pct>0?'+':''}${pct.toFixed(1)}%</b> (laju rata-rata tahunan/CAGR: <b>${cagr>0?'+':''}${cagr.toFixed(2)}%/tahun</b>).`;
  }

  html += ` Sepanjang rentang ini, nilai tertinggi tercatat pada <b>${periodLabel(maxObj)}</b> (${fmtNum(maxObj.data)}${satuan}) dan terendah pada <b>${periodLabel(minObj)}</b> (${fmtNum(minObj.data)}${satuan}), dengan rata-rata sekitar <b>${fmtNum(avg)}${satuan}</b>.`;

  if(filtered.length >= 3){
    let volWord = 'cenderung stabil dari tahun ke tahun';
    if(cv >= 25) volWord = 'cukup fluktuatif dari tahun ke tahun';
    else if(cv >= 10) volWord = 'sedikit berfluktuasi dari tahun ke tahun';
    html += ` Secara sebaran, nilai indikator ini ${volWord} (koefisien variasi sekitar ${cv.toFixed(1)}%, simpangan baku ±${fmtNum(stdev)}${satuan}).`;
  }

  if(filtered.length >= 3){
    let upCount = 0, downCount = 0, flatCount = 0;
    for(let i=1;i<filtered.length;i++){
      const d = filtered[i].data - filtered[i-1].data;
      if(d > 0) upCount++; else if(d < 0) downCount++; else flatCount++;
    }
    let streak = 1, streakDir = null;
    for(let i=filtered.length-1;i>0;i--){
      const d = filtered[i].data - filtered[i-1].data;
      const dir = d > 0 ? 'up' : (d < 0 ? 'down' : 'flat');
      if(streakDir === null){ streakDir = dir; if(dir==='flat') break; }
      else if(dir === streakDir){ streak++; } else break;
    }
    const totalMoves = upCount + downCount + flatCount;
    html += ` Dari ${totalMoves} pergerakan antar periode, tercatat <b>${upCount} kali naik</b> dan <b>${downCount} kali turun</b>`;
    if(streak >= 2 && (streakDir === 'up' || streakDir === 'down')){
      html += `, dengan tren <b>${streakDir==='up'?'kenaikan':'penurunan'} beruntun ${streak} periode terakhir</b>`;
    }
    html += '.';

    if(filtered.length >= 2){
      const lastYoY = filtered[filtered.length-1].data - filtered[filtered.length-2].data;
      const lastYoYPct = filtered[filtered.length-2].data !== 0 ? (lastYoY/filtered[filtered.length-2].data*100) : 0;
      html += ` Perubahan periode terakhir (<b>${periodLabel(filtered[filtered.length-2])}</b> → <b>${periodLabel(filtered[filtered.length-1])}</b>) sebesar <b>${lastYoY>0?'+':''}${fmtNum(lastYoY)}${satuan}</b> (${lastYoYPct>0?'+':''}${lastYoYPct.toFixed(1)}%).`;
    }
  }

  return html;
}

function refreshDetail(entries, fromYear, toYear){
  const filtered = entries.filter(e=>e.tahun>=fromYear && e.tahun<=toYear);
  const labels = filtered.map(periodLabel);
  const values = filtered.map(e=>e.data);

  const latest = filtered[filtered.length-1];
  const prev = filtered[filtered.length-2];
  let changeStr = '—';
  if(latest && prev && prev.data !== 0){
    const pct = ((latest.data-prev.data)/prev.data)*100;
    changeStr = (pct>0?'▲ +':'▼ ') + pct.toFixed(1) + '%';
  }
  const max = filtered.length ? Math.max(...values) : NaN;
  const min = filtered.length ? Math.min(...values) : NaN;

  document.getElementById('statBoxes').innerHTML = `
    <div class="stat-box"><div class="stat-label">Nilai Terkini</div><div class="stat-value">${fmtNum(latest?latest.data:NaN)}</div></div>
    <div class="stat-box"><div class="stat-label">Perubahan</div><div class="stat-value">${changeStr}</div></div>
    <div class="stat-box"><div class="stat-label">Tertinggi / Terendah</div><div class="stat-value" style="font-size:15px;">${fmtNum(max)} / ${fmtNum(min)}</div></div>
  `;

  const narrEl = document.getElementById('drawerNarrative');
  if(narrEl && currentSeriesKey){
    narrEl.innerHTML = buildSeriesInsight(filtered, currentSeriesKey.sub);
  }

  let rows = '';
  [...filtered].reverse().forEach(e=>{
    rows += `<tr><td>${periodLabel(e)}</td><td>${fmtNum(e.data)}</td></tr>`;
  });
  document.getElementById('detailTable').innerHTML =
    `<thead><tr><th>Periode</th><th>Nilai</th></tr></thead><tbody>${rows}</tbody>`;

  const canvasEl = document.getElementById('detailChart');
  if(typeof Chart === 'undefined'){
    canvasEl.parentElement.innerHTML = '<div style="padding:20px;font-size:13px;color:var(--brown-mid);">Grafik gagal dimuat (library Chart.js tidak tersedia). Coba refresh halaman.</div>';
    return;
  }
  const ctx = canvasEl.getContext('2d');
  if(chartInstance) chartInstance.destroy();

  const accent = currentDetailColor || '#D64553';
  const isBar = currentDetailChartType === 'bar' || currentDetailChartType === 'rounded-bar';
  const isLollipop = currentDetailChartType === 'lollipop';
  const isSpline = currentDetailChartType === 'spline';
  const isBubbleTS = currentDetailChartType === 'bubble-ts';
  const isPureBubble = currentDetailChartType === 'pure-bubble';
  const isScatter = currentDetailChartType === 'scatter';
  const isStepped = currentDetailChartType === 'stepped-area';
  const isDashed = currentDetailChartType === 'dashed-area';
  const isWaterfall = currentDetailChartType === 'waterfall';
  const isFunnel = currentDetailChartType === 'funnel';
  const isSurface = currentDetailChartType === 'surface';
  const isRadar = currentDetailChartType === 'radar';
  const isPolarArea = currentDetailChartType === 'polar-area';
  const isDivergingBar = currentDetailChartType === 'diverging-bar';
  const isCombo = currentDetailChartType === 'combo';
  const isPareto = currentDetailChartType === 'pareto';
  const isStream = currentDetailChartType === 'stream';

  let chartLabelsFinal = labels;
  let datasets = [];
  if (isRadar) {
    datasets = [{
      data: values,
      borderColor: accent,
      backgroundColor: hexToRgba(accent, 0.25),
      pointBackgroundColor: accent,
      pointRadius: 3,
      borderWidth: 2
    }];
  } else if (isPolarArea) {
    datasets = [{
      data: values,
      backgroundColor: values.map((_,i)=>hexToRgba(COMPARE_COLORS[i % COMPARE_COLORS.length], 0.65)),
      borderColor: '#fff',
      borderWidth: 1.5
    }];
  } else if (isDivergingBar) {
    const avg = values.reduce((s,v)=>s+v,0)/values.length;
    datasets = [{
      data: values.map(v=>v-avg),
      backgroundColor: values.map(v=> v>=avg ? hexToRgba('#4E7D5A',0.8) : hexToRgba('#A63A50',0.8)),
      borderWidth: 0,
      borderRadius: 3,
      maxBarThickness: 34,
      _baseline: avg
    }];
  } else if (isCombo) {
    let running = 0;
    const movingAvg = values.map((v,i)=>{ running += v; return running/(i+1); });
    datasets = [
      { type:'bar', data: values, backgroundColor: hexToRgba(accent,0.45), borderWidth:0, borderRadius:3, maxBarThickness:32, order:2 },
      { type:'line', data: movingAvg, borderColor:'#4A1620', backgroundColor:'#4A1620', borderWidth:2, pointRadius:2, tension:0.25, fill:false, order:1 }
    ];
  } else if (isPareto) {
    const idxSorted = values.map((v,i)=>i).sort((a,b)=>values[b]-values[a]);
    const sortedVals = idxSorted.map(i=>values[i]);
    chartLabelsFinal = idxSorted.map(i=>labels[i]);
    const total = sortedVals.reduce((s,v)=>s+v,0) || 1;
    let cum = 0;
    const cumPct = sortedVals.map(v=>{ cum += v; return (cum/total*100); });
    datasets = [
      { type:'bar', data: sortedVals, backgroundColor: hexToRgba(accent,0.6), borderWidth:0, borderRadius:3, maxBarThickness:34, yAxisID:'y', order:2 },
      { type:'line', data: cumPct, borderColor:'#4A1620', backgroundColor:'#4A1620', borderWidth:2, pointRadius:3, tension:0, fill:false, yAxisID:'y1', order:1 }
    ];
  } else if (isLollipop) {
    datasets = [
      {
        type: 'bar',
        data: values,
        backgroundColor: hexToRgba(accent, 0.6),
        borderWidth: 0,
        maxBarThickness: 4,
        borderRadius: 0
      },
      {
        type: 'line',
        data: values,
        borderColor: accent,
        backgroundColor: accent,
        pointBackgroundColor: accent,
        pointRadius: 5,
        pointHoverRadius: 7,
        showLine: false,
        fill: false
      }
    ];
  } else if (isPureBubble) {
    const minV = Math.min(...values), maxV = Math.max(...values);
    const rangeV = (maxV - minV) || 1;
    datasets = [{
      type: 'line',
      data: values,
      borderColor: accent,
      backgroundColor: hexToRgba(accent, 0.75),
      pointRadius: function(context) {
        const v = context.raw;
        if(v === null || v === undefined) return 0;
        const norm = (v - minV) / rangeV;
        return computeBubbleRadius(norm, context.chart, 1);
      },
      pointHoverRadius: function(context) {
        const v = context.raw;
        if(v === null || v === undefined) return 0;
        const norm = (v - minV) / rangeV;
        return computeBubbleRadius(norm, context.chart, 1) + 3;
      },
      pointBackgroundColor: accent,
      showLine: false,
      fill: false
    }];
  } else if (isBubbleTS) {
    const minV = Math.min(...values), maxV = Math.max(...values);
    const rangeV = (maxV - minV) || 1;
    datasets = [{
      type: 'line',
      data: values,
      borderColor: accent,
      backgroundColor: hexToRgba(accent, 0.22),
      pointRadius: function(context) {
        const v = context.raw;
        if(v === null || v === undefined) return 0;
        const norm = (v - minV) / rangeV;
        return computeBubbleRadius(norm, context.chart, 1) * 0.8;
      },
      pointHoverRadius: function(context) {
        const v = context.raw;
        if(v === null || v === undefined) return 0;
        const norm = (v - minV) / rangeV;
        return computeBubbleRadius(norm, context.chart, 1) * 0.8 + 3;
      },
      pointBackgroundColor: accent,
      borderWidth: 2.2,
      fill: true,
      tension: 0.3
    }];
  } else if (isBar) {
    datasets = [{
      data: values,
      backgroundColor: hexToRgba(accent, 0.75),
      borderColor: accent,
      borderWidth: 1,
      borderRadius: 0, // Siku tegas tanpa lengkung (standard bar chart)
      maxBarThickness: 38
    }];
  } else if (isScatter) {
    datasets = [{
      type: 'line',
      data: values,
      borderColor: accent,
      backgroundColor: accent,
      pointBackgroundColor: accent,
      pointRadius: 5,
      pointHoverRadius: 7,
      showLine: false,
      fill: false
    }];
  } else if (isWaterfall) {
    const wfData = values.map((v,i)=>{
      const base = i===0 ? 0 : values[i-1];
      return [Math.min(base,v), Math.max(base,v)];
    });
    const wfColors = values.map((v,i)=>{
      if(i===0) return hexToRgba(accent, 0.8);
      return v >= values[i-1] ? hexToRgba('#4E7D5A', 0.82) : hexToRgba('#A63A50', 0.82);
    });
    datasets = [{
      data: wfData,
      backgroundColor: wfColors,
      borderWidth: 0,
      borderRadius: 3,
      maxBarThickness: 36
    }];
  } else if (isFunnel) {
    const idxSorted = values.map((v,i)=>i).sort((a,b)=>values[b]-values[a]);
    const sortedVals = idxSorted.map(i=>values[i]);
    chartLabelsFinal = idxSorted.map(i=>labels[i]);
    datasets = [{
      data: sortedVals,
      backgroundColor: hexToRgba(accent, 0.75),
      borderColor: accent,
      borderWidth: 1,
      borderRadius: 4,
      maxBarThickness: 34
    }];
  } else if (isSurface) {
    const minV = Math.min(...values), maxV = Math.max(...values);
    const rangeV = (maxV - minV) || 1;
    datasets = [{
      data: values,
      backgroundColor: values.map(v => hexToRgba(accent, 0.22 + 0.68 * ((v - minV) / rangeV))),
      borderWidth: 0,
      borderRadius: 2,
      maxBarThickness: 40,
      categoryPercentage: 1.0,
      barPercentage: 1.0
    }];
  } else if (isStream) {
    datasets = [
      { data: values.map(v=>-v/2), borderColor:'transparent', backgroundColor:'transparent', pointRadius:0, fill:false, order:2 },
      { data: values.map(v=>v/2), borderColor:accent, backgroundColor:hexToRgba(accent,0.55), pointRadius:0, borderWidth:1.5, fill:'-1', tension:0.35, order:1 }
    ];
  } else {
    const gradient = ctx.createLinearGradient(0,0,0,260);
    gradient.addColorStop(0, hexToRgba(accent, 0.35));
    gradient.addColorStop(1, hexToRgba(accent, 0.02));
    datasets = [{
      data: values,
      borderColor: accent,
      backgroundColor: gradient,
      pointBackgroundColor: accent,
      pointRadius: 4,
      pointHoverRadius: 6,
      borderWidth: 2.5,
      fill: true,
      tension: isSpline ? 0.4 : ((isStepped || isDashed) ? 0 : 0.25),
      stepped: isSpline ? false : (isStepped ? true : false),
      borderDash: isDashed ? [6, 4] : []
    }];
  }

  const topIsBar = isBar || isWaterfall || isFunnel || isSurface || isDivergingBar || isPareto || (isCombo);

  chartInstance = new Chart(ctx, {
    type: isRadar ? 'radar' : (isPolarArea ? 'polarArea' : (topIsBar ? 'bar' : 'line')),
    data:{ labels: chartLabelsFinal, datasets },
    options: isRadar ? {
      responsive:true,
      maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{
        r:{
          grid:{ color:'#F2D9D4' },
          angleLines:{ color:'#F2D9D4' },
          pointLabels:{ color:'#8A4A55', font:{family:'Inter', size:10.5} },
          ticks:{ color:'#8A4A55', backdropColor:'transparent', font:{family:'Inter', size:9.5} }
        }
      }
    } : isPolarArea ? {
      responsive:true,
      maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{
        r:{
          grid:{ color:'#F2D9D4' },
          angleLines:{ color:'#F2D9D4' },
          pointLabels:{ color:'#8A4A55', font:{family:'Inter', size:10.5} },
          ticks:{ color:'#8A4A55', backdropColor:'transparent', font:{family:'Inter', size:9.5} }
        }
      }
    } : isPareto ? {
      responsive:true,
      maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{
        x:{ grid:{display:false}, ticks:{ color:'#8A4A55', font:{family:'Inter', size:10.5} } },
        y:{ type:'linear', position:'left', grid:{color:'#F2D9D4'}, ticks:{ color:'#8A4A55', font:{family:'Inter', size:11} } },
        y1:{ type:'linear', position:'right', min:0, max:100, grid:{drawOnChartArea:false}, ticks:{ color:'#8A4A55', font:{family:'Inter', size:11}, callback:(v)=>v+'%' } }
      }
    } : {
      responsive:true,
      maintainAspectRatio:false,
      indexAxis: isFunnel ? 'y' : 'x',
      plugins:{ legend:{display:false} },
      scales:{
        x:{ 
          grid:{display: isFunnel ? true : false, color:'#F2D9D4'}, 
          ticks:{ color:'#8A4A55', font:{family:'Inter', size:11} } 
        },
        y:{ grid:{color: isFunnel ? '#fff' : '#F2D9D4', display: (!isFunnel || true) && !isStream}, ticks:{ color:'#8A4A55', font:{family:'Inter', size:11}, display: !isStream } }
      }
    }
  });
}

function computeBubbleRadius(norm, chart, seriesCount){
  norm = Math.max(0, Math.min(1, isFinite(norm) ? norm : 0));
  const area = chart && chart.chartArea;
  const n = (chart && chart.data && chart.data.labels) ? chart.data.labels.length : 10;
  const plotWidth = area ? Math.max(60, area.right - area.left) : 300;
  const perPoint = plotWidth / Math.max(1, n) / Math.max(1, seriesCount || 1);
  const maxR = Math.max(5, Math.min(20, perPoint * 0.42));
  const minR = Math.max(3, maxR * 0.32);
  return minR + Math.sqrt(norm) * (maxR - minR);
}

function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16);
  const g = parseInt(h.substring(2,4),16);
  const b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

/* =========================================================
   SHIFT-SHARE DINAMIS
   Referensi metode: https://en.wikipedia.org/wiki/Shift-share_analysis
   Model: Dynamic Traditional (Dunn), Dynamic Esteban-Marquilas (1972), Dynamic Arcelus (1984)
   Struktur data: satu baris = satu interval tahun (Tahun_Awal -> Tahun_Akhir) per Kategori,
   dengan nilai Klungkung (wilayah studi) & Bali (wilayah acuan) di awal & akhir interval,
   plus totalnya masing-masing.
   ========================================================= */

function ssNormalizeHeader(h){ return (h||'').toString().trim(); }

function autoDetectSSColumns(){
  if(!ssHeaders || !ssHeaders.length) return;
  SS_FIELDS.forEach(f=>{
    if(ssMap[f.key] && ssHeaders.includes(ssMap[f.key])) return; // sudah valid, jangan timpa
    let found = null;
    for(const pat of f.patterns){
      found = ssHeaders.find(h=> pat.test(ssNormalizeHeader(h)));
      if(found) break;
    }
    ssMap[f.key] = found || null;
  });
}

function ssMappingValid(){
  return SS_FIELDS.every(f=> !!ssMap[f.key]);
}

function ssExtractYear(v){
  if(v===undefined||v===null) return NaN;
  const s = v.toString().trim();
  const m = s.match(/(19|20)\d{2}/);
  return m ? parseInt(m[0]) : parseInt(s);
}

/* Bangun dataset interval: satu entri per baris CSV, sudah berisi seluruh
   komponen Traditional / Esteban-Marquilas / Arcelus sesuai rumus persis. */
function buildSSDataset(){
  const rows = [];
  ssRawRows.forEach(r=>{
    const tahunAwal = ssExtractYear(r[ssMap.tahunAwal]);
    const tahunAkhir = ssExtractYear(r[ssMap.tahunAkhir]);
    const kategori = (r[ssMap.kategori]||'').toString().trim();
    const D = toNumber(r[ssMap.D]);  // Klungkung_Awal (e_i, t-1)
    const E = toNumber(r[ssMap.E]);  // Klungkung_Akhir (e_i, t)
    const F = toNumber(r[ssMap.F]);  // Bali_Awal (E_i, t-1)
    const G = toNumber(r[ssMap.G]);  // Bali_Akhir (E_i, t)
    const H = toNumber(r[ssMap.H]);  // Total_Klungkung_Awal (e, t-1)
    const I = toNumber(r[ssMap.I]);  // Total_Klungkung_Akhir (e, t)
    const J = toNumber(r[ssMap.J]);  // Total_Bali_Awal (E, t-1)
    const K = toNumber(r[ssMap.K]);  // Total_Bali_Akhir (E, t)

    if(!tahunAwal || !tahunAkhir || !kategori) return;
    if([D,E,F,G,H,I,J,K].some(v=>isNaN(v))) return;
    if(!(D>0) || !(F>0) || !(J>0) || !(H>0)) return; // hindari pembagian 0

    const g_i = (E-D)/D;                 // laju pertumbuhan sektor i, Wilayah Studi
    const G_i = (G-F)/F;                 // laju pertumbuhan sektor i, Wilayah Acuan
    const Gr  = (K-J)/J;                 // laju pertumbuhan total Wilayah Acuan
    const gr  = (I-H)/H;                 // laju pertumbuhan total Wilayah Studi
    const Actual = E-D;

    // Dynamic Traditional
    const NS = D*Gr;
    const IM = D*(G_i-Gr);
    const RS = D*(g_i-G_i);

    // Dynamic Esteban-Marquilas
    const h = H*(F/J);                   // nilai homotetik
    const RS_EM = h*(g_i-G_i);
    const Alokasi = (D-h)*(g_i-G_i);

    // Dynamic Arcelus
    const NSE = h*Gr;
    const NSD = (D-h)*Gr;
    const IME = h*(G_i-Gr);
    const IMD = (D-h)*(G_i-Gr);
    const RGE = h*(gr-Gr);
    const RGD = (D-h)*(gr-Gr);
    const RIE = h*((g_i-G_i)-(gr-Gr));
    const RID = (D-h)*((g_i-G_i)-(gr-Gr));

    rows.push({
      tahunAwal, tahunAkhir, kategori, D,E,F,G,H,I,J,K,
      g_i,G_i,Gr,gr,Actual,
      NS,IM,RS,
      h,RS_EM,Alokasi,
      NSE,NSD,IME,IMD,RGE,RGD,RIE,RID
    });
  });
  return rows;
}

function ssClassify(method, row){
  let x,y;
  if(method==='tradisional'){ x = row.IM; y = row.RS; }
  else { x = row.spesialisasi; y = row.kompetitif; }
  if(x===null || x===undefined || isNaN(x)) return null;
  if(x>=0 && y>=0) return 1;
  if(x<0 && y>=0) return 2;
  if(x<0 && y<0) return 3;
  return 4;
}

/* Akumulasi seluruh baris interval yang berada dalam rentang tahun terpilih,
   dikelompokkan per Kategori. */
function computeShiftShare(dataset, yearFrom, yearTo, method){
  const inRange = dataset.filter(r=> r.tahunAwal>=yearFrom && r.tahunAkhir<=yearTo);
  const byKategori = {};
  inRange.forEach(r=>{
    if(!byKategori[r.kategori]) byKategori[r.kategori] = {
      kategori:r.kategori, D0:null, NS:0,IM:0,RS:0, h_sum:0, RS_EM:0, Alokasi:0,
      NSE:0,NSD:0,IME:0,IMD:0,RGE:0,RGD:0,RIE:0,RID:0, Actual:0, nInterval:0
    };
    const acc = byKategori[r.kategori];
    if(acc.D0===null) acc.D0 = r.D; // nilai dasar pada interval paling awal terpakai (untuk spesialisasi)
    acc.NS+=r.NS; acc.IM+=r.IM; acc.RS+=r.RS;
    acc.h_sum += (r.D - r.h); // akumulasi deviasi (D-h) sebagai proksi spesialisasi
    acc.RS_EM+=r.RS_EM; acc.Alokasi+=r.Alokasi;
    acc.NSE+=r.NSE; acc.NSD+=r.NSD; acc.IME+=r.IME; acc.IMD+=r.IMD;
    acc.RGE+=r.RGE; acc.RGD+=r.RGD; acc.RIE+=r.RIE; acc.RID+=r.RID;
    acc.Actual += r.Actual;
    acc.nInterval++;
  });

  let perKategori = Object.values(byKategori).map(a=>{
    const totalTrad = a.NS+a.IM+a.RS;
    const totalEM = a.NS+a.IM+a.RS_EM+a.Alokasi;
    const totalArc = a.NSE+a.NSD+a.IME+a.IMD+a.RGE+a.RGD+a.RIE+a.RID;
    let total, check;
    if(method==='tradisional'){ total = totalTrad; check = a.Actual-totalTrad; }
    else if(method==='em'){ total = totalEM; check = a.Actual-totalEM; }
    else { total = totalArc; check = a.Actual-totalArc; }
    return {
      kategori:a.kategori,
      NS:a.NS, IM:a.IM, RS:a.RS,
      RS_EM:a.RS_EM, Alokasi:a.Alokasi,
      NSE:a.NSE, NSD:a.NSD, IME:a.IME, IMD:a.IMD, RGE:a.RGE, RGD:a.RGD, RIE:a.RIE, RID:a.RID,
      spesialisasi: a.h_sum,
      kompetitif: method==='em' ? a.RS_EM : (a.RGE+a.RGD+a.RIE+a.RID),
      total, actual:a.Actual, check, nInterval:a.nInterval
    };
  });

  perKategori.forEach(r=>{ r.quadrant = ssClassify(method, r); });
  perKategori.sort((a,b)=> Math.abs(b.total) - Math.abs(a.total));

  return { perKategori, nRows:inRange.length };
}

function renderShiftShareView(){
  const filterPanel = document.getElementById('kelFilterPanel');
  if(filterPanel) filterPanel.style.display = 'none';
  const main = document.getElementById('main');

  const introHtml = `
    <div class="ss-intro">
      <h2>Shift-Share Dinamis</h2>
      <p>Analisis Shift-Share menguraikan pertumbuhan tiap sektor di Klungkung menjadi tiga hal: dorongan pertumbuhan wilayah acuan/Bali (Pertumbuhan Nasional), pengaruh komposisi sektor (Bauran Industri), dan keunggulan/kelemahan bersaing wilayah itu sendiri (Pergeseran Diferensial). Versi <b>dinamis</b> di bawah ini menjumlahkan komponen tersebut dari setiap interval tahun berurutan yang tersedia pada sumber data, sesuai rentang tahun yang dipilih. Tersedia tiga varian: Dynamic Traditional (Dunn), Dynamic Esteban-Marquilas (1972), dan Dynamic Arcelus (1984). Rujukan metode: <a href="https://en.wikipedia.org/wiki/Shift-share_analysis" target="_blank" rel="noopener">Shift-share analysis — Wikipedia ↗</a></p>
    </div>`;

  if(ssLoadState==='idle'){
    main.innerHTML = `<section class="ss-wrap">${introHtml}<div class="state-msg"><span class="spinner"></span>Memuat data Shift-Share…</div></section>`;
    loadShiftShareData();
    return;
  }
  if(ssLoadState==='loading'){
    main.innerHTML = `<section class="ss-wrap">${introHtml}<div class="state-msg"><span class="spinner"></span>Memuat data Shift-Share…</div></section>`;
    return;
  }
  if(ssLoadState==='error'){
    main.innerHTML = `<section class="ss-wrap">${introHtml}<div class="state-msg">⚠ Gagal memuat data: ${escapeHtml(ssLoadError)}<br><br><a href="${SS_CSV_URL}" target="_blank" style="color:var(--orange-deep);font-weight:600;">Buka sumber data →</a></div></section>`;
    return;
  }
  if(!ssRawRows || !ssRawRows.length){
    main.innerHTML = `<section class="ss-wrap">${introHtml}<div class="state-msg">Sumber data kosong atau tidak dapat dibaca.</div></section>`;
    return;
  }

  const mappingOk = ssMappingValid();

  main.innerHTML = `
    <section class="ss-wrap">
      ${introHtml}

      <div class="ss-method-tabs" id="ssMethodTabs">
        <button class="ss-method-tab" data-m="tradisional">Dynamic Traditional</button>
        <button class="ss-method-tab" data-m="em">Dynamic Esteban-Marquilas</button>
        <button class="ss-method-tab" data-m="arcelus">Dynamic Arcelus</button>
      </div>
      <div class="ss-method-note" id="ssMethodNote"></div>

      <div class="ss-controls">
        <div class="ctrl-item"><label>Tahun Awal</label><select id="ssFrom"></select></div>
        <div class="ctrl-item"><label>Tahun Akhir</label><select id="ssTo"></select></div>
        <div class="ctrl-item" style="font-size:11.5px;color:var(--brown-soft);" id="ssIntervalInfo"></div>
        <button class="ss-mapping-toggle" id="ssMapToggle">${mappingOk ? '⚙ Atur Pemetaan Kolom' : '⚠ Atur Pemetaan Kolom (perlu dilengkapi)'}</button>
      </div>

      <div class="ss-mapping-panel${ssMappingPanelOpen ? ' open' : ''}" id="ssMapPanel"></div>

      <div id="ssBody"></div>
    </section>`;

  document.querySelectorAll('.ss-method-tab').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.m===ssMethod);
    btn.onclick = ()=>{ ssMethod = btn.dataset.m; renderShiftShareView(); };
  });
  updateSSMethodNote();

  renderSSMappingPanel();
  document.getElementById('ssMapToggle').onclick = ()=>{
    ssMappingPanelOpen = !ssMappingPanelOpen;
    document.getElementById('ssMapPanel').classList.toggle('open', ssMappingPanelOpen);
  };

  if(!mappingOk){
    document.getElementById('ssBody').innerHTML = `<div class="state-msg">Pemetaan kolom belum lengkap/valid. Buka "Atur Pemetaan Kolom" di atas untuk menyesuaikan sumber data dengan struktur yang diharapkan (Tahun_Awal, Tahun_Akhir, Kategori, Klungkung_Awal, Klungkung_Akhir, Bali_Awal, Bali_Akhir, Total_Klungkung_Awal, Total_Klungkung_Akhir, Total_Bali_Awal, Total_Bali_Akhir).</div>`;
    ssMappingPanelOpen = true;
    document.getElementById('ssMapPanel').classList.add('open');
    return;
  }

  const dataset = buildSSDataset();

  if(!dataset.length){
    document.getElementById('ssBody').innerHTML = `<div class="state-msg">Tidak ada baris data yang valid (periksa apakah kolom tahun & nilai sudah terisi angka dengan benar).</div>`;
    return;
  }

  const yearsSet = new Set();
  dataset.forEach(r=>{ yearsSet.add(r.tahunAwal); yearsSet.add(r.tahunAkhir); });
  const years = [...yearsSet].sort((a,b)=>a-b);
  ssYearsAvailable = years;

  if(!ssYearFrom || !years.includes(ssYearFrom)) ssYearFrom = years[0];
  if(!ssYearTo || !years.includes(ssYearTo) || ssYearTo<=ssYearFrom) ssYearTo = years[years.length-1];

  const fromSel = document.getElementById('ssFrom');
  const toSel = document.getElementById('ssTo');
  years.forEach(y=>{
    fromSel.innerHTML += `<option value="${y}" ${y===ssYearFrom?'selected':''}>${y}</option>`;
    toSel.innerHTML += `<option value="${y}" ${y===ssYearTo?'selected':''}>${y}</option>`;
  });
  fromSel.onchange = ()=>{
    ssYearFrom = parseInt(fromSel.value);
    if(ssYearTo<=ssYearFrom){ const nxt = years.find(y=>y>ssYearFrom); ssYearTo = nxt||ssYearFrom; }
    renderShiftShareView();
  };
  toSel.onchange = ()=>{ ssYearTo = parseInt(toSel.value); renderShiftShareView(); };

  const result = computeShiftShare(dataset, ssYearFrom, ssYearTo, ssMethod);
  ssResult = result;

  document.getElementById('ssIntervalInfo').textContent =
    result.nRows>0 ? `${result.nRows} baris interval dari sumber data dipakai & diakumulasi` : 'Tidak ada interval yang cocok pada rentang ini';

  if(!result.perKategori.length){
    document.getElementById('ssBody').innerHTML = `<div class="state-msg">Tidak ada interval data pada rentang tahun ${ssYearFrom}–${ssYearTo}. Coba perlebar rentang tahun.</div>`;
    return;
  }

  renderSSBody(result);
}

function updateSSMethodNote(){
