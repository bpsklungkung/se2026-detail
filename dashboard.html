<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Indikator — BPS Klungkung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js';document.head.appendChild(s);"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';document.head.appendChild(s);"></script>
<style>
  :root{
    --cream:#FAF3E6;
    --cream-deep:#F3E7D3;
    --peach:#EFCFA6;
    --peach-soft:#F6DFC0;
    --orange:#C97A3D;
    --orange-deep:#A85F28;
    --brown:#4A3324;
    --brown-mid:#7C5B42;
    --brown-soft:#9C816B;
    --green:#6E8F6B;
    --green-bg:#E4EBDF;
    --rust:#B0512E;
    --rust-bg:#F3DCD1;
    --card-bg:#FFFCF6;
    --line:#E6D7BE;
    --shadow: 0 1px 2px rgba(74,51,36,.06), 0 8px 24px rgba(74,51,36,.08);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    color:var(--brown);
    background:
      radial-gradient(circle at 1px 1px, rgba(74,51,36,0.07) 1px, transparent 0) 0 0/22px 22px,
      var(--cream);
    min-height:100vh;
    padding-bottom:80px;
  }
  ::selection{background:var(--peach);}

  /* Header */
  header{
    padding:44px 28px 20px;
    max-width:1180px;
    margin:0 auto;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--orange-deep);
    font-weight:700;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::before{
    content:'';
    width:16px;height:2px;background:var(--orange-deep);display:inline-block;
  }
  h1{
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:clamp(30px,4vw,44px);
    margin:0 0 8px;
    letter-spacing:-.01em;
    color:var(--brown);
  }
  .subtitle{
    color:var(--brown-mid);
    font-size:15px;
    max-width:560px;
    line-height:1.5;
    margin:0;
  }

  /* Tabs */
  .tabs{
    display:flex;
    gap:4px;
    margin:28px 0 4px;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .tab{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:10px 18px;
    background:none;
    border:none;
    cursor:pointer;
    color:var(--brown-soft);
    position:relative;
    top:1px;
    transition:color .2s;
  }
  .tab.active{ color:var(--orange-deep); }
  .tab.active::after{
    content:'';
    position:absolute;
    left:14px;right:14px;bottom:-1px;
    height:2px;
    background:var(--orange-deep);
    border-radius:2px 2px 0 0;
  }
  .tab:hover{ color:var(--orange-deep); }
  .tab-sep{
    width:1px;
    align-self:stretch;
    background:var(--line);
    margin:8px 8px 9px;
  }

  main{ max-width:1180px; margin:0 auto; padding:0 28px; }

  /* Compare view */
  .compare-wrap{ margin-top:30px; }
  .compare-intro h2{
    font-family:'Fraunces',serif; font-weight:600; font-size:24px;
    margin:0 0 4px; color:var(--brown);
  }
  .compare-intro p{ margin:0 0 22px; color:var(--brown-mid); font-size:14px; max-width:580px; line-height:1.5; }

  .compare-controls{
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    background:var(--card-bg); border:1px solid var(--line); border-radius:14px;
    padding:14px 18px; margin-bottom:20px;
  }
  .ctrl-item{ display:flex; align-items:center; gap:8px; }
  .ctrl-item label{ font-size:12px; font-weight:600; color:var(--brown-mid); }
  .ctrl-item select{
    font-family:'Inter',sans-serif; font-size:13px; padding:6px 10px; border-radius:8px;
    border:1px solid var(--line); background:var(--cream); color:var(--brown);
  }
  .cmp-normalize{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--brown-mid); cursor:pointer; }
  .cmp-normalize input{ accent-color:var(--orange-deep); width:15px; height:15px; }
  .cmp-clear{
    margin-left:auto; font-size:12.5px; font-weight:700; color:var(--rust);
    background:var(--rust-bg); border:none; padding:7px 14px; border-radius:999px; cursor:pointer;
  }
  .cmp-clear:hover{ filter:brightness(.96); }

  .compare-body{
    display:grid; grid-template-columns:260px 1fr; gap:18px; align-items:start;
  }
  .compare-picker{
    background:var(--card-bg); border:1px solid var(--line); border-radius:14px;
    padding:10px; max-height:540px; overflow-y:auto;
  }
  .picker-kategori{
    font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:700;
    color:var(--orange-deep); margin:14px 8px 4px;
  }
  .picker-kategori:first-child{ margin-top:2px; }
  .picker-kelompok{
    font-size:11.5px; font-weight:700; color:var(--brown-mid); margin:8px 8px 4px;
  }
  .picker-item{
    display:flex; align-items:center; gap:9px;
    font-size:13px; color:var(--brown); padding:6px 8px; border-radius:8px;
    cursor:pointer;
  }
  .picker-item:hover{ background:var(--cream-deep); }
  .picker-item.picked{ background:var(--peach-soft); }
  .picker-item input{ accent-color:var(--orange-deep); width:15px; height:15px; flex-shrink:0; }
  .picker-item span{ flex:1; line-height:1.3; }
  .picker-item.picked::after{
    content:''; width:8px; height:8px; border-radius:50%;
    background:var(--dotcolor, var(--orange-deep)); flex-shrink:0;
  }

  .compare-chart-area{ min-height:360px; }
  .compare-empty{
    display:none;
    background:var(--card-bg); border:1px dashed var(--line); border-radius:14px;
    padding:70px 30px; text-align:center; color:var(--brown-soft); font-size:14px;
  }

  @media (max-width:760px){
    .compare-body{ grid-template-columns:1fr; }
    .compare-picker{ max-height:280px; }
  }

  /* Category section */
  .kategori-block{ margin-top:38px; }
  .kategori-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:6px;
  }
  .kategori-head h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    margin:0;
    color:var(--brown);
  }
  .kategori-count{
    font-size:12px;
    color:var(--brown-soft);
    font-weight:600;
  }
  .kelompok-block{ margin-top:22px; }
  .kelompok-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--peach-soft);
    color:var(--orange-deep);
    font-size:12px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:5px 12px;
    border-radius:999px;
    margin-bottom:14px;
  }
  .kelompok-chip::before{
    content:'';
    width:6px;height:6px;border-radius:50%;
    background:var(--orange-deep);
  }

  .card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:14px;
  }

  .card{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 18px 14px;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .card:hover{
    transform:translateY(-3px);
    border-color:var(--orange);
    box-shadow:0 4px 8px rgba(74,51,36,.08), 0 14px 30px rgba(74,51,36,.13);
  }
  .card-label{
    font-size:12.5px;
    font-weight:600;
    color:var(--brown-mid);
    line-height:1.35;
    min-height:32px;
  }
  .card-value-row{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:8px;
  }
  .card-value{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:28px;
    color:var(--brown);
    letter-spacing:-.01em;
  }
  .card-period{
    font-size:11px;
    color:var(--brown-soft);
    font-weight:600;
    margin-bottom:5px;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:12px;
    font-weight:700;
    padding:3px 9px;
    border-radius:999px;
    width:fit-content;
  }
  .badge.up{ background:var(--rust-bg); color:var(--rust); }
  .badge.down{ background:var(--green-bg); color:var(--green); }
  .badge.flat{ background:var(--cream-deep); color:var(--brown-soft); }
  .badge.na{ background:var(--cream-deep); color:var(--brown-soft); }
  .spark-wrap{ height:34px; }
  .spark-wrap svg{ display:block; overflow:visible; }

  /* Loading / empty */
  .state-msg{
    max-width:1180px;
    margin:60px auto;
    padding:0 28px;
    color:var(--brown-mid);
    font-size:14px;
  }
  .spinner{
    width:22px;height:22px;
    border:2.5px solid var(--peach);
    border-top-color:var(--orange-deep);
    border-radius:50%;
    animation:spin .8s linear infinite;
    display:inline-block;
    vertical-align:middle;
    margin-right:10px;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  /* Detail overlay */
  .overlay{
    position:fixed; inset:0;
    background:rgba(41,28,18,.42);
    backdrop-filter:blur(2px);
    display:none;
    align-items:stretch;
    justify-content:flex-end;
    z-index:100;
  }
  .overlay.show{ display:flex; }
  .drawer{
    background:var(--cream);
    width:min(640px,100%);
    height:100%;
    overflow-y:auto;
    box-shadow:-8px 0 30px rgba(41,28,18,.2);
    padding:30px 30px 60px;
    transform:translateX(20px);
    animation:slidein .25s ease forwards;
  }
  @keyframes slidein{ to{ transform:translateX(0); } }
  .drawer-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom:6px;
  }
  .drawer-close{
    background:var(--card-bg);
    border:1px solid var(--line);
    width:34px;height:34px;
    border-radius:50%;
    cursor:pointer;
    font-size:16px;
    color:var(--brown-mid);
    flex-shrink:0;
  }
  .drawer-close:hover{ border-color:var(--orange); color:var(--orange-deep); }
  .drawer-eyebrow{
    font-size:11px; text-transform:uppercase; letter-spacing:.1em;
    color:var(--orange-deep); font-weight:700; margin-bottom:6px;
  }
  .drawer h3{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:24px;
    margin:0 0 18px;
    line-height:1.25;
    max-width:88%;
  }
  .drawer-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:22px;
  }
  .stat-box{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
  }
  .stat-box .stat-label{ font-size:11px; color:var(--brown-soft); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .stat-box .stat-value{ font-family:'Fraunces',serif; font-size:19px; font-weight:600; margin-top:4px; color:var(--brown); }

  .filter-row{
    display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap;
  }
  .filter-row label{ font-size:12px; font-weight:600; color:var(--brown-mid); }
  .filter-row select{
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:7px 10px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card-bg);
    color:var(--brown);
  }
  .quickbtns{ display:flex; gap:6px; margin-left:auto; }
  .quickbtns button{
    font-size:12px; font-weight:600;
    border:1px solid var(--line);
    background:var(--card-bg);
    color:var(--brown-mid);
    padding:6px 11px;
    border-radius:999px;
    cursor:pointer;
  }
  .quickbtns button.active{ background:var(--orange-deep); color:#fff; border-color:var(--orange-deep); }

  .chart-box{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px 14px 8px;
    height:280px;
  }
  .chart-box-wrap{ position:relative; }
  .dl-btn{
    position:absolute;
    top:10px; right:10px;
    z-index:2;
    font-size:11.5px;
    font-weight:700;
    color:var(--brown-mid);
    background:var(--cream);
    border:1px solid var(--line);
    padding:5px 11px;
    border-radius:999px;
    cursor:pointer;
  }
  .dl-btn:hover{ border-color:var(--orange); color:var(--orange-deep); }
  .table-head-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:22px;
    margin-bottom:8px;
  }
  .table-head-label{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--brown-soft);
  }
  .table-head-row .dl-btn{ position:static; }
  .table-scroll{
    max-height:280px;
    overflow-y:auto;
    border:1px solid var(--line);
    border-radius:12px;
  }
  .drawer-desc{
    background:var(--peach-soft);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 18px;
    margin-top:16px;
  }
  .drawer-desc-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    font-weight:700;
    color:var(--orange-deep);
    margin-bottom:5px;
  }
  .drawer-desc p{
    margin:0;
    font-size:13.5px;
    line-height:1.55;
    color:var(--brown-mid);
  }
  .drawer-narrative{
    margin-top:16px;
    font-size:13.5px;
    line-height:1.65;
    color:var(--brown);
    padding:2px 2px;
  }
  .drawer-narrative b{ color:var(--brown); font-weight:700; }
  .drawer-narrative .trend-up{ color:var(--rust); font-weight:700; }
  .drawer-narrative .trend-down{ color:var(--green); font-weight:700; }
  .drawer-narrative .trend-flat{ color:var(--brown-soft); font-weight:700; }
  .drawer-table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  .drawer-table thead th{
    position:sticky;
    top:0;
    background:var(--card-bg);
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--brown-soft);
    padding:9px 12px;
    border-bottom:1px solid var(--line);
  }
  .drawer-table td{
    padding:8px 12px;
    border-bottom:1px solid var(--line);
    color:var(--brown-mid);
  }
  .drawer-table tbody tr:last-child td{ border-bottom:none; }
  .drawer-table tbody tr:first-child td{ font-weight:700; color:var(--brown); }

  @media (max-width:640px){
    header{ padding:30px 18px 12px; }
    main{ padding:0 18px; }
    .drawer{ padding:22px 18px 50px; }
    .drawer-stats{ grid-template-columns:1fr 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">BPS Kabupaten Klungkung</div>
  <h1>Dashboard Indikator</h1>
  <p class="subtitle">Ringkasan data terkini per subkelompok indikator, dikelompokkan menurut periode, kategori, dan kelompok. Klik kartu untuk melihat tren lengkapnya.</p>
  <div class="tabs" id="tabs"></div>
</header>

<main id="main">
  <div class="state-msg" id="stateMsg"><span class="spinner"></span>Memuat data dari Google Sheets…</div>
</main>

<div class="overlay" id="overlay">
  <div class="drawer" id="drawer"></div>
</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0IHQMxQuwLfTdSgKoXUqA8guCT788uBZ4cwlE72X6co3LMRcGU6tk1PSMbi7nVeEB2g-kTVXYBPyv/pub?output=csv";

let STORE = {};        // STORE[periode][kategori][kelompok][subkelompok] = [entries]
let DEFINISI = {};     // DEFINISI[subkelompok] = teks definisi (dari kolom I & J)
let activePeriode = null;
let chartInstance = null;
let currentSeriesKey = null;

let compareMode = false;
let comparePeriode = null;
let compareIndex = {};
let compareSelected = new Set();
let compareFrom = null;
let compareTo = null;
let normalizeCompare = false;
let compareChart = null;
const COMPARE_COLORS = ['#C97A3D','#4E7D5A','#A63A50','#3E6E8E','#8C6BAF','#B98B27','#4A3324','#5C8C8C'];

function toNumber(v){
  if(v===undefined||v===null) return NaN;
  const s = v.toString().trim().replace(/\./g,'').replace(/,/g,'.');
  // handle plain numbers like "12.5" already (Papa keeps original string) — try both
  const direct = parseFloat(v.toString().trim().replace(/,/g,''));
  if(!isNaN(direct)) return direct;
  return parseFloat(s);
}

function fmtNum(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return n.toLocaleString('id-ID', {maximumFractionDigits:2});
}

function triwulanToNum(t){
  if(!t) return 0;
  const s = t.toString().trim().toUpperCase();
  const map = {'I':1,'II':2,'III':3,'IV':4,'1':1,'2':2,'3':3,'4':4};
  return map[s] || 0;
}

function sortKey(e){ return e.tahun*10 + triwulanToNum(e.triwulan); }

function periodLabel(e){
  return e.triwulan ? `${e.tahun} TW ${e.triwulan}` : `${e.tahun}`;
}

function loadData(){
  Papa.parse(CSV_URL, {
    download:true,
    header:false,
    skipEmptyLines:true,
    complete: function(res){
      try{
        buildStore(res.data);
        renderTabs();
        if(activePeriode) renderContent(activePeriode);
      }catch(err){
        showError('Gagal memproses data: ' + err.message);
      }
    },
    error: function(err){
      showError('Gagal memuat CSV. Periksa koneksi atau akses sheet. (' + err + ')');
    }
  });
}

function showError(msg){
  document.getElementById('main').innerHTML =
    `<div class="state-msg">⚠ ${msg}<br><br><a href="${CSV_URL}" target="_blank" style="color:var(--orange-deep);font-weight:600;">Buka sumber data →</a></div>`;
}

// Column positions (0-indexed): A Periode, B Triwulan, C Tahun, D Kategori,
// E Kelompok, F Subkelompok, G Data, H (unused gap), I Subkelompok (definisi), J Definisi
function buildStore(rows){
  STORE = {};
  DEFINISI = {};
  rows.slice(1).forEach(row=>{ // skip header row
    const periode = (row[0]||'').toString().trim();
    const triwulan = (row[1]||'').toString().trim();
    const tahun = parseInt((row[2]||'').toString().trim());
    const kategori = (row[3]||'').toString().trim();
    const kelompok = (row[4]||'').toString().trim();
    const subkelompok = (row[5]||'').toString().trim();
    const data = toNumber(row[6]);

    const defSub = (row[8]||'').toString().trim();
    const defText = (row[9]||'').toString().trim();
    if(defSub && defText && !DEFINISI[defSub]) DEFINISI[defSub] = defText;

    if(!periode || !kategori || !kelompok || !subkelompok || isNaN(tahun) || isNaN(data)) return;

    if(!STORE[periode]) STORE[periode] = {};
    if(!STORE[periode][kategori]) STORE[periode][kategori] = {};
    if(!STORE[periode][kategori][kelompok]) STORE[periode][kategori][kelompok] = {};
    if(!STORE[periode][kategori][kelompok][subkelompok]) STORE[periode][kategori][kelompok][subkelompok] = [];

    STORE[periode][kategori][kelompok][subkelompok].push({tahun, triwulan, data});
  });

  // sort each series chronologically
  Object.values(STORE).forEach(katObj=>{
    Object.values(katObj).forEach(kelObj=>{
      Object.values(kelObj).forEach(subObj=>{
        Object.keys(subObj).forEach(sk=>{
          subObj[sk].sort((a,b)=>sortKey(a)-sortKey(b));
        });
      });
    });
  });

  const periodeList = Object.keys(STORE);
  const priority = ['Tahunan','Triwulanan','Triwulan'];
  periodeList.sort((a,b)=>{
    const ia = priority.indexOf(a), ib = priority.indexOf(b);
    if(ia===-1 && ib===-1) return a.localeCompare(b);
    if(ia===-1) return 1;
    if(ib===-1) return -1;
    return ia-ib;
  });
  if(!activePeriode || !STORE[activePeriode]) activePeriode = periodeList[0];
  STORE.__order = periodeList;
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  STORE.__order.forEach(p=>{
    const btn = document.createElement('button');
    btn.className = 'tab' + (!compareMode && p===activePeriode?' active':'');
    btn.textContent = p;
    btn.onclick = ()=>{ compareMode = false; activePeriode = p; renderTabs(); renderContent(p); };
    tabsEl.appendChild(btn);
  });

  const sep = document.createElement('span');
  sep.className = 'tab-sep';
  tabsEl.appendChild(sep);

  const cmpBtn = document.createElement('button');
  cmpBtn.className = 'tab' + (compareMode ? ' active' : '');
  cmpBtn.textContent = '⇄ Bandingkan';
  cmpBtn.onclick = ()=>{ compareMode = true; renderTabs(); renderCompareView(); };
  tabsEl.appendChild(cmpBtn);
}

function makeSparkline(entries){
  const vals = entries.slice(-8).map(e=>e.data);
  if(vals.length < 2){
    return `<div class="spark-wrap"></div>`;
  }
  const w = 220, h = 34, pad=3;
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max-min) || 1;
  const step = (w-pad*2) / (vals.length-1);
  const pts = vals.map((v,i)=>{
    const x = pad + i*step;
    const y = h - pad - ((v-min)/range)*(h-pad*2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const last = pts[pts.length-1].split(',');
  return `<div class="spark-wrap"><svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts.join(' ')}" fill="none" stroke="var(--orange)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="var(--orange-deep)"/>
  </svg></div>`;
}

function changeBadge(entries){
  if(entries.length < 2) return `<span class="badge na">Data awal</span>`;
  const latest = entries[entries.length-1].data;
  const prev = entries[entries.length-2].data;
  const diff = latest - prev;
  if(Math.abs(diff) < 0.0005) return `<span class="badge flat">▬ ${fmtNum(prev)}</span>`;
  const up = diff > 0;
  return `<span class="badge ${up?'up':'down'}">${up?'▲':'▼'} ${fmtNum(prev)}</span>`;
}

function renderContent(periode){
  const main = document.getElementById('main');
  const katObj = STORE[periode];
  if(!katObj){ main.innerHTML = '<div class="state-msg">Tidak ada data.</div>'; return; }

  let html = '';
  Object.keys(katObj).forEach(kategori=>{
    const kelObj = katObj[kategori];
    const subCount = Object.values(kelObj).reduce((n,k)=>n+Object.keys(k).length,0);
    html += `<section class="kategori-block">
      <div class="kategori-head"><h2>${escapeHtml(kategori)}</h2><span class="kategori-count">${subCount} indikator</span></div>`;

    Object.keys(kelObj).forEach(kelompok=>{
      const subObj = kelObj[kelompok];
      html += `<div class="kelompok-block">
        <div class="kelompok-chip">${escapeHtml(kelompok)}</div>
        <div class="card-grid">`;

      Object.keys(subObj).forEach(sub=>{
        const entries = subObj[sub];
        const latest = entries[entries.length-1];
        const key = encodeURIComponent(JSON.stringify([periode,kategori,kelompok,sub]));
        html += `<div class="card" data-key='${key}'>
            <div class="card-label">${escapeHtml(sub)}</div>
            <div>
              <div class="card-period">${periodLabel(latest)}</div>
              <div class="card-value-row">
                <div class="card-value">${fmtNum(latest.data)}</div>
                ${changeBadge(entries)}
              </div>
            </div>
            ${makeSparkline(entries)}
          </div>`;
      });

      html += `</div></div>`;
    });

    html += `</section>`;
  });

  main.innerHTML = html;

  document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=>{
      const [periode,kategori,kelompok,sub] = JSON.parse(decodeURIComponent(card.dataset.key));
      openDetail(periode,kategori,kelompok,sub);
    });
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- Detail drawer ---------- */

function openDetail(periode,kategori,kelompok,sub){
  currentSeriesKey = {periode,kategori,kelompok,sub};
  const entries = STORE[periode][kategori][kelompok][sub];
  const years = [...new Set(entries.map(e=>e.tahun))].sort((a,b)=>a-b);

  const drawer = document.getElementById('drawer');
  drawer.innerHTML = `
    <div class="drawer-top">
      <div>
        <div class="drawer-eyebrow">${escapeHtml(kategori)} · ${escapeHtml(kelompok)}</div>
        <h3>${escapeHtml(sub)}</h3>
      </div>
      <button class="drawer-close" id="closeDrawer">✕</button>
    </div>

    <div class="drawer-stats" id="statBoxes"></div>

    <div class="filter-row">
      <label>Dari</label>
      <select id="fromYear"></select>
      <label>Sampai</label>
      <select id="toYear"></select>
      <div class="quickbtns" id="quickBtns">
        <button data-range="all">Semua</button>
        <button data-range="5">5 Terakhir</button>
        <button data-range="3">3 Terakhir</button>
      </div>
    </div>

    <div class="chart-box-wrap">
      <button class="dl-btn" id="dlChart" title="Unduh grafik sebagai JPG">⬇ JPG</button>
      <div class="chart-box"><canvas id="detailChart"></canvas></div>
    </div>

    ${DEFINISI[sub] ? `
    <div class="drawer-desc">
      <div class="drawer-desc-label">Definisi</div>
      <p>${escapeHtml(DEFINISI[sub])}</p>
    </div>` : ''}

    <div class="drawer-narrative" id="drawerNarrative"></div>

    <div class="table-head-row">
      <span class="table-head-label">Riwayat Data</span>
      <button class="dl-btn" id="dlExcel" title="Unduh tabel sebagai Excel">⬇ Excel</button>
    </div>
    <div class="table-scroll">
      <table class="drawer-table" id="detailTable"></table>
    </div>
  `;

  document.getElementById('dlChart').onclick = downloadChartJPG;
  document.getElementById('dlExcel').onclick = downloadTableExcel;

  const fromSel = drawer.querySelector('#fromYear');
  const toSel = drawer.querySelector('#toYear');
  years.forEach(y=>{
    fromSel.innerHTML += `<option value="${y}">${y}</option>`;
    toSel.innerHTML += `<option value="${y}">${y}</option>`;
  });
  fromSel.value = years[0];
  toSel.value = years[years.length-1];

  fromSel.onchange = toSel.onchange = ()=>refreshDetail(entries, parseInt(fromSel.value), parseInt(toSel.value));

  drawer.querySelectorAll('#quickBtns button').forEach(btn=>{
    btn.onclick = ()=>{
      drawer.querySelectorAll('#quickBtns button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const r = btn.dataset.range;
      if(r==='all'){ fromSel.value = years[0]; }
      else{ const n = parseInt(r); fromSel.value = years[Math.max(0, years.length-n)]; }
      toSel.value = years[years.length-1];
      refreshDetail(entries, parseInt(fromSel.value), parseInt(toSel.value));
    };
  });
  drawer.querySelector('[data-range="all"]').classList.add('active');

  document.getElementById('closeDrawer').onclick = closeDetail;
  document.getElementById('overlay').classList.add('show');

  refreshDetail(entries, years[0], years[years.length-1]);
}

function closeDetail(){
  document.getElementById('overlay').classList.remove('show');
}

function downloadChartJPG(){
  if(!chartInstance){ alert('Grafik belum siap.'); return; }
  const link = document.createElement('a');
  link.href = chartInstance.toBase64Image('image/jpeg', 1.0);
  link.download = `${(currentSeriesKey.sub||'grafik').replace(/[^a-z0-9]+/gi,'_')}.jpg`;
  link.click();
}

function downloadTableExcel(){
  if(typeof XLSX === 'undefined'){ alert('Gagal memuat library Excel. Coba refresh halaman.'); return; }
  if(!currentSeriesKey) return;
  const {periode,kategori,kelompok,sub} = currentSeriesKey;
  const entries = STORE[periode][kategori][kelompok][sub];
  const fromSel = document.getElementById('fromYear');
  const toSel = document.getElementById('toYear');
  const fromYear = parseInt(fromSel.value), toYear = parseInt(toSel.value);
  const filtered = entries.filter(e=>e.tahun>=fromYear && e.tahun<=toYear);

  const data = [['Periode','Nilai'], ...filtered.map(e=>[periodLabel(e), e.data])];
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = [{wch:16},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Data');
  XLSX.writeFile(wb, `${sub.replace(/[^a-z0-9]+/gi,'_')}.xlsx`);
}

/* ---------- Compare view ---------- */

function buildCompareIndex(periode){
  const idx = {};
  const katObj = STORE[periode];
  Object.keys(katObj).forEach(kategori=>{
    Object.keys(katObj[kategori]).forEach(kelompok=>{
      Object.keys(katObj[kategori][kelompok]).forEach(sub=>{
        const key = `${kategori}|||${kelompok}|||${sub}`;
        idx[key] = {kategori, kelompok, sub, entries: katObj[kategori][kelompok][sub]};
      });
    });
  });
  return idx;
}

function renderCompareView(){
  if(!comparePeriode || !STORE[comparePeriode]) comparePeriode = STORE.__order[0];
  compareIndex = buildCompareIndex(comparePeriode);

  let allEntries = [];
  Object.values(compareIndex).forEach(v=>{ allEntries = allEntries.concat(v.entries); });
  const years = [...new Set(allEntries.map(e=>e.tahun))].sort((a,b)=>a-b);
  if(!compareFrom || !years.includes(compareFrom)) compareFrom = years[0];
  if(!compareTo || !years.includes(compareTo)) compareTo = years[years.length-1];

  const main = document.getElementById('main');
  main.innerHTML = `
    <section class="compare-wrap">
      <div class="compare-intro">
        <h2>Bandingkan Indikator</h2>
        <p>Pilih beberapa indikator dari periode yang sama untuk melihat trennya berdampingan dalam satu grafik.</p>
      </div>
      <div class="compare-controls">
        <div class="ctrl-item"><label>Periode</label><select id="cmpPeriode"></select></div>
        <div class="ctrl-item"><label>Dari</label><select id="cmpFrom"></select></div>
        <div class="ctrl-item"><label>Sampai</label><select id="cmpTo"></select></div>
        <label class="cmp-normalize"><input type="checkbox" id="cmpNormalize"> Indeks (awal = 100)</label>
        <button class="cmp-clear" id="cmpClear">Hapus pilihan</button>
      </div>
      <div class="compare-body">
        <div class="compare-picker" id="cmpPicker"></div>
        <div class="compare-chart-area">
          <div class="chart-box" id="cmpChartBox" style="height:380px;">
            <canvas id="compareChart"></canvas>
          </div>
          <div class="compare-empty" id="cmpEmpty">Pilih minimal satu indikator di samping untuk mulai membandingkan.</div>
        </div>
      </div>
    </section>
  `;

  const periodeSel = document.getElementById('cmpPeriode');
  STORE.__order.forEach(p=>{
    periodeSel.innerHTML += `<option value="${p}" ${p===comparePeriode?'selected':''}>${p}</option>`;
  });
  periodeSel.onchange = ()=>{
    comparePeriode = periodeSel.value;
    compareSelected.clear();
    compareFrom = null; compareTo = null;
    renderCompareView();
  };

  const fromSel = document.getElementById('cmpFrom');
  const toSel = document.getElementById('cmpTo');
  years.forEach(y=>{
    fromSel.innerHTML += `<option value="${y}" ${y===compareFrom?'selected':''}>${y}</option>`;
    toSel.innerHTML += `<option value="${y}" ${y===compareTo?'selected':''}>${y}</option>`;
  });
  fromSel.onchange = ()=>{ compareFrom = parseInt(fromSel.value); renderCompareChart(); };
  toSel.onchange = ()=>{ compareTo = parseInt(toSel.value); renderCompareChart(); };

  document.getElementById('cmpNormalize').checked = normalizeCompare;
  document.getElementById('cmpNormalize').onchange = (e)=>{ normalizeCompare = e.target.checked; renderCompareChart(); };
  document.getElementById('cmpClear').onclick = ()=>{ compareSelected.clear(); renderComparePicker(); renderCompareChart(); };

  renderComparePicker();
  renderCompareChart();
}

function renderComparePicker(){
  const picker = document.getElementById('cmpPicker');
  const katObj = STORE[comparePeriode];
  let html = '';
  Object.keys(katObj).forEach(kategori=>{
    html += `<div class="picker-kategori">${escapeHtml(kategori)}</div>`;
    Object.keys(katObj[kategori]).forEach(kelompok=>{
      html += `<div class="picker-kelompok">${escapeHtml(kelompok)}</div>`;
      Object.keys(katObj[kategori][kelompok]).forEach(sub=>{
        const key = `${kategori}|||${kelompok}|||${sub}`;
        const checked = compareSelected.has(key) ? 'checked' : '';
        html += `<label class="picker-item">
          <input type="checkbox" data-key="${encodeURIComponent(key)}" ${checked}>
          <span>${escapeHtml(sub)}</span>
        </label>`;
      });
    });
  });
  picker.innerHTML = html;

  picker.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.onchange = ()=>{
      const key = decodeURIComponent(cb.dataset.key);
      if(cb.checked){
        if(compareSelected.size >= 8){
          cb.checked = false;
          alert('Maksimal 8 indikator sekaligus supaya grafik tetap mudah dibaca.');
          return;
        }
        compareSelected.add(key);
      }else{
        compareSelected.delete(key);
      }
      updatePickerColors();
      renderCompareChart();
    };
  });
  updatePickerColors();
}

function updatePickerColors(){
  const keys = [...compareSelected];
  document.querySelectorAll('#cmpPicker .picker-item').forEach(item=>{
    const cb = item.querySelector('input');
    const key = decodeURIComponent(cb.dataset.key);
    const idx = keys.indexOf(key);
    if(idx >= 0){
      item.classList.add('picked');
      item.style.setProperty('--dotcolor', COMPARE_COLORS[idx % COMPARE_COLORS.length]);
    }else{
      item.classList.remove('picked');
      item.style.removeProperty('--dotcolor');
    }
  });
}

function renderCompareChart(){
  const box = document.getElementById('cmpChartBox');
  const empty = document.getElementById('cmpEmpty');
  const keys = [...compareSelected];

  if(keys.length === 0){
    box.style.display = 'none';
    empty.style.display = 'block';
    if(compareChart){ compareChart.destroy(); compareChart = null; }
    return;
  }
  box.style.display = 'block';
  empty.style.display = 'none';

  if(typeof Chart === 'undefined'){
    box.innerHTML = '<div style="padding:20px;font-size:13px;color:var(--brown-mid);">Grafik gagal dimuat (library Chart.js tidak tersedia). Coba refresh halaman.</div>';
    return;
  }
  if(!document.getElementById('compareChart')){
    box.innerHTML = '<canvas id="compareChart"></canvas>';
  }

  const uniqueLabelsMap = new Map();
  keys.forEach(k=>{
    compareIndex[k].entries.forEach(e=>{
      if(e.tahun >= compareFrom && e.tahun <= compareTo) uniqueLabelsMap.set(sortKey(e), periodLabel(e));
    });
  });
  const sortedKeys = [...uniqueLabelsMap.keys()].sort((a,b)=>a-b);
  const labels = sortedKeys.map(sk=>uniqueLabelsMap.get(sk));

  const datasets = keys.map((k,i)=>{
    const info = compareIndex[k];
    const bySort = {};
    info.entries.forEach(e=>{ bySort[sortKey(e)] = e.data; });
    let values = sortedKeys.map(sk=> bySort.hasOwnProperty(sk) ? bySort[sk] : null);
    if(normalizeCompare){
      const base = values.find(v=>v!==null && v!==undefined && v!==0);
      if(base){
        values = values.map(v=>(v===null||v===undefined) ? null : (v/base*100));
      }
    }
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    return {
      label: info.sub,
      data: values,
      borderColor: color,
      backgroundColor: color,
      pointRadius: 3,
      pointHoverRadius: 5,
      borderWidth: 2.2,
      spanGaps: true,
      tension: .25,
      fill: false
    };
  });

  const ctx = document.getElementById('compareChart').getContext('2d');
  if(compareChart) compareChart.destroy();
  compareChart = new Chart(ctx, {
    type:'line',
    data:{ labels, datasets },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins:{
        legend:{
          position:'bottom',
          labels:{ color:'#4A3324', font:{family:'Inter', size:11.5}, boxWidth:10, usePointStyle:true }
        },
        tooltip:{
          callbacks:{
            label: (c)=> `${c.dataset.label}: ${normalizeCompare ? c.parsed.y.toFixed(1) : fmtNum(c.parsed.y)}${normalizeCompare?' idx':''}`
          }
        }
      },
      scales:{
        x:{ grid:{display:false}, ticks:{ color:'#7C5B42', font:{family:'Inter', size:11} } },
        y:{ grid:{color:'#EFE3CC'}, ticks:{ color:'#7C5B42', font:{family:'Inter', size:11} } }
      }
    }
  });
}

document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'overlay') closeDetail();
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') closeDetail();
});

function refreshDetail(entries, fromYear, toYear){
  const filtered = entries.filter(e=>e.tahun>=fromYear && e.tahun<=toYear);
  const labels = filtered.map(periodLabel);
  const values = filtered.map(e=>e.data);

  // stats
  const latest = filtered[filtered.length-1];
  const prev = filtered[filtered.length-2];
  let changeStr = '—';
  if(latest && prev && prev.data !== 0){
    const pct = ((latest.data-prev.data)/prev.data)*100;
    changeStr = (pct>0?'▲ +':'▼ ') + pct.toFixed(1) + '%';
  }
  const max = filtered.length ? Math.max(...values) : NaN;
  const min = filtered.length ? Math.min(...values) : NaN;

  document.getElementById('statBoxes').innerHTML = `
    <div class="stat-box"><div class="stat-label">Nilai Terkini</div><div class="stat-value">${fmtNum(latest?latest.data:NaN)}</div></div>
    <div class="stat-box"><div class="stat-label">Perubahan</div><div class="stat-value">${changeStr}</div></div>
    <div class="stat-box"><div class="stat-label">Tertinggi / Terendah</div><div class="stat-value" style="font-size:15px;">${fmtNum(max)} / ${fmtNum(min)}</div></div>
  `;

  // narrative sentence
  const narrEl = document.getElementById('drawerNarrative');
  if(narrEl && currentSeriesKey){
    const first = filtered[0];
    const last = filtered[filtered.length-1];
    const indikator = currentSeriesKey.sub;
    if(first && last && first !== last){
      let trendWord = 'tidak berubah dibandingkan';
      let trendClass = 'trend-flat';
      if(last.data > first.data){ trendWord = 'meningkat dibandingkan'; trendClass = 'trend-up'; }
      else if(last.data < first.data){ trendWord = 'menurun dibandingkan'; trendClass = 'trend-down'; }
      narrEl.innerHTML = `Pada periode <b>${periodLabel(last)}</b>, indikator <b>${escapeHtml(indikator)}</b> mencapai <b>${fmtNum(last.data)}</b>. Nilai ini <span class="${trendClass}">${trendWord}</span> periode <b>${periodLabel(first)}</b> yang mencapai <b>${fmtNum(first.data)}</b>.`;
    }else if(last){
      narrEl.innerHTML = `Pada periode <b>${periodLabel(last)}</b>, indikator <b>${escapeHtml(indikator)}</b> mencapai <b>${fmtNum(last.data)}</b>.`;
    }else{
      narrEl.innerHTML = '';
    }
  }

  // table (reversed, latest first)
  let rows = '';
  [...filtered].reverse().forEach(e=>{
    rows += `<tr><td>${periodLabel(e)}</td><td>${fmtNum(e.data)}</td></tr>`;
  });
  document.getElementById('detailTable').innerHTML =
    `<thead><tr><th>Periode</th><th>Nilai</th></tr></thead><tbody>${rows}</tbody>`;

  // chart
  const canvasEl = document.getElementById('detailChart');
  if(typeof Chart === 'undefined'){
    canvasEl.parentElement.innerHTML = '<div style="padding:20px;font-size:13px;color:var(--brown-mid);">Grafik gagal dimuat (library Chart.js tidak tersedia). Coba refresh halaman.</div>';
    return;
  }
  const ctx = canvasEl.getContext('2d');
  if(chartInstance) chartInstance.destroy();
  const gradient = ctx.createLinearGradient(0,0,0,260);
  gradient.addColorStop(0, 'rgba(201,122,61,0.28)');
  gradient.addColorStop(1, 'rgba(201,122,61,0.02)');

  chartInstance = new Chart(ctx, {
    type:'line',
    data:{
      labels,
      datasets:[{
        data: values,
        borderColor:'#C97A3D',
        backgroundColor: gradient,
        pointBackgroundColor:'#A85F28',
        pointRadius:4,
        pointHoverRadius:6,
        borderWidth:2.5,
        fill:true,
        tension:.25
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{
        x:{ grid:{display:false}, ticks:{ color:'#7C5B42', font:{family:'Inter', size:11} } },
        y:{ grid:{color:'#EFE3CC'}, ticks:{ color:'#7C5B42', font:{family:'Inter', size:11} } }
      }
    }
  });
}
