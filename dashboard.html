<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Indikator — BPS Klungkung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js';document.head.appendChild(s);"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';document.head.appendChild(s);"></script>
<style>
  :root{
    --cream:#FFFDF1;
    --cream-deep:#FFF3DC;
    --peach:#FFCE99;
    --peach-soft:#FFE7C9;
    --orange:#FF9644;
    --orange-deep:#D97730;
    --brown:#562F00;
    --brown-deep:#3a1f00;
    --brown-mid:#7a5230;
    --brown-soft:#a08a70;
    --green:#6F8F52;
    --green-bg:#E9EEDD;
    --rust:#C1440E;
    --rust-bg:#FCE1CB;
    --white:#FFFFFF;
    --card-bg:#FFFFFF;
    --page-bg:#FFFFFF;
    --line:#FFE7C9;
    --shadow: 0 6px 20px rgba(86,47,0,0.10);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    color:var(--brown);
    background:var(--page-bg);
    min-height:100vh;
    padding-bottom:50px;
  }
  ::selection{background:var(--peach);}

  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    color:var(--brown-deep);
    margin:0;
  }

  /* ===== Hero ===== */
  .hero{
    background: linear-gradient(135deg, var(--brown) 0%, #7a4310 55%, var(--orange) 130%);
    padding:30px 24px 40px;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute; right:-60px; top:-60px;
    width:220px; height:220px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,150,68,0.35), transparent 70%);
  }
  .hero-inner{
    max-width:1280px; margin:0 auto; position:relative; z-index:1;
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .hero-eyebrow{
    color:var(--peach); font-weight:600; letter-spacing:.13em; text-transform:uppercase;
    font-size:11px; margin-bottom:8px; font-family:'Inter',sans-serif;
  }
  .hero h1{ color:var(--cream); font-size:clamp(22px,3vw,32px); font-weight:600; line-height:1.15; }
  .hero p{ color:var(--peach-soft); margin-top:6px; font-size:12.5px; max-width:480px; line-height:1.45; }

  .hero-stats{ display:flex; gap:10px; flex-wrap:wrap; }
  .stat-pill{
    background:rgba(255,253,241,0.12);
    border:1px solid rgba(255,206,153,0.35);
    border-radius:12px;
    padding:9px 15px;
    min-width:88px;
    backdrop-filter:blur(4px);
  }
  .stat-pill .num{ color:var(--cream); font-family:'Fraunces',serif; font-size:20px; font-weight:600; line-height:1; }
  .stat-pill .lbl{ color:var(--peach-soft); font-size:10px; margin-top:3px; letter-spacing:.05em; }

  /* ===== Layout ===== */
  .page-wrap{ max-width:1280px; margin:0 auto; padding:0 24px; }

  /* Tabbar */
  .tabbar{
    background:var(--white);
    border:1px solid var(--peach-soft);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:9px 10px;
    margin-top:-22px;
    position:relative; z-index:5;
    display:flex; gap:6px; flex-wrap:wrap; align-items:center;
  }
  .tab{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12.5px;
    padding:8px 14px;
    background:none;
    border:none;
    border-radius:10px;
    cursor:pointer;
    color:var(--brown);
    transition:background .15s, color .15s;
  }
  .tab.active{ background:var(--orange); color:#fff; }
  .tab:hover:not(.active){ background:var(--peach-soft); }
  .tab-sep{
    width:1px;
    align-self:stretch;
    background:var(--peach-soft);
    margin:4px 4px;
  }

  main{ padding-top:22px; }

  /* ===== Filter panel (left sidebar) ===== */
  .content-row{ display:flex; align-items:flex-start; gap:20px; }
  .content-row main{ flex:1; min-width:0; }
  .kel-filter-panel{
    width:220px;
    flex-shrink:0;
    background:var(--white);
    border:1px solid var(--peach-soft);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:16px;
    margin-top:22px;
    position:sticky;
    top:16px;
    max-height:calc(100vh - 32px);
    overflow-y:auto;
  }
  .kel-filter-head{
    display:flex; align-items:center; justify-content:space-between;
    gap:8px; margin-bottom:12px;
  }
  .kel-filter-head span{
    font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    font-weight:700; color:var(--brown-mid);
  }
  .kel-filter-reset{
    font-size:10.5px; font-weight:600; color:var(--orange-deep);
    background:none; border:none; cursor:pointer; padding:2px 0;
    text-decoration:underline;
  }
  .kel-filter-reset:hover{ color:var(--orange); }
  .kel-filter-kat{ margin-bottom:14px; }
  .kel-filter-kat:last-child{ margin-bottom:0; }
  .kel-filter-kat-head{
    display:flex; align-items:center; justify-content:space-between;
    font-size:11.5px; font-weight:700; color:var(--brown-deep);
    margin-bottom:6px; padding-bottom:5px;
    border-bottom:1px solid var(--cream-deep);
  }
  .kel-filter-kat-toggle{
    font-size:10px; font-weight:600; color:var(--brown-soft);
    background:none; border:none; cursor:pointer; padding:0;
  }
  .kel-filter-kat-toggle:hover{ color:var(--orange-deep); }
  .kel-filter-item{
    display:flex; align-items:center; gap:7px;
    font-size:12px; color:var(--brown-mid);
    padding:4px 2px; cursor:pointer; border-radius:6px;
  }
  .kel-filter-item:hover{ background:var(--cream); color:var(--brown); }
  .kel-filter-item input{ accent-color:var(--orange); cursor:pointer; flex-shrink:0; }
  @media (max-width:900px){
    .content-row{ flex-direction:column; }
    .kel-filter-panel{
      width:100%;
      position:static;
      max-height:none;
      margin-top:14px;
    }
    .kel-filter-kat{ margin-bottom:10px; }
  }

  /* ===== Section headers ===== */
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin:22px 0 10px; flex-wrap:wrap; gap:6px;}
  .section-head h2{ font-size:17px; font-weight:600; }
  .section-head .tag{ font-size:11px; color:var(--brown); background:var(--peach-soft); padding:4px 10px; border-radius:100px; font-weight:600; letter-spacing:.04em;}

  .footer-note{ text-align:center; color:var(--brown-soft); font-size:11.5px; margin-top:30px; }

  /* Compare view */
  .compare-wrap{ margin-top:20px; }
  .compare-intro h2{
    font-family:'Fraunces',serif; font-weight:600; font-size:19px;
    margin:0 0 3px; color:var(--brown);
  }
  .compare-intro p{ margin:0 0 14px; color:var(--brown-mid); font-size:12.5px; max-width:560px; line-height:1.45; }

  .compare-controls{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--card-bg); border:1px solid var(--line); border-radius:12px;
    padding:10px 14px; margin-bottom:14px;
  }
  .ctrl-item{ display:flex; align-items:center; gap:7px; }
  .ctrl-item label{ font-size:11.5px; font-weight:600; color:var(--brown-mid); }
  .ctrl-item select{
    font-family:'Inter',sans-serif; font-size:12.5px; padding:5px 9px; border-radius:7px;
    border:1px solid var(--line); background:var(--cream); color:var(--brown);
  }
  .cmp-normalize{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--brown-mid); cursor:pointer; }
  .cmp-normalize input{ accent-color:var(--orange-deep); width:14px; height:14px; }
  .cmp-clear{
    margin-left:auto; font-size:12px; font-weight:700; color:var(--rust);
    background:var(--rust-bg); border:none; padding:6px 12px; border-radius:999px; cursor:pointer;
  }
  .cmp-clear:hover{ filter:brightness(.96); }

  .compare-body{
    display:grid; grid-template-columns:230px 1fr; gap:14px; align-items:start;
  }
  .compare-picker{
    background:var(--card-bg); border:1px solid var(--line); border-radius:12px;
    padding:8px; max-height:480px; overflow-y:auto;
  }
  .picker-kategori{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:700;
    color:var(--orange-deep); margin:11px 7px 3px;
  }
  .picker-kategori:first-child{ margin-top:1px; }
  .picker-kelompok{
    font-size:11px; font-weight:700; color:var(--brown-mid); margin:6px 7px 3px;
  }
  .picker-item{
    display:flex; align-items:center; gap:8px;
    font-size:12.5px; color:var(--brown); padding:5px 7px; border-radius:7px;
    cursor:pointer;
  }
  .picker-item:hover{ background:var(--cream-deep); }
  .picker-item.picked{ background:var(--peach-soft); }
  .picker-item input{ accent-color:var(--orange-deep); width:14px; height:14px; flex-shrink:0; }
  .picker-item span{ flex:1; line-height:1.25; }
  .picker-item.picked::after{
    content:''; width:7px; height:7px; border-radius:50%;
    background:var(--dotcolor, var(--orange-deep)); flex-shrink:0;
  }

  .compare-chart-area{ min-height:300px; display:flex; flex-direction:column; gap:12px; }
  .compare-empty{
    display:none;
    background:var(--card-bg); border:1px dashed var(--line); border-radius:12px;
    padding:50px 24px; text-align:center; color:var(--brown-soft); font-size:13px;
  }

  /* AI Insight & Definisi Grid */
  .cmp-info-grid{
    display:grid;
    grid-template-columns: 1fr;
    gap:12px;
  }
  .ai-insight-box{
    background: linear-gradient(135deg, var(--cream) 0%, var(--cream-deep) 100%);
    border:1px solid var(--peach);
    border-radius:12px;
    padding:18px;
  }
  .ai-insight-title{
    font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; font-weight:700;
    color:var(--orange-deep); margin-bottom:8px; display:flex; align-items:center; gap:6px;
  }
  .ai-insight-content{
    font-size:12.5px; line-height:1.6; color:var(--brown);
  }
  .ai-insight-content b{ color:var(--brown-deep); }
  .insight-section-title{
    font-weight:700; color:var(--brown-deep); margin-top:10px; margin-bottom:4px; display:block;
  }

  .compare-defs-box{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
  }
  .compare-defs-title{
    font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700;
    color:var(--orange-deep); margin-bottom:8px;
  }
  .def-item{
    font-size:12px; line-height:1.45; color:var(--brown-mid); margin-bottom:8px;
  }
  .def-item:last-child{ margin-bottom:0; }
  .def-item b{ color:var(--brown); }

  @media (max-width:760px){
    .compare-body{ grid-template-columns:1fr; }
    .compare-picker{ max-height:240px; }
  }

  /* Category section */
  .kategori-block{ margin-top:24px; }
  .section-head h2{ display:flex; align-items:center; gap:9px; }
  .kat-dot{
    width:11px; height:11px; border-radius:50%;
    display:inline-block; flex-shrink:0;
  }
  .kelompok-block{ margin-top:14px; }
  .kelompok-chip{
    display:inline-flex;
    align-items:center;
    gap:5px;
    background:var(--peach-soft);
    color:var(--orange-deep);
    font-size:11px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:999px;
    margin-bottom:9px;
  }
  .kelompok-chip::before{
    content:'';
    width:5px;height:5px;border-radius:50%;
    background:currentColor;
  }

  .card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(255px,1fr));
    gap:12px;
  }

  .card{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-top:3px solid var(--kat-accent, var(--orange));
    border-radius:var(--radius);
    padding:15px 19px 15px;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .card:hover{
    transform:translateY(-2px);
    border-color:var(--orange);
    box-shadow:0 3px 6px rgba(86,47,0,.08), 0 10px 22px rgba(86,47,0,.12);
  }
  .card.comp-card{
    display:flex;
    flex-direction:column;
    position:relative;
    border-top-color:transparent;
  }
  .comp-color-strip{
    position:absolute;
    top:0; left:0; right:0;
    height:5px;
    border-radius:var(--radius) var(--radius) 0 0;
    overflow:hidden;
  }
  .comp-bar{
    display:flex;
    height:16px;
    border-radius:6px;
    overflow:hidden;
    background:var(--cream-deep);
  }
  .comp-bar-seg{ min-width:2px; }
  .comp-legend{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px 10px;
  }
  .comp-legend-item{
    font-size:11px;
    color:var(--brown-mid);
    display:flex;
    align-items:center;
    gap:5px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
  }
  .comp-legend-item b{ color:var(--brown); }
  .comp-legend-item .dot{
    width:8px; height:8px; border-radius:50%;
    display:inline-block; flex-shrink:0;
  }
  .card-top-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:6px;
  }
  .card-top-row .card-label{ flex:1; }
  .chart-style-select{
    flex-shrink:0;
    font-size:9.5px;
    line-height:1;
    color:var(--brown-mid);
    background:var(--cream);
    border:1px solid var(--line);
    border-radius:5px;
    padding:2px 3px;
    max-width:78px;
    cursor:pointer;
    outline:none;
  }
  .chart-style-select:hover{ border-color:var(--orange); color:var(--orange-deep); }
  .card-label{
    font-size:12.5px;
    font-weight:600;
    color:var(--brown-mid);
    line-height:1.32;
    min-height:32px;
  }
  .card-value-row{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:8px;
  }
  .card-value{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:27px;
    color:var(--brown-deep);
    letter-spacing:-.01em;
  }
  .card-unit {
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--brown-soft);
    margin-left: 4px;
    letter-spacing: 0;
  }
  .card-period{
    font-size:10.5px;
    color:var(--brown-soft);
    font-weight:600;
    margin-bottom:4px;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:3px;
    font-size:11.5px;
    font-weight:700;
    padding:3px 9px;
    border-radius:999px;
    width:fit-content;
  }
  .badge.up{ background:var(--rust-bg); color:var(--rust); }
  .badge.down{ background:var(--green-bg); color:var(--green); }
  .badge.flat{ background:var(--cream-deep); color:var(--brown-soft); }
  .badge.na{ background:var(--cream-deep); color:var(--brown-soft); }
  .spark-wrap{ height:32px; width:100%; overflow:hidden; }
  .spark-wrap svg{ display:block; width:100%; height:100%; }

  /* Loading / empty */
  .state-msg{
    margin:44px 0;
    color:var(--brown-mid);
    font-size:13px;
  }
  .spinner{
    width:20px;height:20px;
    border:2.5px solid var(--peach);
    border-top-color:var(--orange-deep);
    border-radius:50%;
    animation:spin .8s linear infinite;
    display:inline-block;
    vertical-align:middle;
    margin-right:9px;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  /* Detail overlay */
  .overlay{
    position:fixed; inset:0;
    background:rgba(50,28,0,.42);
    backdrop-filter:blur(2px);
    display:none;
    align-items:stretch;
    justify-content:flex-end;
    z-index:100;
  }
  .overlay.show{ display:flex; }
  .drawer{
    background:var(--cream);
    width:min(600px,100%);
    height:100%;
    overflow-y:auto;
    box-shadow:-8px 0 26px rgba(50,28,0,.2);
    padding:22px 22px 40px;
    transform:translateX(20px);
    animation:slidein .22s ease forwards;
  }
  @keyframes slidein{ to{ transform:translateX(0); } }
  .drawer-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom:4px;
  }
  .drawer-close{
    background:var(--card-bg);
    border:1px solid var(--line);
    width:30px;height:30px;
    border-radius:50%;
    cursor:pointer;
    font-size:14px;
    color:var(--brown-mid);
    flex-shrink:0;
  }
  .drawer-close:hover{ border-color:var(--orange); color:var(--orange-deep); }
  .drawer-eyebrow{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.09em;
    color:var(--orange-deep); font-weight:700; margin-bottom:4px;
  }
  .drawer h3{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19px;
    margin:0 0 13px;
    line-height:1.2;
    max-width:88%;
  }
  .drawer-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:14px;
  }
  .stat-box{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:11px;
    padding:9px 11px;
  }
  .stat-box .stat-label{ font-size:10px; color:var(--brown-soft); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .stat-box .stat-value{ font-family:'Fraunces',serif; font-size:16px; font-weight:600; margin-top:3px; color:var(--brown); }

  .filter-row{
    display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap;
  }
  .filter-row label{ font-size:11.5px; font-weight:600; color:var(--brown-mid); }
  .filter-row select{
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    padding:6px 9px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--card-bg);
    color:var(--brown);
  }
  .quickbtns{ display:flex; gap:5px; margin-left:auto; }
  .quickbtns button{
    font-size:11.5px; font-weight:600;
    border:1px solid var(--line);
    background:var(--card-bg);
    color:var(--brown-mid);
    padding:5px 10px;
    border-radius:999px;
    cursor:pointer;
  }
  .quickbtns button.active{ background:var(--orange-deep); color:#fff; border-color:var(--orange-deep); }

  .chart-box{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 10px 6px;
    height:230px;
  }
  .chart-box-wrap{ position:relative; }
  .dl-btn{
    position:absolute;
    top:8px; right:8px;
    z-index:2;
    font-size:11px;
    font-weight:700;
    color:var(--brown-mid);
    background:var(--cream);
    border:1px solid var(--line);
    padding:4px 10px;
    border-radius:999px;
    cursor:pointer;
  }
  .dl-btn:hover{ border-color:var(--orange); color:var(--orange-deep); }
  .table-head-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:14px;
    margin-bottom:6px;
  }
  .table-head-label{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--brown-soft);
  }
  .table-head-row .dl-btn{ position:static; }
  .table-scroll{
    max-height:230px;
    overflow-y:auto;
    border:1px solid var(--line);
    border-radius:11px;
  }
  .drawer-desc{
    background:var(--peach-soft);
    border:1px solid var(--line);
    border-radius:12px;
    padding:11px 14px;
    margin-top:10px;
  }
  .drawer-desc-label{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.08em;
    font-weight:700;
    color:var(--orange-deep);
    margin-bottom:4px;
  }
  .drawer-desc p{

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0IHQMxQuwLfTdSgKoXUqA8guCT788uBZ4cwlE72X6co3LMRcGU6tk1PSMbi7nVeEB2g-kTVXYBPyv/pub?output=csv";

let STORE = {};        
let DEFINISI = {};     
let SATUAN = {};       
let activePeriode = null;
let ENABLED_KELOMPOK = null;
let chartInstance = null;
let currentSeriesKey = null;
let currentCompKey = null;

let compareMode = false;
let comparePeriode = null;
let compareIndex = {};
let compareSelected = new Set();
let compareFrom = null;
let compareTo = null;
let normalizeCompare = false;
let compareChart = null;
let compareChartType = 'line';
const COMPARE_COLORS = ['#FF9644','#4E7D5A','#A63A50','#3E6E8E','#8C6BAF','#B98B27','#562F00','#5C8C8C'];

const KATEGORI_PALETTE = ['#FF6B6B','#3E8E41','#2E86AB','#B8336A','#D4A017','#6A4C93','#FF9644','#008080','#4C5C7D','#C1440E'];
let GROUP_COLOR_MAP = {};
function getGroupColor(kategori, kelompok){
  const key = kategori + '|||' + kelompok;
  if(!GROUP_COLOR_MAP[key]){
    const idx = Object.keys(GROUP_COLOR_MAP).length % KATEGORI_PALETTE.length;
    GROUP_COLOR_MAP[key] = KATEGORI_PALETTE[idx];
  }
  return GROUP_COLOR_MAP[key];
}

let CHART_STYLE_OVERRIDES = {};
const CHART_STYLE_OPTIONS = [
  {value:'filled-area', label:'Area Terisi'},
  {value:'spline', label:'Kurva Halus'},
  {value:'bar', label:'Batang'},
  {value:'rounded-bar', label:'Batang Bulat'},
  {value:'stepped-area', label:'Tangga'},
  {value:'dashed-area', label:'Putus-putus'},
  {value:'scatter', label:'Sebar (Scatter)'},
  {value:'lollipop', label:'Lollipop'},
  {value:'bubble-ts', label:'Bubble Time Series'},
  {value:'pure-bubble', label:'Bubble Murni'}
];

function chartStyleKey(kategori, kelompok, sub){
  return kategori + '|||' + kelompok + '|||' + (sub || '');
}

function getGroupChartType(kategori, kelompok, sub){
  const key = kategori + '|||' + kelompok + '|||' + (sub || '');
  getGroupColor(kategori, kelompok);
  if(CHART_STYLE_OVERRIDES[key]) return CHART_STYLE_OVERRIDES[key];
  
  if (sub && /indeks\s*kemahalan\s*konstruksi/i.test(sub)) {
    return 'pure-bubble';
  }
  if (/upah/i.test(kategori) || /upah/i.test(kelompok) || /upah/i.test(sub || '')) {
    return 'bar'; // Diubah menjadi bar chart standar (bukan rounded-bar) untuk upah atau kategori terkait
  }
  if (/konsumsi|pengeluaran/i.test(kelompok)) {
    return 'rounded-bar';
  }
  if (/gender/i.test(kelompok) || /gender/i.test(kategori)) {
    return 'lollipop';
  }
  if (/pendidikan/i.test(kelompok) || /pendidikan/i.test(kategori)) {
    return 'spline';
  }
  if (/penanaman\s*modal/i.test(kelompok) || /penanaman\s*modal/i.test(kategori)) {
    return 'bubble-ts';
  }

  const idx = Object.keys(GROUP_COLOR_MAP).indexOf(kategori + '|||' + kelompok);
  const types = ['filled-area', 'bar', 'stepped-area', 'dashed-area', 'scatter', 'lollipop', 'rounded-bar', 'spline', 'bubble-ts', 'pure-bubble'];
  return types[idx % types.length];
}

let currentDetailColor = '#FF9644';
let currentDetailChartType = 'filled-area';

function toNumber(v){
  if(v===undefined||v===null) return NaN;
  const s = v.toString().trim().replace(/\./g,'').replace(/,/g,'.');
  const direct = parseFloat(v.toString().trim().replace(/,/g,''));
  if(!isNaN(direct)) return direct;
  return parseFloat(s);
}

function fmtNum(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return n.toLocaleString('id-ID', {maximumFractionDigits:2});
}

function triwulanToNum(t){
  if(!t) return 0;
  const s = t.toString().trim().toUpperCase();
  const map = {'I':1,'II':2,'III':3,'IV':4,'1':1,'2':2,'3':3,'4':4};
  return map[s] || 0;
}

function sortKey(e){ return e.tahun*10 + triwulanToNum(e.triwulan); }

function periodLabel(e){
  return e.triwulan ? `${e.tahun} TW ${e.triwulan}` : `${e.tahun}`;
}

function loadData(){
  Papa.parse(CSV_URL, {
    download:true,
    header:false,
    skipEmptyLines:true,
    complete: function(res){
      try{
        buildStore(res.data);
        computeHeroStats();
        renderTabs();
        if(activePeriode) renderContent(activePeriode);
      }catch(err){
        showError('Gagal memproses data: ' + err.message);
      }
    },
    error: function(err){
      showError('Gagal memuat CSV. Periksa koneksi atau akses sheet. (' + err + ')');
    }
  });
}

function showError(msg){
  document.getElementById('main').innerHTML =
    `<div class="state-msg">⚠ ${msg}<br><br><a href="${CSV_URL}" target="_blank" style="color:var(--orange-deep);font-weight:600;">Buka sumber data →</a></div>`;
}

function buildStore(rows){
  STORE = {};
  DEFINISI = {};
  SATUAN = {};
  rows.slice(1).forEach(row=>{ 
    const periode = (row[0]||'').toString().trim();
    const triwulan = (row[1]||'').toString().trim();
    const tahun = parseInt((row[2]||'').toString().trim());
    
    const kategori = (row[3]||'').toString().trim();
    const kelompok = (row[4]||'').toString().trim();
    const subkelompok = (row[5]||'').toString().trim();
    const data = toNumber(row[6]);
    const satuan = (row[7]||'').toString().trim();

    const defSub = (row[8]||'').toString().trim();
    const defText = (row[9]||'').toString().trim();
    if(defSub && defText && !DEFINISI[defSub]) DEFINISI[defSub] = defText;
    if(subkelompok && satuan && !SATUAN[subkelompok]) SATUAN[subkelompok] = satuan;

    if(!periode || !kategori || !kelompok || !subkelompok || isNaN(tahun) || isNaN(data)) return;

    if(!STORE[periode]) STORE[periode] = {};
    if(!STORE[periode][kategori]) STORE[periode][kategori] = {};
    if(!STORE[periode][kategori][kelompok]) STORE[periode][kategori][kelompok] = {};
    if(!STORE[periode][kategori][kelompok][subkelompok]) STORE[periode][kategori][kelompok][subkelompok] = [];

    STORE[periode][kategori][kelompok][subkelompok].push({tahun, triwulan, data});
  });

  Object.values(STORE).forEach(katObj=>{
    Object.values(katObj).forEach(kelObj=>{
      Object.values(kelObj).forEach(subObj=>{
        Object.keys(subObj).forEach(sk=>{
          subObj[sk].sort((a,b)=>sortKey(a)-sortKey(b));
        });
      });
    });
  });

  const periodeList = Object.keys(STORE);
  const priority = ['Tahunan','Triwulanan','Triwulan'];
  periodeList.sort((a,b)=>{
    const ia = priority.indexOf(a), ib = priority.indexOf(b);
    if(ia===-1 && ib===-1) return a.localeCompare(b);
    if(ia===-1) return 1;
    if(ib===-1) return -1;
    return ia-ib;
  });
  if(!activePeriode || !STORE[activePeriode]) activePeriode = periodeList[0];
  STORE.__order = periodeList;

  if(!ENABLED_KELOMPOK) ENABLED_KELOMPOK = new Set();
  periodeList.forEach(p=>{
    Object.keys(STORE[p]).forEach(kat=>{
      Object.keys(STORE[p][kat]).forEach(kel=>{
        const key = `${kat}|||${kel}`;
        if(!ENABLED_KELOMPOK.has(key)) ENABLED_KELOMPOK.add(key);
      });
    });
  });
}

function renderKelFilterPanel(periode){
  const panel = document.getElementById('kelFilterPanel');
  if(!panel) return;
  panel.style.display = '';
  const katObj = STORE[periode];
  if(!katObj){ panel.innerHTML = ''; return; }

  let html = `<div class="kel-filter-head">
      <span>Tampilkan Data</span>
      <button class="kel-filter-reset" id="kelFilterReset">Tampilkan Semua</button>
    </div>`;

  Object.keys(katObj).forEach(kategori=>{
    const kelompokList = Object.keys(katObj[kategori]);
    html += `<div class="kel-filter-kat">
        <div class="kel-filter-kat-head">
          <span>${escapeHtml(kategori)}</span>
          <button class="kel-filter-kat-toggle" data-kat="${encodeURIComponent(kategori)}">semua/tidak</button>
        </div>`;
    kelompokList.forEach(kelompok=>{
      const key = `${kategori}|||${kelompok}`;
      const checked = ENABLED_KELOMPOK.has(key) ? 'checked' : '';
      html += `<label class="kel-filter-item">
          <input type="checkbox" data-key="${encodeURIComponent(key)}" ${checked}>
          <span>${escapeHtml(kelompok)}</span>
        </label>`;
    });
    html += `</div>`;
  });

  panel.innerHTML = html;

  panel.querySelectorAll('.kel-filter-item input[type=checkbox]').forEach(cb=>{
    cb.onchange = ()=>{
      const key = decodeURIComponent(cb.dataset.key);
      if(cb.checked) ENABLED_KELOMPOK.add(key); else ENABLED_KELOMPOK.delete(key);
      renderContent(activePeriode);
    };
  });

  panel.querySelectorAll('.kel-filter-kat-toggle').forEach(btn=>{
    btn.onclick = ()=>{
      const kategori = decodeURIComponent(btn.dataset.kat);
      const kelompokList = Object.keys(katObj[kategori]);
      const allOn = kelompokList.every(kel=>ENABLED_KELOMPOK.has(`${kategori}|||${kel}`));
      kelompokList.forEach(kel=>{
        const key = `${kategori}|||${kel}`;
        if(allOn) ENABLED_KELOMPOK.delete(key); else ENABLED_KELOMPOK.add(key);
      });
      renderKelFilterPanel(periode);
      renderContent(activePeriode);
    };
  });

  const resetBtn = document.getElementById('kelFilterReset');
  if(resetBtn){
    resetBtn.onclick = ()=>{
      Object.keys(katObj).forEach(kategori=>{
        Object.keys(katObj[kategori]).forEach(kelompok=>{
          ENABLED_KELOMPOK.add(`${kategori}|||${kelompok}`);
        });
      });
      renderKelFilterPanel(periode);
      renderContent(activePeriode);
    };
  }
}

function computeHeroStats(){
  const subSet = new Set();
  const katSet = new Set();
  let maxTahun = -Infinity;
  STORE.__order.forEach(p=>{
    Object.keys(STORE[p]).forEach(kat=>{
      katSet.add(kat);
      Object.keys(STORE[p][kat]).forEach(kel=>{
        Object.keys(STORE[p][kat][kel]).forEach(sub=>{
          subSet.add(kat+'|||'+kel+'|||'+sub);
          STORE[p][kat][kel][sub].forEach(e=>{ if(e.tahun>maxTahun) maxTahun = e.tahun; });
        });
      });
    });
  });
  const elIndikator = document.getElementById('statIndikator');
  const elKategori = document.getElementById('statKategori');
  const elTerbaru = document.getElementById('statTerbaru');
  if(elIndikator) elIndikator.textContent = subSet.size;
  if(elKategori) elKategori.textContent = katSet.size;
  if(elTerbaru) elTerbaru.textContent = isFinite(maxTahun) ? maxTahun : '–';
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  STORE.__order.forEach(p=>{
    const btn = document.createElement('button');
    btn.className = 'tab' + (!compareMode && p===activePeriode?' active':'');
    btn.textContent = p;
    btn.onclick = ()=>{ compareMode = false; activePeriode = p; renderTabs(); renderContent(p); };
    tabsEl.appendChild(btn);
  });

  const sep = document.createElement('span');
  sep.className = 'tab-sep';
  tabsEl.appendChild(sep);

  const cmpBtn = document.createElement('button');
  cmpBtn.className = 'tab' + (compareMode ? ' active' : '');
  cmpBtn.textContent = '⇄ Bandingkan';
  cmpBtn.onclick = ()=>{ compareMode = true; renderTabs(); renderCompareView(); };
  tabsEl.appendChild(cmpBtn);
}

function makeSparkline(entries, color, type){
  color = color || 'var(--orange)';
  type = type || 'filled-area';
  const vals = entries.slice(-8).map(e=>e.data);
  if(vals.length < 2){
    return `<div class="spark-wrap"></div>`;
  }
  const w = 220, h = 34, pad = 3;
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max-min) || 1;
  const step = (w-pad*2) / (vals.length-1);

  let svgContent = '';

  if (type === 'bar') {
    const barW = Math.max(3, (w - pad * 2) / vals.length * 0.5);
    svgContent = vals.map((v, i) => {
      let barH = ((v - min) / range) * (h - pad * 2);
      barH = Math.max(barH, 2); 
      const x = pad + i * step - barW / 2;
      const y = h - pad - barH;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="${color}" rx="0"></rect>`;
    }).join('');
  } else if (type === 'rounded-bar') {
    const barW = Math.max(3, (w - pad * 2) / vals.length * 0.6);
    svgContent = vals.map((v, i) => {
      let barH = ((v - min) / range) * (h - pad * 2);
      barH = Math.max(barH, 3); 
      const x = pad + i * step - barW / 2;
      const y = h - pad - barH;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="${color}" rx="3" ry="3"></rect>`;
    }).join('');
  } else if (type === 'lollipop') {
    svgContent = vals.map((v, i) => {
      const x = pad + i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      const baseY = h - pad;
      return `
        <line x1="${x.toFixed(1)}" y1="${baseY.toFixed(1)}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${color}" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${color}"/>
      `;
    }).join('');
  } else if (type === 'pure-bubble') {
    svgContent = vals.map((v, i) => {
      const x = pad + i * step;
      const normVal = range > 0 ? (v - min) / range : 0.5;
      const y = h - pad - normVal * (h - pad * 2);
      const radius = 2 + normVal * 4; 
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${radius.toFixed(1)}" fill="${color}" opacity="0.85"/>`;
    }).join('');
  } else if (type === 'bubble-ts') {
    let pathD = '';
    const pts = vals.map((v, i) => {
      const x = pad + i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return {x, y, v};
    });
    pts.forEach((p, i) => {
      if (i === 0) pathD += `M ${p.x.toFixed(1)},${p.y.toFixed(1)} `;
      else pathD += `L ${p.x.toFixed(1)},${p.y.toFixed(1)} `;
    });
    let bubbles = pts.map(p => {
      const normVal = range > 0 ? (p.v - min) / range : 0.5;
      const radius = 2 + normVal * 5; 
      return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${radius.toFixed(1)}" fill="${color}" opacity="0.85"/>`;
    }).join('');

    svgContent = `
      <path d="${pathD}" fill="none" stroke="${color}" stroke-width="1.2" opacity="0.4" stroke-dasharray="3,3"/>
      ${bubbles}
    `;
  } else if (type === 'spline') {
    let pathD = '';
    const pts = vals.map((v, i) => {
      const x = pad + i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return {x, y};
    });
    pts.forEach((p, i) => {
      if (i === 0) {
        pathD += `M ${p.x.toFixed(1)},${p.y.toFixed(1)} `;
      } else {
        const prev = pts[i - 1];
        const cpX = (prev.x + p.x) / 2;
        pathD += `C ${cpX.toFixed(1)},${prev.y.toFixed(1)} ${cpX.toFixed(1)},${p.y.toFixed(1)} ${p.x.toFixed(1)},${p.y.toFixed(1)} `;
      }
    });
    const last = pts[pts.length - 1];
    const first = pts[0];
    const poly = `${first.x.toFixed(1)},${h} ${pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')} ${last.x.toFixed(1)},${h}`;
    svgContent = `
      <polygon points="${poly}" fill="${color}" opacity="0.12"/>
      <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="3" fill="${color}"/>
    `;
  } else if (type === 'stepped-area') {
    let pathD = '';
    const pts = vals.map((v,i) => {
      const x = pad + i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    pts.forEach((p, i) => {
      const [x, y] = p.split(',');
      if (i === 0) {
        pathD += `M ${x},${y} `;
      } else {
        const prevY = pts[i-1].split(',')[1];
        pathD += `L ${x},${prevY} L ${x},${y} `;
      }
    });
    const last = pts[pts.length-1].split(',');
    svgContent = `
      <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${color}"/>
    `;
  } else if (type === 'dashed-area') {
    const pts = vals.map((v,i) => {
      const x = pad + i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    const last = pts[pts.length-1].split(',');
    svgContent = `
      <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4,4"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${color}"/>
    `;
  } else if (type === 'scatter') {
    svgContent = vals.map((v, i) => {
      const x = pad + i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${color}"/>`;
    }).join('');
  } else {
    const pts = vals.map((v,i) => {
      const x = pad + i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    const last = pts[pts.length-1].split(',');
    const poly = `${pts[0].split(',')[0]},${h} ${pts.join(' ')} ${last[0]},${h}`;
    svgContent = `
      <polygon points="${poly}" fill="${color}" opacity="0.15"/>
      <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${color}"/>
    `;
  }

  return `<div class="spark-wrap"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${svgContent}</svg></div>`;
}

function changeBadge(entries){
  if(entries.length < 2) return `<span class="badge na">Data awal</span>`;
  const latest = entries[entries.length-1].data;
  const prev = entries[entries.length-2].data;
  const diff = latest - prev;
  if(Math.abs(diff) < 0.0005) return `<span class="badge flat">▬ ${fmtNum(prev)}</span>`;
  const up = diff > 0;
  return `<span class="badge ${up?'up':'down'}">${up?'▲':'▼'} ${fmtNum(prev)}</span>`;
}

function splitCompositionSegments(subObj){
  const subs = Object.keys(subObj);
  const candidates = subs.filter(s => {
    const t = s.trim();
    return /^\d+(\.\d+)?%/.test(t) || /^persentase/i.test(t);
  });
  if(candidates.length < 2 || candidates.length > 8) return null;

  const yearTotals = {};
  candidates.forEach(sub=>{
    subObj[sub].forEach(e=>{
      const k = sortKey(e);
      yearTotals[k] = (yearTotals[k]||0) + e.data;
    });
  });
  const totals = Object.values(yearTotals);
  if(totals.length === 0) return null;
  const closeTo100 = totals.filter(t=>Math.abs(t-100) <= 5).length;
  if((closeTo100 / totals.length) < 0.6) return null;
  return candidates;
}

const LEVEL_SUFFIX_RE = /\s+(SD\/Sederajat|SMP\/Sederajat|SMA\/Sederajat|SMK\/Sederajat|Perguruan Tinggi|\d{1,2}\s*-\s*\d{1,2}\s*Tahun|Laki-laki|Laki-Laki|Perempuan)$/i;

function splitLevelGroups(subObj){
  const subs = Object.keys(subObj);
  const groups = {};
  subs.forEach(s=>{
    const m = s.match(LEVEL_SUFFIX_RE);
    if(m){
      const prefix = s.slice(0, m.index).trim();
      if(!groups[prefix]) groups[prefix] = [];
      groups[prefix].push(s);
    }
  });
  return Object.keys(groups)
    .filter(p=>groups[p].length >= 2)
    .map(p=>({ label:p, segs:groups[p] }));
}

function getCompositionGroups(subObj, kelompok){
  const groups = [];
  const pctSegs = splitCompositionSegments(subObj);
  if(pctSegs) groups.push({ label:kelompok, segs:pctSegs, normalized:true });
  const claimed = new Set(pctSegs || []);
  splitLevelGroups(subObj).forEach(g=>{
    const segs = g.segs.filter(s=>!claimed.has(s));
    if(segs.length >= 2) groups.push({ label:g.label, segs, normalized:false });
  });
  return groups;
}

function renderCompositionCardHtml(periode,kategori,kelompok,subObj,group,katColor){
  const { label, segs, normalized } = group;
  let maxSK = -Infinity;
  segs.forEach(s=> subObj[s].forEach(e=>{ maxSK = Math.max(maxSK, sortKey(e)); }));
  const latestEntries = segs.map(s=>{
    const arr = subObj[s];
    return { sub:s, entry: arr.find(e=>sortKey(e)===maxSK) || arr[arr.length-1] };
  });
  const total = latestEntries.reduce((sum,x)=>sum + (x.entry?x.entry.data:0), 0) || 1;
  const latestLabel = latestEntries[0].entry ? periodLabel(latestEntries[0].entry) : '';

  const barSegs = latestEntries.map((x,i)=>{
    const pct = x.entry ? (x.entry.data/total*100) : 0;
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    return `<div class="comp-bar-seg" style="flex:${Math.max(pct,0.5)};background:${color};" title="${escapeHtml(x.sub)}: ${fmtNum(x.entry?x.entry.data:NaN)}"></div>`;
  }).join('');

  const legend = latestEntries.map((x,i)=>{
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    let shortName = x.sub;
    if(shortName.startsWith(label)){
      shortName = shortName.slice(label.length).trim().replace(/^[-–:\/]\s*/,'');
    }
    if(!shortName) shortName = x.sub;
    return `<div class="comp-legend-item" title="${escapeHtml(x.sub)}: ${fmtNum(x.entry?x.entry.data:NaN)}"><span class="dot" style="background:${color}"></span>${escapeHtml(shortName)}</div>`;
  }).join('');

  const key = encodeURIComponent(JSON.stringify([periode,kategori,kelompok,label,segs]));
  const gradientColors = latestEntries.map((_,i)=>COMPARE_COLORS[i % COMPARE_COLORS.length]);
  let stripGradient = gradientColors[0] || katColor;
  if(gradientColors.length > 1){
    const n = gradientColors.length;
    const stops = gradientColors.map((c,i)=>{
      const startPct = (i/n*100).toFixed(2);
      const endPct = ((i+1)/n*100).toFixed(2);
      return `${c} ${startPct}%, ${c} ${endPct}%`;
    }).join(', ');
    stripGradient = `linear-gradient(90deg, ${stops})`;
  }
  return `<div class="card comp-card" data-compkey='${key}'>
      <div class="comp-color-strip" style="background:${stripGradient}"></div>
      <div class="card-label">${escapeHtml(label)}</div>
      <div class="card-period">${latestLabel} · ${normalized ? 'Komposisi' : 'Rincian per Jenjang'}</div>
      <div class="comp-bar">${barSegs}</div>
      <div class="comp-legend">${legend}</div>
    </div>`;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function triggerJPGDownload(inst, name){
  if(!inst){ alert('Grafik belum siap.'); return; }
  const srcCanvas = inst.canvas;
  const tmpCanvas = document.createElement('canvas');
  tmpCanvas.width = srcCanvas.width;
  tmpCanvas.height = srcCanvas.height;
  const tctx = tmpCanvas.getContext('2d');
  tctx.fillStyle = '#ffffff';
  tctx.fillRect(0, 0, tmpCanvas.width, tmpCanvas.height);
  tctx.drawImage(srcCanvas, 0, 0);
  tmpCanvas.toBlob(function(blob){
    if(!blob){ alert('Gagal membuat gambar.'); return; }
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `${(name||'grafik').replace(/[^a-z0-9]+/gi,'_')}.jpg`;
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }, 'image/jpeg', 1.0);
}
function downloadChartJPG(){ triggerJPGDownload(chartInstance, currentSeriesKey ? currentSeriesKey.sub : 'grafik'); }
function downloadCompChartJPG(){ triggerJPGDownload(chartInstance, currentCompKey ? currentCompKey.label : 'komposisi'); }

async function exportStyledExcel(filename, sheetName, header, rows){
  if(typeof ExcelJS === 'undefined'){ alert('Gagal memuat library Excel. Coba refresh halaman.'); return; }
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet(sheetName);
  ws.addRow(header);
  rows.forEach(r=>ws.addRow(r));

  const headerRow = ws.getRow(1);
  headerRow.eachCell(cell=>{
    cell.font = { bold:true, color:{argb:'FFFFFFFF'} };
    cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFE97B2A'} };
    cell.alignment = { vertical:'middle', horizontal:'center' };
    cell.border = {
      top:{style:'thin',color:{argb:'FFD8A15B'}}, left:{style:'thin',color:{argb:'FFD8A15B'}},
      bottom:{style:'thin',color:{argb:'FFD8A15B'}}, right:{style:'thin',color:{argb:'FFD8A15B'}}
    };
  });
  headerRow.height = 20;

  for(let i=2;i<=ws.rowCount;i++){
    const row = ws.getRow(i);
    row.eachCell((cell, colNumber)=>{
      cell.border = {
        top:{style:'thin',color:{argb:'FFEFDCB8'}}, left:{style:'thin',color:{argb:'FFEFDCB8'}},
        bottom:{style:'thin',color:{argb:'FFEFDCB8'}}, right:{style:'thin',color:{argb:'FFEFDCB8'}}
      };
      if(typeof cell.value === 'number'){
        cell.numFmt = '#,##0.00';
        cell.alignment = { horizontal:'right' };
      }else{
        cell.alignment = { horizontal: colNumber===1 ? 'left' : 'center' };
      }
      if(i % 2 === 0){
        cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFFBF3E4'} };
      }
    });
  }

  ws.columns.forEach((col,idx)=>{
    let maxLen = String(header[idx]==null?'':header[idx]).length;
    rows.forEach(r=>{
      const v = r[idx];
      const len = (v===null||v===undefined||v==='') ? 1 : String(v).length;
      if(len>maxLen) maxLen = len;
    });
    col.width = Math.min(Math.max(maxLen+3, 10), 40);
  });

  ws.views = [{ state:'frozen', ySplit:1 }];

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function buildCompositionInsight(label, segs, bySegSK, sortedSK, skMap){
  if(!sortedSK || sortedSK.length === 0) return 'Tidak ada data pada rentang periode ini.';
  const satuan = SATUAN[segs[0]] ? ' ' + escapeHtml(SATUAN[segs[0]]) : '';
  const firstSK = sortedSK[0], lastSK = sortedSK[sortedSK.length-1];
  const firstLabel = skMap.get(firstSK), lastLabel = skMap.get(lastSK);

  const firstTotal = segs.reduce((sum,s)=> sum + (bySegSK[s][firstSK] || 0), 0);
  const lastTotal = segs.reduce((sum,s)=> sum + (bySegSK[s][lastSK] || 0), 0);

  let domSeg = segs[0], domVal = -Infinity;
  segs.forEach(s=>{
    const v = bySegSK[s][lastSK];
    if(v !== undefined && v > domVal){ domVal = v; domSeg = s; }
  });
  const domShare = lastTotal > 0 ? (domVal/lastTotal*100) : 0;

  let bestSeg = null, bestChange = -Infinity, worstSeg = null, worstChange = Infinity;
  segs.forEach(s=>{
    const f = bySegSK[s][firstSK], l = bySegSK[s][lastSK];
    if(f !== undefined && l !== undefined){
      const diff = l - f;
      if(diff > bestChange){ bestChange = diff; bestSeg = s; }
      if(diff < worstChange){ worstChange = diff; worstSeg = s; }
    }
  });

  let trendWord = 'relatif stabil dibandingkan', trendClass = 'trend-flat';
  if(lastTotal > firstTotal){ trendWord = 'meningkat dibandingkan'; trendClass = 'trend-up'; }
  else if(lastTotal < firstTotal){ trendWord = 'menurun dibandingkan'; trendClass = 'trend-down'; }

  let html = `Pada periode <b>${escapeHtml(lastLabel)}</b>, total gabungan seluruh komponen <b>${escapeHtml(label)}</b> tercatat <b>${fmtNum(lastTotal)}${satuan}</b> (dijumlah apa adanya dari ${segs.length} komponen, bukan dinormalisasi ke 100%).`;

  if(firstSK !== lastSK){
    html += ` Nilai gabungan ini <span class="${trendClass}">${trendWord}</span> periode <b>${escapeHtml(firstLabel)}</b> yang tercatat <b>${fmtNum(firstTotal)}${satuan}</b>.`;
  }

  html += ` Komponen dengan porsi terbesar saat ini adalah <b>${escapeHtml(domSeg)}</b> (${fmtNum(domVal)}${satuan}, sekitar ${domShare.toFixed(1)}% dari total gabungan).`;

  if(bestSeg && worstSeg && bestSeg !== worstSeg){
    html += ` Sepanjang rentang ini, <b>${escapeHtml(bestSeg)}</b> mencatat kenaikan paling besar (${bestChange>0?'+':''}${fmtNum(bestChange)}${satuan}), sementara <b>${escapeHtml(worstSeg)}</b> mencatat perubahan paling rendah/menurun (${worstChange>0?'+':''}${fmtNum(worstChange)}${satuan}).`;
  }

  return html;
}

function refreshCompositionDetail(subObj, segs, fromYear, toYear){
  const skMap = new Map();
  segs.forEach(s=>{
    subObj[s].forEach(e=>{
      if(e.tahun >= fromYear && e.tahun <= toYear) skMap.set(sortKey(e), periodLabel(e));
    });
  });
  const sortedSK = [...skMap.keys()].sort((a,b)=>a-b);
  const labels = sortedSK.map(sk=>skMap.get(sk));

  const bySegSK = {};
  segs.forEach(s=>{
    bySegSK[s] = {};
    subObj[s].forEach(e=>{ bySegSK[s][sortKey(e)] = e.data; });
  });

  const datasets = segs.map((s,i)=>{
    const data = sortedSK.map(sk=> bySegSK[s].hasOwnProperty(sk) ? bySegSK[s][sk] : null);
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    return { label:s, data, backgroundColor:color, borderRadius:0, stack:'comp' };
  });

  const lastSK = sortedSK[sortedSK.length-1];
  const legendHtml = segs.map((s,i)=>{
    const val = bySegSK[s][lastSK];
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    return `<div class="comp-legend-item"><span class="dot" style="background:${color}"></span>${escapeHtml(s)} <b>${val!==undefined?fmtNum(val):'—'}</b></div>`;
  }).join('');
  document.getElementById('compLegendFull').innerHTML = legendHtml;

  const narrEl = document.getElementById('compDrawerNarrative');
  if(narrEl){
    narrEl.innerHTML = buildCompositionInsight(currentCompKey ? currentCompKey.label : '', segs, bySegSK, sortedSK, skMap);
  }

  const canvasEl = document.getElementById('compDetailChart');
  if(typeof Chart === 'undefined'){
    canvasEl.parentElement.innerHTML = '<div style="padding:20px;font-size:13px;color:var(--brown-mid);">Grafik gagal dimuat (library Chart.js tidak tersedia). Coba refresh halaman.</div>';
  }else{
    const ctx = canvasEl.getContext('2d');
    if(chartInstance) chartInstance.destroy();
    chartInstance = new Chart(ctx, {
      type:'bar',
      data:{ labels, datasets },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        plugins:{
          legend:{ display:false },
          tooltip:{
            mode:'index', intersect:false,
            callbacks:{ label:(c)=>`${c.dataset.label}: ${fmtNum(c.parsed.y)}` }
          }
        },
        scales:{
          x:{ stacked:true, grid:{display:false}, ticks:{ color:'#8A5A24', font:{family:'Inter', size:11} } },
          y:{ stacked:true, grid:{color:'#F2DEB8'}, ticks:{ color:'#8A5A24', font:{family:'Inter', size:11} } }
        }
      }
    });
  }

  let theadCells = `<th>Periode</th>` + segs.map(s=>`<th>${escapeHtml(s)}</th>`).join('') + `<th>Total</th>`;
  let bodyRows = '';
  [...sortedSK].reverse().forEach(sk=>{
    const label = skMap.get(sk);
    let rowTotal = 0;
    const cells = segs.map(s=>{
      const v = bySegSK[s].hasOwnProperty(sk) ? bySegSK[s][sk] : null;
      if(v !== null) rowTotal += v;
      return `<td>${v!==null ? fmtNum(v) : '—'}</td>`;
    }).join('');
    bodyRows += `<tr><td>${label}</td>${cells}<td>${fmtNum(rowTotal)}</td></tr>`;
  });
  document.getElementById('compDetailTable').innerHTML = `<thead><tr>${theadCells}</tr></thead><tbody>${bodyRows}</tbody>`;
}

function downloadCompositionExcel(subObj, segs){
  const fromSel = document.getElementById('compFromYear');
  const toSel = document.getElementById('compToYear');
  const fromYear = parseInt(fromSel.value), toYear = parseInt(toSel.value);

  const skMap = new Map();
  segs.forEach(s=>{
    subObj[s].forEach(e=>{
      if(e.tahun >= fromYear && e.tahun <= toYear) skMap.set(sortKey(e), periodLabel(e));
    });
  });
  const sortedSK = [...skMap.keys()].sort((a,b)=>a-b);

  const header = ['Periode', ...segs, 'Total'];
  const rows = [];
  sortedSK.forEach(sk=>{
    const label = skMap.get(sk);
    let rowTotal = 0;
    const vals = segs.map(s=>{
      const entry = subObj[s].find(e=>sortKey(e)===sk);
      const v = entry ? entry.data : '';
      if(typeof v === 'number') rowTotal += v;
      return v;
    });
    rows.push([label, ...vals, rowTotal]);
  });

  exportStyledExcel(`${(currentCompKey?currentCompKey.label:'komposisi').replace(/[^a-z0-9]+/gi,'_')}.xlsx`, 'Komposisi', header, rows);
}

function buildCompareIndex(periode){
  const idx = {};
  const katObj = STORE[periode];
  Object.keys(katObj).forEach(kategori=>{
    Object.keys(katObj[kategori]).forEach(kelompok=>{
      Object.keys(katObj[kategori][kelompok]).forEach(sub=>{
        const key = `${kategori}|||${kelompok}|||${sub}`;
        idx[key] = {kategori, kelompok, sub, entries: katObj[kategori][kelompok][sub]};
      });
    });
  });
  return idx;
}

function renderComparePicker(){
  const picker = document.getElementById('cmpPicker');
  const katObj = STORE[comparePeriode];
  let html = '';
  Object.keys(katObj).forEach(kategori=>{
    html += `<div class="picker-kategori">${escapeHtml(kategori)}</div>`;
    Object.keys(katObj[kategori]).forEach(kelompok=>{
      html += `<div class="picker-kelompok">${escapeHtml(kelompok)}</div>`;
      Object.keys(katObj[kategori][kelompok]).forEach(sub=>{
        const key = `${kategori}|||${kelompok}|||${sub}`;
        const checked = compareSelected.has(key) ? 'checked' : '';
        html += `<label class="picker-item">
          <input type="checkbox" data-key="${encodeURIComponent(key)}" ${checked}>
          <span>${escapeHtml(sub)}</span>
        </label>`;
      });
    });
  });
  picker.innerHTML = html;

  picker.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.onchange = ()=>{
      const key = decodeURIComponent(cb.dataset.key);
      if(cb.checked){
        if(compareSelected.size >= 8){
          cb.checked = false;
          alert('Maksimal 8 indikator sekaligus supaya grafik tetap mudah dibaca.');
          return;
        }
        compareSelected.add(key);
      }else{
        compareSelected.delete(key);
      }
      updatePickerColors();
      renderCompareChart();
    };
  });
  updatePickerColors();
}

function updatePickerColors(){
  const keys = [...compareSelected];
  document.querySelectorAll('#cmpPicker .picker-item').forEach(item=>{
    const cb = item.querySelector('input');
    const key = decodeURIComponent(cb.dataset.key);
    const idx = keys.indexOf(key);
    if(idx >= 0){
      item.classList.add('picked');
      item.style.setProperty('--dotcolor', COMPARE_COLORS[idx % COMPARE_COLORS.length]);
    }else{
      item.classList.remove('picked');
      item.style.removeProperty('--dotcolor');
    }
  });
}

function renderCompareChart(){
  const wrap = document.getElementById('cmpChartWrap');
  const empty = document.getElementById('cmpEmpty');
  const infoGrid = document.getElementById('cmpInfoGrid');
  const keys = [...compareSelected];

  if(keys.length === 0){
    wrap.style.display = 'none';
    empty.style.display = 'block';
    infoGrid.style.display = 'none';
    if(compareChart){ compareChart.destroy(); compareChart = null; }
    return;
  }
  wrap.style.display = 'block';
  empty.style.display = 'none';
  infoGrid.style.display = 'grid';

  if(typeof Chart === 'undefined'){
    document.getElementById('cmpChartBox').innerHTML = '<div style="padding:20px;font-size:13px;color:var(--brown-mid);">Grafik gagal dimuat (library Chart.js tidak tersedia). Coba refresh halaman.</div>';
    return;
  }
  if(!document.getElementById('compareChart')){
    document.getElementById('cmpChartBox').innerHTML = '<canvas id="compareChart"></canvas>';
  }

  const uniqueLabelsMap = new Map();
  keys.forEach(k=>{
    compareIndex[k].entries.forEach(e=>{
      if(e.tahun >= compareFrom && e.tahun <= compareTo) uniqueLabelsMap.set(sortKey(e), periodLabel(e));
    });
  });
  const sortedKeys = [...uniqueLabelsMap.keys()].sort((a,b)=>a-b);
  const labels = sortedKeys.map(sk=>uniqueLabelsMap.get(sk));
  const isSlope = compareChartType === 'slope';
  const chartLabels = (isSlope && labels.length >= 2) ? [labels[0], labels[labels.length-1]] : labels;

  const seriesAnalysisData = [];
  const datasets = [];

  keys.forEach((k,i)=>{
    const info = compareIndex[k];
    const bySort = {};
    info.entries.forEach(e=>{ bySort[sortKey(e)] = e.data; });
    let values = sortedKeys.map(sk=> bySort.hasOwnProperty(sk) ? bySort[sk] : null);
    
    const filteredEntries = info.entries.filter(e => e.tahun >= compareFrom && e.tahun <= compareTo);
    if(filteredEntries.length > 0){
      let maxObj = filteredEntries[0];
      let minObj = filteredEntries[0];
      filteredEntries.forEach(e => {
        if(e.data > maxObj.data) maxObj = e;
        if(e.data < minObj.data) minObj = e;
      });

      const firstVal = filteredEntries[0].data;
      const lastVal = filteredEntries[filteredEntries.length - 1].data;
      const diff = lastVal - firstVal;
      const pct = firstVal !== 0 ? (diff / firstVal) * 100 : 0;
      const spanYears = (compareTo - compareFrom) || 1;
      const cagr = firstVal > 0 ? (Math.pow(lastVal / firstVal, 1 / spanYears) - 1) * 100 : 0;

      seriesAnalysisData.push({
        name: info.sub,
        first: firstVal,
        last: lastVal,
        pct: pct,
        cagr: cagr,
        max: maxObj.data,
        maxLabel: periodLabel(maxObj),
        min: minObj.data,
        minLabel: periodLabel(minObj),
        unit: SATUAN[info.sub] || ''
      });
    }

    if(normalizeCompare){
      const base = values.find(v=>v!==null && v!==undefined && v!==0);
      if(base){
        values = values.map(v=>(v===null||v===undefined) ? null : (v/base*100));
      }
    }
    
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    const yAxisID = (!normalizeCompare && keys.length > 1 && i % 2 === 1) ? 'y1' : 'y';

    if(compareChartType === 'lollipop'){
      datasets.push({
        type:'bar', label:info.sub, data:values, backgroundColor: hexToRgba(color,0.5),
        maxBarThickness:5, borderWidth:0, yAxisID, order:2
      });
      datasets.push({
        type:'line', label:info.sub, data:values, borderColor:color, backgroundColor:color,
        pointBackgroundColor:color, pointRadius:5, pointHoverRadius:7, showLine:false, fill:false,
        yAxisID, order:1
      });
    }else if(compareChartType === 'pure-bubble' || compareChartType === 'bubble-ts'){
      const numericVals = values.filter(v=>v!==null && v!==undefined);
      const minV = numericVals.length ? Math.min(...numericVals) : 0;
      const maxV = numericVals.length ? Math.max(...numericVals) : 1;
      const rangeV = (maxV-minV) || 1;
      const isTS = compareChartType === 'bubble-ts';
      datasets.push({
        type:'line',
        label: info.sub,
        data: values,
        borderColor: color,
        backgroundColor: isTS ? hexToRgba(color,0.16) : hexToRgba(color,0.7),
        pointBackgroundColor: color,
        showLine: isTS,
        fill: isTS,
        tension: isTS ? 0.3 : 0,
        borderDash: isTS ? [3,3] : [],
        borderWidth: isTS ? 1.4 : 0,
        pointRadius: function(context){
          const v = context.raw;
          if(v===null||v===undefined) return 0;
          const norm = (v-minV)/rangeV;
          return computeBubbleRadius(norm, context.chart, keys.length);
        },
        pointHoverRadius: function(context){
          const v = context.raw;
          if(v===null||v===undefined) return 0;
          const norm = (v-minV)/rangeV;
          return computeBubbleRadius(norm, context.chart, keys.length) + 3;
        },
        yAxisID
      });
    }else if(isSlope){
      const twoVals = values.length >= 2 ? [values[0], values[values.length-1]] : values;
      datasets.push({
        type:'line', label:info.sub, data:twoVals, borderColor:color, backgroundColor:color,
        pointBackgroundColor:color, pointRadius:5, pointHoverRadius:7, borderWidth:3, tension:0,
        fill:false, yAxisID
      });
    }else{
      const style = getCompareTypeStyle(compareChartType, color);
      datasets.push(Object.assign({ label:info.sub, data:values, borderColor:color, yAxisID, spanGaps:true }, style));
    }
  });

  const hasY1 = !normalizeCompare && keys.length > 1 && keys.some((_, i) => i % 2 === 1);
  const topType = (compareChartType === 'bar' || compareChartType === 'rounded-bar' || compareChartType === 'lollipop') ? 'bar' : 'line';

  const ctx = document.getElementById('compareChart').getContext('2d');
  if(compareChart) compareChart.destroy();
  compareChart = new Chart(ctx, {
    type: topType,
    data:{ labels: chartLabels, datasets },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins:{
        legend:{
          position:'bottom',
          labels:{
            color:'#562F00', font:{family:'Inter', size:11.5}, boxWidth:10, usePointStyle:true,
            filter: (legendItem)=> compareChartType !== 'lollipop' || legendItem.datasetIndex % 2 === 1
          }
        },
        tooltip:{
          callbacks:{
            label: (c)=> `${c.dataset.label} (${c.dataset.yAxisID === 'y1' ? 'Kanan' : 'Kiri'}): ${normalizeCompare ? c.parsed.y.toFixed(1) : fmtNum(c.parsed.y)}${normalizeCompare?' idx':''}`
          }
        }
      },
      scales:{
        x:{ grid:{display:false}, ticks:{ color:'#8A5A24', font:{family:'Inter', size:11} } },
        y:{
          type: 'linear',
          display: true,
          position: 'left',
          grid:{color:'#F2DEB8'},
          ticks:{ color:'#8A5A24', font:{family:'Inter', size:11} }
        },
        y1:{
          type: 'linear',
          display: hasY1,
          position: 'right',
          grid:{ drawOnChartArea: false },
          ticks:{ color:'#8A5A24', font:{family:'Inter', size:11} }
        }
      }
    }
  });

  generateAdvancedAIInsight(seriesAnalysisData);
  renderCompareDefinitions(keys);
}

function getCompareTypeStyle(type, color){
  switch(type){
    case 'bar':
      return { type:'bar', backgroundColor: hexToRgba(color,0.68), borderRadius:0, borderWidth:0 };
    case 'rounded-bar':
      return { type:'bar', backgroundColor: hexToRgba(color,0.68), borderRadius:6, borderWidth:0 };
    case 'area':
      return { type:'line', backgroundColor: hexToRgba(color,0.28), fill:true, tension:0.25, borderWidth:2.2, pointRadius:3, pointHoverRadius:5 };
    case 'spline':
      return { type:'line', backgroundColor: color, fill:false, tension:0.42, borderWidth:2.2, pointRadius:3, pointHoverRadius:5 };
    case 'stepped-area':
      return { type:'line', backgroundColor: hexToRgba(color,0.22), fill:true, stepped:true, tension:0, borderWidth:2.2, pointRadius:2, pointHoverRadius:5 };
    case 'dashed-area':
      return { type:'line', backgroundColor: 'transparent', fill:false, borderDash:[6,4], tension:0, borderWidth:2.2, pointRadius:2, pointHoverRadius:5 };
    case 'scatter':
      return { type:'line', backgroundColor: color, fill:false, showLine:false, borderWidth:0, pointRadius:4, pointHoverRadius:6 };
    case 'line':
    default:
      return { type:'line', backgroundColor: color, fill:false, tension:0.22, borderWidth:2.2, pointRadius:3, pointHoverRadius:5 };
  }
}

function generateAdvancedAIInsight(dataList){
  const textEl = document.getElementById('aiInsightText');
  if(!textEl) return;

  if(!dataList || dataList.length === 0){
    textEl.innerHTML = `Silakan centang minimal satu indikator di panel sebelah kiri.`;
    return;
  }

  let html = `<span class="insight-section-title">📊 Rangkuman Kinerja & Tren Multi-Indikator</span>`;
  html += `Analisis mencakup rentang waktu <b>${compareFrom}</b> hingga <b>${compareTo}</b>:<br><br>`;

  dataList.forEach(item=>{
    const arah = item.pct > 0 ? 'menunjukkan tren kenaikan' : (item.pct < 0 ? 'menunjukkan tren penurunan' : 'cenderung stagnan');
    const warnaArah = item.pct > 0 ? 'color:var(--rust);' : (item.pct < 0 ? 'color:var(--green);' : '');
    
    html += `• <b>${escapeHtml(item.name)}</b>: <span style="${warnaArah}font-weight:700;">${arah}</span> sebesar <b>${item.pct > 0 ? '+' : ''}${item.pct.toFixed(1)}%</b> secara kumulatif (Laju rata-rata tahunan/CAGR: <b>${item.cagr > 0 ? '+' : ''}${item.cagr.toFixed(2)}%/tahun</b>). Nilai tertinggi tercatat pada <b>${item.maxLabel}</b> (${fmtNum(item.max)} ${item.unit}), sementara titik terendahnya berada di <b>${item.minLabel}</b> (${fmtNum(item.min)} ${item.unit}).<br>`;
  });

  html += `<span class="insight-section-title" style="margin-top:14px;">🔍 Catatan Komparasi & Rekomendasi Analisis</span>`;
  if(dataList.length === 1){
    html += `Anda sedang memantau satu indikator tunggal. Tambahkan indikator pembanding lain di panel sebelah kiri untuk melihat pola korelasi atau divergensi antar variabel.`;
  } else {
    html += `Dengan membandingkan <b>${dataList.length} indikator terpilih</b>, Anda dapat mengamati apakah pergerakan variabel-variabel ini saling sejalan (sinkron) atau bergerak secara berlawanan (trade-off).`;
  }

  textEl.innerHTML = html;
}

function renderCompareDefinitions(keys){
  const listEl = document.getElementById('compareDefsList');
  if(!listEl) return;

  let html = '';
  keys.forEach(k=>{
    const info = compareIndex[k];
    const def = DEFINISI[info.sub] || 'Belum ada deskripsi definisi untuk indikator ini.';
    html += `<div class="def-item"><b>${escapeHtml(info.sub)}:</b> ${escapeHtml(def)}</div>`;
  });
  listEl.innerHTML = html;
}

document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'overlay') closeDetail();
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') closeDetail();
});

function buildSeriesInsight(filtered, indikator){
  if(!filtered || filtered.length === 0) return 'Tidak ada data pada rentang periode ini.';
  const satuan = SATUAN[indikator] ? ' ' + escapeHtml(SATUAN[indikator]) : '';
  const first = filtered[0];
  const last = filtered[filtered.length-1];

  let maxObj = filtered[0], minObj = filtered[0], sum = 0;
  filtered.forEach(e=>{
    if(e.data > maxObj.data) maxObj = e;
    if(e.data < minObj.data) minObj = e;
    sum += e.data;
  });
  const avg = sum / filtered.length;

  let trendWord = 'relatif stabil dibandingkan', trendClass = 'trend-flat';
  if(last.data > first.data){ trendWord = 'meningkat dibandingkan'; trendClass = 'trend-up'; }
  else if(last.data < first.data){ trendWord = 'menurun dibandingkan'; trendClass = 'trend-down'; }

  let html = `Pada periode <b>${periodLabel(last)}</b>, indikator <b>${escapeHtml(indikator)}</b> tercatat <b>${fmtNum(last.data)}${satuan}</b>.`;

  if(first !== last){
    const diff = last.data - first.data;
    const pct = first.data !== 0 ? (diff/first.data*100) : 0;
    const spanYears = (last.tahun - first.tahun) || 1;
    const cagr = first.data > 0 ? (Math.pow(last.data/first.data, 1/spanYears) - 1) * 100 : 0;
    html += ` Nilai ini <span class="${trendClass}">${trendWord}</span> periode <b>${periodLabel(first)}</b> (${fmtNum(first.data)}${satuan}), setara perubahan kumulatif <b>${pct>0?'+':''}${pct.toFixed(1)}%</b> (laju rata-rata tahunan/CAGR: <b>${cagr>0?'+':''}${cagr.toFixed(2)}%/tahun</b>).`;
  }

  html += ` Sepanjang rentang ini, nilai tertinggi tercatat pada <b>${periodLabel(maxObj)}</b> (${fmtNum(maxObj.data)}${satuan}) dan terendah pada <b>${periodLabel(minObj)}</b> (${fmtNum(minObj.data)}${satuan}), dengan rata-rata sekitar <b>${fmtNum(avg)}${satuan}</b>.`;

  return html;
}

function refreshDetail(entries, fromYear, toYear){
  const filtered = entries.filter(e=>e.tahun>=fromYear && e.tahun<=toYear);
  const labels = filtered.map(periodLabel);
  const values = filtered.map(e=>e.data);

  const latest = filtered[filtered.length-1];
  const prev = filtered[filtered.length-2];
  let changeStr = '—';
  if(latest && prev && prev.data !== 0){
    const pct = ((latest.data-prev.data)/prev.data)*100;
    changeStr = (pct>0?'▲ +':'▼ ') + pct.toFixed(1) + '%';
  }
  const max = filtered.length ? Math.max(...values) : NaN;
  const min = filtered.length ? Math.min(...values) : NaN;

  document.getElementById('statBoxes').innerHTML = `
    <div class="stat-box"><div class="stat-label">Nilai Terkini</div><div class="stat-value">${fmtNum(latest?latest.data:NaN)}</div></div>
    <div class="stat-box"><div class="stat-label">Perubahan</div><div class="stat-value">${changeStr}</div></div>
    <div class="stat-box"><div class="stat-label">Tertinggi / Terendah</div><div class="stat-value" style="font-size:15px;">${fmtNum(max)} / ${fmtNum(min)}</div></div>
  `;

  const narrEl = document.getElementById('drawerNarrative');
  if(narrEl && currentSeriesKey){
    narrEl.innerHTML = buildSeriesInsight(filtered, currentSeriesKey.sub);
  }

  let rows = '';
  [...filtered].reverse().forEach(e=>{
    rows += `<tr><td>${periodLabel(e)}</td><td>${fmtNum(e.data)}</td></tr>`;
  });
  document.getElementById('detailTable').innerHTML =
    `<thead><tr><th>Periode</th><th>Nilai</th></tr></thead><tbody>${rows}</tbody>`;

  const canvasEl = document.getElementById('detailChart');
  if(typeof Chart === 'undefined'){
    canvasEl.parentElement.innerHTML = '<div style="padding:20px;font-size:13px;color:var(--brown-mid);">Grafik gagal dimuat (library Chart.js tidak tersedia). Coba refresh halaman.</div>';
    return;
  }
  const ctx = canvasEl.getContext('2d');
  if(chartInstance) chartInstance.destroy();

  const accent = currentDetailColor || '#FF9644';
  const isBar = currentDetailChartType === 'bar' || currentDetailChartType === 'rounded-bar';
  const isLollipop = currentDetailChartType === 'lollipop';
  const isSpline = currentDetailChartType === 'spline';
  const isBubbleTS = currentDetailChartType === 'bubble-ts';
  const isPureBubble = currentDetailChartType === 'pure-bubble';
  const isScatter = currentDetailChartType === 'scatter';
  const isStepped = currentDetailChartType === 'stepped-area';
  const isDashed = currentDetailChartType === 'dashed-area';

  let datasets = [];
  if (isLollipop) {
    datasets = [
      {
        type: 'bar',
        data: values,
        backgroundColor: hexToRgba(accent, 0.6),
        borderWidth: 0,
        maxBarThickness: 4,
        borderRadius: 0
      },
      {
        type: 'line',
        data: values,
        borderColor: accent,
        backgroundColor: accent,
        pointBackgroundColor: accent,
        pointRadius: 5,
        pointHoverRadius: 7,
        showLine: false,
        fill: false
      }
    ];
  } else if (isPureBubble) {
    const minV = Math.min(...values), maxV = Math.max(...values);
    const rangeV = (maxV - minV) || 1;
    datasets = [{
      type: 'line',
      data: values,
      borderColor: accent,
      backgroundColor: hexToRgba(accent, 0.75),
      pointRadius: function(context) {
        const v = context.raw;
        if(v === null || v === undefined) return 0;
        const norm = (v - minV) / rangeV;
        return computeBubbleRadius(norm, context.chart, 1);
      },
      pointHoverRadius: function(context) {
        const v = context.raw;
        if(v === null || v === undefined) return 0;
        const norm = (v - minV) / rangeV;
        return computeBubbleRadius(norm, context.chart, 1) + 3;
      },
      pointBackgroundColor: accent,
      showLine: false,
      fill: false
    }];
  } else if (isBubbleTS) {
    const minV = Math.min(...values), maxV = Math.max(...values);
    const rangeV = (maxV - minV) || 1;
    datasets = [{
      type: 'line',
      data: values,
      borderColor: accent,
      backgroundColor: hexToRgba(accent, 0.22),
      pointRadius: function(context) {
        const v = context.raw;
        if(v === null || v === undefined) return 0;
        const norm = (v - minV) / rangeV;
        return computeBubbleRadius(norm, context.chart, 1) * 0.8;
      },
      pointHoverRadius: function(context) {
        const v = context.raw;
        if(v === null || v === undefined) return 0;
        const norm = (v - minV) / rangeV;
        return computeBubbleRadius(norm, context.chart, 1) * 0.8 + 3;
      },
      pointBackgroundColor: accent,
      borderWidth: 2.2,
      fill: true,
      tension: 0.3
    }];
  } else if (isBar) {
    datasets = [{
      data: values,
      backgroundColor: hexToRgba(accent, 0.75),
      borderColor: accent,
      borderWidth: 1,
      borderRadius: 0, // Siku tegas tanpa lengkung (standard bar chart)
      maxBarThickness: 38
    }];
  } else if (isScatter) {
    datasets = [{
      type: 'line',
      data: values,
      borderColor: accent,
      backgroundColor: accent,
      pointBackgroundColor: accent,
      pointRadius: 5,
      pointHoverRadius: 7,
      showLine: false,
      fill: false
    }];
  } else {
    const gradient = ctx.createLinearGradient(0,0,0,260);
    gradient.addColorStop(0, hexToRgba(accent, 0.35));
    gradient.addColorStop(1, hexToRgba(accent, 0.02));
    datasets = [{
      data: values,
      borderColor: accent,
      backgroundColor: gradient,
      pointBackgroundColor: accent,
      pointRadius: 4,
      pointHoverRadius: 6,
      borderWidth: 2.5,
      fill: true,
      tension: isSpline ? 0.4 : ((isStepped || isDashed) ? 0 : 0.25),
      stepped: isSpline ? false : (isStepped ? true : false),
      borderDash: isDashed ? [6, 4] : []
    }];
  }

  chartInstance = new Chart(ctx, {
    type: isBar ? 'bar' : 'line',
    data:{ labels, datasets },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{
        x:{ 
          grid:{display:false}, 
          ticks:{ color:'#8A5A24', font:{family:'Inter', size:11} } 
        },
        y:{ grid:{color:'#F2DEB8'}, ticks:{ color:'#8A5A24', font:{family:'Inter', size:11} } }
      }
    }
  });
}

function computeBubbleRadius(norm, chart, seriesCount){
  norm = Math.max(0, Math.min(1, isFinite(norm) ? norm : 0));
  const area = chart && chart.chartArea;
  const n = (chart && chart.data && chart.data.labels) ? chart.data.labels.length : 10;
  const plotWidth = area ? Math.max(60, area.right - area.left) : 300;
  const perPoint = plotWidth / Math.max(1, n) / Math.max(1, seriesCount || 1);
  const maxR = Math.max(5, Math.min(20, perPoint * 0.42));
  const minR = Math.max(3, maxR * 0.32);
  return minR + Math.sqrt(norm) * (maxR - minR);
}

function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16);
  const g = parseInt(h.substring(2,4),16);
  const b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

loadData();
</script>
