    info.entries.forEach(e=>{ bySort[sortKey(e)] = e.data; });
    return sortedKeys.map(sk=> bySort.hasOwnProperty(sk) ? bySort[sk] : 0);
  });

  const W = 600, H = 300, padTop = 10, padBottom = 30, padLeft = 4, padRight = 4;
  const plotW = W - padLeft - padRight, plotH = H - padTop - padBottom;

  const periodTotals = sortedKeys.map((sk,ti)=> valuesByKey.reduce((s,vals)=> s + Math.max(0,vals[ti]||0), 0));
  const grandTotal = periodTotals.reduce((s,v)=>s+v,0) || 1;

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" id="cmpMarimekkoSvg" style="width:100%;height:340px;display:block;">`;
  let xCursor = padLeft;
  sortedKeys.forEach((sk, si)=>{
    const total = periodTotals[si] || 0;
    const colW = grandTotal > 0 ? (total/grandTotal) * plotW : plotW/sortedKeys.length;
    let yCursor = padTop;
    keys.forEach((k,i)=>{
      const info = compareIndex[k];
      const v = Math.max(0, valuesByKey[i][si] || 0);
      const shareH = total > 0 ? (v/total) * plotH : 0;
      const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
      svg += `<rect x="${xCursor.toFixed(1)}" y="${yCursor.toFixed(1)}" width="${Math.max(0,colW-1.5).toFixed(1)}" height="${Math.max(0,shareH-1).toFixed(1)}" fill="${color}"><title>${escapeHtml(info.sub)} (${escapeHtml(uniqueLabelsMap.get(sk)||'')}): ${fmtNum(v)}</title></rect>`;
      yCursor += shareH;
    });
    if(colW > 20){
      svg += `<text x="${(xCursor+colW/2).toFixed(1)}" y="${(H-12).toFixed(1)}" font-size="9" text-anchor="middle" fill="#8A5A24">${escapeHtml(uniqueLabelsMap.get(sk)||'')}</text>`;
    }
    xCursor += colW;
  });
  svg += `</svg>`;

  const legend = keys.map((k,i)=>{
    const info = compareIndex[k];
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    return `<div class="comp-legend-item"><span class="dot" style="background:${color}"></span>${escapeHtml(info.sub)}</div>`;
  }).join('');

  return svg + `<div class="comp-legend" style="margin-top:10px;">${legend}</div><div class="comp-chart-note">Lebar tiap kolom sebanding dengan total gabungan seluruh indikator pada tahun tersebut (relatif terhadap total seluruh tahun); tinggi tiap segmen menunjukkan porsi indikator dalam tahun itu. Bermakna optimal jika satuan antar indikator sebanding.</div>`;
}

function buildCompareRadialBarSVG(keys){
  const uniqueLabelsMap = new Map();
  keys.forEach(k=>{
    compareIndex[k].entries.forEach(e=>{
      if(e.tahun >= compareFrom && e.tahun <= compareTo) uniqueLabelsMap.set(sortKey(e), periodLabel(e));
    });
  });
  const sortedKeys = [...uniqueLabelsMap.keys()].sort((a,b)=>a-b);
  if(sortedKeys.length === 0){
    return '<div style="padding:20px;font-size:13px;color:var(--brown-mid);">Tidak ada data pada rentang ini.</div>';
  }

  const valuesByKey = keys.map(k=>{
    const info = compareIndex[k];
    const bySort = {};
    info.entries.forEach(e=>{ bySort[sortKey(e)] = e.data; });
    return sortedKeys.map(sk=> bySort.hasOwnProperty(sk) ? bySort[sk] : null);
  });

  let allVals = [];
  valuesByKey.forEach(arr=> arr.forEach(v=>{ if(v!==null && v!==undefined) allVals.push(v); }));
  const maxV = allVals.length ? Math.max(...allVals) : 1;

  const W = 460, H = 460;
  const cx = W/2, cy = H/2;
  const rInner = 34, rOuter = Math.min(W,H)/2 - 46;
  const n = sortedKeys.length;
  const anglePer = (2*Math.PI) / n;
  const gapAngle = anglePer * 0.18;
  const barAngle = (anglePer - gapAngle) / keys.length;

  function polar(r, a){
    return [cx + r*Math.cos(a - Math.PI/2), cy + r*Math.sin(a - Math.PI/2)];
  }
  function arcPath(r0, r1, a0, a1){
    const [x0a,y0a] = polar(r0,a0);
    const [x1a,y1a] = polar(r1,a0);
    const [x1b,y1b] = polar(r1,a1);
    const [x0b,y0b] = polar(r0,a1);
    const large = (a1-a0) > Math.PI ? 1 : 0;
    return `M${x0a.toFixed(1)},${y0a.toFixed(1)} L${x1a.toFixed(1)},${y1a.toFixed(1)} A${r1.toFixed(1)},${r1.toFixed(1)} 0 ${large} 1 ${x1b.toFixed(1)},${y1b.toFixed(1)} L${x0b.toFixed(1)},${y0b.toFixed(1)} A${r0.toFixed(1)},${r0.toFixed(1)} 0 ${large} 0 ${x0a.toFixed(1)},${y0a.toFixed(1)} Z`;
  }

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" id="cmpRadialBarSvg" style="width:100%;max-width:460px;height:auto;display:block;margin:0 auto;">`;

  [0.25,0.5,0.75,1].forEach(f=>{
    svg += `<circle cx="${cx}" cy="${cy}" r="${(rInner + f*(rOuter-rInner)).toFixed(1)}" fill="none" stroke="#F2DEB8" stroke-width="1"></circle>`;
  });

  sortedKeys.forEach((sk, ti)=>{
    const a0 = ti*anglePer;
    keys.forEach((k,ki)=>{
      const v = valuesByKey[ki][ti];
      if(v===null || v===undefined) return;
      const color = COMPARE_COLORS[ki % COMPARE_COLORS.length];
      const frac = maxV>0 ? Math.max(0,v)/maxV : 0;
      const r1 = rInner + frac*(rOuter-rInner);
      const segA0 = a0 + ki*barAngle;
      const segA1 = segA0 + barAngle*0.86;
      svg += `<path d="${arcPath(rInner,r1,segA0,segA1)}" fill="${color}"><title>${escapeHtml(compareIndex[k].sub)} · ${escapeHtml(uniqueLabelsMap.get(sk)||'')}: ${fmtNum(v)}</title></path>`;
    });
    const labelA = a0 + anglePer/2;
    const [lx,ly] = polar(rOuter+16, labelA);
    svg += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="9.5" text-anchor="middle" dominant-baseline="middle" fill="#8A5A24">${escapeHtml(uniqueLabelsMap.get(sk)||'')}</text>`;
  });

  svg += `</svg>`;

  const legend = keys.map((k,i)=>{
    const info = compareIndex[k];
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    return `<div class="comp-legend-item"><span class="dot" style="background:${color}"></span>${escapeHtml(info.sub)}</div>`;
  }).join('');

  return svg + `<div class="comp-legend" style="margin-top:10px;">${legend}</div><div class="comp-chart-note">Setiap sektor melingkar mewakili satu periode; panjang batang radial dari pusat sebanding dengan nilai indikator (dinormalisasi terhadap nilai maksimum di antara seluruh indikator terpilih).</div>`;
}

  keys.forEach(k=>{
    compareIndex[k].entries.forEach(e=>{
      if(e.tahun >= compareFrom && e.tahun <= compareTo) uniqueLabelsMap.set(sortKey(e), periodLabel(e));
    });
  });
  const sortedKeys = [...uniqueLabelsMap.keys()].sort((a,b)=>a-b);
  if(sortedKeys.length === 0){
    return '<div style="padding:20px;font-size:13px;color:var(--brown-mid);">Tidak ada data pada rentang ini.</div>';
  }

  const rows = keys.map((k,i)=>{
    const info = compareIndex[k];
    const bySort = {};
    info.entries.forEach(e=>{ bySort[sortKey(e)] = e.data; });
    const vals = sortedKeys.map(sk=> bySort.hasOwnProperty(sk) ? bySort[sk] : null).filter(v=>v!==null && v!==undefined);
    const latest = vals.length ? vals[vals.length-1] : 0;
    const target = vals.length > 1 ? vals[vals.length-2] : latest;
    const minV = vals.length ? Math.min(0, ...vals) : 0;
    const maxV = vals.length ? Math.max(...vals) : 1;
    const avgV = vals.length ? vals.reduce((s,v)=>s+v,0)/vals.length : 0;
    return { label: info.sub, latest, target, minV, maxV: (maxV||1), avgV, color: COMPARE_COLORS[i % COMPARE_COLORS.length] };
  });

  const W = 640;
  const rowH = 54;
  const H = rows.length * rowH + 16;
  const padLeft = 152, padRight = 30;
  const plotW = W - padLeft - padRight;

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" id="cmpBulletSvg" style="width:100%;height:${Math.min(H,440)}px;display:block;">`;

  rows.forEach((r, i)=>{
    const y0 = 12 + i*rowH;
    const gMin = r.minV;
    const gMax = r.maxV === gMin ? gMin+1 : r.maxV;
    const scale = plotW / (gMax-gMin);
    const xAt = v => padLeft + (v-gMin)*scale;

    const bandY = y0 + 8, bandH = 22;
    svg += `<rect x="${xAt(gMin).toFixed(1)}" y="${bandY}" width="${Math.max(0,xAt(r.avgV)-xAt(gMin)).toFixed(1)}" height="${bandH}" fill="#F2DEB8"></rect>`;
    svg += `<rect x="${xAt(r.avgV).toFixed(1)}" y="${bandY}" width="${Math.max(0,xAt(gMax)-xAt(r.avgV)).toFixed(1)}" height="${bandH}" fill="#EACB8E"></rect>`;

    const barY = bandY + bandH/2 - 5;
    svg += `<rect x="${xAt(gMin).toFixed(1)}" y="${barY}" width="${Math.max(0,xAt(r.latest)-xAt(gMin)).toFixed(1)}" height="10" fill="${r.color}"><title>${escapeHtml(r.label)}: ${fmtNum(r.latest)}</title></rect>`;

    const tx = xAt(r.target).toFixed(1);
    svg += `<line x1="${tx}" y1="${bandY-4}" x2="${tx}" y2="${bandY+bandH+4}" stroke="#562F00" stroke-width="2.5"><title>Periode sebelumnya: ${fmtNum(r.target)}</title></line>`;

    const shortLabel = r.label.length > 24 ? r.label.slice(0,22)+'…' : r.label;
    svg += `<text x="${padLeft-10}" y="${(bandY+bandH/2+4).toFixed(1)}" font-size="10.5" text-anchor="end" fill="#562F00">${escapeHtml(shortLabel)}</text>`;
  });

  svg += `</svg>`;

  return svg + `<div class="comp-chart-note">Bar berwarna = nilai periode terakhir dalam rentang yang dipilih. Garis tegak gelap = nilai periode sebelumnya (pembanding/target). Pita latar menunjukkan rentang minimum–rata-rata–maksimum historis pada rentang tersebut.</div>`;
}

        pointRadius: function(context){

          return computeBubbleRadius(norm, context.chart, keys.length);

  generateAdvancedAIInsight(seriesAnalysisData);

function getCompareTypeStyle(type, color){
  switch(type){
    case 'bar':
      return { type:'bar', backgroundColor: hexToRgba(color,0.68), borderRadius:0, borderWidth:0 };
    case 'rounded-bar':
      return { type:'bar', backgroundColor: hexToRgba(color,0.68), borderRadius:6, borderWidth:0 };
    case 'area':
      return { type:'line', backgroundColor: hexToRgba(color,0.28), fill:true, tension:0.25, borderWidth:2.2, pointRadius:3, pointHoverRadius:5 };
    case 'spline':
      return { type:'line', backgroundColor: color, fill:false, tension:0.42, borderWidth:2.2, pointRadius:3, pointHoverRadius:5 };
    case 'stepped-area':
      return { type:'line', backgroundColor: hexToRgba(color,0.22), fill:true, stepped:true, tension:0, borderWidth:2.2, pointRadius:2, pointHoverRadius:5 };
    case 'dashed-area':
      return { type:'line', backgroundColor: 'transparent', fill:false, borderDash:[6,4], tension:0, borderWidth:2.2, pointRadius:2, pointHoverRadius:5 };
    case 'scatter':
      return { type:'line', backgroundColor: color, fill:false, showLine:false, borderWidth:0, pointRadius:4, pointHoverRadius:6 };
    case 'stacked-area':
      return { type:'line', backgroundColor: hexToRgba(color,0.55), fill:true, tension:0, pointRadius:0, borderWidth:1.5, stack:'cmp' };
    case 'stacked-bar':
      return { type:'bar', backgroundColor: hexToRgba(color,0.78), borderRadius:0, borderWidth:0, stack:'cmp' };
    case 'stacked-bar-100':
      return { type:'bar', backgroundColor: hexToRgba(color,0.78), borderRadius:0, borderWidth:0, stack:'cmp' };
    case 'line':
    default:
      return { type:'line', backgroundColor: color, fill:false, tension:0.22, borderWidth:2.2, pointRadius:3, pointHoverRadius:5 };
  }
}

function pearsonCorrelation(a, b){
  const pairs = [];
  for(let i=0;i<a.length && i<b.length;i++){
    if(a[i]!==null && a[i]!==undefined && b[i]!==null && b[i]!==undefined) pairs.push([a[i],b[i]]);
  }
  if(pairs.length < 3) return null;
  const n = pairs.length;
  const meanA = pairs.reduce((s,p)=>s+p[0],0)/n;
  const meanB = pairs.reduce((s,p)=>s+p[1],0)/n;
  let cov = 0, varA = 0, varB = 0;
  pairs.forEach(p=>{
    cov += (p[0]-meanA)*(p[1]-meanB);
    varA += Math.pow(p[0]-meanA,2);
    varB += Math.pow(p[1]-meanB,2);
  });
  if(varA === 0 || varB === 0) return null;
  return cov / Math.sqrt(varA*varB);
}

function generateAdvancedAIInsight(dataList){
  const textEl = document.getElementById('aiInsightText');
  if(!textEl) return;

  if(!dataList || dataList.length === 0){
    textEl.innerHTML = `Silakan centang minimal satu indikator di panel sebelah kiri.`;
    return;
  }

  let html = `<span class="insight-section-title">📊 Rangkuman Kinerja & Tren Multi-Indikator</span>`;
  html += `Analisis mencakup rentang waktu <b>${compareFrom}</b> hingga <b>${compareTo}</b>:<br><br>`;

  dataList.forEach(item=>{
    const arah = item.pct > 0 ? 'menunjukkan tren kenaikan' : (item.pct < 0 ? 'menunjukkan tren penurunan' : 'cenderung stagnan');
    const warnaArah = item.pct > 0 ? 'color:var(--rust);' : (item.pct < 0 ? 'color:var(--green);' : '');
    
    html += `• <b>${escapeHtml(item.name)}</b>: <span style="${warnaArah}font-weight:700;">${arah}</span> sebesar <b>${item.pct > 0 ? '+' : ''}${item.pct.toFixed(1)}%</b> secara kumulatif (Laju rata-rata tahunan/CAGR: <b>${item.cagr > 0 ? '+' : ''}${item.cagr.toFixed(2)}%/tahun</b>). Nilai tertinggi tercatat pada <b>${item.maxLabel}</b> (${fmtNum(item.max)} ${item.unit}), sementara titik terendahnya berada di <b>${item.minLabel}</b> (${fmtNum(item.min)} ${item.unit}).<br>`;
  });

  if(dataList.some(d=>d.rawValues && d.rawValues.filter(v=>v!==null&&v!==undefined).length >= 3)){
    html += `<span class="insight-section-title" style="margin-top:14px;">📈 Volatilitas Tiap Indikator</span>`;
    const volList = dataList.map(item=>{
      const vals = (item.rawValues||[]).filter(v=>v!==null && v!==undefined);
      if(vals.length < 3) return {name:item.name, cv:null};
      const mean = vals.reduce((s,v)=>s+v,0)/vals.length;
      const variance = vals.reduce((s,v)=>s+Math.pow(v-mean,2),0)/vals.length;
      const cv = mean !== 0 ? Math.abs(Math.sqrt(variance)/mean*100) : 0;
      return {name:item.name, cv};
    }).filter(v=>v.cv !== null);
    volList.sort((a,b)=>b.cv-a.cv);
    if(volList.length > 0){
      html += volList.map(v=>{
        let w = 'stabil';
        if(v.cv >= 25) w = 'cukup fluktuatif';
        else if(v.cv >= 10) w = 'sedikit berfluktuasi';
        return `• <b>${escapeHtml(v.name)}</b>: ${w} (CV ≈ ${v.cv.toFixed(1)}%)`;
      }).join('<br>') + '<br>';
    }
  }

  if(dataList.length >= 2){
    const corrPairs = [];
    for(let i=0;i<dataList.length;i++){
      for(let j=i+1;j<dataList.length;j++){
        const r = pearsonCorrelation(dataList[i].rawValues||[], dataList[j].rawValues||[]);
        if(r !== null) corrPairs.push({a:dataList[i].name, b:dataList[j].name, r});
      }
    }
    if(corrPairs.length > 0){
      corrPairs.sort((x,y)=>Math.abs(y.r)-Math.abs(x.r));
      html += `<span class="insight-section-title" style="margin-top:14px;">🔗 Korelasi Antar Indikator</span>`;
      corrPairs.slice(0,4).forEach(p=>{
        let word = 'nyaris tidak berkorelasi';
        let cls = 'trend-flat';
        if(p.r >= 0.7){ word = 'bergerak searah dengan kuat'; cls='trend-up'; }
        else if(p.r >= 0.3){ word = 'cenderung bergerak searah'; cls='trend-up'; }
        else if(p.r <= -0.7){ word = 'bergerak berlawanan arah dengan kuat (trade-off)'; cls='trend-down'; }
        else if(p.r <= -0.3){ word = 'cenderung bergerak berlawanan arah'; cls='trend-down'; }
        html += `• <b>${escapeHtml(p.a)}</b> vs <b>${escapeHtml(p.b)}</b>: <span class="${cls}" style="font-weight:700;">${word}</span> (r = ${p.r.toFixed(2)})<br>`;
      });
    }
  }

  html += `<span class="insight-section-title" style="margin-top:14px;">🔍 Catatan Komparasi & Rekomendasi Analisis</span>`;
  if(dataList.length === 1){
    html += `Anda sedang memantau satu indikator tunggal. Tambahkan indikator pembanding lain di panel sebelah kiri untuk melihat pola korelasi atau divergensi antar variabel.`;
  } else {
    html += `Dengan membandingkan <b>${dataList.length} indikator terpilih</b>, Anda dapat mengamati apakah pergerakan variabel-variabel ini saling sejalan (sinkron) atau bergerak secara berlawanan (trade-off). Perhatikan bahwa korelasi statistik di atas tidak selalu menunjukkan hubungan sebab-akibat.`;
  }

  textEl.innerHTML = html;
}

function buildSeriesInsight(filtered, indikator){
  if(!filtered || filtered.length === 0) return 'Tidak ada data pada rentang periode ini.';
  const satuan = SATUAN[indikator] ? ' ' + escapeHtml(SATUAN[indikator]) : '';
  const first = filtered[0];
  const last = filtered[filtered.length-1];

  let maxObj = filtered[0], minObj = filtered[0], sum = 0;
  filtered.forEach(e=>{
    if(e.data > maxObj.data) maxObj = e;
    if(e.data < minObj.data) minObj = e;
    sum += e.data;
  });
  const avg = sum / filtered.length;
  const variance = filtered.reduce((s,e)=>s + Math.pow(e.data-avg,2), 0) / filtered.length;
  const stdev = Math.sqrt(variance);
  const cv = avg !== 0 ? Math.abs(stdev/avg*100) : 0;

  let trendWord = 'relatif stabil dibandingkan', trendClass = 'trend-flat';
  if(last.data > first.data){ trendWord = 'meningkat dibandingkan'; trendClass = 'trend-up'; }
  else if(last.data < first.data){ trendWord = 'menurun dibandingkan'; trendClass = 'trend-down'; }

  let html = `Pada periode <b>${periodLabel(last)}</b>, indikator <b>${escapeHtml(indikator)}</b> tercatat <b>${fmtNum(last.data)}${satuan}</b>.`;

  if(first !== last){
    const diff = last.data - first.data;
    const pct = first.data !== 0 ? (diff/first.data*100) : 0;
    const spanYears = (last.tahun - first.tahun) || 1;
    const cagr = first.data > 0 ? (Math.pow(last.data/first.data, 1/spanYears) - 1) * 100 : 0;
    html += ` Nilai ini <span class="${trendClass}">${trendWord}</span> periode <b>${periodLabel(first)}</b> (${fmtNum(first.data)}${satuan}), setara perubahan kumulatif <b>${pct>0?'+':''}${pct.toFixed(1)}%</b> (laju rata-rata tahunan/CAGR: <b>${cagr>0?'+':''}${cagr.toFixed(2)}%/tahun</b>).`;
  }

  html += ` Sepanjang rentang ini, nilai tertinggi tercatat pada <b>${periodLabel(maxObj)}</b> (${fmtNum(maxObj.data)}${satuan}) dan terendah pada <b>${periodLabel(minObj)}</b> (${fmtNum(minObj.data)}${satuan}), dengan rata-rata sekitar <b>${fmtNum(avg)}${satuan}</b>.`;

  if(filtered.length >= 3){
    let volWord = 'cenderung stabil dari tahun ke tahun';
    if(cv >= 25) volWord = 'cukup fluktuatif dari tahun ke tahun';
    else if(cv >= 10) volWord = 'sedikit berfluktuasi dari tahun ke tahun';
    html += ` Secara sebaran, nilai indikator ini ${volWord} (koefisien variasi sekitar ${cv.toFixed(1)}%, simpangan baku ±${fmtNum(stdev)}${satuan}).`;
  }

  if(filtered.length >= 3){
    let upCount = 0, downCount = 0, flatCount = 0;
    for(let i=1;i<filtered.length;i++){
      const d = filtered[i].data - filtered[i-1].data;
      if(d > 0) upCount++; else if(d < 0) downCount++; else flatCount++;
    }
    let streak = 1, streakDir = null;
    for(let i=filtered.length-1;i>0;i--){
      const d = filtered[i].data - filtered[i-1].data;
      const dir = d > 0 ? 'up' : (d < 0 ? 'down' : 'flat');
      if(streakDir === null){ streakDir = dir; if(dir==='flat') break; }
      else if(dir === streakDir){ streak++; } else break;
    }
    const totalMoves = upCount + downCount + flatCount;
    html += ` Dari ${totalMoves} pergerakan antar periode, tercatat <b>${upCount} kali naik</b> dan <b>${downCount} kali turun</b>`;
    if(streak >= 2 && (streakDir === 'up' || streakDir === 'down')){
      html += `, dengan tren <b>${streakDir==='up'?'kenaikan':'penurunan'} beruntun ${streak} periode terakhir</b>`;
    }
    html += '.';

    if(filtered.length >= 2){
      const lastYoY = filtered[filtered.length-1].data - filtered[filtered.length-2].data;
      const lastYoYPct = filtered[filtered.length-2].data !== 0 ? (lastYoY/filtered[filtered.length-2].data*100) : 0;
      html += ` Perubahan periode terakhir (<b>${periodLabel(filtered[filtered.length-2])}</b> → <b>${periodLabel(filtered[filtered.length-1])}</b>) sebesar <b>${lastYoY>0?'+':''}${fmtNum(lastYoY)}${satuan}</b> (${lastYoYPct>0?'+':''}${lastYoYPct.toFixed(1)}%).`;
    }
  }

  return html;
}

function refreshDetail(entries, fromYear, toYear){
  const filtered = entries.filter(e=>e.tahun>=fromYear && e.tahun<=toYear);
  const labels = filtered.map(periodLabel);
  const values = filtered.map(e=>e.data);

  const latest = filtered[filtered.length-1];
  const prev = filtered[filtered.length-2];
  let changeStr = '—';
  if(latest && prev && prev.data !== 0){
    const pct = ((latest.data-prev.data)/prev.data)*100;
    changeStr = (pct>0?'▲ +':'▼ ') + pct.toFixed(1) + '%';
  }
  const max = filtered.length ? Math.max(...values) : NaN;
  const min = filtered.length ? Math.min(...values) : NaN;

  document.getElementById('statBoxes').innerHTML = `
    <div class="stat-box"><div class="stat-label">Nilai Terkini</div><div class="stat-value">${fmtNum(latest?latest.data:NaN)}</div></div>
    <div class="stat-box"><div class="stat-label">Perubahan</div><div class="stat-value">${changeStr}</div></div>
    <div class="stat-box"><div class="stat-label">Tertinggi / Terendah</div><div class="stat-value" style="font-size:15px;">${fmtNum(max)} / ${fmtNum(min)}</div></div>
  `;

  const narrEl = document.getElementById('drawerNarrative');
  if(narrEl && currentSeriesKey){
    narrEl.innerHTML = buildSeriesInsight(filtered, currentSeriesKey.sub);
  }

  let rows = '';
  [...filtered].reverse().forEach(e=>{
    rows += `<tr><td>${periodLabel(e)}</td><td>${fmtNum(e.data)}</td></tr>`;
  });
  document.getElementById('detailTable').innerHTML =
    `<thead><tr><th>Periode</th><th>Nilai</th></tr></thead><tbody>${rows}</tbody>`;

  const canvasEl = document.getElementById('detailChart');
  if(typeof Chart === 'undefined'){
    canvasEl.parentElement.innerHTML = '<div style="padding:20px;font-size:13px;color:var(--brown-mid);">Grafik gagal dimuat (library Chart.js tidak tersedia). Coba refresh halaman.</div>';
    return;
  }
  const ctx = canvasEl.getContext('2d');
  if(chartInstance) chartInstance.destroy();

  const accent = currentDetailColor || '#FF9644';
  const isBar = currentDetailChartType === 'bar' || currentDetailChartType === 'rounded-bar';
  const isLollipop = currentDetailChartType === 'lollipop';
  const isSpline = currentDetailChartType === 'spline';
  const isBubbleTS = currentDetailChartType === 'bubble-ts';
  const isPureBubble = currentDetailChartType === 'pure-bubble';
  const isScatter = currentDetailChartType === 'scatter';
  const isStepped = currentDetailChartType === 'stepped-area';
  const isDashed = currentDetailChartType === 'dashed-area';
  const isWaterfall = currentDetailChartType === 'waterfall';
  const isFunnel = currentDetailChartType === 'funnel';
  const isSurface = currentDetailChartType === 'surface';
  const isRadar = currentDetailChartType === 'radar';
  const isPolarArea = currentDetailChartType === 'polar-area';
  const isDivergingBar = currentDetailChartType === 'diverging-bar';
  const isCombo = currentDetailChartType === 'combo';
  const isPareto = currentDetailChartType === 'pareto';
  const isStream = currentDetailChartType === 'stream';

  let chartLabelsFinal = labels;
  let datasets = [];
  if (isRadar) {
    datasets = [{
      data: values,
      borderColor: accent,
      backgroundColor: hexToRgba(accent, 0.25),
      pointBackgroundColor: accent,
      pointRadius: 3,
      borderWidth: 2
    }];
  } else if (isPolarArea) {
    datasets = [{
      data: values,
      backgroundColor: values.map((_,i)=>hexToRgba(COMPARE_COLORS[i % COMPARE_COLORS.length], 0.65)),
      borderColor: '#fff',
      borderWidth: 1.5
    }];
  } else if (isDivergingBar) {
    const avg = values.reduce((s,v)=>s+v,0)/values.length;
    datasets = [{
      data: values.map(v=>v-avg),
      backgroundColor: values.map(v=> v>=avg ? hexToRgba('#4E7D5A',0.8) : hexToRgba('#A63A50',0.8)),
      borderWidth: 0,
      borderRadius: 3,
      maxBarThickness: 34,
      _baseline: avg
    }];
  } else if (isCombo) {
    let running = 0;
    const movingAvg = values.map((v,i)=>{ running += v; return running/(i+1); });
    datasets = [
      { type:'bar', data: values, backgroundColor: hexToRgba(accent,0.45), borderWidth:0, borderRadius:3, maxBarThickness:32, order:2 },
      { type:'line', data: movingAvg, borderColor:'#562F00', backgroundColor:'#562F00', borderWidth:2, pointRadius:2, tension:0.25, fill:false, order:1 }
    ];
  } else if (isPareto) {
    const idxSorted = values.map((v,i)=>i).sort((a,b)=>values[b]-values[a]);
    const sortedVals = idxSorted.map(i=>values[i]);
    chartLabelsFinal = idxSorted.map(i=>labels[i]);
    const total = sortedVals.reduce((s,v)=>s+v,0) || 1;
    let cum = 0;
    const cumPct = sortedVals.map(v=>{ cum += v; return (cum/total*100); });
    datasets = [
      { type:'bar', data: sortedVals, backgroundColor: hexToRgba(accent,0.6), borderWidth:0, borderRadius:3, maxBarThickness:34, yAxisID:'y', order:2 },
      { type:'line', data: cumPct, borderColor:'#562F00', backgroundColor:'#562F00', borderWidth:2, pointRadius:3, tension:0, fill:false, yAxisID:'y1', order:1 }
    ];
  } else if (isLollipop) {
    datasets = [
      {
        type: 'bar',
        data: values,
        backgroundColor: hexToRgba(accent, 0.6),
        borderWidth: 0,
        maxBarThickness: 4,
        borderRadius: 0
      },
      {
        type: 'line',
        data: values,
        borderColor: accent,
        backgroundColor: accent,
        pointBackgroundColor: accent,
        pointRadius: 5,
        pointHoverRadius: 7,
        showLine: false,
        fill: false
      }
    ];
  } else if (isPureBubble) {
    const minV = Math.min(...values), maxV = Math.max(...values);
    const rangeV = (maxV - minV) || 1;
    datasets = [{
      type: 'line',
      data: values,
      borderColor: accent,
      backgroundColor: hexToRgba(accent, 0.75),
      pointRadius: function(context) {
        const v = context.raw;
        if(v === null || v === undefined) return 0;
        const norm = (v - minV) / rangeV;
        return computeBubbleRadius(norm, context.chart, 1);
      },
      pointHoverRadius: function(context) {
        const v = context.raw;
        if(v === null || v === undefined) return 0;
        const norm = (v - minV) / rangeV;
        return computeBubbleRadius(norm, context.chart, 1) + 3;
      },
      pointBackgroundColor: accent,
      showLine: false,
      fill: false
    }];
  } else if (isBubbleTS) {
    const minV = Math.min(...values), maxV = Math.max(...values);
    const rangeV = (maxV - minV) || 1;
    datasets = [{
      type: 'line',
      data: values,
      borderColor: accent,
      backgroundColor: hexToRgba(accent, 0.22),
      pointRadius: function(context) {
        const v = context.raw;
        if(v === null || v === undefined) return 0;
        const norm = (v - minV) / rangeV;
        return computeBubbleRadius(norm, context.chart, 1) * 0.8;
      },
      pointHoverRadius: function(context) {
        const v = context.raw;
        if(v === null || v === undefined) return 0;
        const norm = (v - minV) / rangeV;
        return computeBubbleRadius(norm, context.chart, 1) * 0.8 + 3;
      },
      pointBackgroundColor: accent,
      borderWidth: 2.2,
      fill: true,
      tension: 0.3
    }];
  } else if (isBar) {
    datasets = [{
      data: values,
      backgroundColor: hexToRgba(accent, 0.75),
      borderColor: accent,
      borderWidth: 1,
      borderRadius: 0, // Siku tegas tanpa lengkung (standard bar chart)
      maxBarThickness: 38
    }];
  } else if (isScatter) {
    datasets = [{
      type: 'line',
      data: values,
      borderColor: accent,
      backgroundColor: accent,
      pointBackgroundColor: accent,
      pointRadius: 5,
      pointHoverRadius: 7,
      showLine: false,
      fill: false
    }];
  } else if (isWaterfall) {
    const wfData = values.map((v,i)=>{
      const base = i===0 ? 0 : values[i-1];
      return [Math.min(base,v), Math.max(base,v)];
    });
    const wfColors = values.map((v,i)=>{
      if(i===0) return hexToRgba(accent, 0.8);
      return v >= values[i-1] ? hexToRgba('#4E7D5A', 0.82) : hexToRgba('#A63A50', 0.82);
    });
    datasets = [{
      data: wfData,
      backgroundColor: wfColors,
      borderWidth: 0,
      borderRadius: 3,
      maxBarThickness: 36
    }];
  } else if (isFunnel) {
    const idxSorted = values.map((v,i)=>i).sort((a,b)=>values[b]-values[a]);
    const sortedVals = idxSorted.map(i=>values[i]);
    chartLabelsFinal = idxSorted.map(i=>labels[i]);
    datasets = [{
      data: sortedVals,
      backgroundColor: hexToRgba(accent, 0.75),
      borderColor: accent,
      borderWidth: 1,
      borderRadius: 4,
      maxBarThickness: 34
    }];
  } else if (isSurface) {
    const minV = Math.min(...values), maxV = Math.max(...values);
    const rangeV = (maxV - minV) || 1;
    datasets = [{
      data: values,
      backgroundColor: values.map(v => hexToRgba(accent, 0.22 + 0.68 * ((v - minV) / rangeV))),
      borderWidth: 0,
      borderRadius: 2,
      maxBarThickness: 40,
      categoryPercentage: 1.0,
      barPercentage: 1.0
    }];
  } else if (isStream) {
    datasets = [
      { data: values.map(v=>-v/2), borderColor:'transparent', backgroundColor:'transparent', pointRadius:0, fill:false, order:2 },
      { data: values.map(v=>v/2), borderColor:accent, backgroundColor:hexToRgba(accent,0.55), pointRadius:0, borderWidth:1.5, fill:'-1', tension:0.35, order:1 }
    ];
  } else {
    const gradient = ctx.createLinearGradient(0,0,0,260);
    gradient.addColorStop(0, hexToRgba(accent, 0.35));
    gradient.addColorStop(1, hexToRgba(accent, 0.02));
    datasets = [{
      data: values,
      borderColor: accent,
      backgroundColor: gradient,
      pointBackgroundColor: accent,
      pointRadius: 4,
      pointHoverRadius: 6,
      borderWidth: 2.5,
      fill: true,
      tension: isSpline ? 0.4 : ((isStepped || isDashed) ? 0 : 0.25),
      stepped: isSpline ? false : (isStepped ? true : false),
      borderDash: isDashed ? [6, 4] : []
    }];
  }

  const topIsBar = isBar || isWaterfall || isFunnel || isSurface || isDivergingBar || isPareto || (isCombo);

  chartInstance = new Chart(ctx, {
    type: isRadar ? 'radar' : (isPolarArea ? 'polarArea' : (topIsBar ? 'bar' : 'line')),
    data:{ labels: chartLabelsFinal, datasets },
    options: isRadar ? {
      responsive:true,
      maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{
        r:{
          grid:{ color:'#F2DEB8' },
          angleLines:{ color:'#F2DEB8' },
          pointLabels:{ color:'#8A5A24', font:{family:'Inter', size:10.5} },
          ticks:{ color:'#8A5A24', backdropColor:'transparent', font:{family:'Inter', size:9.5} }
        }
      }
    } : isPolarArea ? {
      responsive:true,
      maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{
        r:{
          grid:{ color:'#F2DEB8' },
          angleLines:{ color:'#F2DEB8' },
          pointLabels:{ color:'#8A5A24', font:{family:'Inter', size:10.5} },
          ticks:{ color:'#8A5A24', backdropColor:'transparent', font:{family:'Inter', size:9.5} }
        }
      }
    } : isPareto ? {
      responsive:true,
      maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{
        x:{ grid:{display:false}, ticks:{ color:'#8A5A24', font:{family:'Inter', size:10.5} } },
        y:{ type:'linear', position:'left', grid:{color:'#F2DEB8'}, ticks:{ color:'#8A5A24', font:{family:'Inter', size:11} } },
        y1:{ type:'linear', position:'right', min:0, max:100, grid:{drawOnChartArea:false}, ticks:{ color:'#8A5A24', font:{family:'Inter', size:11}, callback:(v)=>v+'%' } }
      }
    } : {
      responsive:true,
      maintainAspectRatio:false,
      indexAxis: isFunnel ? 'y' : 'x',
      plugins:{ legend:{display:false} },
      scales:{
        x:{ 
          grid:{display: isFunnel ? true : false, color:'#F2DEB8'}, 
          ticks:{ color:'#8A5A24', font:{family:'Inter', size:11} } 
        },
        y:{ grid:{color: isFunnel ? '#fff' : '#F2DEB8', display: (!isFunnel || true) && !isStream}, ticks:{ color:'#8A5A24', font:{family:'Inter', size:11}, display: !isStream } }
      }
    }
  });
}

function computeBubbleRadius(norm, chart, seriesCount){
  norm = Math.max(0, Math.min(1, isFinite(norm) ? norm : 0));
  const area = chart && chart.chartArea;
  const n = (chart && chart.data && chart.data.labels) ? chart.data.labels.length : 10;
  const plotWidth = area ? Math.max(60, area.right - area.left) : 300;
  const perPoint = plotWidth / Math.max(1, n) / Math.max(1, seriesCount || 1);
  const maxR = Math.max(5, Math.min(20, perPoint * 0.42));
  const minR = Math.max(3, maxR * 0.32);
  return minR + Math.sqrt(norm) * (maxR - minR);
}

function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16);
  const g = parseInt(h.substring(2,4),16);
  const b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

/* =========================================================
   SHIFT-SHARE DINAMIS
   Referensi metode: https://en.wikipedia.org/wiki/Shift-share_analysis
   Model: Tradisional (Dunn), Esteban-Marquilas (1972), Arcelus (1984)
   ========================================================= */

function ssIsNumericColumn(col){
  let cnt=0, total=0;
  for(let i=0;i<Math.min(40, ssRawRows.length); i++){
    const v = ssRawRows[i][col];
    if(v===undefined||v===null||v.toString().trim()==='') continue;
    total++;
    if(!isNaN(toNumber(v))) cnt++;
  }
  return total>0 && (cnt/total) > 0.8;
}
function ssIsYearLike(col){
  let cnt=0, total=0;
  ssRawRows.slice(0,50).forEach(r=>{
    const v=(r[col]||'').toString().trim();
    if(!v) return;
    total++;
    if(/^(19|20)\d{2}(\.0)?$/.test(v)) cnt++;
  });
  return total>0 && (cnt/total) > 0.6;
}
function ssUniqueValues(col){
  const set = new Set();
  ssRawRows.forEach(r=>{ const v=(r[col]||'').toString().trim(); if(v) set.add(v); });
  return [...set];
}

function autoDetectSSColumns(){
  if(!ssHeaders || !ssHeaders.length) return;

  let yearCol = ssHeaders.find(h=>/tahun|year/i.test(h)) || ssHeaders.find(h=>ssIsYearLike(h));

  let regionCol = ssHeaders.find(h=> h!==yearCol && /wilayah|kabupaten|kota|provinsi|region|daerah/i.test(h) && !ssIsNumericColumn(h));
  if(regionCol){
    const uv = ssUniqueValues(regionCol);
    if(uv.length<2 || uv.length>12) regionCol = null;
  }

  let sectorCol = ssHeaders.find(h=> h!==yearCol && h!==regionCol && /sektor|lapangan\s*usaha|kategori\s*ekonomi|industri|lu\b/i.test(h));
  if(!sectorCol){
    const textCols = ssHeaders.filter(h=> h!==yearCol && h!==regionCol && !ssIsNumericColumn(h));
    textCols.sort((a,b)=> ssUniqueValues(b).length - ssUniqueValues(a).length);
    sectorCol = textCols[0] || null;
  }

  const numericCols = ssHeaders.filter(h=> h!==yearCol && h!==sectorCol && h!==regionCol && ssIsNumericColumn(h));

  ssMap.yearCol = yearCol || null;
  ssMap.sectorCol = sectorCol || null;

  if(regionCol && numericCols.length){
    ssMap.dataMode = 'wilayah';
    ssMap.regionCol = regionCol;
    ssMap.valueCol = numericCols.find(h=>/nilai|value|pdrb|jumlah|produksi|tenaga\s*kerja|pekerja/i.test(h)) || numericCols[0];
    const uv = ssUniqueValues(regionCol);
    ssMap.regionStudi = uv.find(v=>/klungkung/i.test(v)) || uv[0] || null;
    ssMap.regionAcuan = uv.find(v=> v!==ssMap.regionStudi && /bali|provinsi|nasional|indonesia/i.test(v)) || uv.find(v=> v!==ssMap.regionStudi) || null;
  } else {
    ssMap.dataMode = 'terpisah';
    ssMap.regionCol = null; ssMap.valueCol = null;
    ssMap.valueStudiCol = numericCols.find(h=>/klungkung|studi|kab\b/i.test(h)) || numericCols[0] || null;
    ssMap.valueAcuanCol = numericCols.find(h=> h!==ssMap.valueStudiCol && /bali|provinsi|acuan|nasional|indonesia/i.test(h)) || numericCols.find(h=> h!==ssMap.valueStudiCol) || null;
  }
}

function ssMappingValid(){
  if(!ssMap.yearCol || !ssMap.sectorCol) return false;
  if(ssMap.dataMode==='wilayah'){
    return !!(ssMap.regionCol && ssMap.valueCol && ssMap.regionStudi && ssMap.regionAcuan && ssMap.regionStudi!==ssMap.regionAcuan);
  }
  return !!(ssMap.valueStudiCol && ssMap.valueAcuanCol && ssMap.valueStudiCol!==ssMap.valueAcuanCol);
}

function ssExtractYear(v){
  if(v===undefined||v===null) return NaN;
  const s = v.toString().trim();
  const m = s.match(/(19|20)\d{2}/);
  return m ? parseInt(m[0]) : parseInt(s);
}

function buildSSDataset(){
  const map = {};
  ssRawRows.forEach(r=>{
    const tahun = ssExtractYear(r[ssMap.yearCol]);
    const sektor = (r[ssMap.sectorCol]||'').toString().trim();
    if(!tahun || isNaN(tahun) || !sektor) return;
    const key = tahun+'|||'+sektor;
    if(!map[key]) map[key] = {tahun, sektor, studi:0, acuan:0};
    if(ssMap.dataMode==='wilayah'){
      const wil = (r[ssMap.regionCol]||'').toString().trim();
      const val = toNumber(r[ssMap.valueCol]);
      if(isNaN(val)) return;
      if(wil===ssMap.regionStudi) map[key].studi += val;
      else if(wil===ssMap.regionAcuan) map[key].acuan += val;
    } else {
      const vS = toNumber(r[ssMap.valueStudiCol]);
      const vA = toNumber(r[ssMap.valueAcuanCol]);
      if(!isNaN(vS)) map[key].studi += vS;
      if(!isNaN(vA)) map[key].acuan += vA;
    }
  });
  return Object.values(map);
}

function indexSSDataset(dataset){
  const byYear = {};
  const totals = {};
  const sectorsSet = new Set();
  dataset.forEach(d=>{
    sectorsSet.add(d.sektor);
    if(!byYear[d.tahun]) byYear[d.tahun] = {};
    byYear[d.tahun][d.sektor] = {studi:d.studi, acuan:d.acuan};
    if(!totals[d.tahun]) totals[d.tahun] = {studi:0, acuan:0};
    totals[d.tahun].studi += d.studi;
    totals[d.tahun].acuan += d.acuan;
  });
  const years = Object.keys(byYear).map(Number).sort((a,b)=>a-b);
  return { byYear, totals, sectors:[...sectorsSet].sort(), years };
}

function ssClassify(method, row){
  let x,y;
  if(method==='tradisional'){ x = row.M; y = row.C; }
  else { x = row.spesialisasi; y = row.C; }
  if(x===null || x===undefined || isNaN(x)) return null;
  if(x>=0 && y>=0) return 1;
  if(x<0 && y>=0) return 2;
  if(x<0 && y<0) return 3;
  return 4;
}

function computeShiftShare(idx, yearFrom, yearTo, method){
  const years = idx.years.filter(y=> y>=yearFrom && y<=yearTo);
  const sectors = idx.sectors;
  const acc = {};
  sectors.forEach(s=> acc[s] = {N:0,M:0,C:0,A:0,D:0, hasData:false});
  let skippedIntervals = 0;

  for(let i=0;i<years.length-1;i++){
    const y0=years[i], y1=years[i+1];
    const tot0 = idx.totals[y0], tot1 = idx.totals[y1];
    if(!tot0 || !tot1 || !(tot0.acuan>0) || !(tot0.studi>0)){ skippedIntervals++; continue; }
    const r00 = (tot1.acuan - tot0.acuan) / tot0.acuan;
    sectors.forEach(s=>{
      const d0 = (idx.byYear[y0]||{})[s];
      const d1 = (idx.byYear[y1]||{})[s];
      if(!d0 || !d1) return;
      const Eij0=d0.studi, Eij1=d1.studi, Ei0=d0.acuan, Ei1=d1.acuan;
      acc[s].D += (Eij1-Eij0);
      if(!(Eij0>0) || !(Ei0>0)) return;
      acc[s].hasData = true;
      const ri0 = (Ei1-Ei0)/Ei0;
      const rij = (Eij1-Eij0)/Eij0;
      const EijStar0 = tot0.studi * (Ei0/tot0.acuan);
      let N=0,M=0,C=0,A=0;
      if(method==='tradisional'){
        N = Eij0*r00; M = Eij0*(ri0-r00); C = Eij0*(rij-ri0);
      } else if(method==='em'){
        N = Eij0*r00; M = Eij0*(ri0-r00);
        C = EijStar0*(rij-ri0); A = (Eij0-EijStar0)*(rij-ri0);
      } else { // arcelus — strukturisasi Eij* diterapkan pada seluruh komponen
        N = EijStar0*r00; M = EijStar0*(ri0-r00);
        C = EijStar0*(rij-ri0); A = (Eij0-EijStar0)*rij;
      }
      acc[s].N+=N; acc[s].M+=M; acc[s].C+=C; acc[s].A+=A;
    });
  }

  const y0base = years[0];
  const tot0base = idx.totals[y0base];
  const specBySector = {};
  sectors.forEach(s=>{
    const d0 = (idx.byYear[y0base]||{})[s];
    if(d0 && tot0base && tot0base.acuan>0){
      const EijStar0 = tot0base.studi * (d0.acuan/tot0base.acuan);
      specBySector[s] = d0.studi - EijStar0;
    } else specBySector[s] = null;
  });

  let perSector = sectors.map(s=>{
    const a = acc[s];
    const total = method==='tradisional' ? (a.N+a.M+a.C) : (a.N+a.M+a.C+a.A);
    return {
      sektor:s, N:a.N, M:a.M, C:a.C, A:a.A, total, deltaAktual:a.D,
      spesialisasi: specBySector[s], hasData:a.hasData
    };
  }).filter(r=>r.hasData);

  perSector.forEach(r=>{ r.quadrant = ssClassify(method, r); });
  perSector.sort((a,b)=> Math.abs(b.total) - Math.abs(a.total));

  return { perSector, years, skippedIntervals, y0base };
}

function renderShiftShareView(){

    </div>`;

  if(ssLoadState==='idle'){
    main.innerHTML = `<section class="ss-wrap">${introHtml}<div class="state-msg"><span class="spinner"></span>Memuat data Shift-Share…</div></section>`;
    loadShiftShareData();
    return;
  }
  if(ssLoadState==='loading'){
    main.innerHTML = `<section class="ss-wrap">${introHtml}<div class="state-msg"><span class="spinner"></span>Memuat data Shift-Share…</div></section>`;
    return;
  }
  if(ssLoadState==='error'){
    main.innerHTML = `<section class="ss-wrap">${introHtml}<div class="state-msg">⚠ Gagal memuat data: ${escapeHtml(ssLoadError)}<br><br><a href="${SS_CSV_URL}" target="_blank" style="color:var(--orange-deep);font-weight:600;">Buka sumber data →</a></div></section>`;

  }
  if(!ssRawRows || !ssRawRows.length){
    main.innerHTML = `<section class="ss-wrap">${introHtml}<div class="state-msg">Sumber data kosong atau tidak dapat dibaca.</div></section>`;
    return;
  }

  const mappingOk = ssMappingValid();

  main.innerHTML = `
    <section class="ss-wrap">
      ${introHtml}

      <div class="ss-method-tabs" id="ssMethodTabs">
        <button class="ss-method-tab" data-m="tradisional">Tradisional</button>
        <button class="ss-method-tab" data-m="em">Esteban-Marquilas</button>
        <button class="ss-method-tab" data-m="arcelus">Arcelus</button>
      </div>
      <div class="ss-method-note" id="ssMethodNote"></div>

      <div class="ss-controls">
        <div class="ctrl-item"><label>Tahun Awal</label><select id="ssFrom"></select></div>
        <div class="ctrl-item"><label>Tahun Akhir</label><select id="ssTo"></select></div>
        <div class="ctrl-item" style="font-size:11.5px;color:var(--brown-soft);" id="ssIntervalInfo"></div>
        <button class="ss-mapping-toggle" id="ssMapToggle">${mappingOk ? '⚙ Atur Pemetaan Kolom' : '⚠ Atur Pemetaan Kolom (perlu dilengkapi)'}</button>
      </div>

      <div class="ss-mapping-panel${ssMappingPanelOpen ? ' open' : ''}" id="ssMapPanel"></div>

      <div id="ssBody"></div>
    </section>`;

  document.querySelectorAll('.ss-method-tab').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.m===ssMethod);
    btn.onclick = ()=>{ ssMethod = btn.dataset.m; renderShiftShareView(); };
  });
  updateSSMethodNote();

  renderSSMappingPanel();
  document.getElementById('ssMapToggle').onclick = ()=>{
    ssMappingPanelOpen = !ssMappingPanelOpen;
    document.getElementById('ssMapPanel').classList.toggle('open', ssMappingPanelOpen);
  };

  if(!mappingOk){
    document.getElementById('ssBody').innerHTML = `<div class="state-msg">Pemetaan kolom belum lengkap/valid. Buka "Atur Pemetaan Kolom" di atas untuk menyesuaikan sumber data dengan struktur sheet.</div>`;
    ssMappingPanelOpen = true;
    document.getElementById('ssMapPanel').classList.add('open');
    return;
  }

  const dataset = buildSSDataset();
  const idx = indexSSDataset(dataset);

  if(idx.years.length < 2){
    document.getElementById('ssBody').innerHTML = `<div class="state-msg">Data tahun yang valid kurang dari 2 — Shift-Share memerlukan minimal dua tahun untuk menghitung pertumbuhan.</div>`;
    return;
  }

  ssYearsAvailable = idx.years;
  if(!ssYearFrom || !idx.years.includes(ssYearFrom)) ssYearFrom = idx.years[0];
  if(!ssYearTo || !idx.years.includes(ssYearTo) || ssYearTo<=ssYearFrom) ssYearTo = idx.years[idx.years.length-1];

  const fromSel = document.getElementById('ssFrom');
  const toSel = document.getElementById('ssTo');
  idx.years.forEach(y=>{
    fromSel.innerHTML += `<option value="${y}" ${y===ssYearFrom?'selected':''}>${y}</option>`;
    toSel.innerHTML += `<option value="${y}" ${y===ssYearTo?'selected':''}>${y}</option>`;
  });
  fromSel.onchange = ()=>{
    ssYearFrom = parseInt(fromSel.value);
    if(ssYearTo<=ssYearFrom){ const nxt = idx.years.find(y=>y>ssYearFrom); ssYearTo = nxt||ssYearFrom; }
    renderShiftShareView();
  };
  toSel.onchange = ()=>{ ssYearTo = parseInt(toSel.value); renderShiftShareView(); };

  const usedYears = idx.years.filter(y=>y>=ssYearFrom && y<=ssYearTo);
  document.getElementById('ssIntervalInfo').textContent =
    usedYears.length>=2 ? `${usedYears.length-1} interval tahunan dihitung & diakumulasi` : 'Rentang tahun terlalu pendek';

  if(usedYears.length < 2){
    document.getElementById('ssBody').innerHTML = `<div class="state-msg">Pilih rentang minimal 2 tahun.</div>`;
    return;
  }

  const result = computeShiftShare(idx, ssYearFrom, ssYearTo, ssMethod);
  ssResult = result;

  if(!result.perSector.length){
    document.getElementById('ssBody').innerHTML = `<div class="state-msg">Tidak ada sektor dengan data lengkap pada rentang tahun ini. Coba perlebar rentang tahun atau periksa pemetaan kolom.</div>`;
    return;
  }

  renderSSBody(result);
}

function ssPctStr(perSector, field){
  const sum = perSector.reduce((s,r)=>s+(r[field]||0),0);
  return sum;
}

  const quadGroup = isTraditional ? 'tradisional' : 'spesialisasi';
  const cellCls = v => v>=0 ? 'pos':'neg';

  const rows = perSector.map(r=>{
    const qInfo = r.quadrant ? SS_QUAD_LABELS[quadGroup][r.quadrant] : null;
    const badge = qInfo ? `<span class="ss-badge-quad" style="background:${qInfo.color}">Q${r.quadrant}</span>` : '—';

      <td class="${cellCls(r.M)}">${fmtNum(r.M)}</td>
      <td class="${cellCls(r.C)}">${fmtNum(r.C)}</td>`;
    if(isTraditional){
      return `<tr>${common}<td class="${cellCls(r.total)}">${fmtNum(r.total)}</td><td>${fmtNum(r.deltaAktual)}</td></tr>`;
    }
    return `<tr>${common}<td class="${cellCls(r.A)}">${fmtNum(r.A)}</td><td class="${cellCls(r.total)}">${fmtNum(r.total)}</td><td>${fmtNum(r.deltaAktual)}</td></tr>`;
  }).join('');

  table.innerHTML = `<thead>${head}</thead><tbody>${rows}</tbody>`;
}

function renderSSComponentChart(perSector, isTraditional){
  const ctx = document.getElementById('ssChartCanvas');
  if(ssChart){ ssChart.destroy(); ssChart=null; }
  const labels = perSector.map(r=>r.sektor);
  const datasets = isTraditional ? [
    { label:'PN (Nasional)', data:perSector.map(r=>r.N), backgroundColor:'#B98B27' },
    { label:'PP (Bauran Industri)', data:perSector.map(r=>r.M), backgroundColor:'#3E6E8E' },
    { label:'PPW (Kompetitif)', data:perSector.map(r=>r.C), backgroundColor:'#FF9644' }
  ] : [
    { label:'PN (Nasional)', data:perSector.map(r=>r.N), backgroundColor:'#B98B27' },
    { label:'PP (Bauran Industri)', data:perSector.map(r=>r.M), backgroundColor:'#3E6E8E' },
    { label:'Kompetitif', data:perSector.map(r=>r.C), backgroundColor:'#FF9644' },
    { label:'Efek Alokasi', data:perSector.map(r=>r.A), backgroundColor:'#8C6BAF' }
  ];
  ssChart = new Chart(ctx, {
    type:'bar',
    data:{ labels, datasets },
    options:{
      indexAxis:'y',
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'bottom', labels:{ font:{family:'Inter', size:11}, color:'#562F00' } } },
      scales:{
        x:{ stacked:true, grid:{color:'#F2DEB8'}, ticks:{ color:'#8A5A24', font:{family:'Inter', size:10.5} } },
        y:{ stacked:true, grid:{display:false}, ticks:{ color:'#8A5A24', font:{family:'Inter', size:10.5} } }
      }
    }
  });
}

const ssCrosshairPlugin = {
  id:'ssCrosshair',
  beforeDatasetsDraw(chart){
    const {ctx, chartArea:{left,right,top,bottom}, scales:{x,y}} = chart;
    const x0 = x.getPixelForValue(0), y0 = y.getPixelForValue(0);
    ctx.save();
    ctx.strokeStyle = '#D8A15B';
    ctx.setLineDash([4,4]);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, top); ctx.lineTo(x0, bottom); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(left, y0); ctx.lineTo(right, y0); ctx.stroke();
    ctx.restore();
  }
};

function renderSSQuadrantChart(perSector, quadGroup, isTraditional){
  const ctx = document.getElementById('ssQuadCanvas');
  if(ssQuadChart){ ssQuadChart.destroy(); ssQuadChart=null; }
  const pts = perSector.map(r=>({
    x: isTraditional ? r.M : r.spesialisasi,
    y: r.C,
    label: r.sektor,
    q: r.quadrant
  })).filter(p=> p.x!==null && p.x!==undefined && !isNaN(p.x));

  const maxAbsX = Math.max(1, ...pts.map(p=>Math.abs(p.x)));
  const maxAbsY = Math.max(1, ...pts.map(p=>Math.abs(p.y)));
  const padX = maxAbsX*1.25, padY = maxAbsY*1.25;

  ssQuadChart = new Chart(ctx, {
    type:'scatter',
    data:{ datasets:[{
      label:'Sektor',
      data: pts,
      backgroundColor: pts.map(p=> p.q ? SS_QUAD_LABELS[quadGroup][p.q].color : '#999'),
      pointRadius:7,
      pointHoverRadius:9
    }]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{ display:false },
        tooltip:{
          callbacks:{
            label:(ctx)=> `${ctx.raw.label}: ${isTraditional?'PP':'Spesialisasi'}=${fmtNum(ctx.raw.x)}, ${isTraditional?'PPW':'Kompetitif'}=${fmtNum(ctx.raw.y)}`
          }
        }
      },
      scales:{
        x:{ min:-padX, max:padX, grid:{color:'#F2DEB8'}, title:{display:true, text:isTraditional?'Bauran Industri (PP)':'Spesialisasi', color:'#8A5A24', font:{family:'Inter', size:11}}, ticks:{ color:'#8A5A24', font:{family:'Inter', size:10} } },
        y:{ min:-padY, max:padY, grid:{color:'#F2DEB8'}, title:{display:true, text:isTraditional?'Kompetitif (PPW)':'Keunggulan Kompetitif', color:'#8A5A24', font:{family:'Inter', size:11}}, ticks:{ color:'#8A5A24', font:{family:'Inter', size:10} } }
      }
    },
    plugins:[ssCrosshairPlugin]
  });
}

async function exportSSExcel(perSector, isTraditional){
  const header = isTraditional
    ? ['Sektor','Kuadran','PN (Nasional)','PP (Bauran Industri)','PPW (Kompetitif)','Total Efek','Perubahan Aktual']
    : ['Sektor','Kuadran','PN (Nasional)','PP (Bauran Industri)','Kompetitif','Efek Alokasi','Total Efek','Perubahan Aktual'];
  const rows = perSector.map(r=>{
    const q = r.quadrant ? 'Q'+r.quadrant : '-';
    return isTraditional
      ? [r.sektor, q, r.N, r.M, r.C, r.total, r.deltaAktual]
      : [r.sektor, q, r.N, r.M, r.C, r.A, r.total, r.deltaAktual];
  });
  await exportStyledExcel(`shiftshare_${ssMethod}_${ssYearFrom}_${ssYearTo}`, 'Shift-Share', header, rows);
}

function loadShiftShareData(){
  ssLoadState = 'loading';
  Papa.parse(SS_CSV_URL, {
    download:true,
    header:true,
    skipEmptyLines:true,
    complete:function(res){
      try{
        ssRawRows = (res.data||[]).filter(r=> Object.values(r).some(v=> v!==null && v!==undefined && v.toString().trim()!==''));
        ssHeaders = (res.meta && res.meta.fields) ? res.meta.fields.filter(h=>h && h.toString().trim()!=='') : (ssRawRows[0]?Object.keys(ssRawRows[0]):[]);
        if(!ssMap.yearCol) autoDetectSSColumns();
        ssLoadState = 'ready';
      }catch(err){
        ssLoadState = 'error';
        ssLoadError = err.message;
      }
      if(ssMode) renderShiftShareView();
    },
    error:function(err){
      ssLoadState = 'error';
      ssLoadError = err.toString();
      if(ssMode) renderShiftShareView();
    }
  });
}

loadData();
