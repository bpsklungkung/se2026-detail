<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Indikator — BPS Klungkung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js';document.head.appendChild(s);"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';document.head.appendChild(s);"></script>
<style>
  :root{
    --cream:#FFFDF1;
    --cream-deep:#FFF3DC;
    --peach:#FFCE99;
    --peach-soft:#FFE7C9;
    --orange:#FF9644;
    --orange-deep:#D97730;
    --brown:#562F00;
    --brown-deep:#3a1f00;
    --brown-mid:#7a5230;
    --brown-soft:#a08a70;
    --green:#6F8F52;
    --green-bg:#E9EEDD;
    --rust:#C1440E;
    --rust-bg:#FCE1CB;
    --white:#FFFFFF;
    --card-bg:#FFFFFF;
    --page-bg:#FFFFFF;
    --line:#FFE7C9;
    --shadow: 0 6px 20px rgba(86,47,0,0.10);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    color:var(--brown);
    background:var(--page-bg);
    min-height:100vh;
    padding-bottom:50px;
  }
  ::selection{background:var(--peach);}

  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    color:var(--brown-deep);
    margin:0;
  }

  /* ===== Hero ===== */
  .hero{
    background: linear-gradient(135deg, var(--brown) 0%, #7a4310 55%, var(--orange) 130%);
    padding:30px 24px 40px;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute; right:-60px; top:-60px;
    width:220px; height:220px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,150,68,0.35), transparent 70%);
  }
  .hero-inner{
    max-width:1280px; margin:0 auto; position:relative; z-index:1;
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .hero-eyebrow{
    color:var(--peach); font-weight:600; letter-spacing:.13em; text-transform:uppercase;
    font-size:11px; margin-bottom:8px; font-family:'Inter',sans-serif;
  }
  .hero h1{ color:var(--cream); font-size:clamp(22px,3vw,32px); font-weight:600; line-height:1.15; }
  .hero p{ color:var(--peach-soft); margin-top:6px; font-size:12.5px; max-width:480px; line-height:1.45; }

  .hero-stats{ display:flex; gap:10px; flex-wrap:wrap; }
  .stat-pill{
    background:rgba(255,253,241,0.12);
    border:1px solid rgba(255,206,153,0.35);
    border-radius:12px;
    padding:9px 15px;
    min-width:88px;
    backdrop-filter:blur(4px);
  }
  .stat-pill .num{ color:var(--cream); font-family:'Fraunces',serif; font-size:20px; font-weight:600; line-height:1; }
  .stat-pill .lbl{ color:var(--peach-soft); font-size:10px; margin-top:3px; letter-spacing:.05em; }

  /* ===== Layout ===== */
  .page-wrap{ max-width:1280px; margin:0 auto; padding:0 24px; }

  /* Tabbar */
  .tabbar{
    background:var(--white);
    border:1px solid var(--peach-soft);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:9px 10px;
    margin-top:-22px;
    position:relative; z-index:5;
    display:flex; gap:6px; flex-wrap:wrap; align-items:center;
  }
  .tab{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12.5px;
    padding:8px 14px;
    background:none;
    border:none;
    border-radius:10px;
    cursor:pointer;
    color:var(--brown);
    transition:background .15s, color .15s;
  }
  .tab.active{ background:var(--orange); color:#fff; }
  .tab:hover:not(.active){ background:var(--peach-soft); }
  .tab-sep{
    width:1px;
    align-self:stretch;
    background:var(--peach-soft);
    margin:4px 4px;
  }

  main{ padding-top:22px; }

  /* ===== Filter panel (left sidebar) ===== */
  .content-row{ display:flex; align-items:flex-start; gap:20px; }
  .content-row main{ flex:1; min-width:0; }
  .kel-filter-panel{
    width:220px;
    flex-shrink:0;
    background:var(--white);
    border:1px solid var(--peach-soft);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:16px;
    margin-top:22px;
    position:sticky;
    top:16px;
    max-height:calc(100vh - 32px);
    overflow-y:auto;
  }
  .kel-filter-head{
    display:flex; align-items:center; justify-content:space-between;
    gap:8px; margin-bottom:12px;
  }
  .kel-filter-head span{
    font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    font-weight:700; color:var(--brown-mid);
  }
  .kel-filter-reset{
    font-size:10.5px; font-weight:600; color:var(--orange-deep);
    background:none; border:none; cursor:pointer; padding:2px 0;
    text-decoration:underline;
  }
  .kel-filter-reset:hover{ color:var(--orange); }
  .kel-filter-kat{ margin-bottom:14px; }
  .kel-filter-kat:last-child{ margin-bottom:0; }
  .kel-filter-kat-head{
    display:flex; align-items:center; justify-content:space-between;
    font-size:11.5px; font-weight:700; color:var(--brown-deep);
    margin-bottom:6px; padding-bottom:5px;
    border-bottom:1px solid var(--cream-deep);
  }
  .kel-filter-kat-toggle{
    font-size:10px; font-weight:600; color:var(--brown-soft);
    background:none; border:none; cursor:pointer; padding:0;
  }
  .kel-filter-kat-toggle:hover{ color:var(--orange-deep); }
  .kel-filter-item{
    display:flex; align-items:center; gap:7px;
    font-size:12px; color:var(--brown-mid);
    padding:4px 2px; cursor:pointer; border-radius:6px;
  }
  .kel-filter-item:hover{ background:var(--cream); color:var(--brown); }
  .kel-filter-item input{ accent-color:var(--orange); cursor:pointer; flex-shrink:0; }
  @media (max-width:900px){
    .content-row{ flex-direction:column; }
    .kel-filter-panel{
      width:100%;
      position:static;
      max-height:none;
      margin-top:14px;
    }
    .kel-filter-kat{ margin-bottom:10px; }
  }

  /* ===== Section headers ===== */
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin:22px 0 10px; flex-wrap:wrap; gap:6px;}
  .section-head h2{ font-size:17px; font-weight:600; }
  .section-head .tag{ font-size:11px; color:var(--brown); background:var(--peach-soft); padding:4px 10px; border-radius:100px; font-weight:600; letter-spacing:.04em;}

  .footer-note{ text-align:center; color:var(--brown-soft); font-size:11.5px; margin-top:30px; }

  /* Compare view */
  .compare-wrap{ margin-top:20px; }
  .compare-intro h2{
    font-family:'Fraunces',serif; font-weight:600; font-size:19px;
    margin:0 0 3px; color:var(--brown);
  }
  .compare-intro p{ margin:0 0 14px; color:var(--brown-mid); font-size:12.5px; max-width:560px; line-height:1.45; }

  .compare-controls{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--card-bg); border:1px solid var(--line); border-radius:12px;
    padding:10px 14px; margin-bottom:14px;
  }
  .ctrl-item{ display:flex; align-items:center; gap:7px; }
  .ctrl-item label{ font-size:11.5px; font-weight:600; color:var(--brown-mid); }
  .ctrl-item select{
    font-family:'Inter',sans-serif; font-size:12.5px; padding:5px 9px; border-radius:7px;
    border:1px solid var(--line); background:var(--cream); color:var(--brown);
  }
  .cmp-normalize{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--brown-mid); cursor:pointer; }
  .cmp-normalize input{ accent-color:var(--orange-deep); width:14px; height:14px; }
  .cmp-clear{
    margin-left:auto; font-size:12px; font-weight:700; color:var(--rust);
    background:var(--rust-bg); border:none; padding:6px 12px; border-radius:999px; cursor:pointer;
  }
  .cmp-clear:hover{ filter:brightness(.96); }

  .compare-body{
    display:grid; grid-template-columns:230px 1fr; gap:14px; align-items:start;
  }
  .compare-picker{
    background:var(--card-bg); border:1px solid var(--line); border-radius:12px;
    padding:8px; max-height:480px; overflow-y:auto;
  }
  .picker-kategori{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:700;
    color:var(--orange-deep); margin:11px 7px 3px;
  }
  .picker-kategori:first-child{ margin-top:1px; }
  .picker-kelompok{
    font-size:11px; font-weight:700; color:var(--brown-mid); margin:6px 7px 3px;
  }
  .picker-item{
    display:flex; align-items:center; gap:8px;
    font-size:12.5px; color:var(--brown); padding:5px 7px; border-radius:7px;
    cursor:pointer;
  }
  .picker-item:hover{ background:var(--cream-deep); }
  .picker-item.picked{ background:var(--peach-soft); }
  .picker-item input{ accent-color:var(--orange-deep); width:14px; height:14px; flex-shrink:0; }
  .picker-item span{ flex:1; line-height:1.25; }
  .picker-item.picked::after{
    content:''; width:7px; height:7px; border-radius:50%;
    background:var(--dotcolor, var(--orange-deep)); flex-shrink:0;
  }

  .compare-chart-area{ min-height:300px; display:flex; flex-direction:column; gap:12px; }
  .compare-empty{
    display:none;
    background:var(--card-bg); border:1px dashed var(--line); border-radius:12px;
    padding:50px 24px; text-align:center; color:var(--brown-soft); font-size:13px;
  }

  /* AI Insight & Definisi Grid */
  .cmp-info-grid{
    display:grid;
    grid-template-columns: 1fr;
    gap:12px;
  }
  .ai-insight-box{
    background: linear-gradient(135deg, var(--cream) 0%, var(--cream-deep) 100%);
    border:1px solid var(--peach);
    border-radius:12px;
    padding:18px;
  }
  .ai-insight-title{
    font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; font-weight:700;
    color:var(--orange-deep); margin-bottom:8px; display:flex; align-items:center; gap:6px;
  }
  .ai-insight-content{
    font-size:12.5px; line-height:1.6; color:var(--brown);
  }
  .ai-insight-content b{ color:var(--brown-deep); }
  .insight-section-title{
    font-weight:700; color:var(--brown-deep); margin-top:10px; margin-bottom:4px; display:block;
  }

  .compare-defs-box{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
  }
  .compare-defs-title{
    font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700;
    color:var(--orange-deep); margin-bottom:8px;
  }
  .def-item{
    font-size:12px; line-height:1.45; color:var(--brown-mid); margin-bottom:8px;
  }
  .def-item:last-child{ margin-bottom:0; }
  .def-item b{ color:var(--brown); }

  @media (max-width:760px){
    .compare-body{ grid-template-columns:1fr; }
    .compare-picker{ max-height:240px; }
  }

  /* ===== Shift-Share Dinamis ===== */
  .ss-wrap{ margin-top:20px; }
  .ss-intro h2{
    font-family:'Fraunces',serif; font-weight:600; font-size:19px;
    margin:0 0 3px; color:var(--brown);
  }
  .ss-intro p{ margin:0 0 14px; color:var(--brown-mid); font-size:12.5px; max-width:680px; line-height:1.5; }
  .ss-intro a{ color:var(--orange-deep); font-weight:600; }

  .ss-method-tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .ss-method-tab{
    font-family:'Inter',sans-serif; font-size:12px; font-weight:700;
    padding:8px 14px; border-radius:999px; cursor:pointer;
    background:var(--cream-deep); border:1px solid var(--peach-soft); color:var(--brown-mid);
  }
  .ss-method-tab.active{ background:var(--orange); color:#fff; border-color:var(--orange); }
  .ss-method-tab:hover:not(.active){ background:var(--peach-soft); }

  .ss-method-note{
    background:linear-gradient(135deg, var(--cream) 0%, var(--cream-deep) 100%);
    border:1px solid var(--peach); border-radius:12px; padding:12px 16px; margin-bottom:14px;
    font-size:12px; line-height:1.55; color:var(--brown);
  }
  .ss-method-note b{ color:var(--brown-deep); }

  .ss-controls{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--card-bg); border:1px solid var(--line); border-radius:12px;
    padding:10px 14px; margin-bottom:14px;
  }

  .ss-mapping-toggle{
    font-size:11.5px; font-weight:700; color:var(--orange-deep); background:none; border:none;
    cursor:pointer; text-decoration:underline; margin-left:auto;
  }
  .ss-mapping-panel{
    display:none; background:var(--card-bg); border:1px dashed var(--peach); border-radius:12px;
    padding:14px; margin-bottom:14px;
  }
  .ss-mapping-panel.open{ display:block; }
  .ss-mapping-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px 16px; margin-bottom:10px; }
  .ss-mapping-grid .ctrl-item{ flex-direction:column; align-items:flex-start; gap:4px; }
  .ss-mapping-grid select{ width:100%; }
  .ss-mapping-mode{ display:flex; gap:14px; margin-bottom:10px; font-size:12px; font-weight:600; color:var(--brown-mid); }
  .ss-mapping-mode label{ display:flex; align-items:center; gap:6px; cursor:pointer; }
  .ss-mapping-apply{
    font-size:12px; font-weight:700; color:#fff; background:var(--orange-deep); border:none;
    padding:7px 16px; border-radius:999px; cursor:pointer;
  }
  .ss-mapping-apply:hover{ filter:brightness(1.05); }

  .ss-kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px; }

  .ss-section-title{
    font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:700;
    color:var(--orange-deep); margin:18px 0 8px;
  }

  .ss-quad-grid{ display:grid; grid-template-columns:1.1fr 1fr; gap:14px; align-items:start; }
  .ss-quad-legend{
    display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;
  }
  .ss-quad-legend-item{
    background:var(--cream); border:1px solid var(--line); border-radius:10px; padding:8px 10px;
    font-size:11.5px; line-height:1.4; color:var(--brown-mid);
  }
  .ss-quad-legend-item b{ color:var(--brown-deep); display:block; font-size:12px; margin-bottom:2px; }
  .ss-quad-legend-item .cnt{ color:var(--orange-deep); font-weight:700; }

  .ss-table-wrap{
    border:1px solid var(--line); border-radius:12px; overflow:hidden;
  }
  table.ss-table{ width:100%; border-collapse:collapse; font-size:12px; }
  table.ss-table thead th{
    background:var(--brown); color:var(--cream); text-align:right;
    padding:8px 10px; font-size:10.5px; text-transform:uppercase; letter-spacing:.03em;
    white-space:nowrap; position:sticky; top:0;
  }
  table.ss-table thead th:first-child, table.ss-table thead th:nth-child(2){ text-align:left; }
  table.ss-table td{ padding:7px 10px; text-align:right; border-bottom:1px solid var(--line); color:var(--brown-mid); white-space:nowrap; }
  table.ss-table td:first-child, table.ss-table td:nth-child(2){ text-align:left; color:var(--brown); font-weight:600; }
  table.ss-table tbody tr:hover{ background:var(--cream); }
  table.ss-table td.pos{ color:var(--green); font-weight:700; }
  table.ss-table td.neg{ color:var(--rust); font-weight:700; }
  .ss-table-scroll{ max-height:420px; overflow:auto; }
  .ss-badge-quad{
    display:inline-block; font-size:10px; font-weight:700; padding:2px 8px; border-radius:999px;
    color:#fff;
  }

  @media (max-width:900px){
    .ss-quad-grid{ grid-template-columns:1fr; }
  }
  @media (max-width:760px){
    table.ss-table{ font-size:11px; }
  }

  /* Category section */
  .kategori-block{ margin-top:24px; }
  .section-head h2{ display:flex; align-items:center; gap:9px; }
  .kat-dot{
    width:11px; height:11px; border-radius:50%;
    display:inline-block; flex-shrink:0;
  }
  .kelompok-block{ margin-top:14px; }
  .kelompok-chip{
    display:inline-flex;
    align-items:center;
    gap:5px;
    background:var(--peach-soft);
    color:var(--orange-deep);
    font-size:11px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:999px;
    margin-bottom:9px;
  }
  .kelompok-chip::before{
    content:'';
    width:5px;height:5px;border-radius:50%;
    background:currentColor;
  }

  .card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(255px,1fr));
    gap:12px;
  }

  .card{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-top:3px solid var(--kat-accent, var(--orange));
    border-radius:var(--radius);
    padding:15px 19px 15px;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .card:hover{
    transform:translateY(-2px);
    border-color:var(--orange);
    box-shadow:0 3px 6px rgba(86,47,0,.08), 0 10px 22px rgba(86,47,0,.12);
  }
  .card.comp-card{
    display:flex;
    flex-direction:column;
    position:relative;
    border-top-color:transparent;
  }
  .comp-color-strip{
    position:absolute;
    top:0; left:0; right:0;
    height:5px;
    border-radius:var(--radius) var(--radius) 0 0;
    overflow:hidden;
  }
  .comp-bar{
    display:flex;
    height:16px;
    border-radius:6px;
    overflow:hidden;
    background:var(--cream-deep);
  }
  .comp-bar-seg{ min-width:2px; }
  .comp-legend{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px 10px;
  }
  .comp-legend-item{
    font-size:11px;
    color:var(--brown-mid);
    display:flex;
    align-items:center;
    gap:5px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
  }
  .comp-legend-item b{ color:var(--brown); }
  .comp-legend-item .dot{
    width:8px; height:8px; border-radius:50%;
    display:inline-block; flex-shrink:0;
  }
  .card-top-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:6px;
  }
  .card-top-row .card-label{ flex:1; }
  .chart-style-select{
    flex-shrink:0;
    font-size:9.5px;
    line-height:1;
    color:var(--brown-mid);
    background:var(--cream);
    border:1px solid var(--line);
    border-radius:5px;
    padding:2px 3px;
    max-width:78px;
    cursor:pointer;
    outline:none;
  }
  .chart-style-select:hover{ border-color:var(--orange); color:var(--orange-deep); }
  .card-label{
    font-size:12.5px;
    font-weight:600;
    color:var(--brown-mid);
    line-height:1.32;
    min-height:32px;
  }
  .card-value-row{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:8px;
  }
  .card-value{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:27px;
    color:var(--brown-deep);
    letter-spacing:-.01em;
  }
  .card-unit {
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--brown-soft);
    margin-left: 4px;
    letter-spacing: 0;
  }
  .card-period{
    font-size:10.5px;
    color:var(--brown-soft);
    font-weight:600;
    margin-bottom:4px;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:3px;
    font-size:11.5px;
    font-weight:700;
    padding:3px 9px;
    border-radius:999px;
    width:fit-content;
  }
  .badge.up{ background:var(--rust-bg); color:var(--rust); }
  .badge.down{ background:var(--green-bg); color:var(--green); }
  .badge.flat{ background:var(--cream-deep); color:var(--brown-soft); }
  .badge.na{ background:var(--cream-deep); color:var(--brown-soft); }
  .spark-wrap{ height:32px; width:100%; overflow:hidden; }
  .spark-wrap svg{ display:block; width:100%; height:100%; }

  /* Loading / empty */

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0IHQMxQuwLfTdSgKoXUqA8guCT788uBZ4cwlE72X6co3LMRcGU6tk1PSMbi7nVeEB2g-kTVXYBPyv/pub?output=csv";

let STORE = {};        
let DEFINISI = {};     
let SATUAN = {};       
let activePeriode = null;
let ENABLED_KELOMPOK = null;
let chartInstance = null;
let currentSeriesKey = null;
let currentCompKey = null;
let compCurrentChartType = 'stacked-bar';

let compareMode = false;
let comparePeriode = null;
let compareIndex = {};
let compareSelected = new Set();
let compareFrom = null;
let compareTo = null;
let normalizeCompare = false;
let compareChart = null;
let compareChartType = 'line';
const COMPARE_COLORS = ['#FF9644','#4E7D5A','#A63A50','#3E6E8E','#8C6BAF','#B98B27','#562F00','#5C8C8C'];

/* ===== Shift-Share Dinamis ===== */
const SS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcl1gMindMWTFT3LgR_k72Le9Gm94rR2F5kvJYHzMgfW9SNrwa-8xuZsaAtw649uyBfskx3A9VoYR1/pub?gid=78489782&single=true&output=csv";
let ssMode = false;
let ssRawRows = null;       // array of row objects from CSV (header:true)
let ssHeaders = [];
let ssLoadState = 'idle';   // idle | loading | error | ready
let ssLoadError = '';
let ssMap = {                // column mapping (user-editable)
  yearCol: null,
  sectorCol: null,
  dataMode: 'wilayah',       // 'wilayah' (satu kolom wilayah + nilai) | 'terpisah' (dua kolom nilai)
  regionCol: null,
  valueCol: null,
  regionStudi: null,
  regionAcuan: null,
  valueStudiCol: null,
  valueAcuanCol: null
};
let ssMappingConfirmed = false;
let ssMappingPanelOpen = false;
let ssMethod = 'tradisional';  // tradisional | em | arcelus
let ssYearFrom = null;
let ssYearTo = null;
let ssYearsAvailable = [];
let ssChart = null;
let ssQuadChart = null;
let ssResult = null; // computed result cache

const KATEGORI_PALETTE = ['#FF6B6B','#3E8E41','#2E86AB','#B8336A','#D4A017','#6A4C93','#FF9644','#008080','#4C5C7D','#C1440E'];
let GROUP_COLOR_MAP = {};
function getGroupColor(kategori, kelompok){
  const key = kategori + '|||' + kelompok;
  if(!GROUP_COLOR_MAP[key]){
    const idx = Object.keys(GROUP_COLOR_MAP).length % KATEGORI_PALETTE.length;
    GROUP_COLOR_MAP[key] = KATEGORI_PALETTE[idx];
  }
  return GROUP_COLOR_MAP[key];
}

let CHART_STYLE_OVERRIDES = {};
const CHART_STYLE_OPTIONS = [
  {value:'filled-area', label:'Area Terisi'},
  {value:'spline', label:'Kurva Halus'},
  {value:'bar', label:'Batang'},
  {value:'rounded-bar', label:'Batang Bulat'},
  {value:'stepped-area', label:'Tangga'},
  {value:'dashed-area', label:'Putus-putus'},
  {value:'scatter', label:'Sebar (Scatter)'},
  {value:'lollipop', label:'Lollipop'},
  {value:'bubble-ts', label:'Bubble Time Series'},
  {value:'pure-bubble', label:'Bubble Murni'},
  {value:'waterfall', label:'Waterfall'},
  {value:'funnel', label:'Funnel'},
  {value:'surface', label:'Surface (Heatmap)'},
  {value:'radar', label:'Radar'},
  {value:'polar-area', label:'Polar Area'},
  {value:'diverging-bar', label:'Diverging Bar'},
  {value:'combo', label:'Combo Bar+Garis'},
  {value:'pareto', label:'Pareto'},
  {value:'stacked-area', label:'Stacked Area'},
  {value:'stream', label:'Stream'}
];

function chartStyleKey(kategori, kelompok, sub){
  return kategori + '|||' + kelompok + '|||' + (sub || '');
}

function getGroupChartType(kategori, kelompok, sub){
  const key = kategori + '|||' + kelompok + '|||' + (sub || '');
  getGroupColor(kategori, kelompok);
  if(CHART_STYLE_OVERRIDES[key]) return CHART_STYLE_OVERRIDES[key];
  
  if (sub && /indeks\s*kemahalan\s*konstruksi/i.test(sub)) {
    return 'pure-bubble';
  }
  if (/upah/i.test(kategori) || /upah/i.test(kelompok) || /upah/i.test(sub || '')) {
    return 'bar'; // Diubah menjadi bar chart standar (bukan rounded-bar) untuk upah atau kategori terkait
  }
  if (/konsumsi|pengeluaran/i.test(kelompok)) {
    return 'rounded-bar';
  }
  if (/gender/i.test(kelompok) || /gender/i.test(kategori)) {
    return 'lollipop';
  }
  if (/pendidikan/i.test(kelompok) || /pendidikan/i.test(kategori)) {
    return 'spline';
  }
  if (/penanaman\s*modal/i.test(kelompok) || /penanaman\s*modal/i.test(kategori)) {
    return 'bubble-ts';
  }

  const idx = Object.keys(GROUP_COLOR_MAP).indexOf(kategori + '|||' + kelompok);
  const types = ['filled-area', 'bar', 'stepped-area', 'dashed-area', 'scatter', 'lollipop', 'rounded-bar', 'spline', 'bubble-ts', 'pure-bubble'];
  return types[idx % types.length];
}

let currentDetailColor = '#FF9644';
let currentDetailChartType = 'filled-area';

function toNumber(v){
  if(v===undefined||v===null) return NaN;
  const s = v.toString().trim().replace(/\./g,'').replace(/,/g,'.');
  const direct = parseFloat(v.toString().trim().replace(/,/g,''));
  if(!isNaN(direct)) return direct;
  return parseFloat(s);
}

function fmtNum(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return n.toLocaleString('id-ID', {maximumFractionDigits:2});
}

function triwulanToNum(t){
  if(!t) return 0;
  const s = t.toString().trim().toUpperCase();
  const map = {'I':1,'II':2,'III':3,'IV':4,'1':1,'2':2,'3':3,'4':4};
  return map[s] || 0;
}

function sortKey(e){ return e.tahun*10 + triwulanToNum(e.triwulan); }

function periodLabel(e){
  return e.triwulan ? `${e.tahun} TW ${e.triwulan}` : `${e.tahun}`;
}

function loadData(){
  Papa.parse(CSV_URL, {
    download:true,
    header:false,
    skipEmptyLines:true,
    complete: function(res){
      try{
        buildStore(res.data);
        computeHeroStats();
        renderTabs();
        if(activePeriode) renderContent(activePeriode);
      }catch(err){
        showError('Gagal memproses data: ' + err.message);
      }
    },
    error: function(err){
      showError('Gagal memuat CSV. Periksa koneksi atau akses sheet. (' + err + ')');
    }
  });
}

function showError(msg){
  document.getElementById('main').innerHTML =
    `<div class="state-msg">⚠ ${msg}<br><br><a href="${CSV_URL}" target="_blank" style="color:var(--orange-deep);font-weight:600;">Buka sumber data →</a></div>`;
}

function buildStore(rows){
  STORE = {};
  DEFINISI = {};
  SATUAN = {};
  rows.slice(1).forEach(row=>{ 
    const periode = (row[0]||'').toString().trim();
    const triwulan = (row[1]||'').toString().trim();
    const tahun = parseInt((row[2]||'').toString().trim());
    
    const kategori = (row[3]||'').toString().trim();
    const kelompok = (row[4]||'').toString().trim();
    const subkelompok = (row[5]||'').toString().trim();
    const data = toNumber(row[6]);
    const satuan = (row[7]||'').toString().trim();

    const defSub = (row[8]||'').toString().trim();
    const defText = (row[9]||'').toString().trim();
    if(defSub && defText && !DEFINISI[defSub]) DEFINISI[defSub] = defText;
    if(subkelompok && satuan && !SATUAN[subkelompok]) SATUAN[subkelompok] = satuan;

    if(!periode || !kategori || !kelompok || !subkelompok || isNaN(tahun) || isNaN(data)) return;

    if(!STORE[periode]) STORE[periode] = {};
    if(!STORE[periode][kategori]) STORE[periode][kategori] = {};
    if(!STORE[periode][kategori][kelompok]) STORE[periode][kategori][kelompok] = {};
    if(!STORE[periode][kategori][kelompok][subkelompok]) STORE[periode][kategori][kelompok][subkelompok] = [];

    STORE[periode][kategori][kelompok][subkelompok].push({tahun, triwulan, data});
  });

  Object.values(STORE).forEach(katObj=>{
    Object.values(katObj).forEach(kelObj=>{
      Object.values(kelObj).forEach(subObj=>{
        Object.keys(subObj).forEach(sk=>{
          subObj[sk].sort((a,b)=>sortKey(a)-sortKey(b));
        });
      });
    });
  });

  const periodeList = Object.keys(STORE);
  const priority = ['Tahunan','Triwulanan','Triwulan'];
  periodeList.sort((a,b)=>{
    const ia = priority.indexOf(a), ib = priority.indexOf(b);
    if(ia===-1 && ib===-1) return a.localeCompare(b);
    if(ia===-1) return 1;
    if(ib===-1) return -1;
    return ia-ib;
  });
  if(!activePeriode || !STORE[activePeriode]) activePeriode = periodeList[0];
  STORE.__order = periodeList;

  if(!ENABLED_KELOMPOK) ENABLED_KELOMPOK = new Set();
  periodeList.forEach(p=>{
    Object.keys(STORE[p]).forEach(kat=>{
      Object.keys(STORE[p][kat]).forEach(kel=>{
        const key = `${kat}|||${kel}`;
        if(!ENABLED_KELOMPOK.has(key)) ENABLED_KELOMPOK.add(key);
      });
    });
  });
}

function renderKelFilterPanel(periode){
  const panel = document.getElementById('kelFilterPanel');
  if(!panel) return;
  panel.style.display = '';
  const katObj = STORE[periode];
  if(!katObj){ panel.innerHTML = ''; return; }

  let html = `<div class="kel-filter-head">
      <span>Tampilkan Data</span>
      <button class="kel-filter-reset" id="kelFilterReset">Tampilkan Semua</button>
    </div>`;

  Object.keys(katObj).forEach(kategori=>{
    const kelompokList = Object.keys(katObj[kategori]);
    html += `<div class="kel-filter-kat">
        <div class="kel-filter-kat-head">
          <span>${escapeHtml(kategori)}</span>
          <button class="kel-filter-kat-toggle" data-kat="${encodeURIComponent(kategori)}">semua/tidak</button>
        </div>`;
    kelompokList.forEach(kelompok=>{
      const key = `${kategori}|||${kelompok}`;
      const checked = ENABLED_KELOMPOK.has(key) ? 'checked' : '';
      html += `<label class="kel-filter-item">
          <input type="checkbox" data-key="${encodeURIComponent(key)}" ${checked}>
          <span>${escapeHtml(kelompok)}</span>
        </label>`;
    });
    html += `</div>`;
  });

  panel.innerHTML = html;

  panel.querySelectorAll('.kel-filter-item input[type=checkbox]').forEach(cb=>{
    cb.onchange = ()=>{
      const key = decodeURIComponent(cb.dataset.key);
      if(cb.checked) ENABLED_KELOMPOK.add(key); else ENABLED_KELOMPOK.delete(key);
      renderContent(activePeriode);
    };
  });

  panel.querySelectorAll('.kel-filter-kat-toggle').forEach(btn=>{
    btn.onclick = ()=>{
      const kategori = decodeURIComponent(btn.dataset.kat);
      const kelompokList = Object.keys(katObj[kategori]);
      const allOn = kelompokList.every(kel=>ENABLED_KELOMPOK.has(`${kategori}|||${kel}`));
      kelompokList.forEach(kel=>{
        const key = `${kategori}|||${kel}`;
        if(allOn) ENABLED_KELOMPOK.delete(key); else ENABLED_KELOMPOK.add(key);
      });
      renderKelFilterPanel(periode);
      renderContent(activePeriode);
    };
  });

  const resetBtn = document.getElementById('kelFilterReset');
  if(resetBtn){
    resetBtn.onclick = ()=>{
      Object.keys(katObj).forEach(kategori=>{
        Object.keys(katObj[kategori]).forEach(kelompok=>{
          ENABLED_KELOMPOK.add(`${kategori}|||${kelompok}`);
        });
      });
      renderKelFilterPanel(periode);
      renderContent(activePeriode);
    };
  }
}

function computeHeroStats(){
  const subSet = new Set();
  const katSet = new Set();
  let maxTahun = -Infinity;
  STORE.__order.forEach(p=>{
    Object.keys(STORE[p]).forEach(kat=>{
      katSet.add(kat);
      Object.keys(STORE[p][kat]).forEach(kel=>{
        Object.keys(STORE[p][kat][kel]).forEach(sub=>{
          subSet.add(kat+'|||'+kel+'|||'+sub);
          STORE[p][kat][kel][sub].forEach(e=>{ if(e.tahun>maxTahun) maxTahun = e.tahun; });
        });
      });
    });
  });
  const elIndikator = document.getElementById('statIndikator');
  const elKategori = document.getElementById('statKategori');
  const elTerbaru = document.getElementById('statTerbaru');
  if(elIndikator) elIndikator.textContent = subSet.size;
  if(elKategori) elKategori.textContent = katSet.size;
  if(elTerbaru) elTerbaru.textContent = isFinite(maxTahun) ? maxTahun : '–';
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  STORE.__order.forEach(p=>{
    const btn = document.createElement('button');
    btn.className = 'tab' + (!compareMode && !ssMode && p===activePeriode?' active':'');
    btn.textContent = p;
    btn.onclick = ()=>{ compareMode = false; ssMode = false; activePeriode = p; renderTabs(); renderContent(p); };
    tabsEl.appendChild(btn);
  });

  const sep = document.createElement('span');
  sep.className = 'tab-sep';
  tabsEl.appendChild(sep);

  const cmpBtn = document.createElement('button');
  cmpBtn.className = 'tab' + (compareMode ? ' active' : '');
  cmpBtn.textContent = '⇄ Bandingkan';
  cmpBtn.onclick = ()=>{ compareMode = true; ssMode = false; renderTabs(); renderCompareView(); };
  tabsEl.appendChild(cmpBtn);

  const ssBtn = document.createElement('button');
  ssBtn.className = 'tab' + (ssMode ? ' active' : '');
  ssBtn.textContent = '📐 Shift-Share';
  ssBtn.onclick = ()=>{ compareMode = false; ssMode = true; renderTabs(); renderShiftShareView(); };
  tabsEl.appendChild(ssBtn);
}

function makeSparkline(entries, color, type){
  color = color || 'var(--orange)';
  type = type || 'filled-area';
  const vals = entries.slice(-8).map(e=>e.data);
  if(vals.length < 2){
    return `<div class="spark-wrap"></div>`;
  }
  const w = 220, h = 34, pad = 3;
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max-min) || 1;
  const step = (w-pad*2) / (vals.length-1);

  let svgContent = '';

  if (type === 'bar') {
    const barW = Math.max(3, (w - pad * 2) / vals.length * 0.5);
    svgContent = vals.map((v, i) => {
      let barH = ((v - min) / range) * (h - pad * 2);
      barH = Math.max(barH, 2); 
      const x = pad + i * step - barW / 2;
      const y = h - pad - barH;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="${color}" rx="0"></rect>`;
    }).join('');
  } else if (type === 'rounded-bar') {
    const barW = Math.max(3, (w - pad * 2) / vals.length * 0.6);
    svgContent = vals.map((v, i) => {
      let barH = ((v - min) / range) * (h - pad * 2);
      barH = Math.max(barH, 3); 
      const x = pad + i * step - barW / 2;
      const y = h - pad - barH;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="${color}" rx="3" ry="3"></rect>`;
    }).join('');
  } else if (type === 'lollipop') {
    svgContent = vals.map((v, i) => {
      const x = pad + i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      const baseY = h - pad;
      return `
        <line x1="${x.toFixed(1)}" y1="${baseY.toFixed(1)}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${color}" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${color}"/>
      `;
    }).join('');
  } else if (type === 'pure-bubble') {
    svgContent = vals.map((v, i) => {
      const x = pad + i * step;
      const normVal = range > 0 ? (v - min) / range : 0.5;
      const y = h - pad - normVal * (h - pad * 2);
      const radius = 2 + normVal * 4; 
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${radius.toFixed(1)}" fill="${color}" opacity="0.85"/>`;
    }).join('');
  } else if (type === 'bubble-ts') {
    let pathD = '';
    const pts = vals.map((v, i) => {
      const x = pad + i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return {x, y, v};
    });
    pts.forEach((p, i) => {
      if (i === 0) pathD += `M ${p.x.toFixed(1)},${p.y.toFixed(1)} `;
      else pathD += `L ${p.x.toFixed(1)},${p.y.toFixed(1)} `;
    });
    let bubbles = pts.map(p => {
      const normVal = range > 0 ? (p.v - min) / range : 0.5;
      const radius = 2 + normVal * 5; 
      return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${radius.toFixed(1)}" fill="${color}" opacity="0.85"/>`;
    }).join('');

    svgContent = `
      <path d="${pathD}" fill="none" stroke="${color}" stroke-width="1.2" opacity="0.4" stroke-dasharray="3,3"/>
      ${bubbles}
    `;
  } else if (type === 'spline') {
    let pathD = '';
    const pts = vals.map((v, i) => {
      const x = pad + i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return {x, y};
    });
    pts.forEach((p, i) => {
      if (i === 0) {
        pathD += `M ${p.x.toFixed(1)},${p.y.toFixed(1)} `;
      } else {
        const prev = pts[i - 1];
        const cpX = (prev.x + p.x) / 2;
        pathD += `C ${cpX.toFixed(1)},${prev.y.toFixed(1)} ${cpX.toFixed(1)},${p.y.toFixed(1)} ${p.x.toFixed(1)},${p.y.toFixed(1)} `;
      }
    });
    const last = pts[pts.length - 1];
    const first = pts[0];
    const poly = `${first.x.toFixed(1)},${h} ${pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')} ${last.x.toFixed(1)},${h}`;
    svgContent = `
      <polygon points="${poly}" fill="${color}" opacity="0.12"/>
      <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="3" fill="${color}"/>
    `;
  } else if (type === 'stepped-area') {
    let pathD = '';
    const pts = vals.map((v,i) => {
      const x = pad + i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    pts.forEach((p, i) => {
      const [x, y] = p.split(',');
      if (i === 0) {
        pathD += `M ${x},${y} `;
      } else {
        const prevY = pts[i-1].split(',')[1];
        pathD += `L ${x},${prevY} L ${x},${y} `;
      }
    });
    const last = pts[pts.length-1].split(',');
    svgContent = `
      <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${color}"/>
    `;
  } else if (type === 'dashed-area') {
    const pts = vals.map((v,i) => {
      const x = pad + i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    const last = pts[pts.length-1].split(',');
    svgContent = `
      <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4,4"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${color}"/>
    `;
  } else if (type === 'scatter') {
    svgContent = vals.map((v, i) => {
      const x = pad + i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${color}"/>`;
    }).join('');
  } else if (type === 'waterfall') {
    const barW = Math.max(3, (w - pad * 2) / vals.length * 0.55);
    const zeroY = h - pad;
    svgContent = vals.map((v, i) => {
      const prev = i === 0 ? min : vals[i-1];
      const isUp = v >= prev;
      const yTop = h - pad - ((Math.max(v,prev) - min) / range) * (h - pad * 2);
      const yBot = h - pad - ((Math.min(v,prev) - min) / range) * (h - pad * 2);
      const barH = Math.max(2, yBot - yTop);
      const x = pad + i * step - barW / 2;
      const barColor = i === 0 ? color : (isUp ? '#4E7D5A' : '#A63A50');
      return `<rect x="${x.toFixed(1)}" y="${yTop.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="${barColor}" rx="1"></rect>`;
    }).join('');
  } else if (type === 'funnel') {
    const sortedIdx = vals.map((v,i)=>i).sort((a,b)=>vals[b]-vals[a]);
    const barH = Math.max(2, (h - pad*2) / vals.length - 2);
    svgContent = sortedIdx.map((origI, rank) => {
      const v = vals[origI];
      const wRatio = range > 0 ? 0.28 + 0.72*((v-min)/range) : 1;
      const barW = (w - pad*2) * wRatio;
      const x = pad + ((w - pad*2) - barW)/2;
      const y = pad + rank * ((h - pad*2)/vals.length);
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="${color}" opacity="${(0.55+0.45*(v-min)/range).toFixed(2)}" rx="2"></rect>`;
    }).join('');
  } else if (type === 'surface') {
    const cellW = (w - pad*2) / vals.length;
    svgContent = vals.map((v, i) => {
      const norm = range > 0 ? (v-min)/range : 0.5;
      const x = pad + i * cellW;
      const op = 0.25 + norm*0.7;
      return `<rect x="${x.toFixed(1)}" y="${pad}" width="${(cellW-1.5).toFixed(1)}" height="${(h-pad*2).toFixed(1)}" fill="${color}" opacity="${op.toFixed(2)}" rx="2"></rect>`;
    }).join('');
  } else if (type === 'radar') {
    const cx = h / 2 + 6, cy = h / 2, r = h / 2 - 3;
    const n = vals.length;
    const pts = vals.map((v, i) => {
      const norm = range > 0 ? (v - min) / range : 0.5;
      const rad = 0.35 + norm * (r - 2);
      const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
      return [cx + Math.cos(angle) * rad, cy + Math.sin(angle) * rad];
    });
    const poly = pts.map(p => p.map(v=>v.toFixed(1)).join(',')).join(' ');
    svgContent = `<polygon points="${poly}" fill="${color}" fill-opacity="0.28" stroke="${color}" stroke-width="1.4"></polygon>`;
  } else if (type === 'polar-area') {
    const cx = h / 2 + 6, cy = h / 2, rMax = h / 2 - 2;
    const n = vals.length;
    const slice = (Math.PI * 2) / n;
    svgContent = vals.map((v, i) => {
      const norm = range > 0 ? (v - min) / range : 0.5;
      const rad = 0.3 + norm * (rMax - 1);
      const a0 = i * slice - Math.PI / 2;
      const a1 = a0 + slice;
      const x0 = cx + Math.cos(a0) * rad, y0 = cy + Math.sin(a0) * rad;
      const x1 = cx + Math.cos(a1) * rad, y1 = cy + Math.sin(a1) * rad;
      return `<path d="M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${rad.toFixed(1)},${rad.toFixed(1)} 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" fill="${color}" fill-opacity="${(0.3+0.5*norm).toFixed(2)}" stroke="#fff" stroke-width="0.5"></path>`;
    }).join('');
  } else if (type === 'diverging-bar') {
    const avg = vals.reduce((s,v)=>s+v,0)/vals.length;
    const zeroY = h - pad - ((avg - min) / range) * (h - pad * 2);
    const barW = Math.max(3, (w - pad * 2) / vals.length * 0.55);
    svgContent = vals.map((v, i) => {
      const x = pad + i * step - barW / 2;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      const isUp = v >= avg;
      const yTop = isUp ? y : zeroY;
      const barH = Math.max(1.5, Math.abs(zeroY - y));
      return `<rect x="${x.toFixed(1)}" y="${yTop.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="${isUp ? '#4E7D5A' : '#A63A50'}" rx="1"></rect>`;
    }).join('') + `<line x1="${pad}" y1="${zeroY.toFixed(1)}" x2="${w-pad}" y2="${zeroY.toFixed(1)}" stroke="#8A5A24" stroke-width="0.7" stroke-dasharray="2,2"></line>`;
  } else if (type === 'combo') {
    const barW = Math.max(3, (w - pad * 2) / vals.length * 0.55);
    const bars = vals.map((v, i) => {
      const x = pad + i * step - barW / 2;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      const barH = h - pad - y;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="${color}" opacity="0.45" rx="1"></rect>`;
    }).join('');
    let running = 0;
    const cumLine = vals.map((v,i)=>{
      running += v;
      const avgSoFar = running/(i+1);
      const x = pad + i * step;
      const y = h - pad - ((avgSoFar - min) / range) * (h - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    svgContent = bars + `<polyline points="${cumLine}" fill="none" stroke="${color}" stroke-width="1.6"></polyline>`;
  } else if (type === 'pareto') {
    const idxSorted = vals.map((v,i)=>i).sort((a,b)=>vals[b]-vals[a]);
    const barW = Math.max(3, (w - pad * 2) / vals.length * 0.6);
    const total = vals.reduce((s,v)=>s+v,0) || 1;
    let cum = 0;
    const bars = idxSorted.map((origI, rank) => {
      const v = vals[origI];
      const x = pad + rank * step - barW/2 + step/2 - step/2;
      const xPos = pad + rank * (w - pad*2)/vals.length;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      const barH = h - pad - y;
      return `<rect x="${xPos.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="${color}" opacity="0.55" rx="1"></rect>`;
    }).join('');
    const cumPts = idxSorted.map((origI, rank) => {
      cum += vals[origI];
      const pct = cum/total;
      const xPos = pad + rank * (w - pad*2)/vals.length + (w-pad*2)/vals.length/2;
      const y = h - pad - pct * (h - pad*2);
      return `${xPos.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    svgContent = bars + `<polyline points="${cumPts}" fill="none" stroke="#562F00" stroke-width="1.4"></polyline>`;
  } else if (type === 'stream') {
    const midY = h / 2;
    const scaleY = range > 0 ? (h - pad*2) / 2 / (range/2) : 1;
    const topPts = vals.map((v, i) => {
      const x = pad + i * step;
      const halfV = ((v - min) - range/2) * scaleY * 0.5;
      return [x, midY - Math.abs(halfV) - 2];
    });
    const botPts = vals.map((v, i) => {
      const x = pad + i * step;
      const halfV = ((v - min) - range/2) * scaleY * 0.5;
      return [x, midY + Math.abs(halfV) + 2];
    });
    const pathPts = topPts.concat(botPts.slice().reverse());
    const d = pathPts.map((p,idx)=> (idx===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') + ' Z';
    svgContent = `<path d="${d}" fill="${color}" fill-opacity="0.5" stroke="${color}" stroke-width="1"></path>`;
  } else {
    const pts = vals.map((v,i) => {
      const x = pad + i * step;
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    const last = pts[pts.length-1].split(',');
    const poly = `${pts[0].split(',')[0]},${h} ${pts.join(' ')} ${last[0]},${h}`;
    svgContent = `
      <polygon points="${poly}" fill="${color}" opacity="0.15"/>
      <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${color}"/>
    `;
  }

  return `<div class="spark-wrap"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${svgContent}</svg></div>`;
}

function changeBadge(entries){
  if(entries.length < 2) return `<span class="badge na">Data awal</span>`;
  const latest = entries[entries.length-1].data;
  const prev = entries[entries.length-2].data;
  const diff = latest - prev;
  if(Math.abs(diff) < 0.0005) return `<span class="badge flat">▬ ${fmtNum(prev)}</span>`;
  const up = diff > 0;
  return `<span class="badge ${up?'up':'down'}">${up?'▲':'▼'} ${fmtNum(prev)}</span>`;
}

function renderContent(periode){
  const main = document.getElementById('main');
  const katObj = STORE[periode];
  if(!katObj){ main.innerHTML = '<div class="state-msg">Tidak ada data.</div>'; return; }

  renderKelFilterPanel(periode);

  let html = '';
  let anyVisible = false;
  Object.keys(katObj).forEach(kategori=>{
    const kelObj = katObj[kategori];
    const visibleKelompok = Object.keys(kelObj).filter(kel=>ENABLED_KELOMPOK.has(`${kategori}|||${kel}`));
    if(visibleKelompok.length === 0) return;
    anyVisible = true;
    const subCount = visibleKelompok.reduce((n,k)=>n+Object.keys(kelObj[k]).length,0);
    html += `<section class="kategori-block">
      <div class="section-head"><h2><span class="kat-dot"></span>${escapeHtml(kategori)}</h2><span class="tag">${subCount} indikator</span></div>`;

    visibleKelompok.forEach(kelompok=>{
      const subObj = kelObj[kelompok];
      const compGroups = getCompositionGroups(subObj, kelompok);
      const kelColor = getGroupColor(kategori, kelompok);
      
      html += `<div class="kelompok-block" style="--kat-accent:${kelColor}">
        <div class="kelompok-chip" style="background:${kelColor}22;color:${kelColor}">${escapeHtml(kelompok)}</div>
        <div class="card-grid">`;

      compGroups.forEach(g=>{
        html += renderCompositionCardHtml(periode,kategori,kelompok,subObj,g,kelColor);
      });
      const claimedSubs = new Set(compGroups.flatMap(g=>g.segs));
      const normalSubs = Object.keys(subObj).filter(s=>!claimedSubs.has(s));
      normalSubs.forEach(sub=>{
          const entries = subObj[sub];
          const latest = entries[entries.length-1];
          const key = encodeURIComponent(JSON.stringify([periode,kategori,kelompok,sub]));
          const subChartType = getGroupChartType(kategori, kelompok, sub);

function splitCompositionSegments(subObj){
  const subs = Object.keys(subObj);
  const candidates = subs.filter(s => {
    const t = s.trim();
    return /^\d+(\.\d+)?%/.test(t) || /^persentase/i.test(t);
  });
  if(candidates.length < 2 || candidates.length > 8) return null;

  const yearTotals = {};
  candidates.forEach(sub=>{
    subObj[sub].forEach(e=>{
      const k = sortKey(e);
      yearTotals[k] = (yearTotals[k]||0) + e.data;
    });
  });
  const totals = Object.values(yearTotals);
  if(totals.length === 0) return null;
  const closeTo100 = totals.filter(t=>Math.abs(t-100) <= 5).length;
  if((closeTo100 / totals.length) < 0.6) return null;
  return candidates;
}

const LEVEL_SUFFIX_RE = /\s+(SD\/Sederajat|SMP\/Sederajat|SMA\/Sederajat|SMK\/Sederajat|Perguruan Tinggi|\d{1,2}\s*-\s*\d{1,2}\s*Tahun|Laki-laki|Laki-Laki|Perempuan)$/i;

function splitLevelGroups(subObj){
  const subs = Object.keys(subObj);
  const groups = {};
  subs.forEach(s=>{
    const m = s.match(LEVEL_SUFFIX_RE);
    if(m){
      const prefix = s.slice(0, m.index).trim();
      if(!groups[prefix]) groups[prefix] = [];
      groups[prefix].push(s);
    }
  });
  return Object.keys(groups)
    .filter(p=>groups[p].length >= 2)
    .map(p=>({ label:p, segs:groups[p] }));
}

function getCompositionGroups(subObj, kelompok){
  const groups = [];
  const pctSegs = splitCompositionSegments(subObj);
  if(pctSegs) groups.push({ label:kelompok, segs:pctSegs, normalized:true });
  const claimed = new Set(pctSegs || []);
  splitLevelGroups(subObj).forEach(g=>{
    const segs = g.segs.filter(s=>!claimed.has(s));
    if(segs.length >= 2) groups.push({ label:g.label, segs, normalized:false });
  });
  return groups;
}

function renderCompositionCardHtml(periode,kategori,kelompok,subObj,group,katColor){
  const { label, segs, normalized } = group;
  let maxSK = -Infinity;
  segs.forEach(s=> subObj[s].forEach(e=>{ maxSK = Math.max(maxSK, sortKey(e)); }));
  const latestEntries = segs.map(s=>{
    const arr = subObj[s];
    return { sub:s, entry: arr.find(e=>sortKey(e)===maxSK) || arr[arr.length-1] };
  });
  const total = latestEntries.reduce((sum,x)=>sum + (x.entry?x.entry.data:0), 0) || 1;
  const latestLabel = latestEntries[0].entry ? periodLabel(latestEntries[0].entry) : '';

  const barSegs = latestEntries.map((x,i)=>{
    const pct = x.entry ? (x.entry.data/total*100) : 0;
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    return `<div class="comp-bar-seg" style="flex:${Math.max(pct,0.5)};background:${color};" title="${escapeHtml(x.sub)}: ${fmtNum(x.entry?x.entry.data:NaN)}"></div>`;
  }).join('');

  const legend = latestEntries.map((x,i)=>{
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    let shortName = x.sub;
    if(shortName.startsWith(label)){
      shortName = shortName.slice(label.length).trim().replace(/^[-–:\/]\s*/,'');
    }
    if(!shortName) shortName = x.sub;
    return `<div class="comp-legend-item" title="${escapeHtml(x.sub)}: ${fmtNum(x.entry?x.entry.data:NaN)}"><span class="dot" style="background:${color}"></span>${escapeHtml(shortName)}</div>`;
  }).join('');

  const key = encodeURIComponent(JSON.stringify([periode,kategori,kelompok,label,segs]));
  const gradientColors = latestEntries.map((_,i)=>COMPARE_COLORS[i % COMPARE_COLORS.length]);
  let stripGradient = gradientColors[0] || katColor;
  if(gradientColors.length > 1){
    const n = gradientColors.length;
    const stops = gradientColors.map((c,i)=>{
      const startPct = (i/n*100).toFixed(2);
      const endPct = ((i+1)/n*100).toFixed(2);
      return `${c} ${startPct}%, ${c} ${endPct}%`;
    }).join(', ');
    stripGradient = `linear-gradient(90deg, ${stops})`;
  }
  return `<div class="card comp-card" data-compkey='${key}'>
      <div class="comp-color-strip" style="background:${stripGradient}"></div>
      <div class="card-label">${escapeHtml(label)}</div>
      <div class="card-period">${latestLabel} · ${normalized ? 'Komposisi' : 'Rincian per Jenjang'}</div>
      <div class="comp-bar">${barSegs}</div>
      <div class="comp-legend">${legend}</div>
    </div>`;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function triggerJPGDownload(inst, name){
  if(!inst){ alert('Grafik belum siap.'); return; }
  const srcCanvas = inst.canvas;
  const tmpCanvas = document.createElement('canvas');
  tmpCanvas.width = srcCanvas.width;
  tmpCanvas.height = srcCanvas.height;
  const tctx = tmpCanvas.getContext('2d');
  tctx.fillStyle = '#ffffff';
  tctx.fillRect(0, 0, tmpCanvas.width, tmpCanvas.height);
  tctx.drawImage(srcCanvas, 0, 0);
  tmpCanvas.toBlob(function(blob){
    if(!blob){ alert('Gagal membuat gambar.'); return; }
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `${(name||'grafik').replace(/[^a-z0-9]+/gi,'_')}.jpg`;
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }, 'image/jpeg', 1.0);
}
function downloadChartJPG(){ triggerJPGDownload(chartInstance, currentSeriesKey ? currentSeriesKey.sub : 'grafik'); }
function exportSvgAsJPG(svgEl, name){
  if(!svgEl){ alert('Grafik belum siap.'); return; }
  const xml = new XMLSerializer().serializeToString(svgEl);
  const svg64 = btoa(unescape(encodeURIComponent(xml)));
  const image64 = 'data:image/svg+xml;base64,' + svg64;
  const img = new Image();
  img.onload = function(){
    const vb = svgEl.viewBox && svgEl.viewBox.baseVal;
    const w = (vb && vb.width) || svgEl.clientWidth || 600;
    const h = (vb && vb.height) || svgEl.clientHeight || 320;
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,w,h);
    ctx.drawImage(img, 0, 0, w, h);
    canvas.toBlob(function(blob){
      if(!blob){ alert('Gagal membuat gambar.'); return; }
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${(name||'grafik').replace(/[^a-z0-9]+/gi,'_')}.jpg`;
      link.style.display = 'none';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
    }, 'image/jpeg', 1.0);
  };
  img.onerror = function(){ alert('Gagal membuat gambar dari grafik.'); };
  img.src = image64;
}

async function exportStyledExcel(filename, sheetName, header, rows){
  if(typeof ExcelJS === 'undefined'){ alert('Gagal memuat library Excel. Coba refresh halaman.'); return; }
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet(sheetName);
  ws.addRow(header);
  rows.forEach(r=>ws.addRow(r));

  const headerRow = ws.getRow(1);
  headerRow.eachCell(cell=>{
    cell.font = { bold:true, color:{argb:'FFFFFFFF'} };
    cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFE97B2A'} };
    cell.alignment = { vertical:'middle', horizontal:'center' };
    cell.border = {
      top:{style:'thin',color:{argb:'FFD8A15B'}}, left:{style:'thin',color:{argb:'FFD8A15B'}},
      bottom:{style:'thin',color:{argb:'FFD8A15B'}}, right:{style:'thin',color:{argb:'FFD8A15B'}}
    };
  });
  headerRow.height = 20;

  for(let i=2;i<=ws.rowCount;i++){
    const row = ws.getRow(i);
    row.eachCell((cell, colNumber)=>{
      cell.border = {
        top:{style:'thin',color:{argb:'FFEFDCB8'}}, left:{style:'thin',color:{argb:'FFEFDCB8'}},
        bottom:{style:'thin',color:{argb:'FFEFDCB8'}}, right:{style:'thin',color:{argb:'FFEFDCB8'}}
      };
      if(typeof cell.value === 'number'){
        cell.numFmt = '#,##0.00';
        cell.alignment = { horizontal:'right' };
      }else{
        cell.alignment = { horizontal: colNumber===1 ? 'left' : 'center' };
      }
      if(i % 2 === 0){
        cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFFBF3E4'} };
      }
    });
  }

  ws.columns.forEach((col,idx)=>{
    let maxLen = String(header[idx]==null?'':header[idx]).length;
    rows.forEach(r=>{
      const v = r[idx];
      const len = (v===null||v===undefined||v==='') ? 1 : String(v).length;
      if(len>maxLen) maxLen = len;
    });
    col.width = Math.min(Math.max(maxLen+3, 10), 40);
  });

  ws.views = [{ state:'frozen', ySplit:1 }];

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function buildCompositionInsight(label, segs, bySegSK, sortedSK, skMap){
  if(!sortedSK || sortedSK.length === 0) return 'Tidak ada data pada rentang periode ini.';
  const satuan = SATUAN[segs[0]] ? ' ' + escapeHtml(SATUAN[segs[0]]) : '';
  const firstSK = sortedSK[0], lastSK = sortedSK[sortedSK.length-1];
  const firstLabel = skMap.get(firstSK), lastLabel = skMap.get(lastSK);

  const firstTotal = segs.reduce((sum,s)=> sum + (bySegSK[s][firstSK] || 0), 0);
  const lastTotal = segs.reduce((sum,s)=> sum + (bySegSK[s][lastSK] || 0), 0);

  let domSeg = segs[0], domVal = -Infinity;
  segs.forEach(s=>{
    const v = bySegSK[s][lastSK];
    if(v !== undefined && v > domVal){ domVal = v; domSeg = s; }
  });
  const domShare = lastTotal > 0 ? (domVal/lastTotal*100) : 0;

  let bestSeg = null, bestChange = -Infinity, worstSeg = null, worstChange = Infinity;
  segs.forEach(s=>{
    const f = bySegSK[s][firstSK], l = bySegSK[s][lastSK];
    if(f !== undefined && l !== undefined){
      const diff = l - f;
      if(diff > bestChange){ bestChange = diff; bestSeg = s; }
      if(diff < worstChange){ worstChange = diff; worstSeg = s; }
    }
  });

  let trendWord = 'relatif stabil dibandingkan', trendClass = 'trend-flat';
  if(lastTotal > firstTotal){ trendWord = 'meningkat dibandingkan'; trendClass = 'trend-up'; }
  else if(lastTotal < firstTotal){ trendWord = 'menurun dibandingkan'; trendClass = 'trend-down'; }

  let html = `Pada periode <b>${escapeHtml(lastLabel)}</b>, total gabungan seluruh komponen <b>${escapeHtml(label)}</b> tercatat <b>${fmtNum(lastTotal)}${satuan}</b> (dijumlah apa adanya dari ${segs.length} komponen, bukan dinormalisasi ke 100%).`;

  if(firstSK !== lastSK){
    html += ` Nilai gabungan ini <span class="${trendClass}">${trendWord}</span> periode <b>${escapeHtml(firstLabel)}</b> yang tercatat <b>${fmtNum(firstTotal)}${satuan}</b>.`;
  }

  html += ` Komponen dengan porsi terbesar saat ini adalah <b>${escapeHtml(domSeg)}</b> (${fmtNum(domVal)}${satuan}, sekitar ${domShare.toFixed(1)}% dari total gabungan).`;

  if(bestSeg && worstSeg && bestSeg !== worstSeg){
    html += ` Sepanjang rentang ini, <b>${escapeHtml(bestSeg)}</b> mencatat kenaikan paling besar (${bestChange>0?'+':''}${fmtNum(bestChange)}${satuan}), sementara <b>${escapeHtml(worstSeg)}</b> mencatat perubahan paling rendah/menurun (${worstChange>0?'+':''}${fmtNum(worstChange)}${satuan}).`;
  }

  if(firstSK !== lastSK){
    const domValFirst = bySegSK[domSeg][firstSK];
    if(domValFirst !== undefined && firstTotal > 0){
      const domShareFirst = domValFirst/firstTotal*100;
      const shareDiff = domShare - domShareFirst;
      if(Math.abs(shareDiff) >= 1){
        html += ` Porsi <b>${escapeHtml(domSeg)}</b> terhadap total gabungan ${shareDiff>0?'membesar':'mengecil'} dari sekitar ${domShareFirst.toFixed(1)}% menjadi ${domShare.toFixed(1)}%, menandakan komposisi ${shareDiff>0?'makin terkonsentrasi pada komponen ini':'makin merata antar komponen'}.`;
      }
    }
  }

  if(segs.length >= 2 && sortedSK.length >= 3){
    let sameDirCount = 0, comparableMoves = 0;
    for(let i=1;i<sortedSK.length;i++){
      const skPrev = sortedSK[i-1], skCur = sortedSK[i];
      let totalPrev = 0, totalCur = 0, valid = true;
      segs.forEach(s=>{
        const p = bySegSK[s][skPrev], c = bySegSK[s][skCur];
        if(p === undefined || c === undefined) valid = false;
      });
      if(!valid) continue;
      segs.forEach(s=>{ totalPrev += bySegSK[s][skPrev]; totalCur += bySegSK[s][skCur]; });
      const totalDir = totalCur - totalPrev;
      segs.forEach(s=>{
        const segDir = bySegSK[s][skCur] - bySegSK[s][skPrev];
        comparableMoves++;
        if((segDir >= 0 && totalDir >= 0) || (segDir < 0 && totalDir < 0)) sameDirCount++;
      });
    }
    if(comparableMoves > 0){
      const syncPct = (sameDirCount/comparableMoves*100);
      let syncWord = 'cenderung bergerak searah dengan tren total gabungan (sinkron)';
      if(syncPct < 55) syncWord = 'cukup sering bergerak berlawanan arah satu sama lain (tidak sinkron)';
      else if(syncPct < 75) syncWord = 'kadang bergerak berbeda arah antar komponen';
      html += ` Antar komponen, pergerakan tahun-ke-tahun ${syncWord} (±${syncPct.toFixed(0)}% pergerakan searah dengan total).`;
    }
  }

  return html;
}

function buildTreemapLayout(items, x, y, w, h){
  if(items.length === 0) return [];
  if(items.length === 1){
    return [Object.assign({}, items[0], {x,y,w,h})];
  }
  const total = items.reduce((s,it)=>s+it.value,0) || 1;
  let cum = 0, splitIdx = 1;
  for(let i=0;i<items.length;i++){
    cum += items[i].value;
    if(cum >= total/2){ splitIdx = i+1; break; }
  }
  splitIdx = Math.max(1, Math.min(items.length-1, splitIdx));
  const groupA = items.slice(0, splitIdx);
  const groupB = items.slice(splitIdx);
  const sumA = groupA.reduce((s,it)=>s+it.value,0);
  const fracA = sumA/total;
  let rects = [];
  if(w >= h){
    const wA = w*fracA;
    rects = rects.concat(buildTreemapLayout(groupA, x, y, wA, h));
    rects = rects.concat(buildTreemapLayout(groupB, x+wA, y, w-wA, h));
  }else{
    const hA = h*fracA;
    rects = rects.concat(buildTreemapLayout(groupA, x, y, w, hA));
    rects = rects.concat(buildTreemapLayout(groupB, x, y+hA, w, h-hA));
  }
  return rects;
}

function buildTreemapSVG(segs, bySegSK, lastSK){
  const items = segs.map((s,i)=>({
    name: s,
    value: bySegSK[s][lastSK] || 0,
    color: COMPARE_COLORS[i % COMPARE_COLORS.length]
  })).filter(it=>it.value > 0);

  if(items.length === 0){
    return '<div style="padding:20px;font-size:13px;color:var(--brown-mid);">Tidak ada data pada periode ini.</div>';
  }

  items.sort((a,b)=>b.value-a.value);
  const total = items.reduce((s,it)=>s+it.value,0) || 1;
  const W = 600, H = 320;
  const rects = buildTreemapLayout(items, 0, 0, W, H);

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" id="compTreemapSvg" style="width:100%;height:320px;display:block;background:#fff;">`;
  rects.forEach(r=>{
    const rw = Math.max(0, r.w - 3);
    const rh = Math.max(0, r.h - 3);
    const pct = (r.value/total*100).toFixed(1);
    svg += `<rect x="${r.x.toFixed(1)}" y="${r.y.toFixed(1)}" width="${rw.toFixed(1)}" height="${rh.toFixed(1)}" fill="${r.color}" rx="5"><title>${escapeHtml(r.name)}: ${fmtNum(r.value)} (${pct}%)</title></rect>`;
    if(r.w > 70 && r.h > 34){
      const shortName = r.name.length > 24 ? r.name.slice(0,22)+'…' : r.name;
      svg += `<text x="${(r.x+9).toFixed(1)}" y="${(r.y+19).toFixed(1)}" font-size="11" font-family="Inter,sans-serif" fill="#fff" font-weight="700">${escapeHtml(shortName)}</text>`;
      svg += `<text x="${(r.x+9).toFixed(1)}" y="${(r.y+36).toFixed(1)}" font-size="13" font-family="Inter,sans-serif" fill="#fff" font-weight="700">${fmtNum(r.value)}</text>`;
    }else if(r.w > 34 && r.h > 20){
      svg += `<text x="${(r.x+r.w/2).toFixed(1)}" y="${(r.y+r.h/2+4).toFixed(1)}" font-size="10" font-family="Inter,sans-serif" fill="#fff" font-weight="700" text-anchor="middle">${pct}%</text>`;
    }
  });
  svg += `</svg>`;
  return svg;
}

function buildWaffleSVG(segs, bySegSK, lastSK){
  const items = segs.map((s,i)=>({
    name: s,
    value: bySegSK[s][lastSK] || 0,
    color: COMPARE_COLORS[i % COMPARE_COLORS.length]
  })).filter(it=>it.value > 0);

  if(items.length === 0){
    return '<div style="padding:20px;font-size:13px;color:var(--brown-mid);">Tidak ada data pada periode ini.</div>';
  }

  const total = items.reduce((s,it)=>s+it.value,0) || 1;
  const rawCounts = items.map(it => (it.value/total)*100);
  const counts = rawCounts.map(c => Math.floor(c));
  let remainder = 100 - counts.reduce((s,c)=>s+c,0);
  const order = rawCounts.map((c,i)=>({i, frac:c-Math.floor(c)})).sort((a,b)=>b.frac-a.frac);
  for(let k=0;k<remainder;k++){ counts[order[k % order.length].i]++; }

  const cellSeq = [];
  counts.forEach((c,i)=>{ for(let k=0;k<c;k++) cellSeq.push(items[i]); });
  while(cellSeq.length < 100 && items.length>0) cellSeq.push(items[items.length-1]);

  const cols = 10, gap = 3, size = 26;
  const W = cols*(size+gap)-gap, H = 10*(size+gap)-gap;
  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" id="compWaffleSvg" style="width:100%;height:320px;display:block;">`;
  cellSeq.slice(0,100).forEach((item, idx)=>{
    const col = idx % cols, row = Math.floor(idx/cols);
    const x = col*(size+gap), y = row*(size+gap);
    svg += `<rect x="${x}" y="${y}" width="${size}" height="${size}" rx="4" fill="${item.color}"><title>${escapeHtml(item.name)}: ${fmtNum(item.value)}</title></rect>`;
  });
  svg += `</svg>`;
  return svg;
}

function buildDumbbellSVG(segs, bySegSK, sortedSK, skMap){
  if(sortedSK.length === 0){
    return '<div style="padding:20px;font-size:13px;color:var(--brown-mid);">Tidak ada data pada periode ini.</div>';
  }
  const W = 600, rowH = 30, padTop = 16, padBottom = 24, padLeft = 90, padRight = 20;
  const H = padTop + sortedSK.length*rowH + padBottom;

  let globalMin = Infinity, globalMax = -Infinity;
  sortedSK.forEach(sk=>{
    segs.forEach(s=>{
      const v = bySegSK[s][sk];
      if(v !== undefined){ globalMin = Math.min(globalMin, v); globalMax = Math.max(globalMax, v); }
    });
  });
  if(!isFinite(globalMin)) { globalMin = 0; globalMax = 1; }
  const rangeV = (globalMax-globalMin) || 1;
  const plotW = W - padLeft - padRight;
  const xOf = (v)=> padLeft + ((v-globalMin)/rangeV) * plotW;

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" id="compDumbbellSvg" style="width:100%;height:${Math.min(H,340)}px;display:block;">`;

  sortedSK.forEach((sk, rowIdx)=>{
    const y = padTop + rowIdx*rowH + rowH/2;
    const pts = segs.map((s,i)=>({ v: bySegSK[s][sk], color: COMPARE_COLORS[i % COMPARE_COLORS.length], name:s }))
      .filter(p=>p.v !== undefined);
    if(pts.length === 0) return;
    const minP = pts.reduce((a,b)=> a.v<b.v?a:b);
    const maxP = pts.reduce((a,b)=> a.v>b.v?a:b);

    svg += `<text x="8" y="${(y+4).toFixed(1)}" font-size="10.5" font-family="Inter,sans-serif" fill="#8A5A24">${escapeHtml(skMap.get(sk)||'')}</text>`;
    if(pts.length > 1){
      svg += `<line x1="${xOf(minP.v).toFixed(1)}" y1="${y.toFixed(1)}" x2="${xOf(maxP.v).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#D8A15B" stroke-width="2.5"></line>`;
    }
    pts.forEach(p=>{
      svg += `<circle cx="${xOf(p.v).toFixed(1)}" cy="${y.toFixed(1)}" r="6" fill="${p.color}" stroke="#fff" stroke-width="1.5"><title>${escapeHtml(p.name)}: ${fmtNum(p.v)}</title></circle>`;
    });
  });

  svg += `</svg>`;
  return svg;
}

function buildStreamSVG(segs, bySegSK, sortedSK, skMap){
  if(sortedSK.length === 0){
    return '<div style="padding:20px;font-size:13px;color:var(--brown-mid);">Tidak ada data pada periode ini.</div>';
  }
  const W = 600, H = 300, padLeft = 10, padRight = 10, padTop = 16, padBottom = 26;
  const plotW = W - padLeft - padRight, plotH = H - padTop - padBottom;
  const n = sortedSK.length;
  const centerY = padTop + plotH / 2;

  let maxTotal = 0;
  sortedSK.forEach(sk=>{
    const total = segs.reduce((s,seg)=>s+(bySegSK[seg][sk]||0),0);
    if(total > maxTotal) maxTotal = total;
  });
  if(maxTotal === 0) maxTotal = 1;
  const scaleY = (plotH * 0.92 / 2) / (maxTotal / 2);
  const xAt = i => padLeft + (n<=1 ? plotW/2 : (i/(n-1))*plotW);

  const running = sortedSK.map(sk=>{
    const total = segs.reduce((s,seg)=>s+(bySegSK[seg][sk]||0),0);
    return -total/2;
  });

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" id="compStreamSvg" style="width:100%;height:320px;display:block;">`;
  segs.forEach((seg,i)=>{
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    const topPts = [], botPts = [];
    sortedSK.forEach((sk,ti)=>{
      const v = bySegSK[seg][sk] || 0;
      const bot = running[ti];
      const top = bot + v;
      running[ti] = top;
      topPts.push([xAt(ti), centerY - top*scaleY]);
      botPts.push([xAt(ti), centerY - bot*scaleY]);
    });
    const pathPts = topPts.concat(botPts.slice().reverse());
    const d = pathPts.map((p,idx)=> (idx===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') + ' Z';
    svg += `<path d="${d}" fill="${color}" fill-opacity="0.85" stroke="#fff" stroke-width="0.6"><title>${escapeHtml(seg)}</title></path>`;
  });

  const labelStep = Math.max(1, Math.ceil(n/8));
  sortedSK.forEach((sk,ti)=>{
    if(ti % labelStep === 0 || ti === n-1){
      svg += `<text x="${xAt(ti).toFixed(1)}" y="${(H-6).toFixed(1)}" font-size="9" text-anchor="middle" fill="#8A5A24">${escapeHtml(skMap.get(sk)||'')}</text>`;
    }
  });
  svg += `</svg>`;
  return svg;
}

function buildMarimekkoSVG(segs, bySegSK, sortedSK, skMap){
  if(sortedSK.length === 0){
    return '<div style="padding:20px;font-size:13px;color:var(--brown-mid);">Tidak ada data pada periode ini.</div>';
  }
  const W = 600, H = 300, padTop = 10, padBottom = 30, padLeft = 4, padRight = 4;
  const plotW = W - padLeft - padRight, plotH = H - padTop - padBottom;

  const periodTotals = sortedSK.map(sk => segs.reduce((s,seg)=> s + (bySegSK[seg][sk]||0), 0));
  const grandTotal = periodTotals.reduce((s,v)=>s+v,0) || 1;

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" id="compMarimekkoSvg" style="width:100%;height:320px;display:block;">`;
  let xCursor = padLeft;
  sortedSK.forEach((sk, si)=>{
    const total = periodTotals[si] || 0;
    const colW = grandTotal > 0 ? (total/grandTotal) * plotW : plotW/sortedSK.length;
    let yCursor = padTop;
    segs.forEach((seg,i)=>{
      const v = bySegSK[seg][sk] || 0;
      const shareH = total > 0 ? (v/total) * plotH : 0;
      const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
      svg += `<rect x="${xCursor.toFixed(1)}" y="${yCursor.toFixed(1)}" width="${Math.max(0,colW-1.5).toFixed(1)}" height="${Math.max(0,shareH-1).toFixed(1)}" fill="${color}"><title>${escapeHtml(seg)} (${escapeHtml(skMap.get(sk)||'')}): ${fmtNum(v)}</title></rect>`;
      yCursor += shareH;
    });
    if(colW > 20){
      svg += `<text x="${(xCursor+colW/2).toFixed(1)}" y="${(H-12).toFixed(1)}" font-size="9" text-anchor="middle" fill="#8A5A24">${escapeHtml(skMap.get(sk)||'')}</text>`;
    }
    xCursor += colW;
  });
  svg += `</svg>`;
  return svg;
}

function refreshCompositionDetail(subObj, segs, fromYear, toYear){
  const skMap = new Map();
  segs.forEach(s=>{
    subObj[s].forEach(e=>{
      if(e.tahun >= fromYear && e.tahun <= toYear) skMap.set(sortKey(e), periodLabel(e));
    });
  });
  const sortedSK = [...skMap.keys()].sort((a,b)=>a-b);
  const labels = sortedSK.map(sk=>skMap.get(sk));

  const bySegSK = {};
  segs.forEach(s=>{
    bySegSK[s] = {};
    subObj[s].forEach(e=>{ bySegSK[s][sortKey(e)] = e.data; });
  });

  const datasets = segs.map((s,i)=>{
    const data = sortedSK.map(sk=> bySegSK[s].hasOwnProperty(sk) ? bySegSK[s][sk] : null);

function downloadCompositionExcel(subObj, segs){
  const fromSel = document.getElementById('compFromYear');
  const toSel = document.getElementById('compToYear');
  const fromYear = parseInt(fromSel.value), toYear = parseInt(toSel.value);

  const skMap = new Map();
  segs.forEach(s=>{
    subObj[s].forEach(e=>{
      if(e.tahun >= fromYear && e.tahun <= toYear) skMap.set(sortKey(e), periodLabel(e));
    });
  });
  const sortedSK = [...skMap.keys()].sort((a,b)=>a-b);

  const header = ['Periode', ...segs, 'Total'];
  const rows = [];
  sortedSK.forEach(sk=>{
    const label = skMap.get(sk);
    let rowTotal = 0;
    const vals = segs.map(s=>{
      const entry = subObj[s].find(e=>sortKey(e)===sk);
      const v = entry ? entry.data : '';
      if(typeof v === 'number') rowTotal += v;
      return v;
    });
    rows.push([label, ...vals, rowTotal]);
  });

  exportStyledExcel(`${(currentCompKey?currentCompKey.label:'komposisi').replace(/[^a-z0-9]+/gi,'_')}.xlsx`, 'Komposisi', header, rows);
}

function buildCompareIndex(periode){
  const idx = {};
  const katObj = STORE[periode];
  Object.keys(katObj).forEach(kategori=>{
    Object.keys(katObj[kategori]).forEach(kelompok=>{
      Object.keys(katObj[kategori][kelompok]).forEach(sub=>{
        const key = `${kategori}|||${kelompok}|||${sub}`;
        idx[key] = {kategori, kelompok, sub, entries: katObj[kategori][kelompok][sub]};
      });
    });
  });
  return idx;
}

function updatePickerColors(){
  const keys = [...compareSelected];
  document.querySelectorAll('#cmpPicker .picker-item').forEach(item=>{
    const cb = item.querySelector('input');
    const key = decodeURIComponent(cb.dataset.key);
    const idx = keys.indexOf(key);
    if(idx >= 0){
      item.classList.add('picked');
      item.style.setProperty('--dotcolor', COMPARE_COLORS[idx % COMPARE_COLORS.length]);
    }else{
      item.classList.remove('picked');
      item.style.removeProperty('--dotcolor');
    }
  });
}

function computeSeriesAnalysis(keys){
  const list = [];
  keys.forEach(k=>{
    const info = compareIndex[k];
    const filteredEntries = info.entries.filter(e => e.tahun >= compareFrom && e.tahun <= compareTo);
    if(filteredEntries.length === 0) return;
    let maxObj = filteredEntries[0], minObj = filteredEntries[0];
    filteredEntries.forEach(e=>{
      if(e.data > maxObj.data) maxObj = e;
      if(e.data < minObj.data) minObj = e;
    });
    const firstVal = filteredEntries[0].data;
    const lastVal = filteredEntries[filteredEntries.length-1].data;
    const diff = lastVal - firstVal;
    const pct = firstVal !== 0 ? (diff/firstVal)*100 : 0;
    const spanYears = (compareTo - compareFrom) || 1;
    const cagr = firstVal > 0 ? (Math.pow(lastVal/firstVal, 1/spanYears)-1)*100 : 0;
    list.push({
      name: info.sub, first:firstVal, last:lastVal, pct, cagr,
      max:maxObj.data, maxLabel:periodLabel(maxObj),
      min:minObj.data, minLabel:periodLabel(minObj),
      unit: SATUAN[info.sub] || '',
      rawValues: filteredEntries.map(e=>e.data)
    });
  });
  return list;
}

function buildCompareStreamSVG(keys){
  const uniqueLabelsMap = new Map();
  keys.forEach(k=>{
    compareIndex[k].entries.forEach(e=>{
      if(e.tahun >= compareFrom && e.tahun <= compareTo) uniqueLabelsMap.set(sortKey(e), periodLabel(e));
    });
  });
  const sortedKeys = [...uniqueLabelsMap.keys()].sort((a,b)=>a-b);
  if(sortedKeys.length === 0){
    return '<div style="padding:20px;font-size:13px;color:var(--brown-mid);">Tidak ada data pada rentang ini.</div>';
  }

  const valuesByKey = keys.map(k=>{
    const info = compareIndex[k];
    const bySort = {};
    info.entries.forEach(e=>{ bySort[sortKey(e)] = e.data; });
    return sortedKeys.map(sk=> bySort.hasOwnProperty(sk) ? bySort[sk] : 0);
  });

  const W = 600, H = 300, padLeft = 10, padRight = 10, padTop = 16, padBottom = 26;
  const plotW = W - padLeft - padRight, plotH = H - padTop - padBottom;
  const n = sortedKeys.length;
  const centerY = padTop + plotH / 2;

  let maxTotal = 0;
  sortedKeys.forEach((sk,ti)=>{
    const total = valuesByKey.reduce((s,vals)=>s+(vals[ti]||0),0);
    if(total > maxTotal) maxTotal = total;
  });
  if(maxTotal === 0) maxTotal = 1;
  const scaleY = (plotH * 0.92 / 2) / (maxTotal / 2);
  const xAt = i => padLeft + (n<=1 ? plotW/2 : (i/(n-1))*plotW);

  const running = sortedKeys.map((sk,ti)=>{
    const total = valuesByKey.reduce((s,vals)=>s+(vals[ti]||0),0);
    return -total/2;
  });

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" id="cmpStreamSvg" style="width:100%;height:340px;display:block;">`;
  keys.forEach((k,i)=>{
    const info = compareIndex[k];
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    const topPts = [], botPts = [];
    sortedKeys.forEach((sk,ti)=>{
      const v = valuesByKey[i][ti] || 0;
      const bot = running[ti];
      const top = bot + v;
      running[ti] = top;
      topPts.push([xAt(ti), centerY - top*scaleY]);
      botPts.push([xAt(ti), centerY - bot*scaleY]);
    });
    const pathPts = topPts.concat(botPts.slice().reverse());
    const d = pathPts.map((p,idx)=> (idx===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') + ' Z';
    svg += `<path d="${d}" fill="${color}" fill-opacity="0.85" stroke="#fff" stroke-width="0.6"><title>${escapeHtml(info.sub)}</title></path>`;
  });

  const labelStep = Math.max(1, Math.ceil(n/8));
  sortedKeys.forEach((sk,ti)=>{
    if(ti % labelStep === 0 || ti === n-1){
      svg += `<text x="${xAt(ti).toFixed(1)}" y="${(H-6).toFixed(1)}" font-size="9" text-anchor="middle" fill="#8A5A24">${escapeHtml(uniqueLabelsMap.get(sk)||'')}</text>`;
    }
  });
  svg += `</svg>`;

  const legend = keys.map((k,i)=>{
    const info = compareIndex[k];
    const color = COMPARE_COLORS[i % COMPARE_COLORS.length];
    return `<div class="comp-legend-item"><span class="dot" style="background:${color}"></span>${escapeHtml(info.sub)}</div>`;
  }).join('');

  return svg + `<div class="comp-legend" style="margin-top:10px;">${legend}</div><div class="comp-chart-note">Menampilkan alur tiap indikator sepanjang waktu, disusun simetris di sekitar garis tengah (ThemeRiver style). Perhatikan bahwa penjumlahan lintas indikator hanya bermakna jika satuannya sama.</div>`;
}

function buildCompareMarimekkoSVG(keys){
  const uniqueLabelsMap = new Map();
  keys.forEach(k=>{
    compareIndex[k].entries.forEach(e=>{
      if(e.tahun >= compareFrom && e.tahun <= compareTo) uniqueLabelsMap.set(sortKey(e), periodLabel(e));
    });
  });
  const sortedKeys = [...uniqueLabelsMap.keys()].sort((a,b)=>a-b);
  if(sortedKeys.length === 0){

  }

    const info = compareIndex[k];
